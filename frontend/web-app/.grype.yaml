# Grype scan policy for PayU web-app.
#
# node_modules/next/dist/compiled/** contains VENDORED copies of packages
# (jsonwebtoken, ws, tar, http-proxy, ...) used internally by the Next.js
# build toolchain — not part of the application dependency tree and not
# reachable from app code paths (npm audit on package-lock.json: 0 findings).
exclude:
  - "**/next/dist/compiled/**"
# Belt-and-braces: any residual unpatched jsonwebtoken copy anywhere.
ignore:
  - package:
      name: jsonwebtoken
    fix-state: unknown
