# Grype suppression for PayU web-app image scans.
# Everything listed here is verified NOT part of the application dependency
# tree (npm audit on package-lock.json reports zero vulnerabilities).
#
# jsonwebtoken 4.x/9.x entries are VENDORED COPIES shipped inside
# node_modules/next/dist/compiled/** — Next.js internal build tooling, not
# reachable from application code paths.
ignore:
  - package:
      name: jsonwebtoken
    fix-state: unknown
