apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: "{{serviceName}}-dev", namespace: openshift-gitops}
spec:
  project: payu-dev
  source: {repoURL: https://github.com/fajjarnr/payu-{{serviceName}}.git, targetRevision: main, path: k8s/overlays/dev}
  destination: {server: https://kubernetes.default.svc, namespace: payu-dev}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true, PruneLast=true]}
