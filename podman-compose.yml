# PayU Digital Banking - Podman Compose Setup
# Local Development Environment & E2E Testing
# With optimized resource limits and health checks for production readiness

version: '3.8'
services:
  # ============================================
  # DATA LAYER
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: payu-postgres
    podman_networks:
      - name: payu-network
    environment:
      # REQUIRED: Set in .env file
      POSTGRES_USER: ${POSTGRES_USER:-payu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      POSTGRES_DB: ${POSTGRES_DB:-payu_account}
    volumes:
      - type: persistent
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./infrastructure/containers/init-db.sql
        target: /docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
    pod:
      vols: ["postgres_data_vol"]
      cgroups: "host"
  redis:
    image: redis:7-alpine
    container_name: payu-redis
    podman_networks:
      - name: payu-network
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # MESSAGE BROKER
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: payu-zookeeper
    podman_networks:
      - name: payu-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: payu-kafka
    podman_networks:
      - name: payu-network
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: payu-kafka-ui
    podman_networks:
      - name: payu-network
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: payu-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      JAVA_OPTS: "-Xmx512M -Xms256M"
    depends_on:
      - kafka
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # SECRETS MANAGEMENT
  # ============================================
  vault:
    image: hashicorp/vault:1.15
    container_name: payu-vault
    podman_networks:
      - name: payu-network
    ports:
      - "8200:8200"
    environment:
      # REQUIRED: Set in .env file
      # WARNING: Default token is for development only. Never use in production!
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    security_opt:
      - label=disable
    volumes:
      - type: persistent
        source: vault_data
        target: /vault/data
      - type: bind
        source: ./infrastructure/containers/vault-config.json
        target: /vault/config/vault-config.json:ro
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # IDENTITY & ACCESS MANAGEMENT
  # ============================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: payu-keycloak
    podman_networks:
      - name: payu-network
    ports:
      - "8099:8080"
    environment:
      # REQUIRED: Set in .env file
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-payu}
      # REQUIRED: Set in .env file
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-payu_secret}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xmx1024M -Xms512M"
    command: start-dev
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # CORE BANKING SERVICES (Spring Boot)
  # ============================================
  account-service:
    build:
      context: ./backend/account-service
      dockerfile: Dockerfile
    container_name: payu-account-service
    podman_networks:
      - name: payu-network
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payu_account
      SPRING_DATASOURCE_USERNAME: payu
      # REQUIRED: Set in .env file
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_DUKCAPIL_URL: http://dukcapil-simulator:8080
      SERVICES_AUTH_URL: http://auth-service:8002
      OTEL_ENDPOINT: http://jaeger:4317
      JAVA_OPTS: >-
        -Xmx768M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    depends_on:
      - postgres
      - kafka
      - dukcapil-simulator
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  auth-service:
