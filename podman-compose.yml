      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_ENDPOINT: http://jaeger:4317
    depends_on:
      - postgres
      - kafka
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  promotion-service:
    build:
      context: ./backend/promotion-service
      dockerfile: Dockerfile
    container_name: payu-promotion-service
    podman_networks:
      - name: payu-network
    ports:
      - "8013:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/payu_promotion
      QUARKUS_DATASOURCE_USERNAME: payu
      # REQUIRED: Set in .env file
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_ENDPOINT: http://jaeger:4317
    depends_on:
      - postgres
      - kafka
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  support-service:
    build:
      context: ./backend/support-service
      dockerfile: Dockerfile
    container_name: payu-support-service
    podman_networks:
      - name: payu-network
    ports:
      - "8014:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/payu_support
      QUARKUS_DATASOURCE_USERNAME: payu
      # REQUIRED: Set in .env file
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_ENDPOINT: http://jaeger:4317
    depends_on:
      - postgres
      - kafka
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  api-portal-service:
    build:
      context: ./backend/api-portal-service
      dockerfile: Dockerfile
    container_name: payu-api-portal-service
    podman_networks:
      - name: payu-network
    ports:
      - "8099:8099"
    environment:
      QUARKUS_HTTP_PORT: 8099
      ACCOUNT_SERVICE_URL: http://account-service:8001
      AUTH_SERVICE_URL: http://auth-service:8002
      TRANSACTION_SERVICE_URL: http://transaction-service:8003
      WALLET_SERVICE_URL: http://wallet-service:8004
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      KYC_SERVICE_URL: http://kyc-service:8007
      ANALYTICS_SERVICE_URL: http://analytics-service:8008
      PARTNER_SERVICE_URL: http://partner-service:8080
      PROMOTION_SERVICE_URL: http://promotion-service:8080
      LENDING_SERVICE_URL: http://lending-service:8087
      INVESTMENT_SERVICE_URL: http://investment-service:8080
      COMPLIANCE_SERVICE_URL: http://compliance-service:8087
      BACKOFFICE_SERVICE_URL: http://backoffice-service:8080
      SUPPORT_SERVICE_URL: http://support-service:8080
    depends_on:
      - account-service
      - auth-service
      - transaction-service
      - wallet-service
      - billing-service
      - notification-service
      - kyc-service
      - analytics-service
      - partner-service
      - promotion-service
      - lending-service
      - investment-service
      - compliance-service
      - backoffice-service
      - support-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # BUSINESS & OPERATIONS SERVICES (Spring Boot)
  # ============================================
  statement-service:
    build:
      context: ./backend/statement-service
      dockerfile: Dockerfile
    container_name: payu-statement-service
    podman_networks:
      - name: payu-network
    ports:
      - "8015:8015"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payu_statement
      SPRING_DATASOURCE_USERNAME: payu
      # REQUIRED: Set in .env file
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_WALLET_URL: http://wallet-service:8004
      SERVICES_TRANSACTION_URL: http://transaction-service:8003
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      OTEL_ENDPOINT: http://jaeger:4317
      JAVA_OPTS: >-
        -Xmx512M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    depends_on:
      - postgres
      - kafka
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # ML SERVICES (Python FastAPI)
  # ============================================
  kyc-service:
    build:
      context: ./backend/kyc-service
      dockerfile: Dockerfile
    container_name: payu-kyc-service
    podman_networks:
      - name: payu-network
    ports:
      - "8007:8007"
    environment:
      # REQUIRED: Set in .env file
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payu}:${POSTGRES_PASSWORD:-payu_secret}@postgres:5432/payu_kyc
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DUKCAPIL_URL: http://dukcapil-simulator:8080/api/v1
      OTLP_ENDPOINT: http://jaeger:4317
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - postgres
      - kafka
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: payu-analytics-service
    podman_networks:
      - name: payu-network
    ports:
      - "8008:8008"
    environment:
      # REQUIRED: Set in .env file
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payu}:${POSTGRES_PASSWORD:-payu_secret}@postgres:5432/payu_analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTLP_ENDPOINT: http://jaeger:4317
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - postgres
      - kafka
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # FRONTEND SERVICES
  # ============================================
  web-app:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
    container_name: payu-web-app
    podman_networks:
      - name: payu-network
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NODE_ENV: production
    depends_on:
      - gateway-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # MONITORING & ALERTING
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: payu-jaeger
    podman_networks:
      - name: payu-network
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    command:
      - "--collector.otlp.enabled=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/api/services"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: payu-prometheus
    podman_networks:
      - name: payu-network
    ports:
      - "9090:9090"
    volumes:
      - type: bind
        source: ./infrastructure/containers/prometheus.yml
        target: /etc/prometheus/prometheus.yml:ro
      - type: bind
        source: ./infrastructure/containers/prometheus-alerts.yml
        target: /etc/prometheus/prometheus-alerts.yml:ro
      - type: persistent
        source: prometheus_data
        target: /prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  loki:
    image: grafana/loki:2.9.10
    container_name: payu-loki
    podman_networks:
      - name: payu-network
    ports:
      - "3100:3100"
    volumes:
      - type: bind
        source: ./infrastructure/containers/loki-config.yml
        target: /etc/loki/local-config.yaml:ro
      - type: persistent
        source: loki_data
        target: /loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  promtail:
    image: grafana/promtail:2.9.10
    container_name: payu-promtail
    podman_networks:
      - name: payu-network
    volumes:
      - type: bind
        source: ./infrastructure/containers/promtail-config.yml
        target: /etc/promtail/config.yml:ro
      - type: bind
        source: /var/log
        target: /var/log:ro
      - type: bind
        source: /var/lib/containers
        target: /var/lib/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  grafana:
    image: grafana/grafana:11.1.4
    container_name: payu-grafana
    podman_networks:
      - name: payu-network
    ports:
      - "3000:3000"
    environment:
      # REQUIRED: Set in .env file
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - type: bind
        source: ./infrastructure/containers/grafana/provisioning
        target: /etc/grafana/provisioning:ro
      - type: bind
        source: ./infrastructure/containers/grafana/dashboards
        target: /var/lib/grafana/dashboards:ro
      - type: persistent
        source: grafana_data
        target: /var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: payu-alertmanager
    podman_networks:
      - name: payu-network
    ports:
      - "9093:9093"
    volumes:
      - type: bind
        source: ./infrastructure/containers/alertmanager-config.yml
        target: /etc/alertmanager/alertmanager.yml:ro
      - type: persistent
        source: alertmanager_data
        target: /alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
# ============================================
# NETWORKS
# ============================================
networks:
  payu-network:
    driver: bridge
