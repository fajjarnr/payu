# Gitleaks configuration for PayU lab
# Allowlist dummy/dev secrets in infrastructure manifests

title = "PayU Gitleaks Config"

[[rules]]
  id = "jdbc-embedded-credentials"
  description = "JDBC URL with embedded username and password"
  regex = '''(?i)jdbc:[a-z0-9]+:(?:/{0,2})[^\s"'@/:]+:[^\s"'@/]+@'''
  keywords = ["jdbc:"]

[[rules]]
  id = "jdbc-password-parameter"
  description = "JDBC URL with password query parameter"
  regex = '''(?i)jdbc:[^\s"']{0,512}[?&](?:password|pwd)=[^&\s"']+'''
  keywords = ["jdbc:", "password=", "pwd="]

[[rules]]
  id = "postgres-uri-credentials"
  description = "PostgreSQL URI with embedded username and password"
  regex = '''(?i)postgres(?:ql)?://[^\s"'@/:]+:[^\s"'@/]+@'''
  keywords = ["postgres://", "postgresql://"]

  [rules.allowlist]
    description = "Reviewed documentation and monitoring placeholders"
    paths = [
      '''\.agents/skills/integration-architect/references/celery\.md''',
      '''infrastructure/local/podman/config/BUILD_COMMANDS\.md''',
      '''infrastructure/platform/api-management/3scale/README\.md''',
      '''infrastructure/platform/multi-region/replication/postgres-replication\.yaml''',
      '''infrastructure/platform/multi-region/monitoring/replication-lag-service-monitor\.yaml''',
      '''infrastructure/platform/security/rhtas/securesign-ha\.yaml''',
    ]

[allowlist]
  description = "Allowlist dummy secrets in lab manifests"
  paths = [
    '''infrastructure\/platform\/security\/litmus\/litmus-generated\.yaml''',
    '''infrastructure\/workloads\/overlays\/dev\/secrets\/''',
    '''infrastructure\/platform\/security\/vault\/''',
    '''infrastructure\/platform\/data\/base\/''',
    '''\.gitleaks\.toml''',
    '''scripts\/''',
  ]
  regexes = [
    '''password: \"payu-dev-password\"''',
    '''password: \"keycloak-dev-password\"''',
    '''password: \"payu-cache-dev-password\"''',
    '''password: \"litmus\"''',
    '''password: \"admin\"''',
    '''POSTGRES_PASSWORD=.*''',
    '''KEYCLOAK_ADMIN_PASSWORD=.*''',
    '''JWT_SECRET=.*''',
    '''AES_ENCRYPTION_KEY=.*''',
    '''SECRET_KEY=.*''',
    '''KEYCLOAK_CLIENT_SECRET=.*''',
  ]
