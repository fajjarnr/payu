name: Analytics Service Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/analytics-service/**"
      - ".github/workflows/analytics-tests.yml"
  pull_request:
    paths:
      - "backend/analytics-service/**"
      - ".github/workflows/analytics-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-tests:
    name: Analytics tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/analytics-service
    env:
      PYTHONPATH: src
      SECRET_KEY: ci-test-${{ github.run_id }}-${{ github.sha }}
      ENABLE_TRACING: "false"
      ENABLE_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/analytics-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            pytest==8.3.5 \
            pytest-asyncio==0.25.3 \
            pytest-cov==6.1.1 \
            Faker==30.0.0

      - name: Run tests and coverage gate
        run: python -m pytest -m "not infrastructure"
