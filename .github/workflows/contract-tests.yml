name: contract-tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/pom.xml"
      - "backend/**/src/test/resources/contracts/**"
      - "backend/**/src/test/java/**/contract/**"
      - ".github/workflows/contract-tests.yml"

jobs:
  contract-test:
    name: ${{ matrix.service }} contract verifier
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - transaction-service
          - wallet-service
          - auth-service
          - billing-service
          - partner-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run Spring Cloud Contract verifier
        run: |
          mvn -B -f backend/pom.xml -pl ${{ matrix.service }} -am test \
            -Pcontract-test \
            -Dtest=ContractVerifierTest \
            -Dsurefire.failIfNoSpecifiedTests=false
