name: security-tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Base URL to scan (gateway or service)
        required: false
        default: "http://localhost:8080"
      openapi_url:
        description: OpenAPI schema path (Schemathesis)
        required: false
        default: "http://localhost:8005/v3/api-docs"
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ inputs.target_url || 'http://localhost:8080' }}
          rules_file_name: .github/zap-rules.tsv

  schemathesis:
    name: Schemathesis API fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schemathesis
        run: pip install schemathesis
      - name: Run Schemathesis against OpenAPI schema
        run: |
          schemathesis run \
            --checks all \
            --validate-schema true \
            --hypothesis-max-examples 50 \
            --base-url "${{ inputs.target_url || 'http://localhost:8080' }}" \
            "${{ inputs.openapi_url || 'http://localhost:8005/v3/api-docs' }}"
