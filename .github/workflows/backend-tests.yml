name: backend-tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/test-single-service.sh"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            account: backend/account-service/**
            auth: backend/auth-service/**
            billing: backend/billing-service/**
            cms: backend/cms-service/**
            transaction: backend/transaction-service/**
            wallet: backend/wallet-service/**
            partner: backend/partner-service/**
            promotion: backend/promotion-service/**
            lending: backend/lending-service/**
            investment: backend/investment-service/**
            fx: backend/fx-service/**
            integration: backend/integration-service/**
            statement: backend/statement-service/**
            support: backend/support-service/**
            dispute: backend/dispute-service/**
            compliance: backend/compliance-service/**
            backoffice: backend/backoffice-service/**
            notification: backend/notification-service/**
            gateway: backend/gateway-service/**
            product-catalog: backend/product-catalog-service/**
            loan-origination: backend/loan-origination-service/**
            api-portal: backend/api-portal-service/**
            shared: [backend/shared/**, backend/pom.xml]

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests for ${{ matrix.service }}
        run: |
          case "${{ matrix.service }}" in
            shared)
              mvn -B -f backend/pom.xml -pl shared/outbox-starter,shared/api-commons,shared/security-starter test ;;
            *)
              mvn -B -f backend/pom.xml -pl ${{ matrix.service }}-service -am test ;;
          esac
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: backend/**/target/surefire-reports/
