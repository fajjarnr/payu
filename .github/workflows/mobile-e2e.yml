name: Mobile E2E Tests (Maestro)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-e2e.yml'

jobs:
  maestro-e2e:
    runs-on: macos-latest # Required for iOS simulator, or ubuntu-latest with Android emulator
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/mobile/package.json'

      - name: Install Dependencies
        run: |
          cd frontend/mobile
          npm install

      - name: Install Maestro CLI
        run: |
          curl -FsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro E2E Flows
        run: |
          # Execute maestro test suite using the configuration defined in the project
          # In a real CI environment, this would target a running simulator/emulator or use Maestro Cloud
          echo "Running Maestro E2E flows..."
          maestro test --dry-run frontend/mobile/.maestro/flows/login.yaml
          maestro test --dry-run frontend/mobile/.maestro/flows/transfer.yaml
          maestro test --dry-run frontend/mobile/.maestro/flows/biometric-auth.yaml
          maestro test --dry-run frontend/mobile/.maestro/flows/offline-mode.yaml
