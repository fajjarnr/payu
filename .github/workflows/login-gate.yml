name: Login Release Gate (LOGIN-006)

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/auth-service/**"
      - "backend/gateway-service/**"
      - "frontend/web-app/src/app/api/auth/**"
      - "frontend/web-app/src/app/[locale]/login/**"
      - "frontend/web-app/e2e/login-flow.spec.ts"
      - "infrastructure/local/podman/login-gate-compose.yml"
      - "scripts/login-gate.sh"
      - ".github/workflows/login-gate.yml"
  pull_request:
    paths:
      - "backend/auth-service/**"
      - "backend/gateway-service/**"
      - "frontend/web-app/src/app/api/auth/**"
      - "frontend/web-app/src/app/[locale]/login/**"
      - "frontend/web-app/e2e/login-flow.spec.ts"
      - "infrastructure/local/podman/login-gate-compose.yml"
      - "scripts/login-gate.sh"
      - ".github/workflows/login-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-gate:
    name: Browser login E2E (BFF → gateway → auth → Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Web-app Playwright browsers
        working-directory: frontend/web-app
        run: npx playwright install --with-deps chromium

      - name: Run the login gate (fail-closed)
        run: bash scripts/login-gate.sh
        env:
          GITHUB_ACTIONS: "true"
