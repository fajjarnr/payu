name: k6-tests

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Gateway base URL (default: local podman stack)
        required: false
        default: "http://localhost:8080"
      keycloak_url:
        description: Keycloak base URL
        required: false
        default: "http://localhost:8099"
      stage:
        description: k6 scenario (smoke | load | stress)
        required: false
        default: smoke
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  k6:
    name: k6 ${{ inputs.stage || 'smoke' }} (SLO thresholds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 smoke
        uses: grafana/k6-action@0.3.1
        if: inputs.stage == '' || inputs.stage == 'smoke'
        with:
          filename: tests/performance/k6/smoke-test.js
          flags: --summary-export=summary.json --env GATEWAY_URL=${{ inputs.gateway_url || 'http://localhost:8080' }} --env KEYCLOAK_URL=${{ inputs.keycloak_url || 'http://localhost:8099' }}

      - name: Run k6 load
        uses: grafana/k6-action@0.3.1
        if: inputs.stage == 'load'
        with:
          filename: tests/performance/k6/load-test.js
          flags: --summary-export=summary.json --env GATEWAY_URL=${{ inputs.gateway_url || 'http://localhost:8080' }} --env KEYCLOAK_URL=${{ inputs.keycloak_url || 'http://localhost:8099' }}

      - name: Run k6 stress
        uses: grafana/k6-action@0.3.1
        if: inputs.stage == 'stress'
        with:
          filename: tests/performance/k6/stress-test.js
          flags: --summary-export=summary.json --env GATEWAY_URL=${{ inputs.gateway_url || 'http://localhost:8080' }} --env KEYCLOAK_URL=${{ inputs.keycloak_url || 'http://localhost:8099' }}

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: summary.json

      - name: Check SLO thresholds
        if: always()
        run: |
          if [ -f summary.json ]; then
            echo "k6 summary:"; cat summary.json
          else
            echo "no summary produced (target unreachable?)"
          fi
