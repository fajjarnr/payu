name: account-tests

on:
  push:
    branches: [main]
    paths:
      - "backend/account-service/**"
      - "backend/shared/**"
      - "backend/pom.xml"
      - ".github/workflows/account-tests.yml"
  pull_request:
    paths:
      - "backend/account-service/**"
      - "backend/shared/**"
      - "backend/pom.xml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run account-service unit + integration tests
        run: |
          mvn -B -f backend/pom.xml -pl account-service -am test
      - name: Publish coverage report (jacoco)
        run: |
          mvn -B -f backend/pom.xml -pl account-service jacoco:report
      - uses: actions/upload-artifact@v4
        with:
          name: account-jacoco-report
          path: backend/account-service/target/site/jacoco/
