name: Web App Tests (DX-CI-FE-001)

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/web-app/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/web-app/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Lint, type-check and unit/component tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: i18n coverage check
        run: npm run check:i18n

      - name: Unit / component tests
        run: npm run test -- --run
