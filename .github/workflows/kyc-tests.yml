name: kyc-tests

on:
  push:
    branches: [main]
    paths:
      - "backend/kyc-service/**"
      - ".github/workflows/kyc-tests.yml"
  pull_request:
    paths:
      - "backend/kyc-service/**"
      - ".github/workflows/kyc-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kyc-tests:
    name: KYC tests and coverage gate (>=80%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend/kyc-service
    env:
      PYTHONPATH: src
      SECRET_KEY: ci-test-${{ github.run_id }}-${{ github.sha }}
      ENCRYPTION_KEY: ci-test-encryption-key
      ARTEMIS_USERNAME: ci-test
      ARTEMIS_PASSWORD: ci-test-password
      ENABLE_TRACING: "false"
      ENABLE_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/kyc-service/requirements.txt

      - name: Install dependencies (incl. ML stack)
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            pytest==8.3.5 \
            pytest-asyncio==0.25.3 \
            pytest-cov==6.1.1

      - name: Run unit tests and coverage gate
        run: python -m pytest tests/unit -m "unit" -p no:cacheprovider

      - name: Run e2e workflow tests (HTTP, mocked providers)
        run: python -m pytest tests/e2e -m "e2e" -p no:cacheprovider
