name: Conventional Commits Gate (DX-CI-COMMITS-001)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint PR commits and title
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js
          failOnErrors: true
