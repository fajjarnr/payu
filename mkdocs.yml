site_name: PayU Documentation
site_description: PayU Digital Banking Platform Documentation
site_url: https://docs.payu.id

docs_dir: docs

nav:
  - Home: INDEX.md
  - Architecture:
    - Overview: architecture/ARCHITECTURE.md
    - Service Catalog: architecture/SERVICE_CATALOG.md
    - Event Catalog: architecture/EVENT_CATALOG.md
    - Gateway Architecture: roadmap/GATEWAY_ARCH.md
  - ADR:
    - Index: adr/README.md
    - Guidelines: adr/0000-adr-guidelines.md
    - Template: adr/0001-template.md
  - API:
    - Standards: api/API_STANDARDS.md
  - Guides:
    - Onboarding: guides/ONBOARDING.md
    - Contributing: guides/CONTRIBUTING.md
    - Lessons Learned: guides/LESSONS.md
    - Usage: guides/USAGE.md
    - TDD Reference: guides/TDD_QUICK_REFERENCE.md
  - Operations:
    - Infrastructure Deployment: operations/INFRASTRUCTURE_DEPLOYMENT.md
    - Zero Downtime Deployment: operations/ZERO-DOWNTIME-DEPLOYMENT.md
    - Disaster Recovery: operations/DISASTER_RECOVERY.md
  - Security:
    - Security Policy: security/SECURITY.md
    - PCI-DSS Audit: security/PCI-DSS-UU-PDP-AUDIT-REPORT.md
  - Roadmap:
    - Todos: roadmap/TODOS.md
    - Progress: roadmap/PROGRESS.md

plugins:
  - techdocs-core
  - search

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: emerald
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: emerald
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mermaid-init.js
  - javascripts/mathjax-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/payu
  version:
    provider: mike

copyright: Copyright © 2026 PayU Indonesia
