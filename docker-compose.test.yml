# PayU Digital Banking - Docker Compose Test Environment
# Uses pre-built images with container profile
# Run: docker-compose -f docker-compose.test.yml up -d

services:
  # ============================================
  # DATA LAYER
  # ============================================
  postgres-test:
    image: docker.io/postgres:16-alpine
    container_name: payu-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: payu_test
      POSTGRES_PASSWORD: test_secret
      POSTGRES_DB: payu_test_account
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./infrastructure/containers/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payu_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - payu-test-network
  
  redis-test:
    image: docker.io/redis:7-alpine
    container_name: payu-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - payu-test-network

  # ============================================
  # INFRASTRUCTURE
  # ============================================
  zookeeper-test:
    image: docker.io/confluentinc/cp-zookeeper:7.7.7
    container_name: payu-zookeeper-test
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      retries: 3
    networks:
      - payu-test-network

  kafka-test:
    image: docker.io/confluentinc/cp-kafka:7.7.7
    container_name: payu-kafka-test
    ports:
      - "9093:9092"
      - "29093:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 15s
      retries: 5
    networks:
      - payu-test-network

  keycloak-test:
    image: quay.io/keycloak/keycloak:26.0
    container_name: payu-keycloak-test
    ports:
      - "8100:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-test:5432/keycloak_test
      KC_DB_USERNAME: payu_test
      KC_DB_PASSWORD: test_secret
    command: start-dev
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - payu-test-network

  # ============================================
  # CORE SERVICES (Pre-built Images + Container Profile)
  # ============================================
  account-service:
    image: localhost/payu-account-service:latest
    container_name: payu-account-service
    ports:
      - "8101:8081"
    environment:
      SPRING_PROFILES_ACTIVE: container
      DB_URL: jdbc:postgresql://postgres-test:5432/payu_test_account
      DB_USERNAME: payu_test
      DB_PASSWORD: test_secret
      KAFKA_BROKERS: kafka-test:29092
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      OIDC_ISSUER: http://keycloak-test:8080/realms/payu
      OIDC_JWK_SET_URI: http://keycloak-test:8080/realms/payu/protocol/openid-connect/certs
      READ_REPLICA_ENABLED: false
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - payu-test-network

  auth-service:
    image: localhost/payu-auth-service:latest
    container_name: payu-auth-service
