# PayU Digital Banking - Podman Compose Test Environment
# Uses pre-built images (Decoupled Build Strategy)
# Run with: podman-compose -f podman-compose.test.yml up -d

services:
  # ============================================
  # DATA LAYER
  # ============================================
  postgres-test:
    image: docker.io/postgres:16-alpine
    container_name: payu-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-payu_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      POSTGRES_DB: payu_test_account
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./infrastructure/containers/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payu_test"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  redis-test:
    image: docker.io/redis:7-alpine
    container_name: payu-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============================================
  # INFRASTRUCTURE
  # ============================================
  zookeeper-test:
    image: docker.io/confluentinc/cp-zookeeper:7.7.7
    container_name: payu-zookeeper-test
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      retries: 3

  kafka-test:
    image: docker.io/confluentinc/cp-kafka:7.7.7
    container_name: payu-kafka-test
    ports:
      - "9093:9092"
      - "29093:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 15s
      retries: 5

  keycloak-test:
    image: quay.io/keycloak/keycloak:26.0
    container_name: payu-keycloak-test
    ports:
      - "8100:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-test:5432/keycloak_test
      KC_DB_USERNAME: payu_test
      KC_DB_PASSWORD: test_secret
    command: start-dev
    depends_on:
      postgres-test:
        condition: service_healthy

  # ============================================
  # CORE SERVICES (Pre-built Images)
  # ============================================
  account-service:
    image: localhost/payu-account-service:latest
    container_name: payu-account-service
    ports:
      - "8101:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_account
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy

  auth-service:
    image: localhost/payu-auth-service:latest
    container_name: payu-auth-service
    ports:
      - "8102:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_auth
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
      KEYCLOAK_SERVER_URL: http://keycloak-test:8080
    depends_on:
      postgres-test:
        condition: service_healthy
      keycloak-test:
        condition: service_started

  transaction-service:
    image: localhost/payu-transaction-service:latest
    container_name: payu-transaction-service
    ports:
      - "8103:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_transaction
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy

  wallet-service:
    image: localhost/payu-wallet-service:latest
    container_name: payu-wallet-service
    ports:
      - "8104:8004"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_wallet
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
    depends_on:
      postgres-test:
        condition: service_healthy

  lending-service:
    image: localhost/payu-lending-service:latest
    container_name: payu-lending-service
    ports:
      - "8109:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_lending
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
      KAFKA_BROKERS: kafka-test:29092
    depends_on:
      postgres-test:
        condition: service_healthy

  investment-service:
    image: localhost/payu-investment-service:latest
    container_name: payu-investment-service
    ports:
      - "8110:8006"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_investment
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
    depends_on:
      postgres-test:
        condition: service_healthy

  statement-service:
    image: localhost/payu-statement-service:latest
    container_name: payu-statement-service
    ports:
      - "8115:8015"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_statement
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
      REDIS_HOST: redis-test
      REDIS_PORT: 6379 
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  partner-service:
    image: localhost/payu-partner-service:latest
    container_name: payu-partner-service
    ports:
      - "8185:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_partner
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
    depends_on:
      postgres-test:
        condition: service_healthy

  support-service:
    image: localhost/payu-support-service:latest
    container_name: payu-support-service
    ports:
      - "8186:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_support
      SPRING_DATASOURCE_USERNAME: payu_test
      SPRING_DATASOURCE_PASSWORD: test_secret
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres_test_data:
  
networks:
  default:
    name: payu-test-network
