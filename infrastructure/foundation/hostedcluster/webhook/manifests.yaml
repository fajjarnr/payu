apiVersion: v1
kind: Namespace
metadata:
  name: payu-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hcp-audience-fixer-script
  namespace: payu-system
data:
  webhook.py: |
    #!/usr/bin/env python3
    import json, base64, os, ssl, sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    SA_TO_AUDIENCE = {
        "capi-provider": "sts.amazonaws.com",
        "capa-controller-manager": "sts.amazonaws.com",
        "control-plane-operator": "sts.amazonaws.com",
        "cloud-network-config-controller": "sts.amazonaws.com",
        "kube-controller-manager": "sts.amazonaws.com",
        "aws-cloud-controller-manager": "sts.amazonaws.com",
        "aws-ebs-csi-driver-controller-sa": "sts.amazonaws.com",
        "csi-driver": "sts.amazonaws.com",
        "node-pool": "sts.amazonaws.com",
        "cluster-csi-drivers": "sts.amazonaws.com",
        "aws-ebs-csi-driver-controller": "sts.amazonaws.com",
        "openshift-ingress": "sts.amazonaws.com",
        "router": "sts.amazonaws.com",
        "ingress-operator": "sts.amazonaws.com",
        "cluster-image-registry-operator": "sts.amazonaws.com",
        "image-registry": "sts.amazonaws.com",
        "registry": "sts.amazonaws.com",
    }

    def get_patches(containers, path_prefix, cluster_name):
        patches = []
        for i, c in enumerate(containers or []):
            name = c.get("name", "")
            if not any(s in name for s in ("token-minter", "cloud-token")):
                continue
            args = c.get("args") or []
            new_args = []
            sa_name = ""
            for idx, x in enumerate(args):
                if not isinstance(x, str):
                    continue
                if x.startswith("--service-account-name="):
                    sa_name = x.split("=", 1)[1]
                elif x == "--service-account-name" and idx + 1 < len(args):
                    sa_name = args[idx + 1]
            
            # Determine the target audience
            is_client_or_apiserver = any(s in name for s in ("client-token", "apiserver"))
            if sa_name in SA_TO_AUDIENCE and not is_client_or_apiserver:
                target_aud = SA_TO_AUDIENCE[sa_name]
            else:
                target_aud = f"https://oidc-storage-payu-shared-955370087474.s3.ap-southeast-1.amazonaws.com/{cluster_name}"
                
            # Reconstruct args by stripping any existing --token-audience/--token-audience=...
            temp_args = []
            skip_next = False
            for idx, x in enumerate(args):
                if skip_next:
                    skip_next = False
                    continue
                if not isinstance(x, str):
                    temp_args.append(x)
                    continue
                if x.startswith("--token-audience="):
                    continue
                if x == "--token-audience":
                    skip_next = True
                    continue
                temp_args.append(x)
                
            # Append the correct audience
            new_args = list(temp_args)
            new_args.append(f"--token-audience={target_aud}")
                
            if new_args != args:
                patches.append({"op": "replace", "path": f"{path_prefix}/{i}/args", "value": new_args})
        return patches

    class H(BaseHTTPRequestHandler):
        def do_POST(self):
            print("Received admission review request", file=sys.stderr)
            n = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(n)
            adm = json.loads(body)
            req = adm.get("request", {})
            ns = req.get("namespace", "")
            cluster_name = "payu-onprem"
            if ns.startswith("clusters-"):
                cluster_name = ns.split("clusters-", 1)[1]
                
            pod = req.get("object", {})
            spec = pod.get("spec", {})
            
            patches = get_patches(spec.get("containers", []), "/spec/containers", cluster_name) + \
                      get_patches(spec.get("initContainers", []), "/spec/initContainers", cluster_name)
            
            print(f"Patches generated for namespace {ns} (cluster {cluster_name}): {patches}", file=sys.stderr)
            resp = {
                "apiVersion": "admission.k8s.io/v1",
                "kind": "AdmissionReview",
                "response": {
                    "uid": req.get("uid"),
                    "allowed": True,
                    "patchType": "JSONPatch",
                    "patch": base64.b64encode(json.dumps(patches).encode()).decode() if patches else None,
                },
            }
            out = json.dumps(resp).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)
        def log_message(self, format, *args):
            sys.stderr.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format%args))

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", 8443))
        srv = HTTPServer(("0.0.0.0", port), H)
        cert = os.environ.get("TLS_CERT", "/tls/tls.crt")
        key = os.environ.get("TLS_KEY", "/tls/tls.key")
        if os.path.exists(cert) and os.path.exists(key):
            ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
            ctx.load_cert_chain(cert, key)
            srv.socket = ctx.wrap_socket(srv.socket, server_side=True)
        print(f"Starting server on port {port}...", file=sys.stderr)
        srv.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcp-audience-fixer
  namespace: payu-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hcp-audience-fixer
  template:
    metadata:
      labels:
        app: hcp-audience-fixer
    spec:
      containers:
      - name: webhook
        image: registry.access.redhat.com/ubi9/python-311:latest
        imagePullPolicy: Always
        command:
        - python3
        - /scripts/webhook.py
        env:
        - name: PORT
          value: "8443"
        ports:
        - containerPort: 8443
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: tls
          mountPath: /tls
      volumes:
      - name: scripts
        configMap:
          name: hcp-audience-fixer-script
      - name: tls
        secret:
          secretName: hcp-audience-fixer-tls
---
apiVersion: v1
kind: Service
metadata:
  name: hcp-audience-fixer
  namespace: payu-system
spec:
  ports:
  - port: 443
    targetPort: 8443
    protocol: TCP
  selector:
    app: hcp-audience-fixer
  type: ClusterIP
