apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: payu-dev-ap-southeast-1a
  namespace: local-cluster
  labels:
    hypershift.openshift.io/cluster: payu-dev
    hypershift.openshift.io/auto-created-for-infra: payu-rt7zf
    app.kubernetes.io/part-of: payu
spec:
  clusterName: payu-dev
  arch: amd64
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.18.43-multi

  # ── Autoscaling ──────────────────────────────────────────
  autoScaling:
    min: 1
    max: 6
  replicas: null              # Must be null when autoScaling is set

  # ── Node Management ──────────────────────────────────────
  management:
    autoRepair: true
    upgradeType: Replace
    replace:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      strategy: RollingUpdate

  # ── AWS Platform ─────────────────────────────────────────
  platform:
    aws:
      instanceType: m6a.2xlarge     # 8 vCPU, 32 GiB RAM
      instanceProfile: payu-rt7zf-worker
      rootVolume:
        size: 120                     # GiB
        type: gp3
      subnet:
        id: subnet-0067a49544aa0bb1b  # ap-southeast-1a
    type: AWS
---
