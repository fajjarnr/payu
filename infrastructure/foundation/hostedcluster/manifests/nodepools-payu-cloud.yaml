apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: payu-cloud
  namespace: clusters
  labels:
    hypershift.openshift.io/cluster: payu-cloud
    app.kubernetes.io/part-of: payu
spec:
  clusterName: payu-cloud
  arch: amd64
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.20.24-multi
  replicas: 2
  management:
    autoRepair: true
    upgradeType: Replace
  platform:
    aws:
      instanceType: m6a.4xlarge
      instanceProfile: payu-cloud-worker
      rootVolume:
        size: 120
        type: gp3
      subnet:
        id: subnet-0e0634928bffd75af
      resourceTags:
        - key: kubernetes.io/cluster/payu-cloud
          value: owned
        - key: app.kubernetes.io/part-of
          value: payu
        - key: environment
          value: cloud
        - key: cost-center
          value: platform-engineering
        - key: owner
          value: payu-team
    type: AWS
