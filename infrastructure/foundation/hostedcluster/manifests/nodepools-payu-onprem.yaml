apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: payu-onprem
  namespace: clusters
  labels:
    hypershift.openshift.io/cluster: payu-onprem
    app.kubernetes.io/part-of: payu
spec:
  clusterName: payu-onprem
  arch: amd64
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.18.43-multi
  replicas: 2
  management:
    autoRepair: false
    upgradeType: Replace
  platform:
    aws:
      instanceType: m6a.2xlarge
      instanceProfile: payu-onprem-worker
      rootVolume:
        size: 120
        type: gp3
      subnet:
        id: subnet-0be591f0726ed759c
      resourceTags:
        - key: kubernetes.io/cluster/payu-onprem
          value: owned
        - key: app.kubernetes.io/part-of
          value: payu
        - key: environment
          value: onprem
        - key: cost-center
          value: platform-engineering
        - key: owner
          value: payu-team
    type: AWS
