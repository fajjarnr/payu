apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: payu-cloud
  namespace: clusters
  labels:
    app.kubernetes.io/part-of: payu
    environment: cloud
spec:
  channel: stable-4.20
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.20.24-multi
  dns:
    baseDomain: payu.ocp.fajjjar.my.id
    privateZoneID: Z09069013903ZAKGG8DWP
    publicZoneID: Z01586331DWCIX83XX3FH
  platform:
    aws:
      region: ap-southeast-1
      endpointAccess: Public
      multiArch: false
      cloudProviderConfig:
        subnet:
          id: subnet-08e035b49059d8e7b
        vpc: vpc-02b42c82cbe43fd77
        zone: ap-southeast-1a
      rolesRef:
        controlPlaneOperatorARN: arn:aws:iam::955370087474:role/payu-cloud-control-plane-operator
        imageRegistryARN: arn:aws:iam::955370087474:role/payu-cloud-openshift-image-registry
        ingressARN: arn:aws:iam::955370087474:role/payu-cloud-openshift-ingress
        kubeCloudControllerARN: arn:aws:iam::955370087474:role/payu-cloud-cloud-controller
        networkARN: arn:aws:iam::955370087474:role/payu-cloud-cloud-network-config-controller
        nodePoolManagementARN: arn:aws:iam::955370087474:role/payu-cloud-node-pool
        storageARN: arn:aws:iam::955370087474:role/payu-cloud-aws-ebs-csi-driver-controller
      resourceTags:
        - key: kubernetes.io/cluster/payu-cloud
          value: owned
        - key: app.kubernetes.io/part-of
          value: payu
        - key: environment
          value: cloud
        - key: cost-center
          value: platform-engineering
        - key: owner
          value: payu-team
    type: AWS
  networking:
    clusterNetwork:
      - cidr: 10.136.0.0/14
    machineNetwork:
      - cidr: 10.0.0.0/16
    networkType: OVNKubernetes
    serviceNetwork:
      - cidr: 172.32.0.0/16
  infraID: payu-cloud
  fips: false
  issuerURL: https://oidc-storage-payu-shared-955370087474.s3.ap-southeast-1.amazonaws.com/payu-cloud
  configuration:
    ingress:
      loadBalancer:
        platform:
          aws:
            type: NLB
  capabilities: {}
  olmCatalogPlacement: management
  services:
    - service: APIServer
      servicePublishingStrategy:
        type: LoadBalancer
    - service: OAuthServer
      servicePublishingStrategy:
        type: Route
    - service: Konnectivity
      servicePublishingStrategy:
        type: Route
    - service: Ignition
      servicePublishingStrategy:
        type: Route
  controllerAvailabilityPolicy: SingleReplica
  infrastructureAvailabilityPolicy: SingleReplica
  autoscaling:
    scaling: ScaleUpAndScaleDown
  etcd:
    managed:
      storage:
        persistentVolume:
          size: 8Gi
          storageClassName: gp3-csi
        type: PersistentVolume
    managementType: Managed
  secretEncryption:
    aescbc:
      activeKey:
        name: payu-cloud-etcd-encryption-key
    type: aescbc
  pullSecret:
    name: payu-cloud-pull-secret
