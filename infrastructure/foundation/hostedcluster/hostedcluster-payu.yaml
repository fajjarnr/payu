apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: payu-dev
  namespace: local-cluster
  labels:
    hypershift.openshift.io/auto-created-for-infra: payu-rt7zf
    app.kubernetes.io/part-of: payu
    environment: dev
  annotations:
    hypershift.openshift.io/HasBeenAvailable: ""
spec:
  # ── Release ──────────────────────────────────────────────
  # Using 4.18.43-multi (same as development cluster, AWS-compatible)
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.18.43-multi

  # ── DNS ──────────────────────────────────────────────────
  dns:
    baseDomain: sandbox2356.opentlc.com
    # NOTE: privateZoneID & publicZoneID must match existing Route53 zones
    # If these don't exist yet, create them via AWS CLI/Terraform first
    privateZoneID: Z0415973TSODA407PC84
    publicZoneID: Z02597472Z6C8KKS12MZJ

  # ── Platform (AWS) ───────────────────────────────────────
  platform:
    aws:
      region: ap-southeast-1
      endpointAccess: Public
      multiArch: false
      cloudProviderConfig:
        subnet:
          id: subnet-0067a49544aa0bb1b   # Same subnet as development (ap-southeast-1a)
        vpc: vpc-0a87dcf1eba5b1711       # Same VPC as development
        zone: ap-southeast-1a
      resourceTags:
        - key: kubernetes.io/cluster/payu-rt7zf
          value: owned
        - key: app.kubernetes.io/part-of
          value: payu
        - key: environment
          value: dev
      # ── IAM Roles ────────────────────────────────────────
      # These must be pre-created: infrastructure/foundation/hostedcluster/create-iam-roles.sh
      rolesRef:
        controlPlaneOperatorARN: arn:aws:iam::579147609200:role/payu-rt7zf-control-plane-operator
        imageRegistryARN: arn:aws:iam::579147609200:role/payu-rt7zf-openshift-image-registry
        ingressARN: arn:aws:iam::579147609200:role/payu-rt7zf-openshift-ingress
        kubeCloudControllerARN: arn:aws:iam::579147609200:role/payu-rt7zf-cloud-controller
        networkARN: arn:aws:iam::579147609200:role/payu-rt7zf-cloud-network-config-controller
        nodePoolManagementARN: arn:aws:iam::579147609200:role/payu-rt7zf-node-pool
        storageARN: arn:aws:iam::579147609200:role/payu-rt7zf-aws-ebs-csi-driver-controller
    type: AWS

  # ── Networking ───────────────────────────────────────────
  networking:
    clusterNetwork:
      - cidr: 10.133.0.0/14          # Non-overlapping with development (10.132.0.0/14)
    machineNetwork:
      - cidr: 10.0.0.0/16            # Same VPC CIDR
    networkType: OVNKubernetes
    serviceNetwork:
      - cidr: 172.32.0.0/16          # Non-overlapping with development (172.31.0.0/16)

  # ── Cluster Config ───────────────────────────────────────
  clusterID: ""                        # Auto-generated
  infraID: payu-rt7zf
  fips: false
  issuerURL: https://oidc-storage-rt7zf.s3.us-east-2.amazonaws.com/payu-rt7zf
  configuration: {}
  capabilities: {}
  olmCatalogPlacement: management       # OLM catalogs on management cluster (saves worker resources)

  # ── Control Plane ────────────────────────────────────────
  controllerAvailabilityPolicy: SingleReplica          # Single replica for dev (use HighlyAvailable for prod)
  infrastructureAvailabilityPolicy: SingleReplica       # Single-replica infra for dev

  # ── Autoscaling ──────────────────────────────────────────
  autoscaling:
    scaling: ScaleUpAndScaleDown

  # ── ETCD ─────────────────────────────────────────────────
  etcd:
    managed:
      storage:
        persistentVolume:
          size: 8Gi
          storageClassName: gp3-csi
        type: PersistentVolume
    managementType: Managed

  # ── Encryption ───────────────────────────────────────────
  secretEncryption:
    aescbc:
      activeKey:
        name: payu-dev-etcd-encryption-key
    type: aescbc

  # ── Pull Secret ──────────────────────────────────────────
  pullSecret:
    name: payu-dev-pull-secret
