apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared overlay: Infrastructure namespaces + relaxed network policies
# Apply with: oc apply -k infrastructure/foundation/namespaces/overlays/shared/

resources:
  - ../../base
  - payu-cicd.yaml
  - allow-intra-namespace.yaml
  - allow-dns-egress.yaml
  - allow-external-secrets-to-vault.yaml
  - allow-openshift-router.yaml
  - allow-api-egress.yaml
  - allow-cicd-ingress.yaml
