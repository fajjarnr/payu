# Allow Tekton pipeline pods (payu-cicd) to reach application services in
# promotion namespaces (ZAP/DAST, Schemathesis, k6, Litmus gates target
# gateway-service / account-service via ClusterIP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cicd-ingress
  namespace: payu-sit
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payu-cicd
---
