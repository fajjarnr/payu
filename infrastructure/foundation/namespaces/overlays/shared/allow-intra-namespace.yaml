# Allow intra-namespace communication for PayU workloads
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: payu-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: payu
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: payu
  egress:
    - {}
