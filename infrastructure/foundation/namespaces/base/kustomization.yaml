apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base: Core PayU namespaces with ResourceQuota, LimitRange, and default-deny NetworkPolicy
# Apply with: oc apply -k infrastructure/foundation/namespaces/base/

resources:
  - namespaces.yaml
  - cicd-image-push-rolebindings.yaml
  - resource-quotas.yaml
  - limit-ranges.yaml
  - network-policies.yaml
