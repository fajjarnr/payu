# ------------------------------------------------------------
# PayU DevSecOps — Namespace Strategy (Phase 1 Foundation)
# Base manifests — core application namespaces
# ------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    payu.io/environment: dev
    payu.io/managed-by: platform-team
    payu.io/tier: non-production
    payu.fajjjar.my.id/ingress: shared
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
