# ------------------------------------------------------------
# PayU DevSecOps — Default Deny NetworkPolicy (Phase 1 Foundation)
# Zero-trust baseline: deny all ingress/egress unless explicitly allowed
# ------------------------------------------------------------

# --- payu-dev ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: payu-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
