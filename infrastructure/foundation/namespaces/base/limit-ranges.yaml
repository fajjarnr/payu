# ------------------------------------------------------------
# PayU DevSecOps — LimitRange (Phase 1 Foundation)
# Default container resource boundaries per namespace
# ------------------------------------------------------------

# --- payu-dev ---
apiVersion: v1
kind: LimitRange
metadata:
  name: payu-dev-limits
  namespace: payu-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 10Gi
      min:
        storage: 1Gi
---
