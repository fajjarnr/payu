# ------------------------------------------------------------
# PayU DevSecOps — ResourceQuota (Phase 1 Foundation)
# Scaled for 3-worker lab cluster
# ------------------------------------------------------------

# --- payu-dev ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: payu-dev-quota
  namespace: payu-dev
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "64"
    limits.memory: 80Gi
    persistentvolumeclaims: "30"
    requests.storage: 200Gi
    pods: "100"
    services: "50"
    secrets: "150"
    configmaps: "100"
    # ponytail: see comment above dev quota — secrets 100→150 for barman HA
---
# --- payu-sit ---
apiVersion: v1
