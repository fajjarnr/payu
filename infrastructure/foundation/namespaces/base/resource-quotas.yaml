# ------------------------------------------------------------
# PayU DevSecOps — ResourceQuota (Phase 1 Foundation)
# Scaled for 3-worker lab cluster
# ------------------------------------------------------------

# --- payu-dev ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: payu-dev-quota
  namespace: payu-dev
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 20Gi
    limits.cpu: "36"
    limits.memory: 48Gi
    persistentvolumeclaims: "30"
    requests.storage: 200Gi
    pods: "100"
    services: "50"
    secrets: "100"
    configmaps: "100"
---
