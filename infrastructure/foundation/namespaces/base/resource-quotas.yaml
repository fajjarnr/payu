# PayU DevSecOps — ResourceQuota (Phase 1 Foundation)
# Scaled for 3-worker lab cluster

apiVersion: v1
kind: ResourceQuota
metadata:
  name: payu-dev-quota
  namespace: payu-dev
spec:
  hard:
    requests.cpu: "24"
    requests.memory: 64Gi
    limits.cpu: "96"
    limits.memory: 120Gi
    persistentvolumeclaims: "40"
    requests.storage: 400Gi
    pods: "150"
    services: "80"
    secrets: "300"
    configmaps: "200"
    # ponytail: 30 app deployments + Kafka/Keycloak/3scale all share this namespace.
    # secrets 150→300: observed peak 150/150 wedged the CNPG operator
    # ("secrets payu-database-pull is forbidden: exceeded quota") on a fresh cluster.
---
