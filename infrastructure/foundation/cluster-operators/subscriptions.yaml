  name: rhbk-operator
  namespace: payu-sso # operator namespace; watches payu-sso via OperatorGroup
spec:
  channel: stable-v26
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

---
# 6. External Secrets Operator (Red Hat branded)
# NOTE: v1.1.0 deploys controller in 'external-secrets' namespace via
# ExternalSecretsConfig CR (operator.openshift.io/v1alpha1). Must create
# ExternalSecretsConfig named 'cluster' after operator install.
# CRD versions: v1 (served), v1beta1 (not served).
# See infrastructure/platform/security/vault/vault.yaml for lessons learned.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-external-secrets-operator
  namespace: openshift-operators
spec:
  channel: stable-v1
  name: openshift-external-secrets-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

---
