# PayU Platform - Operator Subscriptions
# All operators required for the platform infrastructure
# Apply BEFORE deploying infra CRs
# ============================================================

# 1. CloudNativePG (PostgreSQL HA)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cloudnative-pg
  namespace: openshift-operators
spec:
  channel: stable-v1
  name: cloudnative-pg
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

---
