# PayU Platform - Namespace & OperatorGroup for RHBK
# RHBK operator is namespace-scoped, requires OperatorGroup in target namespace
# ============================================================

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/managed-by: openshift
    environment: dev
    tier: development

---
# OperatorGroup for namespace-scoped operators (RHBK)
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: payu-dev-operatorgroup
  namespace: payu-dev
spec:
  targetNamespaces:
    - payu-dev
  upgradeStrategy: Default

---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-kube-descheduler-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-gitops-operator
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: gitops
---
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
---
apiVersion: v1
kind: Namespace
metadata:
  name: rhdh-operator
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: developer-hub
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-kube-descheduler-operator
  namespace: openshift-kube-descheduler-operator
spec:
  targetNamespaces:
    - openshift-kube-descheduler-operator

---
# 3. New OperatorGroups for remaining namespaces
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator-group
  namespace: rhacs-operator
spec:
  upgradeStrategy: Default

---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhdh-operator-group
  namespace: rhdh-operator
spec:
  upgradeStrategy: Default

---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-gitops-operator-group
  namespace: openshift-gitops-operator
spec:
  upgradeStrategy: Default

