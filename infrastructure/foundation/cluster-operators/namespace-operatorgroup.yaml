# PayU Platform - Namespace & OperatorGroup for RHBK
# RHBK operator is namespace-scoped, requires OperatorGroup in target namespace
# ============================================================

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/managed-by: platform-team
    payu.io/managed-by: platform-team
    payu.io/environment: dev
    payu.io/tier: non-production
    payu.fajjjar.my.id/ingress: shared
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# OperatorGroup for namespace-scoped operators (RHBK)
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: payu-dev-operatorgroup
  namespace: payu-dev
spec:
  targetNamespaces:
    - payu-dev
  upgradeStrategy: Default

---
apiVersion: v1
kind: Namespace
metadata:
  name: payu-sso
  labels:
    app.kubernetes.io/component: identity
    payu.io/managed-by: platform-team
    payu.fajjjar.my.id/ingress: shared
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: payu-sso
  namespace: payu-sso
spec:
  targetNamespaces:
    - payu-sso
  upgradeStrategy: Default

---
apiVersion: v1
kind: Namespace
metadata:
  name: payu-api-management
  labels:
    app.kubernetes.io/component: api-management
    payu.io/managed-by: platform-team
    payu.fajjjar.my.id/ingress: shared
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: payu-api-management
  namespace: payu-api-management
spec:
  targetNamespaces:
    - payu-api-management
  upgradeStrategy: Default

---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-operator
  labels:
    app.kubernetes.io/component: security
    payu.io/managed-by: platform-team
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cert-manager-operator
  namespace: cert-manager-operator
spec:
  targetNamespaces:
    - cert-manager-operator
  upgradeStrategy: Default

---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-kube-descheduler-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-gitops-operator
  labels:
    app.kubernetes.io/component: gitops
    payu.io/managed-by: platform-team
---
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  labels:
    app.kubernetes.io/component: security
    payu.io/managed-by: platform-team
---
apiVersion: v1
kind: Namespace
metadata:
  name: rhdh-operator
  labels:
    app.kubernetes.io/component: developer-hub
    payu.io/managed-by: platform-team
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-kube-descheduler-operator
  namespace: openshift-kube-descheduler-operator
spec:
  targetNamespaces:
    - openshift-kube-descheduler-operator

---
# 3. New OperatorGroups for remaining namespaces
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator-group
  namespace: rhacs-operator
spec:
  upgradeStrategy: Default

---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhdh-operator-group
  namespace: rhdh-operator
spec:
  upgradeStrategy: Default

---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-gitops-operator-group
  namespace: openshift-gitops-operator
spec:
  upgradeStrategy: Default

