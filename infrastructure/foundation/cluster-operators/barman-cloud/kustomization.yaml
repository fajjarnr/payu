apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CloudNativePG 1.30 deprecates its in-tree Barman integration. Keep the
namespace: openshift-operators
resources:
  - barman-tls.yaml
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.13.0/manifest.yaml

images:
  - name: ghcr.io/cloudnative-pg/plugin-barman-cloud
    newName: ghcr.io/cloudnative-pg/plugin-barman-cloud
    digest: sha256:71589dbac582333442812b07b31f7ea4d00324a8358aac7ca507dabf9f4b6c96

patches:
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      - op: replace
        path: /spec/strategy/type
        value: Recreate
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: --log-level=info
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsGroup
  - target:
      kind: Secret
      name: plugin-barman-cloud-.*
    patch: |-
      - op: replace
        path: /data/SIDECAR_IMAGE
        value: Z2hjci5pby9jbG91ZG5hdGl2ZS1wZy9wbHVnaW4tYmFybWFuLWNsb3VkLXNpZGVjYXJAc2hhMjU2Ojk5MDM2MWFmMzMxOWY5ZTIzYWFmYTBmNmQ3OTgxZjk5YmYxZjY5YjRlNmE4NWNmMWJjN2Q3MWQ2ZjA5YmIyODg=
