apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: shared-ingress
  namespace: openshift-ingress-operator
  annotations:
    ingress.operator.openshift.io/auto-delete-load-balancer: "true"
spec:
  namespaceSelector:
    matchLabels:
      payu.fajjjar.my.id/ingress: shared
  clientTLS:
    clientCA:
      name: ""
    clientCertificatePolicy: ""
  defaultCertificate:
    name: shared-ingress-cert
  domain: apps.fajjjar.my.id
  endpointPublishingStrategy:
    loadBalancer:
      dnsManagementPolicy: Unmanaged
      providerParameters:
        aws:
          networkLoadBalancer: {}
          type: NLB
        type: AWS
      scope: External
    type: LoadBalancerService
  httpCompression: {}
  httpEmptyRequestsPolicy: Respond
  httpErrorCodePages:
    name: ""
  replicas: 3
  tuningOptions:
    reloadInterval: 0s
  unsupportedConfigOverrides: null
