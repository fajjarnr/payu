apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
spec:
  namespaceSelector:
    matchExpressions:
      - key: payu.fajjjar.my.id/ingress
        operator: DoesNotExist
  idleConnectionTerminationPolicy: Deferred
  closedClientConnectionPolicy: Continue
  routeSelector:
    matchExpressions:
      - key: hypershift.openshift.io/hosted-control-plane
        operator: DoesNotExist
      # Shared-ingress routes (label ingress.payu.io/class=shared) are served
      # ONLY by shared-ingress; default router would present the wrong
      # (*.apps.payu.ocp) LE cert and break TLS. Verified live 2026-09-18.
      - key: ingress.payu.io/class
        operator: NotIn
        values:
          - shared
  tuningOptions:
    reloadInterval: 0s
  clientTLS:
    clientCA:
      name: ''
    clientCertificatePolicy: ''
  unsupportedConfigOverrides: null
  defaultCertificate:
    name: cert-manager-ingress-cert
  httpErrorCodePages:
    name: ''
  replicas: 3
  httpEmptyRequestsPolicy: Respond
  httpCompression: {}
  endpointPublishingStrategy:
    loadBalancer:
      providerParameters:
        aws:
          type: NLB
        type: AWS
      scope: External
    type: LoadBalancerService
