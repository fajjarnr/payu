# PayU MachineAutoscaler — current cluster (payu-c5pjf, ap-southeast-1)
# Worker pool: 3 AZs (ap-southeast-1a, 1b, 1c).
# Min 1 per AZ (3 total) = current baseline.
# Max 2 per AZ (6 total) = live ceiling 2026-09-11; raise only with capacity evidence.
---
apiVersion: autoscaling.openshift.io/v1beta1
kind: MachineAutoscaler
metadata:
  name: payu-c5pjf-worker-ap-southeast-1a
  namespace: openshift-machine-api
  annotations:
    payu.io/updated-at: "2026-09-11"
    payu.io/reason: "aligned to live cluster payu-c5pjf, min1/max2 per AZ"
spec:
  minReplicas: 1
  maxReplicas: 2
  scaleTargetRef:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    name: payu-c5pjf-worker-ap-southeast-1a
---
apiVersion: autoscaling.openshift.io/v1beta1
