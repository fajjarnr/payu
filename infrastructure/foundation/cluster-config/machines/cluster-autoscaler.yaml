apiVersion: autoscaling.openshift.io/v1
kind: ClusterAutoscaler
metadata:
  name: default
  annotations:
    payu.io/updated-by: "platform-engineer"
    payu.io/updated-at: "2026-08-01"
    payu.io/reason: "cluster-9xtfg worker autoscaling (us-east-1f, m6a.4xlarge)"
spec:
  # Allow k6/batch pods (priority=-10) to trigger scale-up
  podPriorityThreshold: -10
  resourceLimits:
    # 3 control-plane + up to 12 workers = 15 nodes
    maxNodesTotal: 15
    cores:
      # 3 masters (16 each) + 12 workers (16 each) = 240 cores max
      min: 48
      max: 240
    memory:
      # Units: GiB. 3 master (64 each) + 12 workers (64 each) = 960 GiB max
      min: 256
      max: 960
  balanceSimilarNodeGroups: true
  scaleDown:
    enabled: true
    delayAfterAdd: 10m
    delayAfterDelete: 5m
    delayAfterFailure: 5m
    unneededTime: 10m
