# PayU Platform - Common ConfigMaps and Secrets
# Shared configuration across all services

# Database credentials secret
# Populated automatically by Crunchy Postgres operator
# Applications reference this secret for database connections
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: db-credentials
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
type: Opaque
stringData:
  username: payu
  password: "<populated-from-crunchy-secret>"
  host: payu-postgres-primary.payu-dev.svc.cluster.local
  port: "5432"

---
# JWT Secret for service-to-service authentication
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: jwt-secret
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
type: Opaque
stringData:
  JWT_SECRET: "<generate-strong-secret>"

---
# Encryption keys for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: encryption-keys
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: encryption-keys
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
type: Opaque
stringData:
  AES_ENCRYPTION_KEY: "<32-byte-base64-key>"
  SECRET_KEY: "<32-byte-base64-key>"

---
# Kafka configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: kafka-config
    app.kubernetes.io/part-of: payu
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  KAFKA_RETRIES: "3"
  KAFKA_ACKS: "all"

---
# Spring Boot common configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: spring-config
    app.kubernetes.io/part-of: payu
data:
  SPRING_PROFILES_ACTIVE: "container"
  LOG_LEVEL: "INFO"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

---
# Keycloak/OIDC configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-config
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: oidc-config
    app.kubernetes.io/part-of: payu
data:
  OIDC_AUTH_SERVER_URL: "http://keycloak-discovery:8080/auth/realms/payu"
  OIDC_ISSUER: "http://keycloak-discovery:8080/auth/realms/payu"
  OIDC_REALM: "payu"
  OIDC_CLIENT_ID: "payu-backend"
  OIDC_ENABLED: "true"

---
# Service endpoints registry
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-endpoints
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: service-endpoints
    app.kubernetes.io/part-of: payu
data:
  # Core services
  ACCOUNT_SERVICE_URL: "http://account-service:8080"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  TRANSACTION_SERVICE_URL: "http://transaction-service:8080"
  WALLET_SERVICE_URL: "http://wallet-service:8080"

  # Supporting services
  BILLING_SERVICE_URL: "http://billing-service:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
  KYC_SERVICE_URL: "http://kyc-service:8080"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8080"
  GATEWAY_SERVICE_URL: "http://gateway-service:8080"

  # Infrastructure
  KEYCLOAK_SERVER_URL: "http://keycloak-discovery:8080/auth"
  KEYCLOAK_URL: "http://keycloak-discovery:8080/auth"
  POSTGRES_URL: "jdbc:postgresql://payu-postgres-primary:5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_URL: "kafka:9092"
