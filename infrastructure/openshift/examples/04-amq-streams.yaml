# PayU Platform - AMQ Streams (Apache Kafka)
# Event streaming platform with Kafka 4.0 (KRaft mode - no ZooKeeper)
# Requires: AMQ Streams Operator (installed via OLM)

# KafkaNodePool for Controller nodes (KRaft metadata quorum)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  replicas: 1  # Use 3 for production (minimum for quorum)
  roles:
    - controller
  storage:
    type: ephemeral  # Use persistent-claim for production

---
# KafkaNodePool for Broker nodes (data handling)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  replicas: 1  # Use 3 for production
  roles:
    - broker
  storage:
    type: ephemeral  # Use persistent-claim for production

---
# Main Kafka cluster configuration (KRaft mode)
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: messaging
    environment: dev
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.0.0
    # Listeners for internal and external connections
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    # Kafka configuration
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      inter.broker.protocol.version: "4.0"
      auto.create.topics.enable: "true"
    # Resources for Kafka brokers
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
  # Entity Operator manages topics and users
  entityOperator:
    topicOperator: {}
    userOperator: {}

---
# Service for connecting to Kafka
# Applications use: kafka:9092 (plaintext) or kafka:9093 (TLS)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    strimzi.io/cluster: kafka
    strimzi.io/kind: Kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: plain
    - port: 9093
      targetPort: 9093
      name: tls

---
# Example KafkaTopic for account events
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: account-events
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: account-events
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000  # 7 days
    cleanup.policy: delete

---
# Example KafkaTopic for transaction events
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transaction-events
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: transaction-events
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: 2592000000  # 30 days
    cleanup.policy: delete

---
# Connection information
# Kafka Bootstrap Servers:
#   - Internal (plaintext): kafka:9092
#   - Internal (TLS):       kafka:9093
#   - Bootstrap full:       kafka-kafka-bootstrap.payu-dev.svc:9092
