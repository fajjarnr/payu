# PayU Platform - AMQ Streams Console (Kafka UI)
# Web-based UI for managing Apache Kafka clusters
# Requires: AMQ Streams Console Operator (installed via OLM)
# Reference: https://docs.redhat.com/en/documentation/red_hat_streams_for_apache_kafka/3.1/html/using_the_streams_for_apache_kafka_console/assembly-deploying-str

---
# KafkaUser for Console authentication
# Required for SASL/SCRAM authentication to Kafka
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: payu-kafka-console-user
  namespace: payu-dev
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512

---
# Secret for KafkaUser credentials (auto-created by Strimzi User Operator)
# Contains SASL credentials for Console to connect to Kafka
# apiVersion: v1
# kind: Secret
# metadata:
#   name: payu-kafka-console-user
#   namespace: payu-dev
# type: Opaque
# stringData:
#   username: payu-kafka-console-user
#   password: "<auto-generated>"

---
# AMQ Streams Console instance
apiVersion: console.streamshub.github.com/v1alpha1
kind: Console
metadata:
  name: payu-kafka-console
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-kafka-console
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: kafka-ui
    environment: dev
spec:
  # Number of Console replicas
  replicas: 1

  # Hostname for the Console Route (required)
  hostname: kafka-console-payu-dev.apps.cluster.payu.fajjjar.my.id

  # Console configuration
  config:
    # Branding configuration
    branding:
      name: "PayU Kafka Console"
      url: "https://kafka-console-payu-dev.apps.cluster.payu.fajjjar.my.id"

  # Kafka cluster configuration
  # Note: The Kafka cluster must have a listener with matching authentication type
  kafkaClusters:
    - name: kafka                    # Name of the Kafka custom resource
      namespace: payu-dev            # Namespace of the Kafka cluster
      listener: plain                # Name of the listener to use
      credentials:                   # Authentication credentials
        kafkaUser:
          name: payu-kafka-console-user  # Name of the KafkaUser resource

  # Optional: Container resource configuration
  # containers:
  #   api:
  #     resources:
  #       requests:
  #         memory: "256Mi"
  #         cpu: "100m"
  #       limits:
  #         memory: "512Mi"
  #         cpu: "500m"
  #   ui:
  #     resources:
  #       requests:
  #         memory: "128Mi"
  #         cpu: "50m"
  #       limits:
  #         memory: "256Mi"
  #         cpu: "200m"

  # Optional: Prometheus metrics integration
  # metricsSources:
  #   - name: prometheus
  #     url: http://prometheus:9090

  # Optional: Security configuration
  # security:
  #   oidc:
  #     clientId: kafka-console
  #     issuerUri: https://keycloak-payu-dev.apps.cluster.payu.fajjjar.my.id/auth/realms/payu

---
# Service for internal access (auto-created by operator, shown for reference)
# apiVersion: v1
# kind: Service
# metadata:
#   name: payu-kafka-console-console-service
#   namespace: payu-dev
# spec:
#   selector:
#     app: payu-kafka-console
#   ports:
#     - port: 8080
#       targetPort: 8080

---
# Route for external access (auto-created by operator based on hostname)
# apiVersion: route.openshift.io/v1
# kind: Route
# metadata:
#   name: payu-kafka-console-console-ingress
#   namespace: payu-dev
# spec:
#   host: kafka-console-payu-dev.apps.cluster.payu.fajjjar.my.id
#   to:
#     kind: Service
#     name: payu-kafka-console-console-service
#   tls:
#     termination: edge

---
# Access Information
# Console URL: https://kafka-console-payu-dev.apps.cluster.payu.fajjjar.my.id
# Features:
#   - Browse Kafka topics and messages
#   - View consumer group offsets and lag
#   - Produce messages to topics
#   - Monitor broker health and metrics
#   - View cluster configuration
#
# Requirements:
#   1. Kafka cluster must have a listener with authentication configured
#   2. KafkaUser resource must be created with matching authentication type
#   3. Console CR must reference the correct KafkaUser in credentials
#
# Troubleshooting:
#   - If "0 Connected Kafka clusters" appears:
#     1. Check KafkaUser exists: oc get kafkauser payu-kafka-console-user
#     2. Check secret exists: oc get secret payu-kafka-console-user
#     3. Check Kafka listener has matching auth type
#     4. Check Console pod logs: oc logs deployment/payu-kafka-console-console-deployment
