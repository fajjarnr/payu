# PayU Platform - Red Hat Data Grid (Infinispan)
# Distributed caching and data grid solution
# Requires: Red Hat Data Grid Operator (installed via OLM)

apiVersion: infinispan.org/v1
kind: Infinispan
metadata:
  name: payu-datagrid
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-datagrid
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
    environment: dev
spec:
  # Number of replicas for high availability
  replicas: 1  # Increase to 3 for production HA

  # Service type: DataGrid for caching or Cache for in-memory only
  service:
    type: DataGrid

  # Security configuration
  security:
    endpointAuthentication: false  # Enable for production with proper auth
    # endpointSecretName: datagrid-credentials

  # Container resources
  container:
    memory: "512Mi"
    cpu: "250m"

  # JVM options
  jvm:
    heapSize: "256Mi"

  # Custom config for RESP (Redis protocol) connector
  configMapName: payu-datagrid-custom-config

  # Expose route for external access (optional)
  # expose:
  #   type: Route

---
# Custom Infinispan configuration with RESP connector
apiVersion: v1
kind: ConfigMap
metadata:
  name: payu-datagrid-custom-config
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-datagrid-config
    app.kubernetes.io/part-of: payu
data:
  infinispan-config.yaml: |
    infinispan:
      server:
        endpoints:
          - connectors:
              rest:
                restConnector: null
              hotrod:
                hotrodConnector: null
              resp:
                respConnector:
                  port: 6379
            securityRealm: default
            socketBinding: default

---
# Redis-compatible service alias
# Points to Data Grid's RESP connector on port 6379
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: datagrid
spec:
  type: ExternalName
  externalName: payu-datagrid.payu-dev.svc.cluster.local

---
# Cache configuration example
apiVersion: infinispan.org/v2alpha1
kind: Cache
metadata:
  name: payu-sessions
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-sessions
    app.kubernetes.io/part-of: payu
    infinispan.org/cluster: payu-datagrid
spec:
  clusterName: payu-datagrid
  name: sessions
  template: |
    <local-cache>
      <memory max-count="10000"/>
      <expiration lifespan="3600000" max-idle="1800000"/>
    </local-cache>

---
# Credentials secret (if endpoint authentication is enabled)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: datagrid-credentials
#   namespace: payu-dev
# type: Opaque
# stringData:
#   username: admin
#   password: "<secure-password>"

---
# Connection information
# Data Grid endpoints:
#   - REST:    http://payu-datagrid:11222
#   - HotRod:  payu-datagrid:11222
#   - RESP:    payu-datagrid:6379 (native Redis protocol via RESP connector)
#   - Alias:   redis:6379 (ExternalName → payu-datagrid)
