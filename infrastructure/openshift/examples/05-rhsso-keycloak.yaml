# PayU Platform - Red Hat Single Sign-On (RHSSO)
# Enterprise-grade identity and access management
# Requires: Red Hat Single Sign-On Operator (installed via OLM)

# External Database Secret for Crunchy Postgres
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: keycloak-db-secret
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: sso
type: Opaque
stringData:
  POSTGRES_DATABASE: keycloak
  POSTGRES_EXTERNAL_ADDRESS: payu-postgres-primary.payu-dev.svc.cluster.local
  POSTGRES_EXTERNAL_PORT: "5432"
  POSTGRES_HOST: payu-postgres-primary.payu-dev.svc.cluster.local
  POSTGRES_USERNAME: payu
  POSTGRES_PASSWORD: "<auto-generated-from-crunchy>"  # Get from: oc get secret payu-postgres-pguser-payu -o jsonpath='{.data.password}' | base64 -d
  POSTGRES_SUPERUSER: "false"
  SSLMODE: "prefer"

---
# RHSSO Keycloak Instance
apiVersion: keycloak.org/v1alpha1
kind: Keycloak
metadata:
  name: payu-keycloak
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: sso
    environment: dev
spec:
  # External access via OpenShift Route
  externalAccess:
    enabled: true

  # External database configuration (Crunchy Postgres)
  externalDatabase:
    enabled: true

  # Number of replicas
  instances: 1  # Use 2-3 for production HA

  # Resource configuration
  keycloakDeploymentSpec:
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  # Extensions (optional)
  # extensions:
  #   - https://github.com/aerogear/keycloak-metrics-spi/releases/download/2.5.3/keycloak-metrics-spi-2.5.3.jar

  # Pod disruption budget for HA
  # podDisruptionBudget:
  #   enabled: true

---
# Service for internal Keycloak connections
# Note: RHSSO operator creates 'keycloak' (HTTPS 8443) and 'keycloak-discovery' (HTTP 8080)
# For internal service-to-service (avoid SSL cert issues), use keycloak-discovery:8080
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: sso
spec:
  type: ClusterIP
  selector:
    app: keycloak
    app.kubernetes.io/managed-by: keycloak-operator
  ports:
    - port: 8443
      targetPort: 8443
      name: https
    - port: 8080
      targetPort: 8080
      name: http

---
# Credentials secret (auto-created by operator)
# Use: oc get secret credential-payu-keycloak -o jsonpath='{.data.ADMIN_USERNAME}' | base64 -d
# Use: oc get secret credential-payu-keycloak -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d

---
# Example KeycloakRealm for PayU
apiVersion: keycloak.org/v1alpha1
kind: KeycloakRealm
metadata:
  name: payu-realm
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-realm
    app.kubernetes.io/part-of: payu
spec:
  instanceSelector:
    matchLabels:
      app: payu-keycloak
  realm:
    id: payu
    realm: payu
    enabled: true
    displayName: "PayU Digital Banking"
    sslRequired: external
    registrationAllowed: false
    resetPasswordAllowed: true
    rememberMe: true

---
# Example KeycloakClient for Web App
apiVersion: keycloak.org/v1alpha1
kind: KeycloakClient
metadata:
  name: payu-web-app
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-web-app
    app.kubernetes.io/part-of: payu
spec:
  instanceSelector:
    matchLabels:
      app: payu-keycloak
  realmSelector:
    matchLabels:
      app: payu-realm
  client:
    clientId: payu-web-app
    name: "PayU Web Application"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://web-app-payu-dev.apps.cluster.payu.fajjjar.my.id/*"
      - "http://localhost:3000/*"
    webOrigins:
      - "+"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: false
    publicClient: true
    protocol: openid-connect

---
# Backend client for auth-service (confidential)
apiVersion: keycloak.org/v1alpha1
kind: KeycloakClient
metadata:
  name: payu-backend
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-backend
    app.kubernetes.io/part-of: payu
spec:
  instanceSelector:
    matchLabels:
      app: payu-keycloak
  realmSelector:
    matchLabels:
      app: payu-realm
  client:
    clientId: payu-backend
    name: "PayU Backend Services"
    enabled: true
    clientAuthenticatorType: client-secret
    secret: payu-backend-secret
    redirectUris:
      - "*"
    webOrigins:
      - "+"
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: true
    publicClient: false
    protocol: openid-connect

---
# Keycloak credentials secret for auth-service
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: keycloak-credentials
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: sso
type: Opaque
stringData:
  KEYCLOAK_CLIENT_SECRET: "payu-backend-secret"
  KEYCLOAK_ADMIN_USERNAME: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "<from-credential-payu-keycloak-secret>"

---
# Access Information
# Keycloak External URL: https://keycloak-payu-dev.apps.cluster.payu.fajjjar.my.id/auth
# Admin Credentials: Get from secret credential-payu-keycloak
# Internal HTTP (no SSL): http://keycloak-discovery:8080/auth  (use for service-to-service)
# Internal HTTPS: https://keycloak:8443/auth  (requires SSL trust config in Java)
# OIDC Issuer: http://keycloak-discovery:8080/auth/realms/payu
# Token Endpoint: http://keycloak-discovery:8080/auth/realms/payu/protocol/openid-connect/token
# Realm: payu
# Backend Client: payu-backend (confidential, secret: payu-backend-secret)
