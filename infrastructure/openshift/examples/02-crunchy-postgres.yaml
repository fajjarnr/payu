# PayU Platform - Crunchy Postgres for Kubernetes
# Production-ready PostgreSQL with high availability, backups, and monitoring
# Requires: Crunchy Postgres Operator (installed via OLM)

apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: payu-postgres
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
    environment: dev
spec:
  # PostgreSQL version and image
  image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi8-16.4-0
  postgresVersion: 16

  # Instance configuration with resource limits
  instances:
    - name: instance1
      replicas: 1  # Increase to 3 for production HA
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

  # pgBackRest backup configuration
  backups:
    pgbackrest:
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbackrest:ubi8-2.53-1
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi

  # pgBouncer connection pooling
  proxy:
    pgBouncer:
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbouncer:ubi8-1.23-1
      replicas: 1

  # User and database configuration
  users:
    - name: payu
      databases:
        - payu_account
        - payu_auth
        - payu_transaction
        - payu_wallet
        - payu_notification
        - payu_billing
        - payu_kyc
        - payu_analytics
        - payu_compliance
        - payu_bifast
        - payu_dukcapil
        - payu_qris
        - payu_investment
        - payu_lending
        - payu_backoffice
        - payu_partner
        - payu_promotion
        - payu_support
        - payu_statement
        - payu_fx
        - payu_cms
        - payu_abtesting
        - keycloak
      options: "SUPERUSER"

---
# Secret template for database credentials
# The operator creates this automatically, but this shows the structure
apiVersion: v1
kind: Secret
metadata:
  name: payu-postgres-pguser-payu
  namespace: payu-dev
type: Opaque
stringData:
  # These values are auto-generated by the operator
  # Use: oc get secret payu-postgres-pguser-payu -o jsonpath='{.data.password}' | base64 -d
  user: payu
  password: "<auto-generated>"
  host: payu-postgres-primary.payu-dev.svc.cluster.local
  port: "5432"
  dbname: payu_account
  uri: postgresql://payu:<password>@payu-postgres-primary:5432/payu_account

---
# Service for external database connections
# Primary endpoint for write operations
apiVersion: v1
kind: Service
metadata:
  name: payu-postgres-primary
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-postgres
    app.kubernetes.io/component: database
    postgres-operator.crunchydata.com/cluster: payu-postgres
    postgres-operator.crunchydata.com/role: master
spec:
  type: ClusterIP
  selector:
    postgres-operator.crunchydata.com/cluster: payu-postgres
    postgres-operator.crunchydata.com/role: master
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
