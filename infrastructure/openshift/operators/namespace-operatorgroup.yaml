# PayU Platform - Namespace & OperatorGroup for RHBK
# RHBK operator is namespace-scoped, requires OperatorGroup in target namespace
# ============================================================

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/managed-by: openshift
    environment: dev
    tier: development

---
# OperatorGroup for namespace-scoped operators (RHBK)
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: payu-dev-operatorgroup
  namespace: payu-dev
spec:
  targetNamespaces:
    - payu-dev
  upgradeStrategy: Default
