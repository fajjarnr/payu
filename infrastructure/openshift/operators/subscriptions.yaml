# PayU Platform - Operator Subscriptions
# All operators required for the platform infrastructure
# Apply BEFORE deploying infra CRs
# ============================================================

# 1. Crunchy Postgres for Kubernetes (PostgreSQL)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: crunchy-postgres-operator
  namespace: openshift-operators
spec:
  channel: v5
  name: crunchy-postgres-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

---
# 2. Red Hat Data Grid (Infinispan - Redis-compatible cache)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: datagrid
  namespace: openshift-operators
spec:
  channel: stable
  name: datagrid
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

---
