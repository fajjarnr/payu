apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-portal-service
  labels:
    app: api-portal-service
    app.kubernetes.io/name: api-portal-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: payu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-portal-service
  template:
    metadata:
      labels:
        app: api-portal-service
        app.kubernetes.io/name: api-portal-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api-portal-service
          image: image-registry.openshift-image-registry.svc:5000/payu/api-portal-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://postgres:5432/payu_api_portal"
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-portal-service
  labels:
    app: api-portal-service
spec:
  selector:
    app: api-portal-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
