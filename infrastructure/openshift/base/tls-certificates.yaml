# TLS Certificate Management for PayU Banking Platform
# Uses cert-manager with letsencrypt-cluster-issuer (DNS01 via Route53)
#
# The cluster already has a wildcard certificate for *.apps.payu.ocp.fajjjar.my.id
# managed by the ingress-certificate in openshift-ingress namespace.
#
# These certificates are for service-specific TLS secrets if needed.
# For dev, Routes use edge termination with the default ingress wildcard cert.
---
# Certificate: Gateway service (public-facing API)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
spec:
  secretName: gateway-tls-secret
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - gateway-payu-dev.apps.payu.ocp.fajjjar.my.id
  duration: 720h     # 30 days
  renewBefore: 168h  # 7 days before expiry
---
# Certificate: Web app (public-facing)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-app-tls
spec:
  secretName: web-app-tls-secret
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - payu-dev.apps.payu.ocp.fajjjar.my.id
  duration: 720h
  renewBefore: 168h
---
# Route: Gateway with TLS
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway-service-tls
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: payu-banking
spec:
  host: gateway-payu-dev.apps.payu.ocp.fajjjar.my.id
  to:
    kind: Service
    name: gateway-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
# Route: Web App with TLS
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web-app-tls
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: payu-banking
spec:
  host: payu-dev.apps.payu.ocp.fajjjar.my.id
  to:
    kind: Service
    name: web-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
