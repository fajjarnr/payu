# =============================================================================
# Pod Disruption Budget (PDB) for PayU Services
# =============================================================================
# Ensures minimum availability during node maintenance, upgrades, or eviction
# minAvailable: 1 means at least 1 pod must remain running
# This prevents total service outage during voluntary disruptions
# =============================================================================

# Critical Services - Require at least 1 pod during disruptions
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-service-pdb
  labels:
    app: gateway-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-service

