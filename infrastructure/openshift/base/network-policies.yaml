# NetworkPolicy: Default deny all ingress traffic
# Only explicitly allowed traffic will be permitted
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: payu-prod
  labels:
    app.kubernetes.io/part-of: payu-banking
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# NetworkPolicy: Allow traffic from OpenShift Router to gateway and web-app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-router
  namespace: payu-prod
  labels:
    app.kubernetes.io/part-of: payu-banking
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway-service
          - web-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
---
# NetworkPolicy: Allow gateway to reach all backend services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-gateway
  namespace: payu-prod
  labels:
    app.kubernetes.io/part-of: payu-banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: payu-banking
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-service
      ports:
        - protocol: TCP
          port: 8080
---
# NetworkPolicy: Allow inter-service communication within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: payu-prod
  labels:
    app.kubernetes.io/part-of: payu-banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: payu-banking
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: payu-banking
---
# NetworkPolicy: Allow Prometheus scraping from monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: payu-prod
  labels:
    app.kubernetes.io/part-of: payu-banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: payu-banking
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: openshift-monitoring
      ports:
        - protocol: TCP
          port: 8080
---
# NetworkPolicy: Allow Keycloak access from auth-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-from-auth
  namespace: payu-prod
  labels:
    app.kubernetes.io/part-of: payu-banking
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: payu-banking
      ports:
        - protocol: TCP
          port: 8080
---
# NetworkPolicy: Default deny all egress (restrict outbound)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: payu-prod
  labels:
    app.kubernetes.io/part-of: payu-banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: payu-banking
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow traffic within namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: payu-banking
    # Allow traffic to infrastructure namespace (DB, Kafka, Redis)
    - to:
        - namespaceSelector:
            matchLabels:
              name: payu-infra
    # Allow traffic to Keycloak
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
