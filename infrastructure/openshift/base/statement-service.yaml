apiVersion: apps/v1
kind: Deployment
metadata:
  name: statement-service
  labels:
    app: statement-service
    app.kubernetes.io/name: statement-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: payu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statement-service
  template:
    metadata:
      labels:
        app: statement-service
        app.kubernetes.io/name: statement-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: statement-service
      containers:
        - name: statement-service
          image: image-registry.openshift-image-registry.svc:5000/payu-dev/statement-service:v1.4.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "container"
            - name: SERVICES_WALLET_URL
              value: "http://wallet-service:8080"
            - name: SERVICES_TRANSACTION_URL
              value: "http://transaction-service:8080"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://payu-postgres-primary.payu-dev.svc:5432/payu_statement"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-kafka-bootstrap.payu-dev.svc:9092"
            - name: REDIS_HOST
              value: "payu-datagrid.payu-dev.svc"
            - name: REDIS_PORT
              value: "11222"
            - name: STATEMENT_STORAGE_TYPE
              value: "s3"
            - name: STATEMENT_STORAGE_S3_BUCKET
              value: "payu-statements"
            - name: STATEMENT_STORAGE_S3_REGION
              value: "ap-southeast-1"
            - name: STATEMENT_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: STATEMENT_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: statement-service
  labels:
    app: statement-service
spec:
  selector:
    app: statement-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
