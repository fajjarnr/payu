apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-service
  labels:
    app: support-service
    app.kubernetes.io/name: support-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: payu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-service
  template:
    metadata:
      labels:
        app: support-service
        app.kubernetes.io/name: support-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: support-service
          image: support-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "container"
            - name: OIDC_ISSUER
              value: "http://keycloak:8080/realms/payu"
            - name: OIDC_JWK_SET_URI
              value: "http://keycloak:8080/realms/payu/protocol/openid-connect/certs"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/payu_support"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: support-service
  labels:
    app: support-service
spec:
  selector:
    app: support-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
