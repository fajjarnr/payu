apiVersion: apps/v1
kind: Deployment
metadata:
  name: lending-service
  labels:
    app: lending-service
    app.kubernetes.io/name: lending-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: payu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lending-service
  template:
    metadata:
      labels:
        app: lending-service
        app.kubernetes.io/name: lending-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lending-service
      containers:
        - name: lending-service
          image: image-registry.openshift-image-registry.svc:5000/payu-dev/lending-service:v1.4.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "container"
            - name: SERVICES_WALLET_URL
              value: "http://wallet-service:8080"
            - name: PAYU_CACHE_REDIS_HOST
              value: "payu-datagrid.payu-dev.svc"
            - name: PAYU_CACHE_REDIS_PORT
              value: "11222"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://payu-postgres-primary.payu-dev.svc:5432/payu_lending"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-kafka-bootstrap.payu-dev.svc:9092"
            - name: REDIS_HOST
              value: "payu-datagrid.payu-dev.svc"
            - name: REDIS_PORT
              value: "11222"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lending-service
  labels:
    app: lending-service
spec:
  selector:
    app: lending-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
