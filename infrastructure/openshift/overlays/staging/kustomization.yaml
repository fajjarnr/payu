apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: payu-staging

# Staging: 1 replica per service, relaxed resource limits
patches:
  # Scale down to 1 replica for cost savings
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=payu-banking"

configMapGenerator:
  - name: staging-shared-config
    literals:
      - SPRING_PROFILES_ACTIVE=container
      - LOG_LEVEL=DEBUG
      - OTEL_TRACES_SAMPLER_ARG=1.0
