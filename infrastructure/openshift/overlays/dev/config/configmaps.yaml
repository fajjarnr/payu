apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: payu-dev
data:
  POSTGRES_HOST: "payu-postgres-pgbouncer.payu-dev.svc"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "payu"
  POSTGRES_MAX_CONNECTIONS: "20"
  POSTGRES_CONNECTION_TIMEOUT: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: payu-dev
data:
  REDIS_HOST: "payu-datagrid.payu-dev.svc"
  REDIS_PORT: "11222"
  REDIS_MAX_RETRIES: "3"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: payu-dev
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap.payu-dev.svc:9092"
  KAFKA_RETRIES: "3"
  KAFKA_ACKS: "all"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: payu-dev
data:
  PROMETHEUS_ENDPOINT: "http://prometheus-operated:9090"
  GRAFANA_ENDPOINT: "http://grafana:3000"
  LOKI_ENDPOINT: "http://loki:3100"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  LOGGING_ENABLED: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-dev-config
  namespace: payu-dev
data:
  QUARKUS_PROFILE: "dev"
  QUARKUS_LOG_LEVEL: "DEBUG"
  QUARKUS_LOG_CATEGORY__ID_PAYU__LEVEL: "DEBUG"
  QUARKUS_HTTP_CORS_ORIGINS: "https://dev.payu.id,http://localhost:3000,http://localhost:3001"
  QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
  QUARKUS_HTTP_CORS_HEADERS: "Authorization,Content-Type,Accept,Origin,X-Requested-With"
  QUARKUS_HTTP_CORS_CREDENTIALS: "true"
  QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE: "10M"
  OIDC_AUTH_SERVER_URL: "http://keycloak-discovery.payu-dev.svc:8080/auth/realms/payu"
  OIDC_CLIENT_ID: "payu-backend"
  OIDC_ENABLED: "true"
  ACCOUNT_SERVICE_URL: "http://account-service:8080"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  TRANSACTION_SERVICE_URL: "http://transaction-service:8080"
  WALLET_SERVICE_URL: "http://wallet-service:8080"
  BILLING_SERVICE_URL: "http://billing-service:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
  KYC_SERVICE_URL: "http://kyc-service:8080"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8080"
  RATE_LIMIT_ENABLED: "false"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-dev-config
  namespace: payu-dev
data:
  SPRING_PROFILES_ACTIVE: "container"
  LOG_LEVEL: "DEBUG"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-dev-config
  namespace: payu-dev
data:
  LOG_LEVEL: "DEBUG"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OTEL_ENDPOINT: "http://jaeger-collector:4317"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
