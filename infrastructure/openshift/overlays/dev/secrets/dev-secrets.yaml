## Dev Secrets for PayU Dev Environment
## Only secrets NOT managed by Vault Secrets Operator (VSO)
## VSO already manages: db-credentials, jwt-secret, encryption-keys, keycloak-credentials
##
## WARNING: These are DEVELOPMENT-ONLY secrets with placeholder values.
## DO NOT use these values in staging or production environments.
## For staging/prod, use ExternalSecrets or Vault Secrets Operator.
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: payu-dev
type: Opaque
stringData:
  JWT_SECRET: "payu-dev-jwt-secret-key-for-gateway-at-least-256-bits-long"
  WEBHOOK_PARTNER_1_SECRET: "dev-partner-1-webhook-secret-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: payu-dev
type: Opaque
stringData:
  url: "redis://payu-datagrid.payu-dev.svc:11222"
  REDIS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: web-credentials
  namespace: payu-dev
type: Opaque
stringData:
  nextauth-secret: "payu-dev-nextauth-secret-key-for-session-encryption"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: payu-dev
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: "3j9ha81g_8LZTQ=="
