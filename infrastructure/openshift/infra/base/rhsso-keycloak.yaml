# PayU Platform - Red Hat Single Sign-On (RHSSO / Keycloak)
# Enterprise identity and access management
# Prerequisite: rhsso-operator subscription installed (namespace-scoped)
# ============================================================
#
# IMPORTANT NOTES:
# 1. RHSSO operator creates an ExternalName service 'keycloak-postgresql'
#    pointing to keycloak-db-secret.POSTGRES_EXTERNAL_ADDRESS.
#    Use FQDN (*.svc.cluster.local) to avoid DNS resolution failures.
# 2. keycloak-db-secret MUST contain POSTGRES_EXTERNAL_ADDRESS with FQDN.
# 3. The 'keycloak' database must be in the PostgresCluster user.databases list
#    so pg_hba.conf is auto-configured for the connection.
# ============================================================

# RHSSO Keycloak Instance
apiVersion: keycloak.org/v1alpha1
kind: Keycloak
metadata:
  name: payu-keycloak
  labels:
    app: payu-keycloak
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: sso
spec:
  externalAccess:
    enabled: true
  externalDatabase:
    enabled: true
  instances: 1

---
# KeycloakRealm for PayU
apiVersion: keycloak.org/v1alpha1
kind: KeycloakRealm
metadata:
  name: payu-realm
  labels:
    app.kubernetes.io/name: payu-realm
    app.kubernetes.io/part-of: payu
spec:
  instanceSelector:
    matchLabels:
      app: payu-keycloak
  realm:
    id: payu
    realm: payu
    enabled: true
    displayName: "PayU Digital Banking"
    sslRequired: external
    registrationAllowed: false
    resetPasswordAllowed: true
    rememberMe: true

---
# KeycloakClient - Web App (public)
apiVersion: keycloak.org/v1alpha1
kind: KeycloakClient
metadata:
  name: payu-web-app
  labels:
    app.kubernetes.io/name: payu-web-app
    app.kubernetes.io/part-of: payu
spec:
  instanceSelector:
    matchLabels:
      app: payu-keycloak
  realmSelector:
    matchLabels:
      app: payu-realm
  client:
    clientId: payu-web-app
    name: "PayU Web Application"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://dev.payu.fajjjar.my.id/*"
      - "http://localhost:3000/*"
    webOrigins:
      - "+"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: false
    publicClient: true
    protocol: openid-connect

---
# KeycloakClient - Backend Services (confidential)
apiVersion: keycloak.org/v1alpha1
kind: KeycloakClient
metadata:
  name: payu-backend
  labels:
    app.kubernetes.io/name: payu-backend
    app.kubernetes.io/part-of: payu
spec:
  instanceSelector:
    matchLabels:
      app: payu-keycloak
  realmSelector:
    matchLabels:
      app: payu-realm
  client:
    clientId: payu-backend
    name: "PayU Backend Services"
    enabled: true
    clientAuthenticatorType: client-secret
    secret: payu-backend-secret
    redirectUris:
      - "*"
    webOrigins:
      - "+"
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: true
    publicClient: false
    protocol: openid-connect
