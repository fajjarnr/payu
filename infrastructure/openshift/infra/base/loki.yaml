# LokiStack for Application & Infrastructure Logging
# This instance handles ONLY cluster/app logs via ClusterLogForwarder.
# Network Observability (NetObserv) uses a SEPARATE LokiStack → netobserv-loki.yaml
# ============================================================
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: payu-loki
  namespace: openshift-logging
spec:
  size: 1x.extra-small
  limits:
    global:
      ingestion:
        ingestionRate: 50
        ingestionBurstSize: 100
        maxGlobalStreamsPerTenant: 100000
  storage:
    schemas:
      - version: v13
        effectiveDate: "2024-10-01"
    secret:
      name: logging-loki-s3
      type: s3
  storageClassName: gp3-csi
  tenants:
    mode: openshift-logging
