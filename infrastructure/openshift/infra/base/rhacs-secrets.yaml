# RHACS (Red Hat Advanced Cluster Security) Secrets
# This file contains dummy secrets for automation/lab purposes.
# In production, use SealedSecrets or Vault.
---
# API Token for roxctl (used in Tekton pipelines)
apiVersion: v1
kind: Secret
metadata:
  name: roxctl-api-token
  namespace: payu-cicd
  labels:
    app: payu
    type: security
type: Opaque
stringData:
  # This is a dummy token. Replace with a real token from ACS Central.
  token: "eyJhbGciOiJSUzI1NiIsImtpZCI6InJveGN0bC1kZXYifQ.eyJyZWFsbSI6InN0YWNrcm94IiwiY2xpZW50IjoiZGV2LWNsaWVudCJ9.dummy-token-for-dev-use-replace-me"
---
# Cluster Registration Secret (used by SecuredCluster CR to connect sensor to central)
apiVersion: v1
kind: Secret
metadata:
  name: cluster-registration-secret
  namespace: stackrox
  labels:
    app: payu
    type: security
type: Opaque
stringData:
  # In a real ACS setup, this secret is generated by ACS Central.
  # This is a placeholder to satisfy the SecuredCluster CR.
  admission-control-token: "dummy-registration-token"
  collector-token: "dummy-registration-token"
  sensor-token: "dummy-registration-token"
