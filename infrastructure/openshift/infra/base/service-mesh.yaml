# Service Mesh - using Sail operator (OpenShift Service Mesh 3.x)
# CRD: istios.sailoperator.io (NOT maistra.io)
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: payu-mesh
  namespace: istio-system
spec:
  version: v1.28.4
  namespace: istio-system
  values:
    global:
      meshID: payu-mesh
    pilot:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
