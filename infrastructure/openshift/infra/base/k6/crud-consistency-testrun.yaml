# PayU k6 Operator — CRUD Data Consistency TestRun (OPS-2026-04-08-04 follow-up)
# Addresses: OPS-2026-04-08-04 (re-run consistency canary with latest cluster state)
#
# Run: kubectl apply -f crud-consistency-testrun.yaml -n payu-k6
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: payu-crud-consistency
  namespace: payu-k6
  labels:
    app.kubernetes.io/part-of: payu-platform
    app.kubernetes.io/component: k6-performance
    test-type: consistency
    ops-ref: OPS-2026-04-08-04
spec:
  parallelism: 2
  script:
    configMap:
      name: k6-crud-consistency-test
      file: crud-data-consistency-test.js
  runner:
    serviceAccountName: k6-runner
    image: grafana/k6:latest
    env:
      - name: GATEWAY_URL
        value: "https://gateway-dev.payu.fajjjar.my.id"
      - name: KEYCLOAK_URL
        value: "https://sso.dev.payu.fajjjar.my.id"
      - name: GATEWAY_RATE_LIMIT_TEST_MODE
        value: "true"
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    volumeMounts:
      - name: lib-auth
        mountPath: /scripts/lib/auth.js
        subPath: auth.js
      - name: lib-wallet
        mountPath: /scripts/lib/wallet.js
        subPath: wallet.js
      - name: lib-card
        mountPath: /scripts/lib/card.js
        subPath: card.js
      - name: lib-transaction
        mountPath: /scripts/lib/transaction.js
        subPath: transaction.js
    volumes:
      - name: lib-auth
        configMap:
          name: k6-lib-auth
      - name: lib-wallet
        configMap:
          name: k6-lib-wallet
      - name: lib-card
        configMap:
          name: k6-lib-card
      - name: lib-transaction
        configMap:
          name: k6-lib-transaction
  separate: false
