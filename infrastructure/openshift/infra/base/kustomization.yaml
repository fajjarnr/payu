apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PayU Infrastructure - Base manifests (payu-dev namespace resources ONLY)
# Resources with their own namespace are in cluster-scoped/ and applied separately
# ============================================================
#
# Deployment Order:
# 1. Operators:  oc apply -k infrastructure/openshift/operators/
# 2. Wait:       Wait for all operator CSVs to reach 'Succeeded'
# 3. Cluster:    ./scripts/apply-cluster-infra.sh (or manually apply cluster-scoped resources)
# 4. Infra:      oc apply -k infrastructure/openshift/infra/overlays/dev/
# 5. Vault Init: oc apply -f infrastructure/openshift/infra/base/vault-init-job.yaml
#                (update passwords first!)
# 6. Services:   oc apply -k infrastructure/openshift/overlays/dev/
# ============================================================

resources:
  # === Resources that belong in payu-dev namespace ===
  # Database
  - crunchy-postgres.yaml
  # Cache (Redis-compatible)
  - datagrid.yaml
  # Event Streaming
  - amq-streams.yaml
  # Kafka UI
  - kafka-console.yaml
  # Identity & Access (RHBK - Red Hat Build of Keycloak)
  # IMPORTANT: secrets must be applied BEFORE rhbk-keycloak.yaml
  - rhbk-secrets.yaml
  - rhbk-keycloak.yaml
  # Secret Management
  - vault.yaml
  # TLS / cert-manager
  - cert-manager.yaml
  # Shared ConfigMaps
  - common-configmaps.yaml
  # API Management
  - 3scale.yaml

  # === Cluster-scoped resources (have their own namespace in metadata) ===
  # These are included here but MUST NOT have namespace overridden.
  # The overlay uses namespace exceptions or they are applied separately.
  # ---
  # NOTE: The following resources have hardcoded namespaces and must be
  # applied directly with `oc apply -f` to avoid namespace override:
  #
  #   oc apply -f infrastructure/openshift/infra/base/loki.yaml
  #   oc apply -f infrastructure/openshift/infra/base/netobserv-loki.yaml
  #   oc apply -f infrastructure/openshift/infra/base/netobserv.yaml
  #   oc apply -f infrastructure/openshift/infra/base/cluster-logging.yaml
  #   oc apply -f infrastructure/openshift/infra/base/cluster-observability.yaml
  #   oc apply -f infrastructure/openshift/infra/base/kubedescheduler.yaml
  #   oc apply -f infrastructure/openshift/infra/base/rhacs.yaml
  #   oc apply -f infrastructure/openshift/infra/base/rhdh.yaml
  #   oc apply -f infrastructure/openshift/infra/base/kiali.yaml
  #   oc apply -f infrastructure/openshift/infra/base/service-mesh.yaml
  #   oc apply -f infrastructure/openshift/infra/base/istio-cni.yaml
  #   oc apply -f infrastructure/openshift/infra/base/gitops.yaml
  #   oc apply -f infrastructure/openshift/infra/base/pipelines.yaml

commonLabels:
  environment: dev
