# PayU Platform - Keycloak Database Secret (Legacy RHSSO format)
# ============================================================
# NOTE: This file is DEPRECATED.
# RHBK uses rhbk-secrets.yaml with payu-keycloak-db secret instead.
# This file is retained for reference during migration only.
# The RHBK Keycloak CR references db credentials via:
#   spec.db.usernameSecret / spec.db.passwordSecret
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  labels:
    app.kubernetes.io/name: keycloak-db-secret
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: sso
type: Opaque
stringData:
  # FQDN for ExternalName service - must use cluster.local suffix
  POSTGRES_EXTERNAL_ADDRESS: "payu-postgres-primary.payu-dev.svc.cluster.local"
  # Database credentials
  POSTGRES_USERNAME: "payu"
  POSTGRES_PASSWORD: "payu-dev-password-123"
  # Connection details
  POSTGRES_HOST: "payu-postgres-primary.payu-dev.svc"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "keycloak"
