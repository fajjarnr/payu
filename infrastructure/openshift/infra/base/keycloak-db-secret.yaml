# PayU Platform - Keycloak Database Secret
# Required by RHSSO operator for external database connectivity
# ============================================================
#
# IMPORTANT: This secret MUST be created BEFORE the Keycloak CR is applied.
# The RHSSO operator uses this secret to:
# 1. Connect to external PostgreSQL database
# 2. Create ExternalName service 'keycloak-postgresql'
#
# Required keys:
# - POSTGRES_EXTERNAL_ADDRESS: FQDN for ExternalName service (*.svc.cluster.local)
# - POSTGRES_USERNAME: Database username
# - POSTGRES_PASSWORD: Database password
# - POSTGRES_HOST: Database host for Keycloak connection
# - POSTGRES_PORT: Database port
# - POSTGRES_DATABASE: Database name
#
# NOTE: Update the password before applying in production!
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  labels:
    app.kubernetes.io/name: keycloak-db-secret
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: sso
type: Opaque
stringData:
  # FQDN for ExternalName service - must use cluster.local suffix
  POSTGRES_EXTERNAL_ADDRESS: "payu-postgres-primary.payu-dev.svc.cluster.local"
  # Database credentials
  POSTGRES_USERNAME: "payu"
  POSTGRES_PASSWORD: "payu-dev-password-123"
  # Connection details
  POSTGRES_HOST: "payu-postgres-primary.payu-dev.svc"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "keycloak"
