apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-ingress-cert
  namespace: openshift-ingress
spec:
  commonName: apps.payu.ocp.fajjjar.my.id
  dnsNames:
    - apps.payu.ocp.fajjjar.my.id
    - "*.apps.payu.ocp.fajjjar.my.id"
  duration: 2160h
  isCA: false
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: zerossl-production-ec2
  renewBefore: 360h
  secretName: cert-manager-ingress-cert
  usages:
    - server auth
    - client auth
