apiVersion: apps/v1
kind: Deployment
metadata:
  name: developer-hub
  namespace: payu-platform
  labels:
    app: developer-hub
    app.kubernetes.io/name: developer-hub
    app.kubernetes.io/component: developer-portal
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/managed-by: kustomize
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"postgresql"}]'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: developer-hub
  template:
    metadata:
      labels:
        app: developer-hub
        app.kubernetes.io/name: developer-hub
        app.kubernetes.io/component: developer-portal
        app.kubernetes.io/part-of: payu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "7007"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: developer-hub
      containers:
        - name: developer-hub
          image: registry.redhat.io/rhdh/rhdh-hub-rhel9:1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7007
              name: http
              protocol: TCP
          args:
            - "--config"
            - "/opt/app-root/app-config/app-config.yaml"
          envFrom:
            - secretRef:
                name: developer-hub-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: app-config
              mountPath: /opt/app-root/app-config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      volumes:
        - name: app-config
          configMap:
            name: developer-hub-config
