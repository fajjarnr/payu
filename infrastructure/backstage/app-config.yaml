app:
  title: PayU Developer Hub
  baseUrl: https://developer-hub.payu.fajjjar.my.id

organization:
  name: PayU

backend:
  baseUrl: https://developer-hub.payu.fajjjar.my.id
  listen:
    port: 7007
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  cors:
    origin: https://developer-hub.payu.fajjjar.my.id
    methods: [GET, POST, PUT, DELETE]
    credentials: true

auth:
  environment: production
  providers:
    oidc:
      development:
        # Must match Keycloak realm 'payu'. The realm export uses clientId 'payu-web-app'.
        # Ensure KEYCLOAK_CLIENT_ID is set to a Backstage-specific client or 'payu-web-app'.
        metadataUrl: ${KEYCLOAK_URL}/realms/payu/.well-known/openid-configuration
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        prompt: auto
        scope: openid profile email

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: ${KUBERNETES_API_URL}
          name: payu-openshift
          authProvider: serviceAccount
          serviceAccountToken: ${KUBERNETES_SA_TOKEN}
          skipTLSVerify: false

catalog:
