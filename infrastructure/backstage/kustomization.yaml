apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payu-platform

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: payu

resources:
  - deployment.yaml
  - service.yaml
  - secrets.yaml
  - rbac.yaml

configMapGenerator:
  - name: developer-hub-config
    files:
      - app-config.yaml
