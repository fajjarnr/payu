# WARNING: This is a template. Replace placeholder values before applying.
# For production, use SealedSecrets or External Secrets Operator with HashiCorp Vault.
#
# Example with External Secrets:
#   kubectl apply -f external-secret-developer-hub.yaml
#
# Example with SealedSecrets:
#   kubeseal --format=yaml < secrets.yaml > sealed-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: developer-hub-secrets
  namespace: payu-platform
  labels:
    app: developer-hub
    app.kubernetes.io/name: developer-hub
    app.kubernetes.io/component: developer-portal
    app.kubernetes.io/part-of: payu
type: Opaque
stringData:
  # ── PostgreSQL ──────────────────────────────────
  POSTGRES_HOST: "postgresql.payu-platform.svc"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "backstage"
  POSTGRES_PASSWORD: "${BACKSTAGE_DB_PASSWORD}"

  # ── Keycloak / OIDC ────────────────────────────
  KEYCLOAK_URL: "https://sso.payu.fajjjar.my.id"
  KEYCLOAK_CLIENT_ID: "developer-hub"
  KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"

  # ── Kubernetes API (for catalog plugin) ─────────
  KUBERNETES_API_URL: "https://api.payu-openshift.fajjjar.my.id:6443"
  KUBERNETES_SA_TOKEN: "${KUBERNETES_SA_TOKEN}"
