# Kong Plugin Configuration for PayU Integration
#
# Defines KongPlugin CRDs that configure Kong to work with the PayU gateway-service
# in a 2-tier architecture. These plugins handle:
#   1. API key authentication (partner identification)
#   2. Rate limiting (per-partner quotas)
#   3. Request transformation (inject PayU-specific headers)
#   4. Request correlation (tracing across tiers)
#
# Usage:
#   oc apply -f kong-plugin-payu.yaml -n payu-api-management
#
# NOTE: This is a TEMPLATE. Adjust configuration values as needed.
# See README.md for full setup instructions.
---
# ============================================================================
# Plugin 1: API Key Authentication
# Validates partner API keys before forwarding to PayU gateway
# ============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: payu-key-auth
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: kong-plugin
    app.kubernetes.io/part-of: payu-api-management
  annotations:
    kubernetes.io/description: "API key authentication for PayU partner access"
plugin: key-auth
config:
  # Where to look for the API key
  key_names:
    - X-API-Key
    - apikey
  # Include the consumer (partner) info in upstream headers
  key_in_header: true
  key_in_query: false
  key_in_body: false
  # Hide the API key from upstream (PayU gateway handles its own auth)
  hide_credentials: true
  # Return 401 with descriptive error
  anonymous: null
  run_on_preflight: false

---
# ============================================================================
# Plugin 2: Rate Limiting (Global Default)
# Per-partner rate limits; override per consumer for specific plans
# ============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: payu-rate-limiting
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: kong-plugin
    app.kubernetes.io/part-of: payu-api-management
  annotations:
    kubernetes.io/description: "Default rate limiting for PayU API access"
plugin: rate-limiting
config:
  # Default limits (override per consumer for partner-specific plans)
  second: null
  minute: 60
  hour: 1000
  day: 10000
  month: null
  year: null
  # Use Redis for distributed rate limiting (shared across Kong replicas)
  policy: redis
  redis:
    host: datagrid.payu-cache.svc  # Red Hat Data Grid in RESP mode
    port: 6379
    password: "${REDIS_PASSWORD}"  # REQUIRED: inject via Kong env or K8s Secret. Never leave null in production.
    database: 3     # Separate DB from 3scale/application cache
    timeout: 2000
  # Rate limit by consumer (partner), not by IP
  limit_by: consumer
  # Return rate limit headers to partners
  header_name: X-PayU-Rate-Limit
  hide_client_headers: false
  # Count only successful requests against quota
  error_code: 429
  error_message: "PayU API rate limit exceeded. Contact support for plan upgrade."
  fault_tolerant: true

---
# ============================================================================
# Plugin 3: Request Transformer — PayU Header Injection
# Injects partner identification headers for the PayU gateway (Tier 2)
# ============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: payu-request-transformer
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: kong-plugin
    app.kubernetes.io/part-of: payu-api-management
  annotations:
    kubernetes.io/description: "Injects PayU partner headers into upstream requests"
plugin: request-transformer
config:
  add:
    headers:
      # Inject partner ID from Kong consumer username
      - "X-PayU-Partner-Id:$(headers['x-consumer-username'] or 'unknown')"
      # Inject consumer custom_id as plan identifier
      - "X-PayU-Plan-Id:$(headers['x-consumer-custom-id'] or 'default')"
      # Inject Kong request ID for cross-tier tracing
      - "X-PayU-Request-Id:$(headers['x-kong-request-id'])"
      # Mark that request passed through API management tier
      - "X-PayU-Gateway-Tier:kong"
  remove:
    headers:
      # Remove Kong internal headers that should not leak upstream
      - "x-consumer-id"

---
# ============================================================================
# Plugin 4: Correlation ID — End-to-End Request Tracing
# Ensures every request has a unique correlation ID across both tiers
# ============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: payu-correlation-id
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: kong-plugin
    app.kubernetes.io/part-of: payu-api-management
  annotations:
    kubernetes.io/description: "Correlation ID for end-to-end request tracing"
plugin: correlation-id
config:
  header_name: X-PayU-Correlation-Id
  generator: uuid#counter
  echo_downstream: true

---
# ============================================================================
# Plugin 5: IP Restriction (Optional — per-partner allowlists)
# Apply to specific consumers/routes for partners with static IP requirements
# ============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: payu-ip-restriction-template
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: kong-plugin
    app.kubernetes.io/part-of: payu-api-management
  annotations:
    kubernetes.io/description: "Template: IP allowlist for specific partners"
plugin: ip-restriction
config:
  # Replace with actual partner IP ranges
  allow:
    - "10.0.0.0/8"       # Internal cluster network (placeholder)
    - "<PARTNER_IP_CIDR>" # Partner-specific IP range
  status: 403
  message: "Access denied: IP not in allowlist for this partner"

---
# ============================================================================
# KongIngress: Upstream configuration for PayU Gateway Service
# Defines how Kong connects to the PayU gateway backend
# ============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongIngress
metadata:
  name: payu-gateway-upstream
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: kong-ingress
    app.kubernetes.io/part-of: payu-api-management
upstream:
  # Health checks to detect PayU gateway failures
  healthchecks:
    active:
      healthy:
        interval: 10
        successes: 3
      unhealthy:
        interval: 5
        http_failures: 3
        tcp_failures: 3
        timeouts: 3
      type: http
      http_path: /q/health/ready  # Quarkus health endpoint
      timeout: 5
    passive:
      healthy:
        successes: 5
      unhealthy:
        http_failures: 5
        tcp_failures: 3
        timeouts: 3
  # Load balancing
  algorithm: round-robin
  slots: 1000
  # Connection settings
  hash_on: consumer  # Route same partner to same upstream for caching
proxy:
  connect_timeout: 5000
  read_timeout: 30000   # Allow time for banking operations
  write_timeout: 30000
  retries: 2
  path: /
  # PRODUCTION: Change to 'https' and configure TLS certificates.
  # In OpenShift, TLS termination is typically handled by the Route/Ingress,
  # but backend protocol should still be HTTPS for defense-in-depth (mTLS).
  protocol: http
