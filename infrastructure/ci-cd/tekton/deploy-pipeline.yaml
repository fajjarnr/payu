apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-deploy-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: deploy
spec:
  description: |
    Deployment pipeline for PayU services with blue-green deployment strategy.
    Supports multiple environments with automatic rollback on failure.
    Fixed for OpenShift Pipelines 1.21+ (no ClusterTask — uses resolver: cluster).
  params:
    - name: service-name
      type: string
      description: Name of the service to deploy
    - name: environment
      type: string
      description: Target environment (dev, staging, prod)
      default: staging
    - name: image-tag
      type: string
      description: Image tag to deploy
      default: latest
    - name: registry-url
      type: string
      description: Container registry URL
      default: image-registry.openshift-image-registry.svc:5000
    - name: registry-namespace
      type: string
      description: Registry namespace/project
      default: payu-dev
    - name: namespace
      type: string
      description: Target namespace for deployment
      default: payu-dev
    - name: replicas
      type: string
      description: Number of replicas
      default: "1"
    - name: health-check-timeout
      type: string
      description: Timeout for health checks in seconds
      default: "300"
    - name: rollback-on-failure
      type: string
      description: Automatic rollback on deployment failure
      default: "true"
    - name: deployment-strategy
      type: string
      description: Deployment strategy (bluegreen, rolling)
      default: rolling
  workspaces:
    - name: manifest-dir
      description: Workspace for Kubernetes manifests
  tasks:
    - name: create-namespace
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            if oc get namespace $(params.namespace) >/dev/null 2>&1; then
              echo "[*] Namespace $(params.namespace) already exists"
            else
              echo "[*] Creating namespace $(params.namespace)"
              oc new-project $(params.namespace) --skip-config-write
            fi

            oc label namespace $(params.namespace) environment=$(params.environment) app=payu --overwrite

    - name: apply-configmaps
      runAfter:
        - create-namespace
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            config_path="infrastructure/openshift/overlays/$(params.environment)/config/configmaps.yaml"

            echo "[*] Applying configmaps for $(params.environment)"
            if [ -f "$config_path" ]; then
              oc apply -f "$config_path" -n $(params.namespace)
            else
              echo "[*] Skipping configmaps apply; $config_path is not available in this PipelineRun workspace"
            fi

    - name: create-deployment
      runAfter:
        - apply-configmaps
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            if oc get deployment/$(params.service-name) -n $(params.namespace) >/dev/null 2>&1; then
              echo "[*] Updating existing deployment $(params.service-name)"

              oc patch deployment $(params.service-name) -n $(params.namespace) --type merge -p '{"metadata":{"labels":{"app":"$(params.service-name)","app.kubernetes.io/name":"$(params.service-name)","app.kubernetes.io/part-of":"payu","environment":"$(params.environment)"}},"spec":{"replicas":$(params.replicas),"template":{"metadata":{"labels":{"app":"$(params.service-name)","app.kubernetes.io/name":"$(params.service-name)","app.kubernetes.io/part-of":"payu"}}}}}'
              oc set image deployment/$(params.service-name) $(params.service-name)=$(params.registry-url)/$(params.registry-namespace)/$(params.service-name):$(params.image-tag) -n $(params.namespace)
            else
              echo "Deployment $(params.service-name) does not exist in namespace $(params.namespace)."
              echo "This pipeline currently supports updating existing deployments so service-specific env, probes, and secrets are preserved."
              exit 1
            fi

    - name: create-service
      runAfter:
        - create-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            cat <<EOF | oc apply -n $(params.namespace) -f -
            apiVersion: v1
            kind: Service
            metadata:
              name: $(params.service-name)
              labels:
                app: payu
                service: $(params.service-name)
            spec:
              selector:
                app: $(params.service-name)
              ports:
              - name: http
                port: 8080
                targetPort: 8080
                protocol: TCP
              type: ClusterIP
            EOF

    - name: create-route
      runAfter:
        - create-service
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            cat <<EOF | oc apply -n $(params.namespace) -f -
            apiVersion: route.openshift.io/v1
            kind: Route
            metadata:
              name: $(params.service-name)
              labels:
                app: payu
                service: $(params.service-name)
            spec:
              to:
                kind: Service
                name: $(params.service-name)
              port:
                targetPort: http
              tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            EOF

    - name: wait-for-rollout
      runAfter:
        - create-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "Waiting for deployment to complete..."
            oc rollout status deployment/$(params.service-name) -n $(params.namespace) --timeout=$(params.health-check-timeout)s
            echo "Deployment completed successfully"

  finally:
    - name: verify-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Deployment Verification ==="
            oc get pods -n $(params.namespace) -l app=$(params.service-name)
            oc get deployment/$(params.service-name) -n $(params.namespace)
