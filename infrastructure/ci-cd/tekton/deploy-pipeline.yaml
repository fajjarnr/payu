apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-deploy-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: deploy
spec:
  description: |
    Deployment pipeline for PayU services with blue-green deployment strategy.
    Supports multiple environments with automatic rollback on failure.
    Fixed for OpenShift Pipelines 1.21+ (no ClusterTask — uses resolver: cluster).
  params:
    - name: service-name
      type: string
      description: Name of the service to deploy
    - name: environment
      type: string
      description: Target environment (dev, staging, prod)
      default: staging
    - name: image-tag
      type: string
      description: Image tag to deploy
      default: latest
    - name: registry-url
      type: string
      description: Container registry URL
      default: image-registry.openshift-image-registry.svc:5000
    - name: registry-namespace
      type: string
      description: Registry namespace/project
      default: payu-dev
    - name: namespace
      type: string
      description: Target namespace for deployment
      default: payu-dev
    - name: replicas
      type: string
      description: Number of replicas
      default: "1"
    - name: health-check-timeout
      type: string
      description: Timeout for health checks in seconds
      default: "300"
    - name: rollback-on-failure
      type: string
      description: Automatic rollback on deployment failure
      default: "true"
    - name: deployment-strategy
      type: string
      description: Deployment strategy (bluegreen, rolling)
      default: rolling
  workspaces:
    - name: manifest-dir
      description: Workspace for Kubernetes manifests
  tasks:
    - name: create-namespace
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            oc new-project $(params.namespace) --skip-config-write || true
            oc label namespace $(params.namespace) environment=$(params.environment) app=payu --overwrite

    - name: apply-configmaps
      runAfter:
        - create-namespace
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "[*] Applying configmaps for $(params.environment)"
            oc apply -f infrastructure/openshift/overlays/$(params.environment)/config/configmaps.yaml -n $(params.namespace) || true

    - name: create-deployment
      runAfter:
        - apply-configmaps
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            cat <<EOF | oc apply -n $(params.namespace) -f -
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: $(params.service-name)
              labels:
                app: $(params.service-name)
                app.kubernetes.io/name: $(params.service-name)
                app.kubernetes.io/part-of: payu
                environment: $(params.environment)
            spec:
              replicas: $(params.replicas)
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 25%
                  maxUnavailable: 0
              selector:
                matchLabels:
                  app: $(params.service-name)
              template:
                metadata:
                  labels:
                    app: $(params.service-name)
                    app.kubernetes.io/name: $(params.service-name)
                    app.kubernetes.io/part-of: payu
                spec:
                  containers:
                  - name: $(params.service-name)
                    image: $(params.registry-url)/$(params.registry-namespace)/$(params.service-name):$(params.image-tag)
                    ports:
                    - containerPort: 8080
                      protocol: TCP
                    env:
                    - name: JAVA_OPTS
                      value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
                    - name: SPRING_PROFILES_ACTIVE
                      value: "$(params.environment)"
                    resources:
                      limits:
                        cpu: "2"
                        memory: "2Gi"
                      requests:
                        cpu: "500m"
                        memory: "1Gi"
                    livenessProbe:
                      httpGet:
                        path: /actuator/health/liveness
                        port: 8080
                      initialDelaySeconds: 60
                      timeoutSeconds: 5
                      periodSeconds: 10
                      successThreshold: 1
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /actuator/health/readiness
                        port: 8080
                      initialDelaySeconds: 30
                      timeoutSeconds: 5
                      periodSeconds: 5
                      successThreshold: 1
                      failureThreshold: 3
            EOF

    - name: create-service
      runAfter:
        - create-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            cat <<EOF | oc apply -n $(params.namespace) -f -
            apiVersion: v1
            kind: Service
            metadata:
              name: $(params.service-name)
              labels:
                app: payu
                service: $(params.service-name)
            spec:
              selector:
                app: $(params.service-name)
              ports:
              - name: http
                port: 8080
                targetPort: 8080
                protocol: TCP
              type: ClusterIP
            EOF

    - name: create-route
      runAfter:
        - create-service
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            cat <<EOF | oc apply -n $(params.namespace) -f -
            apiVersion: route.openshift.io/v1
            kind: Route
            metadata:
              name: $(params.service-name)
              labels:
                app: payu
                service: $(params.service-name)
            spec:
              to:
                kind: Service
                name: $(params.service-name)
              port:
                targetPort: http
              tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            EOF

    - name: wait-for-rollout
      runAfter:
        - create-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "Waiting for deployment to complete..."
            oc rollout status deployment/$(params.service-name) -n $(params.namespace) --timeout=$(params.health-check-timeout)s
            echo "Deployment completed successfully"

  finally:
    - name: verify-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Deployment Verification ==="
            oc get pods -n $(params.namespace) -l app=$(params.service-name)
            oc get deployment/$(params.service-name) -n $(params.namespace)
