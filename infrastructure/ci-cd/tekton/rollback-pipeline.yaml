apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-rollback-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: rollback
spec:
  description: |
    Rollback pipeline for PayU services with quick recovery options.
    Fixed for OpenShift Pipelines 1.21+ (no ClusterTask — uses resolver: cluster).
  params:
    - name: service-name
      type: string
      description: Name of the service to rollback
    - name: namespace
      type: string
      description: Target namespace
      default: payu-dev
    - name: rollback-to
      type: string
      description: Target revision to rollback to (empty for previous version)
      default: ""
    - name: create-backup
      type: string
      description: Create backup before rollback
      default: "true"
  tasks:
    - name: verify-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Current Deployment State ==="
            oc get deployment/$(params.service-name) -n $(params.namespace) -o wide
            echo "=== Replicas ==="
            oc get pods -n $(params.namespace) -l app=$(params.service-name)

    - name: get-deployment-history
      runAfter:
        - verify-deployment
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Deployment History ==="
            oc rollout history deployment/$(params.service-name) -n $(params.namespace)

    - name: perform-rollback
      runAfter:
        - get-deployment-history
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            if [ -n "$(params.rollback-to)" ]; then
              echo "Rolling back to specific revision: $(params.rollback-to)"
              oc rollout undo deployment/$(params.service-name) -n $(params.namespace) --to-revision=$(params.rollback-to)
            else
              echo "Rolling back to previous version"
              oc rollout undo deployment/$(params.service-name) -n $(params.namespace)
            fi

    - name: wait-for-rollback
      runAfter:
        - perform-rollback
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "Waiting for rollback to complete..."
            oc rollout status deployment/$(params.service-name) -n $(params.namespace) --timeout=300s
            echo "Rollback completed successfully"

    - name: verify-rollback
      runAfter:
        - wait-for-rollback
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Post-Rollback State ==="
            oc get pods -n $(params.namespace) -l app=$(params.service-name)
            oc get deployment/$(params.service-name) -n $(params.namespace) -o wide

  finally:
    - name: generate-report
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Rollback Summary Report ==="
            echo "Service: $(params.service-name)"
            echo "Namespace: $(params.namespace)"
            echo "Timestamp: $(date)"
            echo ""
            echo "Deployment Status:"
            oc get deployment/$(params.service-name) -n $(params.namespace) -o wide
            echo ""
            echo "Pod Status:"
            oc get pods -n $(params.namespace) -l app=$(params.service-name)
