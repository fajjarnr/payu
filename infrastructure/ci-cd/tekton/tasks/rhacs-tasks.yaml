# RHACS (StackRox) Tekton Tasks for DevSecOps Pipeline
# Tasks: image-check, image-scan, deployment-check
# Requires: rox-admin-password secret in payu-cicd namespace
# ============================================================
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhacs-image-scan
  namespace: payu-cicd
  labels:
    app: payu
    type: security
spec:
  description: >
    Scan a container image for vulnerabilities using RHACS (roxctl).
    Returns CVE list with severity levels.
  params:
    - name: IMAGE
      type: string
      description: Full image reference to scan (registry/namespace/image:tag)
    - name: ROX_CENTRAL_ENDPOINT
      type: string
      description: ACS Central endpoint (host:port)
      default: central-stackrox.apps.payu.ocp.fajjjar.my.id:443
    - name: OUTPUT_FORMAT
      type: string
      description: Output format (table, csv, json, junit)
      default: table
    - name: INSECURE_SKIP_TLS_VERIFY
      type: string
      default: "true"
  steps:
    - name: scan-image
      image: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel8:4.7
      env:
        - name: ROX_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rox-admin-password
              key: password
        - name: ROX_CENTRAL_ADDRESS
          value: $(params.ROX_CENTRAL_ENDPOINT)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "🔍 RHACS Image Scan: $(params.IMAGE)"
        echo "   Central: ${ROX_CENTRAL_ADDRESS}"
        echo "============================================"

        INSECURE_FLAG=""
        if [ "$(params.INSECURE_SKIP_TLS_VERIFY)" = "true" ]; then
          INSECURE_FLAG="--insecure-skip-tls-verify"
        fi

        roxctl -e "${ROX_CENTRAL_ADDRESS}" ${INSECURE_FLAG} \
          image scan \
          --image "$(params.IMAGE)" \
          --output "$(params.OUTPUT_FORMAT)" \
          --force || true

        echo ""
        echo "✅ Image scan complete"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhacs-image-check
  namespace: payu-cicd
  labels:
    app: payu
    type: security
spec:
  description: >
    Check a container image against RHACS build-time policies.
    Fails the pipeline if critical policy violations are found.
  params:
    - name: IMAGE
      type: string
      description: Full image reference to check
    - name: ROX_CENTRAL_ENDPOINT
      type: string
      default: central-stackrox.apps.payu.ocp.fajjjar.my.id:443
    - name: INSECURE_SKIP_TLS_VERIFY
      type: string
      default: "true"
  results:
    - name: check-result
      description: Pass or fail result of the image check
  steps:
    - name: check-image
      image: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel8:4.7
      env:
        - name: ROX_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rox-admin-password
              key: password
        - name: ROX_CENTRAL_ADDRESS
          value: $(params.ROX_CENTRAL_ENDPOINT)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        echo "🛡️ RHACS Image Policy Check: $(params.IMAGE)"
        echo "   Central: ${ROX_CENTRAL_ADDRESS}"
        echo "============================================"

        INSECURE_FLAG=""
        if [ "$(params.INSECURE_SKIP_TLS_VERIFY)" = "true" ]; then
          INSECURE_FLAG="--insecure-skip-tls-verify"
        fi

        set +e
        output=$(roxctl -e "${ROX_CENTRAL_ADDRESS}" ${INSECURE_FLAG} \
          image check \
          --image "$(params.IMAGE)" \
          --output table 2>&1)
        status=$?
        set -e

        echo "${output}"

        if [ ${status} -eq 0 ]; then
          echo "PASS" | tee $(results.check-result.path)
          echo ""
          echo "✅ Image passes all ACS build-time policies"
        elif printf '%s' "${output}" | grep -Eq 'token validation failed|Unauthenticated|image enrichment error|status=401|credentials not found'; then
          echo "WARN" | tee $(results.check-result.path)
          echo ""
          echo "⚠️ RHACS policy gate unavailable due to auth or registry integration failure"
          echo "   Continuing build so delivery is not blocked by platform security wiring."
        else
          echo "FAIL" | tee $(results.check-result.path)
          echo ""
          echo "❌ Image VIOLATES ACS build-time policies!"
          echo "   Review violations above and fix before deploying."
          exit 1
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhacs-deployment-check
  namespace: payu-cicd
  labels:
    app: payu
    type: security
spec:
  description: >
    Check Kubernetes deployment YAML against RHACS deploy-time policies.
    Catches misconfigurations before they reach the cluster.
  params:
    - name: DEPLOYMENT_FILE
      type: string
      description: Path to deployment YAML within the workspace
    - name: ROX_CENTRAL_ENDPOINT
      type: string
      default: central-stackrox.apps.payu.ocp.fajjjar.my.id:443
    - name: INSECURE_SKIP_TLS_VERIFY
      type: string
      default: "true"
  workspaces:
    - name: source
      description: Workspace containing deployment manifests
  steps:
    - name: check-deployment
      image: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel8:4.7
      workingDir: $(workspaces.source.path)
      env:
        - name: ROX_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rox-admin-password
              key: password
        - name: ROX_CENTRAL_ADDRESS
          value: $(params.ROX_CENTRAL_ENDPOINT)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        echo "📋 RHACS Deployment Policy Check"
        echo "   File: $(params.DEPLOYMENT_FILE)"
        echo "   Central: ${ROX_CENTRAL_ADDRESS}"
        echo "============================================"

        INSECURE_FLAG=""
        if [ "$(params.INSECURE_SKIP_TLS_VERIFY)" = "true" ]; then
          INSECURE_FLAG="--insecure-skip-tls-verify"
        fi

        if roxctl -e "${ROX_CENTRAL_ADDRESS}" ${INSECURE_FLAG} \
          deployment check \
          --file "$(params.DEPLOYMENT_FILE)" \
          --output table; then
          echo ""
          echo "✅ Deployment passes all ACS deploy-time policies"
        else
          echo ""
          echo "⚠️ Deployment has policy violations (review above)"
          echo "   Pipeline continues — violations are warnings only"
          # Don't exit 1 for deploy check, just warn
        fi
