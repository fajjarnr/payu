apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-test-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: test
spec:
  description: |
    Test pipeline for PayU services with parallel execution.
    Includes unit tests, integration tests, and architecture tests.
    Fixed for OpenShift Pipelines 1.21+ (no ClusterTask — uses resolver: cluster).
  params:
    - name: service-name
      type: string
      description: Name of the service to test
    - name: git-url
      type: string
      description: Git repository URL
      default: "https://github.com/fajjarnr/payu.git"
    - name: git-revision
      type: string
      description: Git revision to test
      default: main
    - name: service-type
      type: string
      description: Type of service (spring-boot, quarkus, python)
      default: spring-boot
    - name: coverage-threshold
      type: string
      description: Minimum code coverage percentage
      default: "80"
    - name: run-integration-tests
      type: string
      description: Run integration tests with Testcontainers
      default: "false"
  workspaces:
    - name: source
      description: Workspace for source code
  tasks:
    - name: fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: source
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: DELETE_EXISTING
          value: "true"

    # Unit Tests for Java services
    - name: unit-tests
      runAfter:
        - fetch-repository
      taskRef:
        name: maven-java21
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["spring-boot", "quarkus"]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: GOALS
          value:
            - -f
            - backend/pom.xml
            - -pl
            - $(params.service-name)
            - -am
            - test
            - "-Dtest=!**/*Integration*,!**/*IT*"

    # Architecture Tests (Spring Boot only)
    - name: architecture-tests
      runAfter:
        - fetch-repository
      taskRef:
        name: maven-java21
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["spring-boot"]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: GOALS
          value:
            - -f
            - backend/pom.xml
            - -pl
            - $(params.service-name)
            - -am
            - test
            - "-Dtest=ArchTest*"

    # Python Tests
    - name: python-tests
      runAfter:
        - fetch-repository
      taskRef:
        name: pytest
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["python"]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: TEST_DIR
          value: backend/$(params.service-name)
        - name: EXTRA_ARGS
          value: "-v --tb=short"

    # Integration Tests (optional)
    - name: integration-tests
      runAfter:
        - fetch-repository
      taskRef:
        name: maven-java21
      when:
        - input: "$(params.run-integration-tests)"
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: GOALS
          value:
            - -f
            - backend/pom.xml
            - -pl
            - $(params.service-name)
            - -am
            - test
            - "-Dtest=**/*Integration*,**/*IT*"

  finally:
    - name: test-report
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Test Execution Summary ==="
            echo "Service: $(params.service-name)"
            echo "Type: $(params.service-type)"
            echo "Date: $(date)"
            echo ""
            echo "Test pipeline completed."
