# RHACS (Red Hat Advanced Cluster Security) Configuration
# Central: ACS management server (stackrox namespace)
# SecuredCluster: registers this cluster for runtime monitoring & compliance
# ============================================================
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: payu-central
  namespace: stackrox
spec:
  central:
    # M2M short-lived access: validates pipeline service-account tokens
    # (audience rhacs-ci, see payu-cicd tekton task rhacs-image-scan) against
    # the cluster SA issuer. Secret content follows RHACS declarative config
    # schema (short-lived-token type GENERIC).
    declarativeConfiguration:
      secrets:
        - name: rhacs-m2m-config
    # Serving cert from cert-manager (stable private CA) instead of Central's
    # auto-generated cert: reinstalls used to rotate the CA and silently break
    # every pipeline scan (x509 unknown authority, L-453). Leaf auto-renews;
    # pipeline pins the 10y issuer CA in rhacs-central-ca (tekton/).
    defaultTLSSecret:
      name: payu-central-serving-tls
    exposure:
      route:
        enabled: true
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
  # Trust OpenShift service-serving signer so Central/Scanner can reach the
  # internal image registry over TLS (strict verify, no skipTLSVerify).
  # Cluster-managed, rotates ~2y — refresh from configmap
  # openshift-service-ca.crt/service-ca.crt if scans start x509-failing.
  tls:
    additionalCAs:
    - name: openshift-service-serving-signer
      content: |
        -----BEGIN CERTIFICATE-----
        MIIDUTCCAjmgAwIBAgIIIujRGHQUHlIwDQYJKoZIhvcNAQELBQAwNjE0MDIGA1UE
        Awwrb3BlbnNoaWZ0LXNlcnZpY2Utc2VydmluZy1zaWduZXJAMTc4OTAxNTIwODAe
        Fw0yNjA5MTAwNDQwMDhaFw0yODExMDgwNDQwMDlaMDYxNDAyBgNVBAMMK29wZW5z
        aGlmdC1zZXJ2aWNlLXNlcnZpbmctc2lnbmVyQDE3ODkwMTUyMDgwggEiMA0GCSqG
        SIb3DQEBAQUAA4IBDwAwggEKAoIBAQDGq61qRPz771PqwSe+utaW7c/JiU9dDlv7
        c0ULW9QC6So9pQLMEYRNylsUk7+Zpdu1FluYwISivAVtZjp3l5+/RF4mKT47h+tv
        WX6yKLTqRhthzaYOcPxrYzVL5evVYclq5sz6k9vo5VF7p4ISaN4W0ZHAIQhcWcnL
        ZH7KGro2UQPu/4cQCsxpOBP2PrK/qp+CX/wP6mY3HjHw8UGNH5xw1H6BXC3FU2k0
        O+g/oGucDMqd5qxZ+ksKqBEsdKTFznppkYfpXvD+nuAJvMRJHBSIdlmgTznjCVpq
        xTirLgjnJYy/sgthvX9E/EA/57PbwXuv8wYLOk+t2pSTmMK4buJrAgMBAAGjYzBh
        MA4GA1UdDwEB/wQEAwICpDAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBTLc8rR
        VlzQ/Int9jlsOhHPDHuB8DAfBgNVHSMEGDAWgBTLc8rRVlzQ/Int9jlsOhHPDHuB
        8DANBgkqhkiG9w0BAQsFAAOCAQEAtm0XvdbWWyMrqwWSL8giBZNN9tQ9+geObnAy
        EspQvOOw0lHMWdwmKRkbskiV5wUn50T8Tg+iRffsCnLnqqq2/X3i4m+cpR3mWGvD
        LJmPLgewwcakYfGuQrjrsv0OQdjJF4xTfuqV0NLc0oGmUJWamMEbe//ecYMXMMVM
        8rM7n0GhDbMsiZhBA3ScSUk/PoVmreOHB4hKUuxNLhLgV+fyhaVfy9eM5xxvmq+a
