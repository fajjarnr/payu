  # Keep the operator-supported scanner alongside Scanner V4.
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
  scannerV4:
    scannerComponent: Default
    indexer:
      scaling:
        autoScaling: Enabled
        maxReplicas: 3
        minReplicas: 1
        replicas: 2
    matcher:
      scaling:
        autoScaling: Enabled
        maxReplicas: 3
        minReplicas: 1
        replicas: 2
    db:
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
          storageClassName: gp3-csi
          size: 50Gi
---
# SecuredCluster: registers this OpenShift cluster to ACS Central
# Uses cluster-registration-secret created from ACS UI/API
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: payu-secured-cluster
  namespace: stackrox
spec:
  clusterName: payu-openshift
  centralEndpoint: central.stackrox.svc:443
  admissionControl:
    # Audit-first rollout 2026-09-11: sensor/collector detect, nothing blocked.
    # Promote to Enabled/Fail after policy validation evidence on dev/sit.
    enforcement: Disabled
    failurePolicy: Ignore
    bypass: BreakGlassAnnotation
  perNode:
    collector:
      collection: EBPF
      imageFlavor: Regular
    taintToleration: TolerateTaints
  sensor:
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
---
# Private PKI for Central serving cert (cert-manager). LE can't issue .svc
# names, so a private CA: pipeline pins this CA once (rhacs-central-ca),
# leaf auto-renews every 90d without breaking scans.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: payu-central-selfsigned
  namespace: stackrox
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payu-central-ca
  namespace: stackrox
spec:
  secretName: payu-central-ca-secret
  commonName: PayU Central CA
  isCA: true
  duration: 87600h # 10y
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    name: payu-central-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: payu-central-ca-issuer
  namespace: stackrox
spec:
  ca:
    secretName: payu-central-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payu-central-serving
  namespace: stackrox
spec:
  secretName: payu-central-serving-tls
  duration: 2160h # 90d, auto-renewed by cert-manager
  renewBefore: 360h
  dnsNames:
  - central.stackrox.svc
  - central.stackrox
  - central.stackrox.svc.cluster.local
  issuerRef:
    name: payu-central-ca-issuer
    kind: Issuer
