apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhacs-registry-reader
  namespace: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacs-registry-reader
  namespace: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
subjects:
  - kind: ServiceAccount
    name: rhacs-registry-reader
    namespace: payu-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
