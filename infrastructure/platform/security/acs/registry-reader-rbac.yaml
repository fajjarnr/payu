apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhacs-registry-reader
  namespace: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacs-registry-reader
  namespace: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
subjects:
  - kind: ServiceAccount
    name: rhacs-registry-reader
    namespace: payu-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
---
# Manifest pulls authorize against the imagestream object itself — without
# registry-viewer the registry answers 401 (L-453). Token-only + image-puller
# is not enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacs-registry-viewer
  namespace: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
subjects:
  - kind: ServiceAccount
    name: rhacs-registry-reader
    namespace: payu-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: registry-viewer
