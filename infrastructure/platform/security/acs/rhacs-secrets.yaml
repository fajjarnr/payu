# RHACS (Red Hat Advanced Cluster Security) Secrets via External Secrets Operator
# Vault paths expected:
# - secret/data/payu/acs/roxctl-api-token
# - secret/data/payu/acs/cluster-registration
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roxctl-api-token
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: roxctl-api-token
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: payu
          app.kubernetes.io/component: security
  data:
    - secretKey: token
      remoteRef:
        key: payu/acs/roxctl-api-token
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-registration-secret
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: cluster-registration-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: payu
          app.kubernetes.io/component: security
  data:
    - secretKey: admission-control-token
      remoteRef:
        key: payu/acs/cluster-registration
        property: admission-control-token
    - secretKey: collector-token
      remoteRef:
        key: payu/acs/cluster-registration
        property: collector-token
    - secretKey: sensor-token
      remoteRef:
        key: payu/acs/cluster-registration
        property: sensor-token
