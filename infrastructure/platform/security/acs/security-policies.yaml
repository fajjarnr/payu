apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: payu-block-privileged-containers
  namespace: stackrox
spec:
  policyName: PayU - Block Privileged Containers
  description: Blocks privileged containers before they enter controlled PayU environments.
  rationale: Privileged containers can bypass namespace isolation and access host resources.
  remediation: Remove privileged mode and grant only the minimum required capabilities.
  disabled: false
  categories:
    - Security Best Practices
  lifecycleStages:
    - DEPLOY
  eventSource: NOT_APPLICABLE
  severity: CRITICAL_SEVERITY
  enforcementActions:
    - FAIL_DEPLOYMENT_CREATE_ENFORCEMENT
    - FAIL_DEPLOYMENT_UPDATE_ENFORCEMENT
    - SCALE_TO_ZERO_ENFORCEMENT
  scope:
    - namespace: payu-sit
    - namespace: payu-uat
    - namespace: payu-preprod
    - namespace: payu
  policySections:
    - sectionName: Privileged container
      policyGroups:
        - fieldName: Privileged Container
          booleanOperator: OR
          negate: false
          values:
            - value: "true"
  criteriaLocked: false
  mitreVectorsLocked: false
  isDefault: false
