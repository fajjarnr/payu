apiVersion: v1
kind: Namespace
metadata:
  name: vault-secrets-operator
  labels:
    app.kubernetes.io/name: vault-secrets-operator
    app.kubernetes.io/part-of: payu
    payu.io/managed-by: platform-team
    payu.io/environment-class: platform
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: vault-secrets-operator
  namespace: vault-secrets-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: vault-secrets-operator
  namespace: vault-secrets-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: vault-secrets-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
  config:
    volumeMounts:
      - name: payu-service-ca
        mountPath: /etc/pki/payu
        readOnly: true
    volumes:
      - name: payu-service-ca
        secret:
          secretName: vault-vso-trust
          items:
            - key: ca.crt
              path: service-ca.crt
