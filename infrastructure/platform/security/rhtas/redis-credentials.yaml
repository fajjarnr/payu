apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: rhtas-redis-password
  namespace: trusted-artifact-signer
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  encoding: hex
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhtas-redis-auth
  namespace: trusted-artifact-signer
spec:
  refreshInterval: 0s
  target:
    name: rhtas-redis-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: rhtas-redis
          app.kubernetes.io/part-of: payu
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: rhtas-redis-password

