apiVersion: batch/v1
kind: Job
metadata:
  name: rhtas-trillian-schema-v1-4-2
  namespace: trusted-artifact-signer
  labels:
    app.kubernetes.io/name: rhtas-trillian-schema
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/version: "1.4.2"
    team: platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhtas-trillian-schema
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/version: "1.4.2"
        team: platform
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-schema
          image: registry.redhat.io/ubi9/ubi-minimal@sha256:907b68736aa798b2d38255b7aa070b2a70acb90803864a40f05d0ec47556ddd0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              curl --fail --silent --show-error --location \
                https://raw.githubusercontent.com/securesign/trillian/817b58f2c6ce4e092661a41eb18c52c231a3c2b4/storage/postgresql/schema/storage.sql \
                --output /schema/storage.sql
              echo "5faf995c3ef22fd2d709830ee5af410e6fce0477b6eaf58e231bd7b8b7c7170c  /schema/storage.sql" | sha256sum --check --strict
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: schema
              mountPath: /schema
      containers:
        - name: apply-schema
          image: registry.redhat.io/rhel9/postgresql-16@sha256:410bfee278e05aa680bd0d22c906377863aff2cd0da83b5356c3dc2a8ed7ad00
          command: ["/bin/bash", "-ec"]
          args:
            - |
              until pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}"; do sleep 5; done
              if [[ "$(psql -tAc "SELECT to_regclass('public.trees')")" == "trees" ]]; then
                echo "Trillian schema already initialized"
                exit 0
              fi
              psql --set=ON_ERROR_STOP=1 --file=/schema/storage.sql
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: rhtas-postgres-app
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: rhtas-postgres-app
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: rhtas-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rhtas-postgres-app
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: rhtas-postgres-app
                  key: dbname
            - name: PGSSLMODE
              value: require
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          emptyDir:
            sizeLimit: 2Mi
