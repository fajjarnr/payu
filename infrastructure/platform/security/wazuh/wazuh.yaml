# Wazuh SIEM — Lightweight Lab Deployment
# Components: Manager + Indexer (single-node)
# Full Wazuh stack (dashboard, agents) bisa ditambah later
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-manager
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-manager
    app.kubernetes.io/component: siem
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-manager
        app.kubernetes.io/component: siem
    spec:
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.9.2
          ports:
            - containerPort: 1514
              name: syslog
            - containerPort: 1515
              name: registration
            - containerPort: 55000
              name: api
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/data
      volumes:
        - name: wazuh-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-manager
    app.kubernetes.io/component: siem
spec:
  selector:
    app.kubernetes.io/name: wazuh-manager
  ports:
    - port: 1514
      targetPort: 1514
      name: syslog
    - port: 1515
      targetPort: 1515
      name: registration
    - port: 55000
      targetPort: 55000
      name: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-indexer
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-indexer
    app.kubernetes.io/component: siem
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-indexer
        app.kubernetes.io/component: siem
    spec:
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.9.2
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
          env:
            - name: discovery.type
              value: single-node
            - name: cluster.name
              value: wazuh-cluster
          volumeMounts:
            - name: indexer-data
              mountPath: /var/lib/wazuh-indexer
      volumes:
        - name: indexer-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-indexer
    app.kubernetes.io/component: siem
spec:
  selector:
    app.kubernetes.io/name: wazuh-indexer
  ports:
    - port: 9200
      targetPort: 9200
      name: http

---
# Route untuk Wazuh Manager API
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wazuh-manager
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-manager
    app.kubernetes.io/component: siem
spec:
  to:
    kind: Service
    name: wazuh-manager
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
