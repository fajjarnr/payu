# OpenShift Route for Wazuh Dashboard
# TLS termination: edge (HTTPS at router, HTTP to pod)
# Dashboard serves on HTTP port 5601 (SERVER_SSL_ENABLED=false in values.yaml)
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  labels:
    app: wazuh-dashboard
spec:
  host: wazuh.apps.fajjjar.my.id
  port:
    targetPort: 5601
  tls:
    termination: edge
  to:
    kind: Service
    name: wazuh-dashboard
    weight: 100
  wildcardPolicy: None
