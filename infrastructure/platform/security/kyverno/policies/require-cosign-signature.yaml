apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-cosign-signature
  annotations:
    policies.kyverno.io/title: Require Cosign Image Signature
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Verify container images are signed with Cosign
      before deployment.
spec:
  validationFailureAction: Audit
  background: false
  rules:
  - name: verify-image-signature
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: payu
    verifyImages:
    - imageReferences:
      - image-registry.openshift-image-registry.svc:5000/payu*
      - quay.io/payu*
      mutateDigest: false
      verifyDigest: true
      required: true
      attestors:
      - count: 1
        entries:
        - keyless:
            issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/payu-platform/.github/workflows/build.yaml@refs/heads/main
            rekor:
              url: https://rekor.sigstore.dev
    exclude:
      any:
      - resources:
          selector:
            matchExpressions:
            - key: app.kubernetes.io/managed-by
              operator: Exists
      - resources:
          selector:
            matchLabels:
              strimzi.io/cluster: ?*
      - resources:
          selector:
            matchLabels:
              app: infinispan-pod
