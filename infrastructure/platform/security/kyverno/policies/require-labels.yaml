# Require standard labels on all PayU resources
# Ref: DEVSECOPS_ARCHITECTURE.md §4.4.2 — Kyverno operational policy
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-payu-labels
  annotations:
    policies.kyverno.io/title: Require PayU Standard Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Ensures all Deployments in PayU namespaces have required labels
      for cost allocation, ownership tracking, and observability.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-required-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: payu
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/component: chaos-engineering
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/component: cost-management
          - resources:
              selector:
                matchExpressions:
                - key: app.kubernetes.io/managed-by
                  operator: Exists
          - resources:
              selector:
                matchLabels:
                  strimzi.io/cluster: ?*
          - resources:
              selector:
                matchLabels:
                  app: infinispan-pod
          - resources:
              selector:
                matchLabels:
                  app: payu-cache
          - resources:
              selector:
                matchLabels:
                  app: infinispan-config-listener-pod
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/component: cache
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/instance: payu-kafka-console-console-deployment
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: keycloak-operator
          - resources:
              selector:
                matchLabels:
                  openshift.io/build.name: ?*
          - resources:
              namespaces:
              - payu-cicd
              - openshift-pipelines
              - openshift-gitops
      validate:
        message: >-
          Deployments in PayU namespaces must have labels:
          app.kubernetes.io/name, app.kubernetes.io/part-of,
          app.kubernetes.io/version, team
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/part-of: "payu"
              app.kubernetes.io/version: "?*"
              team: "?*"
