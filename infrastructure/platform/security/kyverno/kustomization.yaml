# Kyverno — Policy-as-Code + Helm Deployment
#
# Referenced in: DEVSECOPS_ARCHITECTURE.md §4.4.2
# Purpose: Operational/mutation K8s policies (NOT security — that's ACS)
#
# Policy Boundary (MUST avoid overlap with ACS):
#   ACS  → Security: image signature, CVE threshold, runtime behavior
#   Kyverno → Operational: auto-add labels, resource limits, namespace lifecycle
#
# See DEVSECOPS_ARCHITECTURE.md §4.4.2 for the complete policy matrix
#
# Requires ArgoCD kustomize.buildOptions: --enable-helm
# or local: kustomize build --enable-helm .
# ============================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - policies/

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: "3.8.2"
    releaseName: kyverno
    namespace: kyverno
    valuesFile: values.yaml
    includeCRDs: true
