# Kyverno Helm Values Override
# Fix: Use OpenShift internal CLI image for cleanup CronJobs
# because bitnami/kubectl:1.28.5 tag no longer exists on Docker Hub
# ============================================================

# Install in kyverno namespace (must exist or use CreateNamespace)
namespace: kyverno

# Do not create namespace via Helm; we manage it separately
createNamespace: false

# Kyverno admission controller — disable Helm hooks if running on OpenShift
# (hooks may conflict with OLM or ArgoCD sync)
admissionController:
  initContainer:
    image:
      registry: ""  # use chart default
    securityContext:
      runAsUser: null
      runAsGroup: null
  container:
    image:
      registry: ""  # use chart default
    securityContext:
      runAsUser: null
      runAsGroup: null
  replicas: 1
  # Trust OpenShift internal registry CA for cosign/verifyImages.
  # ConfigMap kyverno-certs is created separately (see certs.yaml) and
  # auto-refreshed by the service-ca operator.
  extraVolumes:
  - name: ca-certificates
    configMap:
      name: kyverno-certs
      items:
      - key: service-ca.crt
        path: ca.crt
  - name: cluster-ca-certificates
    configMap:
      name: config-trusted-cabundle
      items:
      - key: ca-bundle.crt
        path: ca.crt
  extraVolumeMounts:
  - name: ca-certificates
    mountPath: /etc/ssl/certs/ca-certificates.crt
    subPath: ca.crt
    readOnly: true
  - name: cluster-ca-certificates
    mountPath: /etc/pki/tls/certs/ca-bundle.crt
    subPath: ca.crt
    readOnly: true

features:
  policyExceptions:
    enabled: true

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: null
    runAsGroup: null
  extraVolumes:
  - name: ca-certificates
    configMap:
      name: kyverno-certs
      items:
      - key: service-ca.crt
        path: ca.crt
  - name: cluster-ca-certificates
    configMap:
      name: config-trusted-cabundle
      items:
      - key: ca-bundle.crt
        path: ca.crt
  extraVolumeMounts:
  - name: ca-certificates
    mountPath: /etc/ssl/certs/ca-certificates.crt
    subPath: ca.crt
    readOnly: true
  - name: cluster-ca-certificates
    mountPath: /etc/pki/tls/certs/ca-bundle.crt
    subPath: ca.crt
    readOnly: true

cleanupController:
  replicas: 1
  securityContext:
    runAsUser: null
    runAsGroup: null

reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: null
    runAsGroup: null
  extraVolumes:
  - name: ca-certificates
    configMap:
      name: kyverno-certs
      items:
      - key: service-ca.crt
        path: ca.crt
  - name: cluster-ca-certificates
    configMap:
      name: config-trusted-cabundle
      items:
      - key: ca-bundle.crt
        path: ca.crt
  extraVolumeMounts:
  - name: ca-certificates
    mountPath: /etc/ssl/certs/ca-certificates.crt
    subPath: ca.crt
    readOnly: true
  - name: cluster-ca-certificates
    mountPath: /etc/pki/tls/certs/ca-bundle.crt
    subPath: ca.crt
    readOnly: true

crds:
  install: true
  migration:
    enabled: false
    securityContext:
      runAsUser: null
      runAsGroup: null

webhooksCleanup:
  securityContext:
    runAsUser: null
    runAsGroup: null

test:
  securityContext:
    runAsUser: null
    runAsGroup: null

# Registry credentials for image verification (verifyImages).
# Secret registry-credentials holds a pull token for internal registry;
# SA kyverno-registry-puller is granted system:image-puller on payu-* namespaces.
existingImagePullSecrets:
- registry-credentials

# Pod security — align with OpenShift restricted-v2 SCC
# Kyverno pods run as non-root but OpenShift assigns random UID
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Network policies — disable if managed externally
networkPolicy:
  enabled: false

# Service monitor — disable; we use OpenShift monitoring stack
serviceMonitor:
  enabled: false
