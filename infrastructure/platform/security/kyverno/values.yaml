# Kyverno Helm Values Override
# Fix: Use OpenShift internal CLI image for cleanup CronJobs
# because bitnami/kubectl:1.28.5 tag no longer exists on Docker Hub
# ============================================================

# Install in kyverno namespace (must exist or use CreateNamespace)
namespace: kyverno

# Do not create namespace via Helm; we manage it separately
createNamespace: false

# Cleanup CronJobs image override
# https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml
cleanupJobs:
  admissionReports:
    image:
      registry: image-registry.openshift-image-registry.svc:5000
      repository: openshift/cli
      tag: latest
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  clusterAdmissionReports:
    image:
      registry: image-registry.openshift-image-registry.svc:5000
      repository: openshift/cli
      tag: latest
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  clusterEphemeralReports:
    image:
      registry: image-registry.openshift-image-registry.svc:5000
      repository: openshift/cli
      tag: latest
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  ephemeralReports:
    image:
      registry: image-registry.openshift-image-registry.svc:5000
      repository: openshift/cli
      tag: latest
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  updateRequests:
    image:
      registry: image-registry.openshift-image-registry.svc:5000
      repository: openshift/cli
      tag: latest
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

# Kyverno admission controller — disable Helm hooks if running on OpenShift
# (hooks may conflict with OLM or ArgoCD sync)
admissionController:
  initContainer:
    image:
      registry: ""  # use chart default
  container:
    image:
      registry: ""  # use chart default
  replicas: 1

backgroundController:
  replicas: 1

cleanupController:
  replicas: 1

reportsController:
  replicas: 1

# Pod security — align with OpenShift restricted-v2 SCC
# Kyverno pods run as non-root but OpenShift assigns random UID
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Network policies — disable if managed externally
networkPolicy:
  enabled: false

# Service monitor — disable; we use OpenShift monitoring stack
serviceMonitor:
  enabled: false
