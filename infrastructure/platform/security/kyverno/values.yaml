# Kyverno Helm Values Override
# Fix: Use OpenShift internal CLI image for cleanup CronJobs
# because bitnami/kubectl:1.28.5 tag no longer exists on Docker Hub
# ============================================================

# Install in kyverno namespace (must exist or use CreateNamespace)
namespace: kyverno

# Do not create namespace via Helm; we manage it separately
createNamespace: false

# Kyverno admission controller — disable Helm hooks if running on OpenShift
# (hooks may conflict with OLM or ArgoCD sync)
admissionController:
  initContainer:
    image:
      registry: ""  # use chart default
    securityContext:
      runAsUser: null
      runAsGroup: null
  container:
    image:
      registry: ""  # use chart default
    securityContext:
      runAsUser: null
      runAsGroup: null
  replicas: 3

backgroundController:
  replicas: 2
  securityContext:
    runAsUser: null
    runAsGroup: null

cleanupController:
  replicas: 2
  securityContext:
    runAsUser: null
    runAsGroup: null

reportsController:
  replicas: 2
  securityContext:
    runAsUser: null
    runAsGroup: null

crds:
  migration:
    securityContext:
      runAsUser: null
      runAsGroup: null

webhooksCleanup:
  securityContext:
    runAsUser: null
    runAsGroup: null

test:
  securityContext:
    runAsUser: null
    runAsGroup: null

# Pod security — align with OpenShift restricted-v2 SCC
# Kyverno pods run as non-root but OpenShift assigns random UID
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Network policies — disable if managed externally
networkPolicy:
  enabled: false

# Service monitor — disable; we use OpenShift monitoring stack
serviceMonitor:
  enabled: false
