apiVersion: apps/v1
kind: Deployment
metadata:
  name: coraza-waf
  namespace: coraza-waf
  labels:
    app.kubernetes.io/name: coraza-waf
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: waf
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coraza-waf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coraza-waf
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: waf
      annotations:
        payu.io/security-zone: perimeter
        compliance.payu.io/pci-dss: "6.4.2"
    spec:
      serviceAccountName: default
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coraza-waf
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/etc/coraza/waf-proxy.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: UPSTREAM_HOST
              value: "127.0.0.1"
            - name: UPSTREAM_PORT
              value: "8081"
            - name: WAZUH_HOST
              value: wazuh-manager.wazuh.svc.cluster.local
            - name: WAZUH_PORT
              value: "514"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: coraza-config
              mountPath: /etc/coraza
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        - name: echo-upstream
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/etc/coraza/echo-upstream.py"]
          ports:
            - name: http-echo
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: coraza-config
              mountPath: /etc/coraza
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: coraza-config
          configMap:
            name: coraza-waf-config
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coraza-waf-pdb
  namespace: coraza-waf
  labels:
    app.kubernetes.io/name: coraza-waf
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coraza-waf
