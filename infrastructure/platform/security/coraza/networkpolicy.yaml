apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coraza-waf-ingress
  namespace: coraza-waf
  labels:
    app.kubernetes.io/name: coraza-waf
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coraza-waf
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.30.0.0/16
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coraza-to-gateway
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: coraza-waf
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coraza-waf
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coraza-to-wazuh-syslog
  namespace: wazuh
  labels:
    app.kubernetes.io/name: coraza-waf
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coraza-waf
      ports:
        - protocol: TCP
          port: 514
        - protocol: UDP
          port: 514
