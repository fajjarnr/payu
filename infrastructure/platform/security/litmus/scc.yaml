# SecurityContextConstraints for LitmusChaos
# Required for Litmus Chaos Agent/Runner to perform chaos experiments
# (hostPath volumes, privileged containers, hostPID, NET_ADMIN/SYS_ADMIN)
#
# WARNING: This SCC is highly privileged. Only bind to litmus-agent SA.
# Portal components (frontend, server, mongodb) use restricted-v2 SCC.
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: litmus-chaos
  annotations:
    kubernetes.io/description: >-
      LitmusChaos agent SCC. Allows host access, privileged containers,
      and CAP_NET_ADMIN/CAP_SYS_ADMIN required for network/pod chaos.
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: false
allowHostPID: true
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: true
allowedCapabilities: null
defaultAddCapabilities:
  - NET_ADMIN
  - SYS_ADMIN
fsGroup:
  type: MustRunAs
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - KILL
  - MKNOD
  - SETUID
  - SETGID
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:litmus:default
  - system:serviceaccount:litmus:litmus
  - system:serviceaccount:litmus:litmus-admin
  - system:serviceaccount:litmus:litmus-agent
  - system:serviceaccount:payu-sit:litmus-admin
  - system:serviceaccount:payu-sit:litmus
  - system:serviceaccount:payu-uat:litmus-admin
  - system:serviceaccount:payu-uat:litmus
  - system:serviceaccount:payu-preprod:litmus-admin
  - system:serviceaccount:payu-preprod:litmus
  - system:serviceaccount:payu-preprod:cerberus
  - system:serviceaccount:payu-preprod:kraken-chaos
  - system:serviceaccount:payu:litmus-admin
  - system:serviceaccount:payu:litmus
  - system:serviceaccount:payu:cerberus
  - system:serviceaccount:payu:kraken-chaos
  - system:serviceaccount:payu-cid:litmus-admin
  - system:serviceaccount:payu-cid:litmus
  - system:serviceaccount:payu-cid:cerberus
  - system:serviceaccount:payu-cid:kraken-chaos
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
  - hostPath
