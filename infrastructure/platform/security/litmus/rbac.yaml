# RBAC: Bind Litmus SCCs to Litmus service accounts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: use-litmus-sccs
  namespace: litmus
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - litmus-portal
      - litmus-chaos
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litmus-default-scc
  namespace: litmus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-litmus-sccs
subjects:
  - kind: ServiceAccount
    name: default
    namespace: litmus
  - kind: ServiceAccount
    name: litmus-mongodb
    namespace: litmus
