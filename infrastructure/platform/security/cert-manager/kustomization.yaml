apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PayU Cert-Manager — TLS & Certificate Management
# Apply with: oc apply -k infrastructure/platform/security/cert-manager/

resources:
  # Shared
  - letsencrypt/1-cluster.yaml
  - letsencrypt/2-secret.yaml
  - letsencrypt/5-ingressController.yaml

  # Staging
  - letsencrypt/staging/cluster-issuer.yaml
  - letsencrypt/staging/certificate.apps.yaml
  - letsencrypt/staging/certificate.api.yaml

  # Production
  - letsencrypt/production/cluster-issuer.yaml
  - letsencrypt/production/certificate.apps.yaml
  - letsencrypt/production/certificate.api.yaml
  - letsencrypt/production/certificate.shared-ingress.yaml
