apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-issuer
spec:
  acme:
    email: 'zfajart@gmail.com'
    privateKeySecretRef:
      name: cluster-issuer-acme-production
    server: 'https://acme-v02.api.letsencrypt.org/directory'
    solvers:
      # -----------------------------------------------------------------------
      # Zone 1 (ACTIVE): apps.fajjjar.my.id → Z1020593DR8SM39FHW1U (verified live 2026-09-10)
      # Covers: *.apps.fajjjar.my.id, apps.fajjjar.my.id
      # Credentials: cert-manager-aws-creds (student, via kube-system/aws-creds)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z1020593DR8SM39FHW1U'
            region: ap-southeast-1
        selector:
          dnsZones:
            - 'apps.fajjjar.my.id'


      # -----------------------------------------------------------------------
      # Zone 2 (ACTIVE): payu.ocp branch → Z0368342YBF7WZUD5033 (recreated 2026-09-10,
      # old Z047 data-plane dead REFUSED; *.apps.payu.ocp A lives here, delegation fixed)
      # Covers: *.apps.payu.ocp.fajjjar.my.id, payu.ocp.fajjjar.my.id
      # Credentials: cert-manager-aws-creds (student, via kube-system/aws-creds)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z0368342YBF7WZUD5033'
            region: ap-southeast-1
        selector:
          dnsZones:
            - 'payu.ocp.fajjjar.my.id'
            - 'apps.payu.ocp.fajjjar.my.id'
      # -----------------------------------------------------------------------
      # Zone 3 (ACTIVE): ocp.fajjjar.my.id → Z063276236858H64KDJYG (verified live 2026-09-10)
      # Covers: ocp.fajjjar.my.id (cluster API/api-int live here)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z063276236858H64KDJYG'
            region: ap-southeast-1
        selector:
          dnsZones:
            - 'ocp.fajjjar.my.id'

