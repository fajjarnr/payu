apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-issuer
spec:
  acme:
    email: 'zfajart@gmail.com'
    privateKeySecretRef:
      name: cluster-issuer-acme-production
    server: 'https://acme-v02.api.letsencrypt.org/directory'
    solvers:
      # -----------------------------------------------------------------------
      # Zone 1 (ACTIVE): apps.fajjjar.my.id → hostedZoneID Z04089013J3OEZ617CSS4
      # Covers: *.apps.fajjjar.my.id, apps.fajjjar.my.id, fajjjar.my.id
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z04089013J3OEZ617CSS4'
            region: us-east-1
        selector:
          dnsZones:
            - 'fajjjar.my.id'
            - 'apps.fajjjar.my.id'

      # -----------------------------------------------------------------------
      # Zone 2 (ACTIVE): 9xtfg.sandbox5612.opentlc.com → Z02340702RYD34OD8N5J0
      # Covers: *.apps.cluster-9xtfg.9xtfg.sandbox5612.opentlc.com (default OCP ingress)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z02340702RYD34OD8N5J0'
            region: us-east-1
        selector:
          dnsZones:
            - '9xtfg.sandbox5612.opentlc.com'

      # -----------------------------------------------------------------------
      # Zone 3 (EXAMPLE): Untuk zone domain tambahan lainnya
      # -----------------------------------------------------------------------
