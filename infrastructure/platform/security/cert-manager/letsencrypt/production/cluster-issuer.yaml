apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-issuer
spec:
  acme:
    email: 'zfajart@gmail.com'
    privateKeySecretRef:
      name: cluster-issuer-acme-production
    server: 'https://acme-v02.api.letsencrypt.org/directory'
    solvers:
      # -----------------------------------------------------------------------
      # Zone 1 (ACTIVE): apps.fajjjar.my.id → Z0964617377Y5SMFEKJFR
      # Covers: *.apps.fajjjar.my.id, apps.fajjjar.my.id
      # Credentials: cert-manager-aws-creds (student, via kube-system/aws-creds)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z0964617377Y5SMFEKJFR'
            region: ap-southeast-1
        selector:
          dnsZones:
            - 'apps.fajjjar.my.id'


      # -----------------------------------------------------------------------
      # Zone 2 (ACTIVE): payu.ocp branch — served by ocp.fajjjar.my.id → Z00771482ZN71F761ZGVE
      # (Z016807015N5JY498AUZI payu.ocp zone is NOT delegated from parent; TXT there is invisible.
      #  Parent Z0077 holds the live A records, so DNS-01 must present here.)
      # Covers: *.apps.payu.ocp.fajjjar.my.id, apps.payu.ocp.fajjjar.my.id, payu.ocp.fajjjar.my.id, ocp.fajjjar.my.id
      # Ingress default: apps.payu.ocp.fajjjar.my.id (oc get ingress.config cluster .spec.domain)
      # Credentials: cert-manager-aws-creds (student, via kube-system/aws-creds)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z00771482ZN71F761ZGVE'
            region: ap-southeast-1
        selector:
          dnsZones:
            - 'payu.ocp.fajjjar.my.id'
            - 'apps.payu.ocp.fajjjar.my.id'
            - 'ocp.fajjjar.my.id'

      # -----------------------------------------------------------------------
      # Zone 4 (EXAMPLE): Untuk zone domain tambahan lainnya
      # -----------------------------------------------------------------------
