apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-issuer
spec:
  acme:
    email: 'zfajart@gmail.com'
    privateKeySecretRef:
      name: cluster-issuer-acme-production
    server: 'https://acme-v02.api.letsencrypt.org/directory'
    solvers:
      # -----------------------------------------------------------------------
      # Zone 1 (ACTIVE): apps.fajjjar.my.id → Z10103903MRVEAEFIS9U0 (2026-08-21 manual PHZ)
      # Covers: *.apps.fajjjar.my.id, apps.fajjjar.my.id
      # Public zone apps.fajjjar.my.id NS ns-806/ns-1199/ns-218/ns-1668 → Cloudflare NS updated
      # Credentials: cert-manager-aws-creds (student, ap-southeast-1, via kube-system/aws-creds)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z10103903MRVEAEFIS9U0'
            region: ap-southeast-1
        selector:
          dnsZones:
            - 'apps.fajjjar.my.id'

      # -----------------------------------------------------------------------
      # Zone 2 (ACTIVE): 9xtfg.sandbox5612.opentlc.com → Z02340702RYD34OD8N5J0
      # Covers: *.apps.cluster-9xtfg.9xtfg.sandbox5612.opentlc.com (default OCP ingress)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z02340702RYD34OD8N5J0'
            region: us-east-1
        selector:
          dnsZones:
            - '9xtfg.sandbox5612.opentlc.com'

      # -----------------------------------------------------------------------
      # Zone 3 (ACTIVE): payu.ocp.fajjjar.my.id → Z06846852WNH0L4ZSACW3
      # Covers: *.apps.payu.ocp.fajjjar.my.id, apps.payu.ocp.fajjjar.my.id, payu.ocp.fajjjar.my.id, ocp.fajjjar.my.id
      # Ingress default: apps.payu.ocp.fajjjar.my.id (oc get ingress.config cluster .spec.domain)
      # Credentials: cert-manager-aws-creds (student, ap-southeast-1, via kube-system/aws-creds)
      # -----------------------------------------------------------------------
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: cert-manager-aws-creds
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: cert-manager-aws-creds
              key: aws_secret_access_key
            hostedZoneID: 'Z06846852WNH0L4ZSACW3'
            region: ap-southeast-1
        selector:
          dnsZones:
            - 'payu.ocp.fajjjar.my.id'
            - 'apps.payu.ocp.fajjjar.my.id'
            - 'ocp.fajjjar.my.id'

      # -----------------------------------------------------------------------
      # Zone 4 (EXAMPLE): Untuk zone domain tambahan lainnya
