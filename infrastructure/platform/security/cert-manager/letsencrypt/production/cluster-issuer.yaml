      #     route53:
      #       accessKeyIDSecretRef:
      #         name: cert-manager-aws-creds
      #         key: aws_access_key_id
      #       secretAccessKeySecretRef:
      #         name: cert-manager-aws-creds
      #         key: aws_secret_access_key
      #       hostedZoneID: 'ZONE_ID_LAIN'
      #       region: us-east-1
      #   selector:
      #     dnsZones:
      #       - 'domain-lain.com'
