# Route53 credentials for the fajjjar hosted zones
# (apps Z08250423T85PP5RVLQF1 + ocp Z084653138N4UYGP2EAQ1, verified live 2026-09-18).
# Values are copied from kube-system/aws-creds
# (Cloud Credential Operator "student" user, AdministratorAccess) which has
# change access to these zones.
#
# Populate via envsubst before apply, same as 2-secret.yaml:
#   AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... oc apply -f <this file>
kind: Secret
apiVersion: v1
metadata:
  name: cert-manager-route53-fajjjar
  namespace: cert-manager
type: Opaque
stringData:
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
