# Route53 credentials for the apps.fajjjar.my.id hosted zone
# (Z03524191B5L20ILPO48O). Values are copied from kube-system/aws-creds
# (Cloud Credential Operator "student" user) which has change access to the
# fajjjar zone. The default cert-manager-aws-creds (Route53User) only covers
# sandbox zones and cannot issue for apps.fajjjar.my.id.
#
# Populate via envsubst before apply, same as 2-secret.yaml:
#   AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... oc apply -f <this file>
kind: Secret
apiVersion: v1
metadata:
  name: cert-manager-route53-fajjjar
  namespace: cert-manager
type: Opaque
stringData:
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
