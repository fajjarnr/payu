apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingress-certificate-staging
  namespace: openshift-ingress
spec:
  secretName: app-router-certs-staging
  duration: 720h # 30d
  renewBefore: 168h # 7d
  privateKey:
    rotationPolicy: Never
  dnsNames:
    - "*.apps.payu.ocp.fajjjar.my.id"
  issuerRef:
    name: letsencrypt-staging-issuer
    kind: ClusterIssuer
    group: cert-manager.io
