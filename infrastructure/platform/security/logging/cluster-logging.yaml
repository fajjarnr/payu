# Red Hat OpenShift Logging — audit log forwarding (INFRA-029 / SEC-020)
# ClusterLogForwarder inputRefs=[audit] → LokiStack (S3-backed, KMS-encrypted).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-logging
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: observability
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cluster-logging
  namespace: openshift-logging
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-logging
  namespace: openshift-logging
spec:
  channel: stable-6.5
  installPlanApproval: Automatic
  name: cluster-logging
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  namespace: openshift-logging
spec:
  channel: stable-6.5
  installPlanApproval: Automatic
  name: loki-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-logging-platform-egress
  namespace: openshift-logging
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.30.0.0/16
  egress:
    # Allow-all egress: fine-grained egress rules (namespaceSelector/ipBlock +
    # port) are not enforced by OVN-Kubernetes in this cluster — vector DNS to
    # openshift-dns/172.30.0.10:53 timed out with specific rules but works with
    # `- {}` (OPS-2026-08-01-04, L-188). Infra namespace: system operators need
    # arbitrary egress; ingress stays zero-trust.
    - {}
---
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: loki
  namespace: openshift-logging
spec:
  size: 1x.extra-small
  storage:
    schemas:
      - version: v13
        effectiveDate: "2024-01-01"
    secret:
      name: loki-s3
      type: s3
  storageClassName: gp3-csi
  replicationFactor: 1
  tenants:
    mode: openshift-logging
  limits:
    global:
      queries:
        maxQuerySeries: 500
---
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: instance
  namespace: openshift-logging
spec:
  serviceAccount:
    name: logcollector
  outputs:
    - name: loki
      type: lokiStack
      lokiStack:
        target:
          name: loki
          namespace: openshift-logging
        authentication:
          token:
            from: serviceAccount
      # Vector sink must trust the loki gateway serving cert (signed by the
      # OpenShift service CA). Without this the generated vector config has no
      # ca_file → "certificate verify failed: self-signed certificate in
      # certificate chain" (OPS-2026-08-01-04, L-188).
      tls:
        ca:
          configMapName: loki-gateway-ca-bundle
          key: service-ca.crt
    - name: wazuh-syslog
      type: syslog
      syslog:
        rfc: RFC5424
        facility: local0
        severity: informational
        appName: coraza-waf
        procName: coraza
        addLogSource: true
        payloadKey: message
      url: tcp://wazuh-manager.wazuh.svc.cluster.local:514
  pipelines:
    - name: audit-logs
      inputRefs:
        - audit
      labels:
        log_type: audit
      outputRefs:
        - loki
    - name: audit-to-wazuh-siem
      inputRefs:
        - audit
      labels:
        security_zone: perimeter
        compliance: pci-dss-v4.0
      outputRefs:
        - wazuh-syslog
    - name: app-to-wazuh-siem
      inputRefs:
        - application
      labels:
        security_zone: perimeter
      outputRefs:
        - wazuh-syslog
