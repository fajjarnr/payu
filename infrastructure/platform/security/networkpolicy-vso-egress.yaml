# NetworkPolicy: Vault Secrets Operator (vault-secrets-operator ns) needs
# API server egress (kubernetes auth login + secret sync) and Vault egress.
# default-deny-all generated by Kyverno blocked it → CrashLoopBackOff
# ("dial tcp 172.30.0.1:443: i/o timeout").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vso-platform-egress
  namespace: vault-secrets-operator
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 172.30.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payu-vault
      ports:
        - protocol: TCP
          port: 8200
