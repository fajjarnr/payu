# NetworkPolicy: Vault Secrets Operator (vault-secrets-operator ns) needs
# API server egress (kubernetes auth login + secret sync) and Vault egress.
# default-deny-all generated by Kyverno blocked it → CrashLoopBackOff
# ("dial tcp 172.30.0.1:443: i/o timeout").
#
# Egress allow-all (empty rule `{}`): OVN-Kubernetes in this cluster does not
# enforce fine-grained egress rules (namespaceSelector/ipBlock + port) reliably —
# proven by allow-logging-platform-egress DNS rules (OPS-2026-08-01-04) and VSO
# API egress rules (OPS-2026-08-01-03) timing out while `- {}` works (L-188).
# Ingress stays zero-trust; egress allow-all matches the proven payu-dev pattern.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vso-platform-egress
  namespace: vault-secrets-operator
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - {}
