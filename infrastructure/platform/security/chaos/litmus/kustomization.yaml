# LitmusChaos — Application-Level Chaos (payu-sit)
# Ref: DEVSECOPS_ARCHITECTURE.md §4.3.3
#
# Experiments:
#   - Pod delete / container kill
#   - Network latency/delay between services
#   - Disk fill
#   - CPU/memory stress
#   - Resiliency probes for auto-recovery validation

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - networkpolicy.yaml
  - chaosengine.yaml
  - pod-delete-experiment.yaml
  - network-latency-experiment.yaml
