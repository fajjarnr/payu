apiVersion: v1
kind: ServiceAccount
metadata:
  name: cerberus
  namespace: payu-preprod
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kraken-chaos
  namespace: payu-preprod
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cerberus-cluster-reader-payu-preprod
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
subjects:
  - kind: ServiceAccount
    name: cerberus
    namespace: payu-preprod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kraken-chaos-admin-payu-preprod
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
subjects:
  - kind: ServiceAccount
    name: kraken-chaos
    namespace: payu-preprod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: v1
kind: Service
metadata:
  name: cerberus
  namespace: payu-preprod
  labels:
    app: cerberus
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
spec:
  selector:
    app: cerberus
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus
  namespace: payu-preprod
  labels:
    app: cerberus
    app.kubernetes.io/name: cerberus
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: chaos-engineering
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cerberus
  template:
    metadata:
      labels:
        app: cerberus
        app.kubernetes.io/name: cerberus
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: chaos-engineering
        team: platform
    spec:
      serviceAccountName: cerberus
      securityContext:
        runAsUser: 0
      initContainers:
        - name: kubeconfig
          image: quay.io/krkn-chaos/krkn:latest
          command:
            - sh
            - -c
            - |
              cat > /tmp/kubeconfig <<'EOF'
              apiVersion: v1
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: https://kubernetes.default.svc
                name: in-cluster
              contexts:
              - context:
                  cluster: in-cluster
                  user: in-cluster
                name: in-cluster
              current-context: in-cluster
              users:
              - name: in-cluster
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              EOF
          volumeMounts:
            - name: kubeconfig
              mountPath: /tmp
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cerberus
          image: quay.io/redhat-chaos/cerberus:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /root/cerberus/config/config.yaml
              subPath: config.yaml
            - name: kubeconfig
              mountPath: /tmp
          env:
            - name: KUBECONFIG
              value: /tmp/kubeconfig
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: cerberus-config
        - name: kubeconfig
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kraken-run
  namespace: payu-preprod
  labels:
    app: kraken
    app.kubernetes.io/name: kraken
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: chaos-engineering
    team: platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: kraken
        app.kubernetes.io/name: kraken
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: chaos-engineering
        team: platform
    spec:
      restartPolicy: Never
      serviceAccountName: kraken-chaos
      securityContext:
        runAsUser: 0
      initContainers:
        - name: fixperms
          image: quay.io/krkn-chaos/krkn:latest
          command:
            - sh
            - -c
            - chmod -R 777 /home/krkn/kraken || true
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: kraken
          image: quay.io/krkn-chaos/krkn:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /root/kraken/config/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: kraken-config
