apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: payu-vault
  labels:
    app.kubernetes.io/name: vault-snapshot
    app.kubernetes.io/part-of: payu
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: payu-vault
  labels:
    app.kubernetes.io/name: vault-snapshot
    app.kubernetes.io/part-of: payu
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-snapshot
            app.kubernetes.io/part-of: payu
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: raft-snapshot
              image: docker.io/hashicorp/vault@sha256:db6a5f78749204d0a8d002be1cc6e9a2a6de53dffce41a894c4a06d309dca360
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  jwt="$(cat /var/run/secrets/vault/token)"
                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                    role=vault-snapshot \
                    jwt="${jwt}")"
                  export VAULT_TOKEN
                  vault operator raft snapshot save /snapshot/vault.snap
              env:
                - name: VAULT_ADDR
                  value: https://vault.payu-vault.svc.cluster.local:8200
                - name: VAULT_CACERT
                  value: /var/run/secrets/vault-ca/service-ca.crt
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /snapshot
                - name: vault-token
                  mountPath: /var/run/secrets/vault
                  readOnly: true
                - name: vault-ca
                  mountPath: /var/run/secrets/vault-ca
                  readOnly: true
          containers:
            - name: snapshot
              image: docker.io/amazon/aws-cli:2.17.44
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws s3 cp /snapshot/vault.snap \
                    "s3://${SNAPSHOT_BUCKET}/raft/${timestamp}.snap" \
                    --region "${AWS_REGION}" \
                    --sse aws:kms \
                    --sse-kms-key-id "${KMS_KEY_ID}" \
                    --only-show-errors
                  rm -f /snapshot/vault.snap
              env:
                - name: AWS_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: vault-aws-config
                      key: aws-region
                - name: KMS_KEY_ID
                  valueFrom:
                    configMapKeyRef:
                      name: vault-aws-config
                      key: kms-key-id
                - name: SNAPSHOT_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: vault-aws-config
                      key: snapshot-bucket
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: vault-snapshot-credentials
                      key: aws_access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vault-snapshot-credentials
                      key: aws_secret_access_key
                - name: HOME
                  value: /snapshot
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /snapshot
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: vault-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: vault
                      expirationSeconds: 900
            - name: vault-ca
              configMap:
                name: vault-service-ca
