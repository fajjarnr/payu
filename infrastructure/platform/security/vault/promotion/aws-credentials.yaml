apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-aws-config
  namespace: payu-vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
data:
  aws-region: ap-southeast-1
  kms-key-id: arn:aws:kms:ap-southeast-1:405894847531:key/e0ad4932-933d-4de4-8caa-5b170630636e
  snapshot-bucket: payu-vault-snapshots-405894847531-cluster-nkk8q
---
apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: payu-vault-kms
  namespace: openshift-cloud-credential-operator
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
spec:
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
      - effect: Allow
        resource: arn:aws:kms:ap-southeast-1:405894847531:key/e0ad4932-933d-4de4-8caa-5b170630636e
        action:
          - kms:Decrypt
          - kms:DescribeKey
          - kms:Encrypt
          - kms:GenerateDataKey
  secretRef:
    name: vault-kms-credentials
    namespace: payu-vault
  serviceAccountNames:
    - vault
---
apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: payu-vault-snapshot
  namespace: openshift-cloud-credential-operator
  labels:
    app.kubernetes.io/name: vault-snapshot
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backup
spec:
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
      - effect: Allow
        resource: arn:aws:kms:ap-southeast-1:405894847531:key/e0ad4932-933d-4de4-8caa-5b170630636e
        action:
          - kms:Encrypt
          - kms:GenerateDataKey
      - effect: Allow
        resource: arn:aws:s3:::payu-vault-snapshots-405894847531-cluster-nkk8q
        action:
          - s3:GetBucketLocation
          - s3:ListBucket
      - effect: Allow
        resource: arn:aws:s3:::payu-vault-snapshots-405894847531-cluster-nkk8q/*
        action:
          - s3:GetObject
          - s3:PutObject
  secretRef:
    name: vault-snapshot-credentials
    namespace: payu-vault
  serviceAccountNames:
    - vault-snapshot
