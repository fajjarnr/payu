apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-aws-config
  namespace: payu-vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
data:
  aws-region: us-east-1
  kms-key-id: arn:aws:kms:us-east-1:390403884108:key/610f3f85-0e82-4a7a-930b-64d7a3e05af4
  snapshot-bucket: payu-vault-snapshots-390403884108-cluster-9xtfg
---
apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: payu-vault-kms
  namespace: openshift-cloud-credential-operator
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
spec:
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
      - effect: Allow
        resource: arn:aws:kms:us-east-1:390403884108:key/610f3f85-0e82-4a7a-930b-64d7a3e05af4
        action:
          - kms:Decrypt
          - kms:DescribeKey
          - kms:Encrypt
          - kms:GenerateDataKey
  secretRef:
    name: vault-kms-credentials
    namespace: payu-vault
  serviceAccountNames:
    - vault
---
apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: payu-vault-snapshot
  namespace: openshift-cloud-credential-operator
  labels:
    app.kubernetes.io/name: vault-snapshot
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backup
spec:
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
      - effect: Allow
        resource: arn:aws:kms:us-east-1:390403884108:key/610f3f85-0e82-4a7a-930b-64d7a3e05af4
        action:
          - kms:Encrypt
          - kms:GenerateDataKey
      - effect: Allow
        resource: arn:aws:s3:::payu-vault-snapshots-390403884108-cluster-9xtfg
        action:
          - s3:GetBucketLocation
          - s3:ListBucket
      - effect: Allow
        resource: arn:aws:s3:::payu-vault-snapshots-390403884108-cluster-9xtfg/*
        action:
          - s3:GetObject
          - s3:PutObject
  secretRef:
    name: vault-snapshot-credentials
    namespace: payu-vault
  serviceAccountNames:
    - vault-snapshot
