# PayU Platform - Vault Init Job
# Seeds Vault with initial secrets after deployment
# Run ONCE after Vault pod is ready:
#   oc apply -f vault-init-job.yaml
# ============================================================
#
# This job:
# 1. Enables KV-v2 secrets engine
# 2. Seeds initial secrets used by External Secrets Operator
#
# IMPORTANT:
# - Secret payu-dev/vault-bootstrap must exist with key root-token
# - Override POSTGRES_* and KEYCLOAK_* env vars in a PipelineRun/Job patch when needed
# ============================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  labels:
    app.kubernetes.io/name: vault-init
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vault-init
          image: docker.io/hashicorp/vault:1.15
          env:
            - name: VAULT_ADDR
              value: "http://vault.payu-dev.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-bootstrap
                  key: root-token
          command:
            - /bin/sh
            - -c
            - |
              set -e
              random_alnum() {
                tr -dc 'A-Za-z0-9' </dev/urandom | head -c "$1"
              }

              random_b64() {
                head -c "$1" /dev/urandom | base64 | tr -d '\n'
              }

              echo "=== Waiting for Vault to be ready ==="
              until vault status 2>/dev/null; do sleep 2; done

              echo "=== Enabling KV-v2 secrets engine ==="
              vault secrets enable -path=secret kv-v2 2>/dev/null || echo "KV-v2 already enabled"

              POSTGRES_HOST="${POSTGRES_HOST:-payu-postgres-primary.payu-dev.svc.cluster.local}"
              POSTGRES_PORT="${POSTGRES_PORT:-5432}"
              POSTGRES_USERNAME="${POSTGRES_USERNAME:-payu}"
              POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$(random_alnum 32)}"
              POSTGRES_DATABASE="${POSTGRES_DATABASE:-payu}"
              KEYCLOAK_DATABASE="${KEYCLOAK_DATABASE:-keycloak}"
              KEYCLOAK_ADMIN_USERNAME="${KEYCLOAK_ADMIN_USERNAME:-admin}"
              KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD:-$(random_alnum 32)}"
              KEYCLOAK_CLIENT_SECRET="${KEYCLOAK_CLIENT_SECRET:-$(random_alnum 48)}"
              KEYCLOAK_OIDC_ISSUER_URL="${KEYCLOAK_OIDC_ISSUER_URL:-https://sso.payu.fajjjar.my.id/realms/payu}"
              JWT_SECRET="${JWT_SECRET:-$(random_alnum 64)}"
              AES_ENCRYPTION_KEY="${AES_ENCRYPTION_KEY:-$(random_b64 32)}"
              SECRET_KEY="${SECRET_KEY:-$(random_b64 32)}"

              echo "=== Seeding db-credentials ==="
              vault kv put secret/payu/db-credentials \
                username="$POSTGRES_USERNAME" \
                password="$POSTGRES_PASSWORD" \
                host="$POSTGRES_HOST" \
                port="$POSTGRES_PORT" \
                database="$POSTGRES_DATABASE"

              echo "=== Seeding jwt-secret ==="
              vault kv put secret/payu/jwt-secret \
                JWT_SECRET="$JWT_SECRET"

              echo "=== Seeding encryption-keys ==="
              vault kv put secret/payu/encryption-keys \
                AES_ENCRYPTION_KEY="$AES_ENCRYPTION_KEY" \
                SECRET_KEY="$SECRET_KEY"

              echo "=== Seeding keycloak-credentials ==="
              vault kv put secret/payu/keycloak-credentials \
                OIDC_ISSUER_URL="$KEYCLOAK_OIDC_ISSUER_URL" \
                KEYCLOAK_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET" \
                KEYCLOAK_ADMIN_USERNAME="$KEYCLOAK_ADMIN_USERNAME" \
                KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD"

              echo "=== Seeding keycloak-db ==="
              vault kv put secret/payu/keycloak-db \
                POSTGRES_DATABASE="$KEYCLOAK_DATABASE" \
                POSTGRES_EXTERNAL_ADDRESS="$POSTGRES_HOST" \
                POSTGRES_EXTERNAL_PORT="$POSTGRES_PORT" \
                POSTGRES_HOST="$POSTGRES_HOST" \
                POSTGRES_USERNAME="$POSTGRES_USERNAME" \
                POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
                POSTGRES_SUPERUSER="false" \
                SSLMODE="prefer"

              echo "=== Vault initialization complete ==="
