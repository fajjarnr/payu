# PayU Platform - HashiCorp Vault OSS + External Secrets Operator bridge
# Prerequisites:
# 1. External Secrets Operator is installed in the cluster.
# 2. Secret payu-dev/vault-bootstrap exists and contains key root-token.
# ============================================================
#
# IMPORTANT: This remains a lab/dev Vault topology. For production use:
# - Raft storage with PVC-backed HA replicas
# - Auto-unseal via KMS/HSM
# - Non-root bootstrap workflow with short-lived admin token
# ============================================================

# Vault Deployment (dev mode for lab bootstrap)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: secrets
    spec:
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:1.15
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-bootstrap
                  key: root-token
            - name: SKIP_SETCAP
              value: "1"
            - name: HOME
              value: /tmp
          ports:
            - containerPort: 8200
              name: http
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m

---
# Vault Service
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault
  ports:
    - port: 8200
      targetPort: 8200
      name: http

---
# ClusterSecretStore - ESO bridge to Vault
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: payu-vault
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
spec:
  provider:
    vault:
      server: http://vault.payu-dev.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-bootstrap
          key: root-token
          namespace: payu-dev

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: payu-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: payu
  dataFrom:
    - extract:
        key: payu/db-credentials

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: payu-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: jwt-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: payu
  dataFrom:
    - extract:
        key: payu/jwt-secret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: encryption-keys
  namespace: payu-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: encryption-keys
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: payu
  dataFrom:
    - extract:
        key: payu/encryption-keys

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-credentials
  namespace: payu-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: payu
  dataFrom:
    - extract:
        key: payu/keycloak-credentials

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-secret
  namespace: payu-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-db-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: payu
  dataFrom:
    - extract:
        key: payu/keycloak-db
