# Vault ESO Bridge — ClusterSecretStore + ExternalSecrets
# Extracted from vault.yaml to avoid duplicate resource IDs when
# kustomize merges both dev and production manifests.
# ============================================================

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: payu-vault
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
spec:
  provider:
    vault:
      server: http://vault.payu-dev.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-bootstrap
          key: root-token
          namespace: payu-dev

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: payu-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: payu
  dataFrom:
    - extract:
        key: payu/db-credentials

