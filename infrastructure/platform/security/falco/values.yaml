# Falco Helm Values for OpenShift 4.22+
# Chart: falcosecurity/falco
# NOTE: OpenShift requires privileged SCC. Ensure falco-system namespace
# is excluded from Kyverno disallow-root-user policy.
# ============================================================

# Driver configuration — use modern eBPF probe (kernel 5.8+ with BTF)
driver:
  kind: modern-bpf
  loader:
    initContainer:
      enabled: true
      image:
        registry: docker.io
        repository: falcosecurity/falco-driver-loader
        tag: 0.40.0

# Collector — syscall event collection
collectors:
  enabled: false  # disable kubernetes metadata collector (needs extra perms)

# falcoctl — disable auto-install (causes init container crash)
falcoctl:
  artifact:
    install:
      enabled: false
    follow:
      enabled: false

# Falco daemonset configuration
falco:
  # Disable plugin requirement for container metadata
  # Rely on syscall-level rules only (sufficient for banking threat detection)
  load_plugins: []

  # Rules files — only custom rules (no container plugin dependency)
  rules_files:
    - /etc/falco/rules.d/falco-custom-rules.yaml

  # Output configuration
  json_output: true
  json_include_output_property: true
  http_output:
    enabled: true
    url: http://falcosidekick.falco-system:2801/

  # Logging
  log_syslog: false
  log_level: info

  # Metrics for Prometheus
  metrics:
    enabled: true
    interval: 1m
    output_rule: true

# Falco Sidekick — forward alerts to Wazuh/SIEM
falcosidekick:
  enabled: true
  config:
    debug: false
    # Wazuh integration via webhook
    webhook:
      address: http://wazuh-manager.wazuh:55000/
      minimumpriority: notice
      checkcert: false
  webui:
    enabled: false  # disable UI for lab

# ServiceMonitor for OpenShift Monitoring
serviceMonitor:
  enabled: true
  interval: 30s

# Pod security — OpenShift requires privileged
# Kyverno policies must exclude falco-system namespace
podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  runAsUser: 0
  runAsGroup: 0

# Mount custom rules ConfigMap
extraVolumes:
  - name: custom-rules
    configMap:
      name: falco-custom-rules
      items:
        - key: payu-rules.yaml
          path: payu-rules.yaml

extraVolumeMounts:
  - name: custom-rules
    mountPath: /etc/falco/rules.d
    readOnly: true

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Node selector — run on all nodes including control plane
nodeSelector: {}

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
