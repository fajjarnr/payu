# Falco Custom Rules for PayU Banking Platform
# Ref: DEVSECOPS_ARCHITECTURE.md §4.5.1
# NOTE: Rules use only syscall-level fields (no container plugin dependency)
# Compatible with Falco v0.37+ (no CIDR, no IP operators)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: falco-system
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: runtime-security
data:
  payu-rules.yaml: |
    # ============================================================
    # PayU Banking-Specific Falco Rules (Syscall-only)
    # ============================================================

    # Detect shell execution (common for reverse shells)
    - rule: Shell Execution Detected
      desc: Detect shell spawned anywhere on the system
      condition: >
        spawned_process and
        proc.name in (bash, sh, zsh, dash, ksh)
      output: >
        Shell spawned
        (user=%user.name command=%proc.cmdline parent=%proc.pname)
      priority: NOTICE
      tags: [payu, shell]

    # Detect sensitive file access
    - rule: Sensitive File Access Detected
      desc: Detect read access to sensitive files
      condition: >
        open_read and
        (fd.name contains "/etc/shadow" or
         fd.name contains "/etc/passwd" or
         fd.name contains ".key" or
         fd.name contains ".pem" or
         fd.name contains "credentials")
      output: >
        Sensitive file access
        (user=%user.name file=%fd.name process=%proc.name)
      priority: WARNING
      tags: [payu, sensitive-file]

    # Detect privilege escalation binaries
    - rule: Privilege Escalation Binary Executed
      desc: Detect execution of setuid/sudo binaries
      condition: >
        spawned_process and
        proc.name in (sudo, su, setuid)
      output: >
        Privilege escalation binary executed
        (user=%user.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [payu, privilege-escalation]

    # Detect crypto mining patterns
    - rule: Crypto Mining Binary Detected
      desc: Detect known crypto mining binary names
      condition: >
        spawned_process and
        proc.name in (xmrig, minerd, stratum)
      output: >
        Crypto mining binary detected
        (user=%user.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [payu, crypto-mining]

    # Detect unexpected binary execution in /tmp
    - rule: Binary Execution in Temp Directory
      desc: Detect execution of binaries from /tmp or /var/tmp
      condition: >
        spawned_process and
        (proc.exe startswith "/tmp/" or proc.exe startswith "/var/tmp/")
      output: >
        Binary executed from temp directory
        (user=%user.name command=%proc.cmdline exe=%proc.exe)
      priority: WARNING
      tags: [payu, temp-execution]
