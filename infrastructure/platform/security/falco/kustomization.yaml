# Falco — Runtime Security (Complement RHACS)
#
# Purpose: Cover gaps that RHACS + RHCOS don't cover:
#   - Deep syscall-level custom rules
#   - Container escape / privilege escalation detection
#   - Real-time SIEM forwarding to Wazuh
#   - Banking-specific detections
#
# RHACS covers: image CVE, network policy, deployment risk, basic runtime
# Falco covers: granular syscalls, custom rules, instant alerting
# ============================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: falco-system

resources:
  - namespace.yaml
  - scc.yaml

helmCharts:
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: "4.21.3"
    releaseName: falco
    namespace: falco-system
    valuesFile: values.yaml
    includeCRDs: true
