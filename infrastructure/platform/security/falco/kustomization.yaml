# Falco — Runtime Security Monitoring
#
# Referenced in: DEVSECOPS_ARCHITECTURE.md §4.5.1 (CWPP)
# Purpose: Syscall-level threat detection, cloud-native runtime alerting engine
# Integration: DaemonSet + Prometheus metrics + Wazuh SIEM forwarding
#
# Note: Using Falco (not Tetragon) due to OVN-Kubernetes conflict on OCP 4.20+
#   (Tetragon requires Cilium CNI — see DEVSECOPS_ARCHITECTURE.md §4.5.1)
#
# Requires ArgoCD kustomize.buildOptions: --enable-helm
# or local: kustomize build --enable-helm .
# ============================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: falco-system

resources:
  - namespace.yaml
  - scc.yaml
  - falco-config.yaml
  - falco-rules.yaml

helmCharts:
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: "4.21.3"
    releaseName: falco
    namespace: falco-system
    valuesFile: values.yaml
    includeCRDs: true
