# Kraken Configuration for PayU Pre-Production Chaos
# Ref: DEVSECOPS_ARCHITECTURE.md §4.3.3
apiVersion: v1
kind: ConfigMap
metadata:
  name: kraken-config
  namespace: payu
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
data:
  config.yaml: |
    kraken:
      exit_on_failure: true
      publish_kraken_status: true
      signal_state: RUN
      signal_address: 0.0.0.0
      port: 8081
      chaos_scenarios:
        - pod_disruption_scenarios:
            - scenarios/openshift/etcd.yml
            - scenarios/openshift/openshift-apiserver.yml
            - scenarios/openshift/openshift-kube-apiserver.yml

    cerberus:
      cerberus_enabled: true
      cerberus_url: "http://cerberus.payu.svc.cluster.local:8080"
      check_applicaton_routes: false

    tunings:
      wait_duration: 60
      iterations: 1
      daemon_mode: false

    health_checks:
      interval: 5
      config:
        - url: https://console-openshift-console.apps.payu.ocp.fajjjar.my.id
          exit_on_failure: true

---
# Cerberus — Cluster Health Guardian for Kraken Chaos
# Provides go/no-go signal before each chaos scenario progresses
apiVersion: v1
kind: ConfigMap
metadata:
  name: cerberus-config
  namespace: payu
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
data:
  config.yaml: |
    cerberus:
      distribution: openshift
      port: 8080
      kubeconfig_path: /tmp/kubeconfig
      watch_url_routes:
        - https://console-openshift-console.apps.payu.ocp.fajjjar.my.id
        - https://oauth-openshift.apps.payu.ocp.fajjjar.my.id
      watch_namespaces:
        - payu
        - openshift-etcd
        - openshift-apiserver
        - openshift-kube-apiserver
      watch_master_schedulable:
        enabled: true
      watch_nodes:
        enabled: true
      cerberus_publish_status: true
      inspect_components: true
      prometheus_url: ""
      prometheus_bearer_token: ""
      slack_integration:
        slack_api_token: ""
        slack_channel: "#payu-chaos-alerts"
    tunings:
      iterations: -1
      sleep_time: 30
      daemon_mode: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cerberus
  namespace: payu
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kraken-chaos
  namespace: payu
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cerberus-cluster-reader-payu
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
subjects:
  - kind: ServiceAccount
    name: cerberus
    namespace: payu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kraken-chaos-admin-payu
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
subjects:
  - kind: ServiceAccount
    name: kraken-chaos
    namespace: payu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: v1
kind: Service
metadata:
  name: cerberus
  namespace: payu
  labels:
    app: cerberus
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
spec:
  selector:
    app: cerberus
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus
  namespace: payu
  labels:
    app: cerberus
    app.kubernetes.io/name: cerberus
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: chaos-engineering
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cerberus
  template:
    metadata:
      labels:
        app: cerberus
        app.kubernetes.io/name: cerberus
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: chaos-engineering
        team: platform
    spec:
      serviceAccountName: cerberus
      securityContext:
        runAsUser: 0
      initContainers:
        - name: kubeconfig
          image: quay.io/krkn-chaos/krkn:latest
          command:
            - sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              cat > /tmp/kubeconfig <<'EOF'
              apiVersion: v1
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: https://kubernetes.default.svc
                name: in-cluster
              contexts:
              - context:
                  cluster: in-cluster
                  user: in-cluster
                name: in-cluster
              current-context: in-cluster
              users:
              - name: in-cluster
                user:
                  token: PLACEHOLDER_TOKEN
              EOF
              sed -i "s/PLACEHOLDER_TOKEN/$TOKEN/" /tmp/kubeconfig
          volumeMounts:
            - name: kubeconfig
              mountPath: /tmp
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cerberus
          image: quay.io/redhat-chaos/cerberus:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /root/cerberus/config/config.yaml
              subPath: config.yaml
            - name: kubeconfig
              mountPath: /tmp
          env:
            - name: KUBECONFIG
              value: /tmp/kubeconfig
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: cerberus-config
        - name: kubeconfig
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kraken-run
  namespace: payu
  labels:
    app: kraken
    app.kubernetes.io/name: kraken
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: chaos-engineering
    team: platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: kraken
        app.kubernetes.io/name: kraken
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: chaos-engineering
        team: platform
    spec:
      restartPolicy: Never
      serviceAccountName: kraken-chaos
      securityContext:
        runAsUser: 0
      initContainers:
        - name: fixperms
          image: quay.io/krkn-chaos/krkn:latest
          command:
            - sh
            - -c
            - echo INIT_WRITE_OK
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: kraken
          image: quay.io/krkn-chaos/krkn:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /root/kraken/config/config.yaml
              subPath: config.yaml
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: kraken-config
        # Writabe emptyDir over the report/temp paths: OCP CRI-O mounted the
        # krkn image rootfs read-only (OPS-2026-08-01-05) even with
        # readOnlyRootFilesystem:false, so `kraken.report` write failed.
        # Mounting writable volumes keeps the job runnable on any cluster.
        - name: tmp
          emptyDir: {}
