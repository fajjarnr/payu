# KNOWN ISSUE: Container Kill
# Helper pods deadlock on OpenShift/CRI-O with Litmus 3.28.0.
# Status: FAIL - Retained for future use once upstream fix is available.
# To enable, change engineState from 'stop' to 'active'.
# Requires: CONTAINER_RUNTIME=crio, SOCKET_PATH=/run/crio/crio.sock
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: payu-account-service-container-kill
  namespace: payu-dev
spec:
  appinfo:
    appns: 'payu-dev'
    applabel: 'app.kubernetes.io/name=account-service'
    appkind: 'deployment'
  engineState: 'stop'
  chaosServiceAccount: litmus
  experiments:
    - name: container-kill
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: 'app'
            - name: CONTAINER_RUNTIME
              value: 'crio'
            - name: SOCKET_PATH
              value: '/run/crio/crio.sock'
            - name: SIGNAL
              value: 'SIGKILL'
            - name: TOTAL_CHAOS_DURATION
              value: '30'
            - name: PODS_AFFECTED_PERC
              value: '50'
          probe:
            - name: 'check-account-service-health'
              type: 'httpProbe'
              mode: 'Continuous'
              runProperties:
                probeTimeout: '5s'
                retry: 2
                interval: '5s'
                probePollingInterval: '2s'
                initialDelay: '2s'
              httpProbe/inputs:
                url: 'http://account-service.payu-dev.svc.cluster.local:8080/actuator/health/liveness'
                insecureSkipVerify: false
                method:
                  get:
                    criteria: '=='
                    responseCode: '200'

