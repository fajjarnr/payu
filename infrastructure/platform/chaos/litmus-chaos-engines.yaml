# KNOWN ISSUE: Pod Network Latency
# Helper pods deadlock on OpenShift/CRI-O with Litmus 3.28.0.
# Status: FAIL - Retained for future use once upstream fix is available.
# To enable, change engineState from 'stop' to 'active'.
# Same root cause as pod-cpu-hog (helper binary futex deadlock).
# NOTE: Even if fixed, target container needs 'tc' (iproute2) which is
# NOT present in Spring Boot UBI containers.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: payu-account-service-network-latency
  namespace: payu-dev
spec:
  appinfo:
    appns: 'payu-dev'
    applabel: 'app.kubernetes.io/name=account-service'
    appkind: 'deployment'
  engineState: 'stop'
  chaosServiceAccount: litmus
  experiments:
    - name: pod-network-latency
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: 'app'
            - name: NETWORK_INTERFACE
              value: 'eth0'
            - name: CONTAINER_RUNTIME
              value: 'crio'
            - name: SOCKET_PATH
              value: '/run/crio/crio.sock'
            - name: NETWORK_LATENCY
              value: '2000'
            - name: TOTAL_CHAOS_DURATION
              value: '60'
            - name: RAMP_TIME
              value: '10'
            - name: PODS_AFFECTED_PERC
              value: '50'
          probe:
            - name: 'check-account-service-health'
              type: 'httpProbe'
              mode: 'Continuous'
              runProperties:
                probeTimeout: '5s'
                retry: 2
                interval: '5s'
                probePollingInterval: '2s'
                initialDelay: '2s'
              httpProbe/inputs:
                url: 'http://account-service.payu-dev.svc.cluster.local:8080/actuator/health/liveness'
                insecureSkipVerify: false
                method:
                  get:
                    criteria: '=='
                    responseCode: '200'

