# ClusterRole for LitmusChaos execution — used by litmus-admin SA per CHAOS-ENV-001
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "events", "configmaps", "secrets", "services", "serviceaccounts"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "deployments/scale"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # The runner pod carries an ownerReference to the ChaosEngine with
  # blockOwnerDeletion — creating it requires finalizer rights on
  # chaosengines (else: "cannot set blockOwnerDeletion", engine stuck
  # at initialized, preprod 2026-10-22).
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines/finalizers", "chaosresults/finalizers"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["litmus-chaos", "litmus-portal"]
    verbs: ["use"]
