# NetworkPolicy for OpenCost
# Allows all egress (OpenCost needs broad cluster access for metrics & K8s API)
# and ingress on the API port.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opencost
  namespace: payu-observability
  labels:
    app.kubernetes.io/component: cost-management
    app.kubernetes.io/part-of: payu
    payu.io/managed-by: platform-team
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opencost
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 9003
        - protocol: TCP
          port: 9090
  egress:
    - {}
