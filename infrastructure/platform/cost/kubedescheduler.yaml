# Kube Descheduler Configuration for PayU
# Ensures pods are evenly spread across all worker nodes
#
# Profiles:
#   - TopologyAndDuplicates: evicts duplicate pods on same node + enforces topology spread
#   - LifecycleAndUtilization: rebalances pods from overutilized to underutilized nodes
#   - SoftTopologyAndDuplicates: also handles soft topology constraints
#
# Applied to: openshift-kube-descheduler-operator namespace
# Applied via: oc apply -f infrastructure/platform/cost/kubedescheduler.yaml
# ============================================================
apiVersion: operator.openshift.io/v1
kind: KubeDescheduler
metadata:
  name: cluster
  namespace: openshift-kube-descheduler-operator
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: descheduler
spec:
  managementState: Managed
  logLevel: Normal
  operatorLogLevel: Normal

  # Run every 2 minutes for faster rebalancing
  deschedulingIntervalSeconds: 120

  # All three profiles combined for maximum spread
  profiles:
    # Utilization: move pods from overloaded nodes to underloaded nodes
    - LifecycleAndUtilization
    # Soft topology: handles both hard & soft topology constraints + removes duplicates
    - SoftTopologyAndDuplicates

  # Automatic = actually evict and reschedule pods
  mode: Automatic

  # Profile customizations — no namespace filter = applies to entire cluster
  profileCustomizations:
    # Low threshold = more aggressive rebalancing (triggers even at small imbalance)
    devLowNodeUtilizationThresholds: Low
