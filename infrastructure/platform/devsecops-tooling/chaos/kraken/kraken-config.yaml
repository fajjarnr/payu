# Kraken Configuration for PayU Pre-Production Chaos
# Ref: DEVSECOPS_ARCHITECTURE.md §4.3.3
apiVersion: v1
kind: ConfigMap
metadata:
  name: kraken-config
  namespace: payu-preprod
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: chaos-engineering
data:
  config.yaml: |
    kraken:
      distribution: openshift
      kubeconfig_path: /root/.kube/config
      exit_on_failure: true
      publish_kraken_status: true
      signal_state: GO
      litmus_install: false
      cerberus:
        cerberus_enabled: true
        cerberus_url: "http://cerberus.payu-preprod:8080"

    scenarios:
      # Scenario 1: Pod disruption (etcd, apiserver)
      - pod_scenarios:
          - namespace: openshift-etcd
            label_selector: app=etcd
            action: delete
            expected_recovery_time: 120
          - namespace: openshift-apiserver
            label_selector: app=openshift-apiserver
            action: delete
            expected_recovery_time: 90

      # Scenario 2: Node drain & reboot
      - node_scenarios:
          - action: node_drain_reboot
            node_count: 1
            expected_recovery_time: 300

    tunings:
      wait_duration: 60
      iterations: 1
      daemon_mode: false
