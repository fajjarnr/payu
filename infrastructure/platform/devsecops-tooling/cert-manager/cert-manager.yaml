# cert-manager TLS Configuration for PayU Banking Platform
# ============================================================
# Prerequisites:
#   - OpenShift cert-manager operator installed (stable-v1 channel)
#   - AWS IAM user with Route53 permissions for DNS01 challenge
#
# IMPORTANT:
#   - ClusterIssuer is cluster-scoped (no namespace required)
#   - AWS credentials Secret MUST be in the 'cert-manager' namespace
#   - Certificates are namespace-scoped (created in payu-dev)
#
# After applying, verify:
#   oc get clusterissuer letsencrypt-cluster-issuer
#   oc get certificate -n payu-dev
# ============================================================
---
# AWS Credentials for Route53 DNS01 Challenge
# IMPORTANT: Update aws_secret_access_key before applying!
apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-aws-creds
  namespace: cert-manager
type: Opaque
stringData:
  aws_access_key_id: "AKIA5XMY7E7VVH4R6F5C"
  aws_secret_access_key: "REPLACE_WITH_ACTUAL_SECRET_KEY"
---
# ClusterIssuer: Let's Encrypt Production with DNS01/Route53
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cluster-issuer
spec:
  acme:
    email: zfajart@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cluster-issuer-acme-production
    solvers:
      - dns01:
          route53:
            accessKeyID: AKIA5XMY7E7VVH4R6F5C
            hostedZoneID: Z07072361SZ3NVD6OWWGC
            region: ap-southeast-1
            secretAccessKeySecretRef:
              key: aws_secret_access_key
              name: cert-manager-aws-creds
        selector:
          dnsZones:
            - "ocp.fajjjar.my.id"
---
# Certificate: Gateway service (public-facing API)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
spec:
  secretName: gateway-tls-secret
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - gateway-dev.payu.fajjjar.my.id
  duration: 720h      # 30 days
  renewBefore: 168h   # Renew 7 days before expiry
---
# Certificate: Web App (public-facing UI)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-app-tls
spec:
  secretName: web-app-tls-secret
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - dev.payu.fajjjar.my.id
  duration: 720h      # 30 days
  renewBefore: 168h   # Renew 7 days before expiry
