# Falco Custom Rules for PayU Banking Platform
# Ref: DEVSECOPS_ARCHITECTURE.md §4.5.1
# Policy: Use native/predefined rules first, OSS defaults as fallback
# These rules supplement Falco's default ruleset with PayU-specific detections
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: falco-system
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: runtime-security
data:
  payu-rules.yaml: |
    # ============================================================
    # PayU Banking-Specific Falco Rules
    # ============================================================

    # Detect shell access in production namespaces
    - rule: Shell in PayU Production Container
      desc: Detect shell execution in payu production namespace containers
      condition: >
        spawned_process and container and
        proc.name in (bash, sh, zsh, dash, ksh) and
        k8s.ns.name = "payu"
      output: >
        Shell spawned in production container
        (user=%user.name command=%proc.cmdline container=%container.name
        namespace=%k8s.ns.name pod=%k8s.pod.name image=%container.image.repository)
      priority: CRITICAL
      tags: [payu, production, shell]

    # Detect sensitive file access (PII/credentials)
    - rule: Sensitive File Access in PayU
      desc: Detect access to sensitive files in PayU containers
      condition: >
        open_read and container and
        k8s.ns.name startswith "payu" and
        (fd.name contains "/etc/shadow" or
         fd.name contains "/etc/passwd" or
         fd.name contains "credentials" or
         fd.name contains ".key" or
         fd.name contains ".pem")
      output: >
        Sensitive file access detected
        (user=%user.name file=%fd.name container=%container.name
        namespace=%k8s.ns.name pod=%k8s.pod.name)
      priority: WARNING
      tags: [payu, sensitive-file, pii]

    # Detect outbound connections to unexpected destinations
    - rule: Unexpected Outbound Connection from PayU
      desc: Detect outbound network connections to non-whitelisted destinations
      condition: >
        outbound and container and
        k8s.ns.name startswith "payu" and
        not (fd.sip in (rfc_1918_addresses))
      output: >
        Unexpected outbound connection from PayU service
        (command=%proc.cmdline connection=%fd.name
        container=%container.name namespace=%k8s.ns.name)
      priority: NOTICE
      tags: [payu, network, egress]

    # Detect privilege escalation attempts
    - rule: Privilege Escalation in PayU Namespace
      desc: Detect privilege escalation in PayU containers
      condition: >
        spawned_process and container and
        k8s.ns.name startswith "payu" and
        proc.name in (sudo, su, setuid)
      output: >
        Privilege escalation attempt detected
        (user=%user.name command=%proc.cmdline container=%container.name
        namespace=%k8s.ns.name pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [payu, privilege-escalation]
