---
# ============================================================
# Production Project — payu
# RBAC: SRE only (break-glass)
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payu
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "PayU Production — SRE Only (Break-Glass)"
  sourceRepos:
    - "https://github.com/payu-digital/payu-platform.git"
  destinations:
    - namespace: payu
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
  roles:
    - name: sre-prod
      description: "Production SRE access (break-glass only)"
      policies:
        - p, proj:payu:sre-prod, applications, get, payu/*, allow
        - p, proj:payu:sre-prod, applications, sync, payu/*, allow
      groups:
        - payu-sre
