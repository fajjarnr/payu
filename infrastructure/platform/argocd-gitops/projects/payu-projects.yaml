  sourceRepos:
    - "https://github.com/payu-digital/payu-platform.git"
  destinations:
    - namespace: payu-sit
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: qa-team
      description: "QA and Development team access"
      policies:
