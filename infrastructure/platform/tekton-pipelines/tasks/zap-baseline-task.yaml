apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zap-baseline
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Run an OWASP ZAP baseline scan against a deployed environment."
  params:
    - name: TARGET_URL
      type: string
      description: "Base URL to scan"
  workspaces:
    - name: source
      description: "Workspace used to persist reports"
  steps:
    - name: scan
      image: ghcr.io/zaproxy/zaproxy:stable
      script: |
        #!/bin/sh
        set -eu

        REPORT_DIR="$(workspaces.source.path)/reports"
        mkdir -p "$REPORT_DIR"
        zap-baseline.py -t "$(params.TARGET_URL)" -J "$REPORT_DIR/zap-baseline.json" -r "$REPORT_DIR/zap-baseline.html" -I