# PayU Platform - Crunchy Postgres for Kubernetes
# PostgreSQL 16 with pgBouncer, pgBackRest, and multi-database setup
# Prerequisite: crunchy-postgres-operator subscription installed
# ============================================================

apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: payu-postgres
  labels:
    app.kubernetes.io/name: payu-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
spec:
  image: registry.connect.redhat.com/crunchydata/crunchy-postgres@sha256:3c38e7be43392c37e7d72ee3a8387e1931f342e42c7c5b7c88559d865c4cc024
  postgresVersion: 18

  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

  # pgBackRest backup configuration
  backups:
    pgbackrest:
      # Let operator choose compatible image
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi

  # pgBouncer connection pooling
  proxy:
    pgBouncer:
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbouncer:ubi8-1.23-1
      replicas: 1
      # pgBouncer configuration
      # Ref: https://www.pgbouncer.org/config.html
      config:
        # Pool settings
        max_client_conn: 1000
        default_pool_size: 20
        min_pool_size: 5
        reserve_pool_size: 10
        reserve_pool_timeout: 3

        # Pool mode: transaction (best for OLTP)
        pool_mode: transaction

        # Connection limits per database
        max_db_connections: 100
        max_user_connections: 100

        # Timeouts
        server_idle_timeout: 600
        server_lifetime: 3600
        client_idle_timeout: 0
        client_login_timeout: 60

        # Logging
        verbose: 0
        admin_users: payu
        stats_users: payu

  # User and all databases
  # IMPORTANT: keycloak is included here so pg_hba.conf is auto-configured
  users:
    - name: payu
      databases:
        - payu_account
        - payu_auth
        - payu_transaction
        - payu_wallet
        - payu_notification
        - payu_billing
        - payu_kyc
        - payu_analytics
        - payu_compliance
        - payu_bifast
        - payu_dukcapil
        - payu_qris
        - payu_investment
        - payu_lending
        - payu_backoffice
        - payu_partner
        - payu_promotion
        - payu_support
        - payu_statement
        - payu_fx
        - payu_cms
        - payu_abtesting
        - payu_dispute
        - payu_integration
        - payu_productcatalog
        - payu_biller
        - payu_va
        - keycloak
      options: "SUPERUSER"

  # Patroni dynamic configuration for performance tuning
  # Ref: https://patroni.readthedocs.io/en/latest/dynamic_configuration.html
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          # Connection limits - 300 for 22 services with pool size 10 each
          max_connections: 300
          max_prepared_transactions: 300

          # Memory settings (25% of 1GB = 256MB)
          shared_buffers: 256MB
          effective_cache_size: 768MB
          work_mem: 8MB
          maintenance_work_mem: 128MB

          # WAL settings for write performance
          wal_level: replica
          max_wal_size: 2GB
          min_wal_size: 512MB
          checkpoint_timeout: 10min
          checkpoint_completion_target: 0.9

          # Autovacuum for busy tables
          autovacuum: on
          autovacuum_max_workers: 4
          autovacuum_naptime: 30s
          autovacuum_vacuum_scale_factor: 0.05
          autovacuum_analyze_scale_factor: 0.02

          # Query planner
          random_page_cost: 1.1
          effective_io_concurrency: 200
