apiVersion: batch/v1
kind: Job
metadata:
  name: outbox-bootstrap
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: outbox-bootstrap
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
  annotations:
    # Jobs are immutable: ArgoCD cannot patch a spec change. Replace=true lets
    # GitOps delete+recreate on spec drift instead of failing sync
    # ("field is immutable") on redeploy.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  ttlSecondsAfterFinished: 300
  manualSelector: true
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-bootstrap
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: database
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:16.8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: payu-database-rw.payu-dev.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: payu-database-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: payu-database-superuser
                  key: password
            - name: APP_USER
              value: payu
            - name: DB_LIST
              value: >-
                payu_account payu_auth payu_billing payu_cms payu_compliance
                payu_dispute payu_fx payu_integration payu_investment
                payu_lending payu_loan_origination payu_partner payu_products
                payu_promotion payu_statement payu_support payu_transaction
                payu_wallet
            - name: PGCONNECT_TIMEOUT
              value: "10"
          command:
            - /bin/bash
            - -ceu
            - |
              for db in $DB_LIST; do
                echo "Post-migration outbox_events owner+grants in ${db}"
                # lock_timeout: fail fast instead of hanging hours when an app
                # session leaks an open transaction on outbox_events
                # (idle-in-transaction holding RowExclusiveLock → ALTER blocked,
                # OPS-2026-08-01-06). Redeploy gate must see a failure, not a hang.
                psql -w -v ON_ERROR_STOP=1 -d "$db" \
                  -c "SET lock_timeout TO '15s'" -c "
                  DO \$\$
                  BEGIN
                    IF to_regclass('public.outbox_events') IS NOT NULL THEN
                      ALTER TABLE outbox_events OWNER TO payu;
                    END IF;
                  END
                  \$\$;
                  DO \$\$
                  BEGIN
                    IF to_regclass('public.outbox_events') IS NOT NULL THEN
                      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE outbox_events TO ${APP_USER};
                    END IF;
                  END
                  \$\$;
                "
              done
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
