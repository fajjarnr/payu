# PayU Platform - Red Hat Data Grid (Infinispan)
# Distributed caching with RESP (Redis-compatible) connector
# Prerequisite: datagrid operator subscription installed
# ============================================================
#
# RESP CONNECTOR SETUP:
# - Data Grid 8.5+ supports RESP (Redis wire protocol) natively
# - endpointAuthentication: false for dev (no AUTH handshake needed)
# - RESP listens on socket binding "resp" port 6379
# - Spring Boot Lettuce connects via redis://payu-cache:6379 without auth
# - Admin service required for config listener to push RESP config
# ============================================================

# Credentials secret for DataGrid endpoint authentication
apiVersion: v1
kind: Secret
metadata:
  name: datagrid-credentials
  labels:
    app.kubernetes.io/name: datagrid-credentials
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  identities.yaml: |
    credentials:
      - username: developer
        password: payu-cache-dev-password
        roles:
          - admin

---
# Infinispan CR - DataGrid instance
apiVersion: infinispan.org/v1
kind: Infinispan
metadata:
  name: payu-cache
  labels:
    app.kubernetes.io/name: payu-cache
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
spec:
  replicas: 1

  service:
    type: DataGrid

  security:
    endpointAuthentication: false
    endpointEncryption:
      type: None

  container:
    memory: "512Mi"

  # RESP config pushed via config listener to add Redis-compatible connector
  configMapName: payu-cache-resp-config

---
# RESP connector configuration for Data Grid
# This adds a Redis-protocol endpoint on port 6379 alongside the default HotRod/REST on 11222
apiVersion: v1
kind: ConfigMap
metadata:
  name: payu-cache-resp-config
  labels:
    app.kubernetes.io/name: payu-cache-resp-config
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
data:
  infinispan-config.yaml: |
    infinispan:
      cacheContainer:
        security:
          authorization: {}
    connector:
      - type: resp
        socketBinding: resp
        authentication:
          enabled: false
    socketBindings:
      defaultInterface: public
      socketBinding:
        - name: default
          port: 11222
        - name: resp
          port: 6379

---
# Admin service required by config-listener to push RESP config
apiVersion: v1
kind: Service
metadata:
  name: payu-cache-admin
  labels:
    app.kubernetes.io/name: payu-cache-admin
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: 11223
      targetPort: 11223
  selector:
    app: infinispan-pod
    clusterName: payu-cache

---
# Redis-compatible service alias via ExternalName
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: datagrid
spec:
  type: ExternalName
  externalName: payu-cache.payu-dev.svc.cluster.local
