apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PayU Data Services - Base manifests
# Apply with: oc apply -k infrastructure/platform/data/base/

resources:
  - postgres-statefulset.yaml  # ACTIVE: 2-replica PostgreSQL (1 master + 1 replica, native streaming replication, iter 59)
  - redis-statefulset.yaml     # ACTIVE: 2-replica Redis cache
  - kafka-amqstreams.yaml      # ACTIVE: 3-broker Kafka (payu-kafka)
  - network-policy-egress.yaml # allow-all-egress
  - kafka-console.yaml         # AMQ Streams console UI
  # SUPERSEDED (READY-027 → READY-076):
  # - postgres-cluster.yaml  # Crunchy HA spec kept as future-migration reference only
  # - kyverno-exception-kafka.yaml
  # - kyverno-exception-kafka-deployments.yaml
  # kafka-config is managed by workload overlays per environment
  # - kafka-config.yaml
