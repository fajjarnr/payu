apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: payu-postgres
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
spec:
  # READY-027 HA: 3 instances (1 primary + 2 replicas) with streaming replication.
  # Migration from the legacy StatefulSet `payu-postgres-0` (single pod) is
  # documented in docs/operations/PG_HA_MIGRATION.md.
  instances:
    - name: pgha
      replicas: 3
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-csi
        resources:
          requests:
            storage: 10Gi
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    postgres-operator.crunchydata.com/cluster: payu-postgres
                    postgres-operator.crunchydata.com/instance-set: pgha
                topologyKey: kubernetes.io/hostname
                namespaces: [payu-dev]
    - name: pgbackrest
      replicas: 1
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-csi
        resources:
          requests:
            storage: 20Gi

  postgresVersion: 16

  # Backup config (pgBackRest) for PITR + replica WAL shipping
  backups:
    pgbackrest:
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbackrest:ubi8-2.50.1
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes: [ReadWriteOnce]
              storageClassName: gp3-csi
              resources:
                requests:
                  storage: 20Gi
          schedules:
            full: "0 1 * * 0"
            incremental: "0 1 * * 1-6"
          retention: 7d

  # Users (must match current StatefuSet user names so app configs work)
  users:
    - name: postgres
      options: SUPERUSER
    - name: payu
    - name: payu_account
    - name: payu_auth
    - name: payu_transaction
    - name: payu_wallet
    - name: payu_notification
    - name: payu_sonarqube

  # Databases
  databases:
    - name: payu
      owner: payu
    - name: payu_account
      owner: payu_account
    - name: payu_auth
      owner: payu_auth
    - name: payu_transaction
      owner: payu_transaction
    - name: payu_wallet
      owner: payu_wallet
    - name: payu_notification
      owner: payu_notification
    - name: payu_sonarqube
      owner: payu_sonarqube

  # Proxy (PgBouncer) — pool connections from microservices
  proxy:
    pgBouncer:
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbouncer:ubi8-1.22.1
      replicas: 2
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

  # Patroni-managed monitoring
  monitoring:
    pgmonitor:
      exporter:
        image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres-exporter:ubi8-5.4.0
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
