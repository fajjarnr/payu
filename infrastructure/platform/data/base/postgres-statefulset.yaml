# PayU Platform - Shared PostgreSQL HA (RHEL9 postgresql-16) - READY-076
# Native streaming replication: payu-postgres-0 (master) + payu-postgres-1 (replica)
# --------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: payu-postgres-credentials
  labels:
    app.kubernetes.io/name: payu-postgres-credentials
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
type: Opaque
stringData:
  password: payu-dev-password
  keycloak-password: keycloak-dev-password
  replicator-password: payu-replicator-password

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payu-postgres-init
  labels:
    app.kubernetes.io/name: payu-postgres-init
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
data:
  01-create-keycloak.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username postgres <<-EOSQL
        CREATE USER keycloak WITH PASSWORD '${KEYCLOAK_PASSWORD}';
        CREATE DATABASE keycloak OWNER keycloak;
        GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
    EOSQL

  02-create-replicator.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username postgres <<-EOSQL
        DO $$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'replicator') THEN
                CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'payu-replicator-password';
            ELSE
                ALTER USER replicator WITH REPLICATION LOGIN PASSWORD 'payu-replicator-password';
            END IF;
        END
        \$\$;
    EOSQL

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payu-postgres-replica-scripts
  labels:
    app.kubernetes.io/name: payu-postgres-replica-scripts
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
data:
  replica-setup.sh: |
    #!/bin/bash
    set -e

    HOSTNAME_SHORT=$(echo "$HOSTNAME" | sed 's/.*-//')
    if [ "$HOSTNAME_SHORT" = "0" ]; then
        echo "[replica-setup] pod-0 detected, this is the master - skipping basebackup"
        exit 0
    fi

    echo "[replica-setup] replica pod detected: $HOSTNAME"
    MASTER="payu-postgres-0.payu-postgres.${POD_NAMESPACE}.svc.cluster.local"
    echo "[replica-setup] master host: $MASTER"

    until PGPASSWORD=payu-replicator-password pg_isready -h "$MASTER" -U replicator -q; do
        echo "[replica-setup] waiting for master..."
        sleep 2
    done
    echo "[replica-setup] master is ready"

    echo "[replica-setup] wiping data dir for fresh basebackup"
    rm -rf /var/lib/pgsql/data/userdata/* /var/lib/pgsql/data/userdata/.* 2>/dev/null || true

    PGPASSWORD=payu-replicator-password pg_basebackup -h "$MASTER" -D /var/lib/pgsql/data/userdata -U replicator -X stream -c fast -P
    touch /var/lib/pgsql/data/userdata/standby.signal
    # Fetch master's openshift-custom-postgresql.conf (replica doesn't have it)
    mkdir -p /var/lib/pgsql/data/userdata/conf.d
    echo "primary_conninfo = 'host=$MASTER port=5432 user=replicator password=payu-replicator-password application_name=$HOSTNAME'" > /var/lib/pgsql/data/userdata/postgresql.auto.conf
    # Add a minimal placeholder for the include directive
    cat > /var/lib/pgsql/openshift-custom-postgresql.conf <<'CUSTOMCONF'
listen_addresses = '*'
wal_level = hot_standby
max_wal_senders = 10
wal_keep_size = 6400MB
hot_standby = on
CUSTOMCONF
    echo "[replica-setup] basebackup complete"

---
apiVersion: v1
kind: Service
metadata:
  name: payu-postgres
  labels:
    app.kubernetes.io/name: payu-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payu-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: payu-postgres-headless
  labels:
    app.kubernetes.io/name: payu-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: payu-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payu-postgres
  labels:
    app.kubernetes.io/name: payu-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "16"
    team: platform
spec:
  replicas: 2
  serviceName: payu-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: payu-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payu-postgres
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: replica-setup
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/replica-setup.sh"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: pgsql-tmp
              mountPath: /var/lib/pgsql
            - name: tmp
              mountPath: /tmp
            - name: replica-scripts
              mountPath: /scripts
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              value: payu
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payu-postgres-credentials
                  key: password
            - name: POSTGRESQL_DATABASE
              value: payu
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payu-postgres-credentials
                  key: password
            - name: POSTGRESQL_REPLICATOR_PASSWORD
              value: payu-replicator-password
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: "500"
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payu-postgres-credentials
                  key: keycloak-password
            - name: ENABLE_REPLICATION
              value: "true"
            - name: POSTGRESQL_MASTER_USER
              value: replicator
            - name: POSTGRESQL_MASTER_PASSWORD
              value: payu-replicator-password
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: pgsql-tmp
              mountPath: /var/lib/pgsql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
            - name: init-scripts
              mountPath: /opt/app-root/src/postgresql-init
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: pgsql-tmp
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: payu-postgres-init
            defaultMode: 0755
        - name: replica-scripts
          configMap:
            name: payu-postgres-replica-scripts
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-csi
        resources:
          requests:
            storage: 10Gi
