# PayU Platform - Infinispan 16.2.1
# Native Hot Rod and REST only. The Operator owns the endpoint Service on 11222.
# Prerequisites, supplied through External Secrets (never committed here):
#   - payu-cache-credentials: Data Grid endpoint credentials.
#   - payu-cache-server-tls: server tls.crt and tls.key.
#   - payu-cache-client-ca: trusted client CA bundle for mTLS validation.
apiVersion: infinispan.org/v1
kind: Infinispan
metadata:
  name: payu-cache
  annotations:
    infinispan.org/monitoring: "true"
  labels:
    app.kubernetes.io/name: payu-cache
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  version: 16.2.1
  upgrades:
    type: Shutdown
  service:
    type: DataGrid
  security:
    endpointAuthentication: true
    endpointSecretName: payu-cache-credentials
    endpointEncryption:
      type: Secret
      certSecretName: payu-cache-server-tls
      clientCert: Validate
      clientCertSecretName: payu-cache-client-ca
  container:
    memory: "512Mi"
  configMapName: payu-cache-custom-config

---
# Keep custom configuration inside cache-container. Endpoint, TLS, and transport
# remain Operator-managed to avoid overriding the generated server configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payu-cache-custom-config
  labels:
    app.kubernetes.io/name: payu-cache-config
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cache
data:
  infinispan-config.xml: |
    <infinispan xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="urn:infinispan:config:16.0 https://infinispan.org/schemas/infinispan-config-16.0.xsd"
                xmlns="urn:infinispan:config:16.0">
      <cache-container name="default" statistics="true">
        <distributed-cache name="payu" mode="SYNC" owners="1" statistics="true">
          <encoding>
            <key media-type="text/plain"/>
            <value media-type="text/plain"/>
          </encoding>
        </distributed-cache>
      </cache-container>
    </infinispan>
