apiVersion: batch/v1
kind: Job
metadata:
  name: outbox-bootstrap
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: outbox-bootstrap
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-bootstrap
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: database
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:16.8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: payu-database-rw.payu-dev.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: payu-database-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: payu-database-superuser
                  key: password
            - name: APP_USER
              value: payu
            - name: DB_LIST
              value: >-
                payu_account payu_auth payu_billing payu_cms payu_compliance
                payu_dispute payu_fx payu_integration payu_investment
                payu_lending payu_loan_origination payu_partner payu_products
                payu_promotion payu_statement payu_support payu_transaction
                payu_wallet
          command:
            - /bin/bash
            - -ceu
            - |
              for db in $DB_LIST; do
                echo "Ensuring outbox_events in ${db}"
                psql -v ON_ERROR_STOP=1 -d "$db" -c "
                  DO \$\$
                  BEGIN
                    IF to_regclass('public.outbox_events') IS NOT NULL THEN
                      ALTER TABLE outbox_events OWNER TO payu;
                    END IF;
                  END
                  \$\$;
                  SET ROLE payu;
                  CREATE TABLE IF NOT EXISTS outbox_events (
                      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                      aggregate_type VARCHAR(100) NOT NULL,
                      aggregate_id VARCHAR(100) NOT NULL,
                      event_type VARCHAR(100) NOT NULL,
                      payload JSONB NOT NULL,
                      headers JSONB,
                      destination_topic VARCHAR(255),
                      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                      published_at TIMESTAMPTZ,
                      sequence_num BIGSERIAL NOT NULL,
                      retry_count INTEGER NOT NULL DEFAULT 0,
                      last_error VARCHAR(1000),
                      CONSTRAINT chk_retry_count_non_negative CHECK (retry_count >= 0)
                  );
                  ALTER TABLE outbox_events
                      ALTER COLUMN aggregate_id TYPE VARCHAR(100),
                      ALTER COLUMN event_type TYPE VARCHAR(100),
                      ALTER COLUMN payload TYPE JSONB USING payload::jsonb,
                      ALTER COLUMN headers TYPE JSONB USING headers::jsonb,
                      ALTER COLUMN destination_topic DROP NOT NULL,
                      ALTER COLUMN last_error TYPE VARCHAR(1000);
                  CREATE SEQUENCE IF NOT EXISTS outbox_events_sequence_num_seq;
                  ALTER SEQUENCE outbox_events_sequence_num_seq
                      OWNED BY outbox_events.sequence_num;
                  ALTER TABLE outbox_events
                      ALTER COLUMN sequence_num SET DEFAULT nextval('outbox_events_sequence_num_seq'),
                      ALTER COLUMN sequence_num SET NOT NULL;
                  CREATE INDEX IF NOT EXISTS idx_outbox_aggregate
                      ON outbox_events(aggregate_type, aggregate_id);
                  CREATE INDEX IF NOT EXISTS idx_outbox_published
                      ON outbox_events(published_at) WHERE published_at IS NULL;
                  CREATE INDEX IF NOT EXISTS idx_outbox_created
                      ON outbox_events(created_at);
                  CREATE INDEX IF NOT EXISTS idx_outbox_event_type
                      ON outbox_events(event_type);
                  CREATE INDEX IF NOT EXISTS idx_outbox_sequence
                      ON outbox_events(sequence_num);
                  CREATE INDEX IF NOT EXISTS idx_outbox_unpublished_retry
                      ON outbox_events(created_at, retry_count)
                      WHERE published_at IS NULL;
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE outbox_events TO ${APP_USER};
                  GRANT USAGE, SELECT ON SEQUENCE outbox_events_sequence_num_seq TO ${APP_USER};
                "
              done
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
