apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  labels:
    app.kubernetes.io/name: kafka-config
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: messaging
data:
  KAFKA_BOOTSTRAP_SERVERS: "payu-kafka-kafka-bootstrap:9092"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  KAFKA_RETRIES: "3"
  KAFKA_ACKS: "all"
