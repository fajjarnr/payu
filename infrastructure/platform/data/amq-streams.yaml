# PayU Platform - AMQ Streams (Apache Kafka 4.0 KRaft)
# Event streaming with KRaft mode (no ZooKeeper)
# Prerequisite: amq-streams operator subscription installed
# ============================================================

# KafkaNodePool - Controller nodes (KRaft metadata quorum)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
  storage:
    type: ephemeral

---
# KafkaNodePool - Broker nodes (data handling)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - broker
  storage:
    type: ephemeral

---
# Main Kafka cluster (KRaft mode)
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      inter.broker.protocol.version: "4.1"
      auto.create.topics.enable: "true"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
  entityOperator:
    topicOperator: {}
    userOperator: {}

---
# KafkaTopic - account events
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: account-events
  labels:
    app.kubernetes.io/name: account-events
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete

---
# KafkaTopic - transaction events
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transaction-events
  labels:
    app.kubernetes.io/name: transaction-events
    app.kubernetes.io/part-of: payu
    strimzi.io/cluster: kafka
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
