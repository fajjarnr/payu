# PayU Platform - Database Migration: StatefulSet → CNPG
# Dumps all 27 databases from old Postgres, restores to CNPG cluster
# Run once: oc apply -f cnpg-migration.yaml -n payu-dev
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-to-cnpg
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: migrate-to-cnpg
    app.kubernetes.io/part-of: payu
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.redhat.io/rhel9/postgresql-16:latest
          env:
            - name: SOURCE_HOST
              value: payu-postgres-ha-primary.payu-dev.svc.cluster.local
            - name: SOURCE_USER
              value: postgres
            - name: SOURCE_PASSWORD
              value: ""  # connect using trust in same namespace
            - name: TARGET_HOST
              value: payu-database-rw.payu-dev.svc.cluster.local
            - name: TARGET_USER
              value: postgres
            - name: TARGET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payu-database-superuser
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export PGPASSWORD="$TARGET_PASSWORD"

              DBS=$(PGPASSWORD="" PGPASSWORD="" psql -h "$SOURCE_HOST" -U "$SOURCE_USER" -d postgres -t -c \
                "SELECT datname FROM pg_database WHERE datname LIKE 'payu%' OR datname = 'keycloak';")

              for db in $DBS; do
                echo "=== Migrating $db ==="
                PGPASSWORD="" pg_dump -h "$SOURCE_HOST" -U "$SOURCE_USER" -d "$db" --no-owner --no-privileges --clean --if-exists | \
                  psql -h "$TARGET_HOST" -U "$TARGET_USER" -d "$db" -v ON_ERROR_STOP=1
                echo "  Done: $db"
              done
              echo "All databases migrated successfully."
