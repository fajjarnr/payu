apiVersion: batch/v1
kind: Job
metadata:
  name: shedlock-bootstrap
  namespace: payu-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:16.8
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
