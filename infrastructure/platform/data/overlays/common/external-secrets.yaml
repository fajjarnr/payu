apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payu-database-app
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    payu.io/vault-environment-path: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payu-vault
    kind: ClusterSecretStore
  target:
    name: payu-database-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: payu/environment/database/app
---
