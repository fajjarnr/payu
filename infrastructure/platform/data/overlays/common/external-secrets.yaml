---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-cache-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    payu.io/vault-environment-path: "true"
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/cache/credentials
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-cache-credentials
    create: true
    overwrite: true
    transformation:
      templates:
        identities.yaml:
          text: |-
            credentials:
              - username: {{ get .Secrets "username" }}
                password: {{ get .Secrets "password" }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-cache-server-tls
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    payu.io/vault-environment-path: "true"
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/cache/server-tls
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-cache-server-tls
    create: true
    overwrite: true
    type: kubernetes.io/tls
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-cache-client-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    payu.io/vault-environment-path: "true"
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/cache/client-ca
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-cache-client-ca
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^truststore-password$
      templates:
        truststore.p12:
          text: '{{ get .Secrets "truststore.p12" | b64dec }}'
