apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-database-app
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    payu.io/vault-environment-path: "true"
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/database/app
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-database-app
    create: true
    overwrite: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-database-superuser
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    payu.io/vault-environment-path: "true"
spec:
  vaultAuthRef: payu-vault
  mount: secret
