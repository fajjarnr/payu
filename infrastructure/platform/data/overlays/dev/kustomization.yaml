apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PayU Data Services - Dev Overlay
# Dev-specific patches for data infrastructure
# Apply with: oc apply -k infrastructure/platform/data/overlays/dev/

resources:
  - ../../base

namespace: payu-dev

# Dev-specific patches
patches:
  # Postgres: Dev sizing (1 replica, 10Gi)
  - target:
      kind: PostgresCluster
      name: payu-postgres
    patch: |
      - op: replace
        path: /spec/instances/0/replicas
        value: 1

  # DataGrid: Dev sizing (1 replica, 512Mi)
  - target:
      kind: Infinispan
      name: payu-datagrid
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Kafka: Dev sizing (1 broker, 1 controller, ephemeral)
  - target:
      kind: KafkaNodePool
      name: controller
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: KafkaNodePool
      name: broker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Kafka Console: Dev hostname
  - target:
      kind: Console
      name: payu-kafka-console
    patch: |
      - op: replace
        path: /spec/hostname
        value: kafka-console-dev.payu.fajjjar.my.id

  # Redis ExternalName: Use FQDN for DNS resolution
  - target:
      kind: Service
      name: redis
    patch: |
      - op: replace
        path: /spec/externalName
        value: payu-datagrid.payu-dev.svc.cluster.local
