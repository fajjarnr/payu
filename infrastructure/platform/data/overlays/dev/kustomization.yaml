apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PayU Data Services - Dev Overlay
# Dev-specific patches for data infrastructure
# Apply with: oc apply -k infrastructure/platform/data/overlays/dev/

namespace: payu-dev
resources:
  - ../../cnpg
  - cnpg-secrets.yaml
  # Dev-only: standalone Infinispan StatefulSet serves plain Hot Rod. The
  # operator-managed Infinispan CR (base/datagrid.yaml) is skipped because the
  # Data Grid 8.6.5 operator webhook (vinfinispan.kb.io) panics on it in the
  # sandbox cluster and never provisions the cache.
  - infinispan-standalone.yaml
  # Dev-only: standalone Redis for RESP clients (transaction VelocityGuard Lua,
  # gateway rate limiter) at payu-cache-resp:11222. Promoted envs use managed Redis.
  - redis-standalone.yaml
  # Promoted overlays (sit/uat/preprod/prod) use ../../base which includes the
  # operator-managed Infinispan CR with mTLS.

# Dev cache stays reachable without Vault-provisioned server TLS/CA secrets.
# Production overlays keep the base mTLS configuration.
patches:
  - target:
      group: infinispan.org
      version: v1
      kind: Infinispan
      name: payu-cache
    patch: |-
      - op: add
        path: /metadata/annotations/payu.io~1dev-cache-revision
        value: "2026-08-04-plain-tx-log"
      - op: replace
        path: /spec/security
        value:
          endpointAuthentication: false
          endpointEncryption:
            type: None
      - op: add
        path: /spec/logging
        value:
          categories:
            org.infinispan.commons.util.StringPropertyReplacer: error
