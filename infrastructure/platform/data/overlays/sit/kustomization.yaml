apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PayU Data Services - SIT Overlay
# Same proven pattern as dev: standalone Infinispan StatefulSet (plain Hot Rod)
# because the Data Grid 8.6.5 operator webhook (vinfinispan.kb.io) panics on the
# operator-managed CR in this sandbox cluster. Plain cnpg bootstrap secrets
# replace VaultStaticSecrets until Vault/VSO ships (DEVSECOPS-017).

namespace: payu-sit
resources:
  - ../../cnpg
  - cnpg-secrets.yaml
  - infinispan-standalone.yaml
  - redis-standalone.yaml

replacements:
  # Bootstrap jobs hardcode the dev FQDN; retarget the namespace segment.
  - source:
      kind: ConfigMap
      name: promotion-environment
      fieldPath: data.namespace
    targets:
      - select:
          group: batch
          version: v1
          kind: Job
          name: outbox-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=psql].env.[name=PGHOST].value
        options:
          delimiter: .
          index: 1
      - select:
          group: batch
          version: v1
          kind: Job
          name: shedlock-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=psql].env.[name=PGHOST].value
        options:
          delimiter: .
          index: 1
      - select:
          group: batch
          version: v1
          kind: Job
          name: post-deploy-db-grants
        fieldPaths:
          - spec.template.spec.containers.[name=db-grants].env.[name=PGHOST].value
        options:
          delimiter: .
          index: 1
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: promotion-environment
    literals:
      - environment=sit
      - namespace=payu-sit
patches:
- target:
    group: infinispan.org
    version: v1
    kind: Infinispan
    name: payu-cache
  patch: |-
    - op: add
      path: /metadata/annotations/payu.io~1dev-cache-revision
      value: "2026-08-04-plain-tx-log"
    - op: replace
      path: /spec/security
      value:
        endpointAuthentication: false
        endpointEncryption:
          type: None
    - op: add
      path: /spec/logging
      value:
        categories:
          org.infinispan.commons.util.StringPropertyReplacer: error
# SIT has no S3 backup credentials (secret payu-backup-s3 is created outside
# git and only exists for dev). Drop the barman WAL archiver so the cluster
# does not spam failed archive attempts and grow WAL volume unbounded
# (archive_timeout 60s). Re-enable (revert this patch + provide the secret)
# before UAT — non-prod SIT runs without PITR by explicit decision.
- target:
    group: postgresql.cnpg.io
    version: v1
    kind: Cluster
    name: payu-database
  patch: |-
    - op: remove
      path: /spec/plugins
