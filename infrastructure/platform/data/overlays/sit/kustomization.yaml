apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-sit
resources:
  - ../common
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: promotion-environment
    literals:
      - environment=sit
      - namespace=payu-sit
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: payu-database
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
  - target:
      group: infinispan.org
      version: v1
      kind: Infinispan
      name: payu-cache
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-all-egress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-all-egress
      $patch: delete
replacements:
  - source:
      kind: ConfigMap
      name: promotion-environment
      fieldPath: data.environment
    targets:
      - select:
          group: secrets.hashicorp.com
          version: v1beta1
          kind: VaultStaticSecret
          labelSelector: payu.io/vault-environment-path=true
        fieldPaths:
          - spec.path
        options:
          delimiter: /
          index: 1
  - source:
      kind: ConfigMap
      name: promotion-environment
      fieldPath: data.namespace
    targets:
      - select:
          group: batch
          version: v1
          kind: Job
          name: outbox-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=psql].env.[name=PGHOST].value
        options:
          delimiter: .
          index: 1
      - select:
          group: batch
          version: v1
          kind: Job
          name: shedlock-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=psql].env.[name=PGHOST].value
        options:
          delimiter: .
          index: 1
      - select:
          group: batch
          version: v1
          kind: Job
          name: post-deploy-db-grants
        fieldPaths:
          - spec.template.spec.containers.[name=db-grants].env.[name=PGHOST].value
        options:
          delimiter: .
          index: 1
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: allow-payu-namespaces-to-cnpg
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          labelSelector: payu.io/environment-selector=true
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
          - spec.egress.0.to.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
labels:
  - pairs:
      environment: sit
    includeSelectors: false
