apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # The AMQ Broker operator pods lack the `app.kubernetes.io/part-of: payu` label
  # `allow-intra-namespace` selects, so default-deny-all blocks their broker ports.
  - network-policy-ingress.yaml
namespace: payu-dev
