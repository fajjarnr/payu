apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay — ADR-0068 spec: min 3 max 10, cooldown 30s polling 15s, Vault TriggerAuthentication
# Namespaces: ScaledObjects + ExternalSecret in payu-prod, operator stays keda

resources:
  - ../../base

patches:
  - target:
      kind: ExternalSecret
      name: payu-kafka-credentials
    patch: |
      - op: replace
        path: /metadata/namespace
        value: payu-prod
  - target:
      kind: TriggerAuthentication
      name: payu-kafka-auth
    patch: |
      - op: replace
        path: /metadata/namespace
        value: payu-prod
  - target:
      kind: ScaledObject
      name: transaction-service-keda
    patch: |
      - op: replace
        path: /metadata/namespace
        value: payu-prod
      - op: replace
        path: /spec/triggers/0/metadata/bootstrapServers
        value: payu-kafka-kafka-bootstrap.payu-prod.svc:9092
      - op: replace
        path: /spec/triggers/1/metadata/serverAddress
        value: http://prometheus-operated.payu-prod.svc:9090
  - target:
      kind: ScaledObject
      name: wallet-service-keda
    patch: |
      - op: replace
        path: /metadata/namespace
        value: payu-prod
      - op: replace
        path: /spec/triggers/0/metadata/bootstrapServers
        value: payu-kafka-kafka-bootstrap.payu-prod.svc:9092
      - op: replace
        path: /spec/triggers/1/metadata/serverAddress
        value: http://prometheus-operated.payu-prod.svc:9090
  - target:
      kind: ScaledObject
      name: gateway-service-keda
    patch: |
      - op: replace
        path: /metadata/namespace
        value: payu-prod
      - op: replace
        path: /spec/triggers/0/metadata/serverAddress
        value: http://prometheus-operated.payu-prod.svc:9090
  - target:
      kind: ScaledObject
      name: va-simulator-keda
    patch: |
      - op: replace
        path: /metadata/namespace
        value: payu-prod
      - op: replace
        path: /spec/triggers/0/metadata/bootstrapServers
        value: payu-kafka-kafka-bootstrap.payu-prod.svc:9092
  - target:
      kind: ScaledObject
      name: biller-simulator-keda
    patch: |
      - op: replace
        path: /metadata/namespace
        value: payu-prod
      - op: replace
        path: /spec/triggers/0/metadata/bootstrapServers
        value: payu-kafka-kafka-bootstrap.payu-prod.svc:9092
