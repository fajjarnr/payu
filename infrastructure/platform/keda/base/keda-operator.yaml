# KEDA 2.14 operator — Helm install (cluster-wide)
# ponytail: minimal — one operator HA 2 replicas + PDB, no Knative
# Install: helm upgrade --install keda kedacore/keda --namespace keda --create-namespace --version 2.14.0 --set watchNamespace=""
# ArgoCD Helm alternative: track via infrastructure/platform/keda/base/kustomization.yaml helmCharts
apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-install-notes
  namespace: keda
  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/part-of: payu
data:
  install.sh: |
    #!/bin/sh
    set -e
    helm repo add kedacore https://kedacore.github.io/charts 2>/dev/null || true
    helm repo update
    helm upgrade --install keda kedacore/keda \
      --namespace keda --create-namespace \
      --version 2.14.0 \
      --set watchNamespace="" \
      --set replicaCount=2 \
      --set podDisruptionBudget.minAvailable=1 \
      --set resources.operator.limits.cpu=1000m \
      --set resources.operator.limits.memory=1000Mi \
      --set resources.operator.requests.cpu=100m \
      --set resources.operator.requests.memory=100Mi \
      --set metricsServer.enabled=true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keda-operator-pdb
  namespace: keda
  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/part-of: payu
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keda-operator
