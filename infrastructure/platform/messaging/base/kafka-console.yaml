# PayU Platform - AMQ Streams Console (Kafka UI)
# Web-based UI for managing Apache Kafka clusters
# Prerequisite: amq-streams-console operator subscription installed
# ============================================================

# KafkaUser for Console authentication (SASL/SCRAM)
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: payu-kafka-console-user
  labels:
    strimzi.io/cluster: payu-kafka
    app.kubernetes.io/part-of: payu
spec:
  authentication:
    type: scram-sha-512

---
# AMQ Streams Console instance
apiVersion: console.streamshub.github.com/v1alpha1
kind: Console
metadata:
  name: payu-kafka-console
  labels:
    app.kubernetes.io/name: payu-kafka-console
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: kafka-ui
spec:
  replicas: 1
  # OCP auto-generates route host: <svc>-<ns>.apps.<cluster-domain>
  hostname: payu-kafka-console-payu-dev.apps.payu.ocp.fajjjar.my.id
  metricsSources:
    - name: openshift-monitoring
      type: openshift-monitoring
  # OIDC auth via Keycloak payu realm. Reuses the existing payu-backend client
  # for now (its redirect-uris may need to be widened to include this console
  # URL via a KeycloakClient CRD or admin API — TODO: create dedicated
  # payu-kafka-console client).
  security:
    oidc:
      issuer: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
      authServerUrl: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
      clientId: payu-backend
      clientSecret:
        valueFrom:
          secretKeyRef:
            name: payu-kafka-console-oidc
            key: client-secret
      scopes: "openid profile email"
  kafkaClusters:
    - name: payu-kafka
      namespace: payu-dev
      metricsSource: openshift-monitoring
      # Strimzi Kafka 4.1's status.listeners is empty (operator doesn't auto-populate
      # the bootstrap URL in this version). Set explicit bootstrap.servers via
      # the properties field so the console can connect.
      properties:
        values:
          - name: bootstrap.servers
            value: payu-kafka-kafka-bootstrap:9092
      listener: plain
      credentials:
        kafkaUser:
          name: payu-kafka-console-user
