# PayU Platform - AMQ Streams Kafka Cluster (KRaft mode)
# Event streaming with persistent storage
# Prerequisite: amq-streams operator subscription installed
# --------------------------------------------------------

# KafkaNodePool - Controller nodes (KRaft metadata quorum)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: messaging
    strimzi.io/cluster: payu-kafka
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 10Gi
    class: gp3-csi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

---
# KafkaNodePool - Broker nodes (data handling) — READY-026/077 HA: 5 brokers
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: messaging
    strimzi.io/cluster: payu-kafka
spec:
  replicas: 5
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    class: gp3-csi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

---
# Main Kafka cluster (KRaft mode) — READY-026 HA: replication factor 3
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: payu-kafka
  labels:
    app.kubernetes.io/name: payu-kafka
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: "true"
  entityOperator:
    topicOperator: {}
    userOperator: {}

---
# KafkaTopic - account events
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: account-events
  labels:
    app.kubernetes.io/name: account-events
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: messaging
    strimzi.io/cluster: payu-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete

---
