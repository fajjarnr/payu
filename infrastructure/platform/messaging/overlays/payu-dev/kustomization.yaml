apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../base

patches:
  - target:
      group: console.streamshub.github.com
      version: v1alpha1
      kind: Console
      name: payu-kafka-console
    patch: |-
      $patch: delete
      apiVersion: console.streamshub.github.com/v1alpha1
      kind: Console
      metadata:
        name: payu-kafka-console
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaUser
      name: payu-kafka-console-user
    patch: |-
      $patch: delete
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaUser
      metadata:
        name: payu-kafka-console-user
  # Dev resource configuration: 3 brokers + 3 controllers (KRaft HA)
  - target:
      group: kafka.strimzi.io
      kind: KafkaNodePool
      name: broker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      group: kafka.strimzi.io
      kind: KafkaNodePool
      name: controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      group: kafka.strimzi.io
      kind: Kafka
      name: payu-kafka
    patch: |-
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 3
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 3
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 2
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 3
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 2
