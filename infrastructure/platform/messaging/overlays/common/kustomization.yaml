apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets.yaml
  - network-policy.yaml
patches:
  - path: ha-patch.yaml
  - path: kafka-security-patch.yaml
    target:
      group: kafka.strimzi.io
      version: v1
      kind: Kafka
      name: payu-kafka
