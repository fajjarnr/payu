apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - network-policy.yaml
patches:
  - path: ha-patch.yaml
# kafka-security-patch.yaml (TLS/SCRAM-only listener on 9093) is NOT applied:
# services and the console both consume plaintext :9092 and have no SCRAM
# credentials yet. In-namespace exposure is bounded by network-policy.yaml.
# Re-apply together with per-service TLS wiring (DEVSECOPS-017).
