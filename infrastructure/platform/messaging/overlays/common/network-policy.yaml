apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: allow-kafka-platform
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: network
    payu.io/environment-selector: "true"
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: payu-kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payu-environment
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-operators
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
  # KAFKA-QUORUM-001/KAFKA-UAT-001: fine-grained egress (notably the
  # namespaceSelector->openshift-dns :53 rule) blackholed DNS for
  # Strimzi pods on OVN-Kubernetes (pod-IP OK, ClusterIP FAIL) and
  # crashed brokers 25h+. OVN-K cannot enforce fine-grained egress
  # (L-188; precedents: allow-api-egress `- {}`, logging `- {}`,
  # wazuh Ingress-only). Ingress stays zero-trust; egress allow-all.
  egress:
    - {}
---
