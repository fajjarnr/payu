apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu
resources:
  - ../common
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: messaging-environment
    literals:
      - environment=prod
      - namespace=payu
      - consoleHostname=payu-kafka-console-payu.apps.payu.ocp.fajjjar.my.id
replacements:
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.environment
    targets:
      - select:
          group: secrets.hashicorp.com
          version: v1beta1
          kind: VaultStaticSecret
          name: payu-kafka-console-oidc
        fieldPaths:
          - spec.path
        options:
          delimiter: /
          index: 1
      - select:
          group: secrets.hashicorp.com
          version: v1beta1
          kind: VaultStaticSecret
          name: payu-broker-credentials
        fieldPaths:
          - spec.path
        options:
          delimiter: /
          index: 1
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.namespace
    targets:
      - select:
          group: console.streamshub.github.com
          version: v1alpha1
          kind: Console
          name: payu-kafka-console
        fieldPaths:
          - spec.kafkaClusters.0.namespace
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          labelSelector: payu.io/environment-selector=true
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
          - spec.egress.0.to.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.consoleHostname
    targets:
      - select:
          group: console.streamshub.github.com
          version: v1alpha1
          kind: Console
          name: payu-kafka-console
        fieldPaths:
          - spec.hostname
labels:
  - pairs:
      environment: prod
    includeSelectors: false
