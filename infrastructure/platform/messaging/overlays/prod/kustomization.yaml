apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu
resources:
  - ../common
  # Plain secret replaces the VaultStaticSecret pair from common
  # (external-secrets.yaml) until Vault/VSO ships (DEVSECOPS-017).
  - console-oidc-secret.yaml
patches:
  - target:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
      name: payu-kafka-console-oidc
    patch: |-
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: payu-kafka-console-oidc
      $patch: delete
  - target:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
      name: payu-broker-credentials
    patch: |-
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: payu-broker-credentials
      $patch: delete
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaNodePool
      name: "^(controller|broker)$"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/resources/requests/cpu
        value: 50m
  - target:
      group: broker.amq.io
      version: v1beta1
      kind: ActiveMQArtemis
      name: payu-broker
    patch: |-
      - op: replace
        path: /spec/deploymentPlan/size
        value: 1
      - op: replace
        path: /spec/deploymentPlan/resources/requests/cpu
        value: 50m
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: Kafka
      name: payu-kafka
    patch: |-
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 1
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 1
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaTopic
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: messaging-environment
    literals:
      - environment=prod
      - namespace=payu
      - consoleHostname=payu-kafka-console-payu.apps.payu.ocp.fajjjar.my.id
replacements:
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.environment
    targets:
      - select:
          group: secrets.hashicorp.com
          version: v1beta1
          kind: VaultStaticSecret
          name: payu-kafka-console-oidc
        fieldPaths:
          - spec.path
        options:
          delimiter: /
          index: 1
      - select:
          group: secrets.hashicorp.com
          version: v1beta1
          kind: VaultStaticSecret
          name: payu-broker-credentials
        fieldPaths:
          - spec.path
        options:
          delimiter: /
          index: 1
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.namespace
    targets:
      - select:
          group: console.streamshub.github.com
          version: v1alpha1
          kind: Console
          name: payu-kafka-console
        fieldPaths:
          - spec.kafkaClusters.0.namespace
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          labelSelector: payu.io/environment-selector=true
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
          - spec.egress.0.to.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.consoleHostname
    targets:
      - select:
          group: console.streamshub.github.com
          version: v1alpha1
          kind: Console
          name: payu-kafka-console
        fieldPaths:
          - spec.hostname
labels:
  - pairs:
      environment: prod
    includeSelectors: false
