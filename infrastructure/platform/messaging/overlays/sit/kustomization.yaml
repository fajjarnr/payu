apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-sit
resources:
  - ../common
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: messaging-environment
    literals:
      - environment=sit
      - namespace=payu-sit
      - secretStore=payu-vault-sit
      - consoleHostname=payu-kafka-console-payu-sit.apps.payu.ocp.fajjjar.my.id
replacements:
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.environment
    targets:
      - select:
          group: external-secrets.io
          version: v1
          kind: ExternalSecret
          name: payu-kafka-console-oidc
        fieldPaths:
          - spec.data.0.remoteRef.key
        options:
          delimiter: /
          index: 1
      - select:
          group: external-secrets.io
          version: v1
          kind: ExternalSecret
          name: payu-broker-credentials
        fieldPaths:
          - spec.dataFrom.0.extract.key
        options:
          delimiter: /
          index: 1
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.namespace
    targets:
      - select:
          group: console.streamshub.github.com
          version: v1alpha1
          kind: Console
          name: payu-kafka-console
        fieldPaths:
          - spec.kafkaClusters.0.namespace
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          labelSelector: payu.io/environment-selector=true
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
          - spec.egress.0.to.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.consoleHostname
    targets:
      - select:
          group: console.streamshub.github.com
          version: v1alpha1
          kind: Console
          name: payu-kafka-console
        fieldPaths:
          - spec.hostname
  - source:
      kind: ConfigMap
      name: messaging-environment
      fieldPath: data.secretStore
    targets:
      - select:
          group: external-secrets.io
          version: v1
          kind: ExternalSecret
          labelSelector: payu.io/vault-environment-path=true
        fieldPaths:
          - spec.secretStoreRef.name
labels:
  - pairs:
      environment: sit
    includeSelectors: false
