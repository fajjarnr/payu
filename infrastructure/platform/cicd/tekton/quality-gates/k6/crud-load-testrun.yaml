# PayU k6 Operator — CRUD Load TestRun (OPS-2026-04-08-02 follow-up)
# Full 40-minute run with 2 parallel runners.
# Addresses: OPS-2026-04-08-02 (re-run crud-stress-test after wallet cache fix)
#            OPS-2026-04-08-03 (isolate slow endpoints if p99 breaches 10s)
#
# Run: kubectl apply -f crud-load-testrun.yaml -n payu-k6
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: payu-crud-load
  namespace: payu-k6
  labels:
    app.kubernetes.io/part-of: payu-platform
    app.kubernetes.io/component: k6-performance
    test-type: load
    ops-ref: OPS-2026-04-08-02
spec:
  parallelism: 2
  script:
    configMap:
      name: k6-crud-load-test
      file: crud-load-test.js
  runner:
    serviceAccountName: k6-runner
    image: grafana/k6:latest
    env:
      - name: GATEWAY_URL
        value: "https://gateway-dev.payu.fajjjar.my.id"
      - name: KEYCLOAK_URL
        value: "https://sso.dev.payu.fajjjar.my.id"
      - name: GATEWAY_RATE_LIMIT_TEST_MODE
        value: "true"
    resources:
      requests:
        cpu: "1000m"
        memory: "512Mi"
      limits:
        cpu: "1500m"
        memory: "1Gi"
    volumeMounts:
      - name: lib-auth
        mountPath: /scripts/lib/auth.js
        subPath: auth.js
      - name: lib-wallet
        mountPath: /scripts/lib/wallet.js
        subPath: wallet.js
      - name: lib-card
        mountPath: /scripts/lib/card.js
        subPath: card.js
      - name: lib-transaction
        mountPath: /scripts/lib/transaction.js
        subPath: transaction.js
    volumes:
      - name: lib-auth
        configMap:
          name: k6-lib-auth
      - name: lib-wallet
        configMap:
          name: k6-lib-wallet
      - name: lib-card
        configMap:
          name: k6-lib-card
      - name: lib-transaction
        configMap:
          name: k6-lib-transaction
  separate: false
