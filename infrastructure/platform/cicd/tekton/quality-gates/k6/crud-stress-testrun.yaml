# PayU k6 Operator — CRUD Stress TestRun
# Distributed across 4 runner pods (parallelism=4), each running a shard.
# Total peak VUs: 1000 across 4 pods = 250 VUs/pod — matches existing stress stages.
#
# AUTOSCALING NOTE: This TestRun is designed to trigger the ClusterAutoscaler.
# At parallelism=4 with 1.5 CPU request per pod, 6 CPU are needed beyond current capacity,
# which causes MachineAutoscaler to provision 1-2 new r6a.4xlarge nodes (16 CPU each).
#
# Run: kubectl apply -f crud-stress-testrun.yaml -n payu-k6
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: payu-crud-stress
  namespace: payu-k6
  labels:
    app.kubernetes.io/part-of: payu-platform
    app.kubernetes.io/component: k6-performance
    test-type: stress
spec:
  # 4 parallel runner pods — distributes VUs across pods for true distributed load
  parallelism: 4
  script:
    configMap:
      name: k6-crud-stress-test
      file: crud-stress-test.js
  runner:
    serviceAccountName: k6-runner
    image: grafana/k6:latest
    env:
      - name: GATEWAY_URL
        value: "https://gateway-dev.payu.fajjjar.my.id"
      - name: KEYCLOAK_URL
        value: "https://sso.dev.payu.fajjjar.my.id"
      - name: GATEWAY_RATE_LIMIT_TEST_MODE
        value: "true"
      - name: K6_ENABLE_CARD_CRUD
        value: "1"
    resources:
      requests:
        # Sized to trigger autoscaling: 4 pods × 1.5 CPU = 6 CPU needed
        # Current 2 workers have ~28 CPU available; additional pods from PayU services
        # leave ~4-6 CPU free, so new nodes will be provisioned.
        cpu: "1500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    volumeMounts:
      - name: lib-auth
        mountPath: /scripts/lib/auth.js
        subPath: auth.js
      - name: lib-wallet
        mountPath: /scripts/lib/wallet.js
        subPath: wallet.js
      - name: lib-card
        mountPath: /scripts/lib/card.js
        subPath: card.js
      - name: lib-transaction
        mountPath: /scripts/lib/transaction.js
        subPath: transaction.js
    volumes:
      - name: lib-auth
        configMap:
          name: k6-lib-auth
      - name: lib-wallet
        configMap:
          name: k6-lib-wallet
      - name: lib-card
        configMap:
          name: k6-lib-card
      - name: lib-transaction
        configMap:
          name: k6-lib-transaction
  separate: false
