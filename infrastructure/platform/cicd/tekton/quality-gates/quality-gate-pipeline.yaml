apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-quality-gate-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: quality-gate
spec:
  description: |
    Quality gate pipeline for PayU services with security scanning
    and test coverage validation. Blocks deployment if criteria are not met.
    Fixed for OpenShift Pipelines 1.21+ (no ClusterTask — uses resolver: cluster).
  params:
    - name: service-name
      type: string
      description: Name of the service
    - name: service-type
      type: string
      description: Type of service
      default: spring-boot
    - name: min-coverage
      type: string
      description: Minimum code coverage percentage
      default: "80"
    - name: max-critical-vulns
      type: string
      description: Maximum allowed critical vulnerabilities
      default: "0"
    - name: max-high-vulns
      type: string
      description: Maximum allowed high vulnerabilities
      default: "3"
    - name: image-digest
      type: string
      description: Immutable sha256 digest of the image to scan
  workspaces:
    - name: source
      description: Workspace for source code
  tasks:
    - name: validate-coverage
      taskRef:
        name: maven-java21
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["spring-boot", "quarkus"]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: GOALS
          value:
            - -f
            - backend/pom.xml
            - -pl
            - $(params.service-name)
            - -am
            - jacoco:check

    - name: security-scan
      taskRef:
        name: trivy
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/payu-dev/$(params.service-name)@$(params.image-digest)
        - name: SEVERITY
          value: "CRITICAL,HIGH"
        - name: EXIT_CODE
          value: "1"

    - name: generate-quality-report
      runAfter:
        - validate-coverage
        - security-scan
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== Quality Gate Report ==="
            echo "Service: $(params.service-name)"
            echo "Type: $(params.service-type)"
            echo "Timestamp: $(date -Iseconds)"
            echo ""
            echo "Coverage: threshold=$(params.min-coverage)%"
            echo "Security: max_critical=$(params.max-critical-vulns), max_high=$(params.max-high-vulns), image_digest=$(params.image-digest)"
            echo ""
            echo "Quality Gate: PASSED"
