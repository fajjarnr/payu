apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: account-service-build-
  namespace: payu-cicd
  labels:
    app: payu
    service: account-service
    type: build
spec:
  pipelineRef:
    name: payu-build-pipeline
  params:
    - name: service-name
      value: account-service
    - name: git-url
      value: https://github.com/fajjarnr/payu.git
    - name: git-revision
      value: main
    - name: service-type
      value: spring-boot
    - name: registry-url
      value: image-registry.openshift-image-registry.svc:5000
    - name: registry-namespace
      value: payu-dev
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    - name: maven-settings
      emptyDir: {}
    - name: dockerconfig
      secret:
        secretName: dockerconfig
    - name: m2-cache
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: signing-secrets
      secret:
        secretName: signing-secrets
    - name: maven-settings
      secret:
        secretName: maven-settings

  timeout: 1h30m
