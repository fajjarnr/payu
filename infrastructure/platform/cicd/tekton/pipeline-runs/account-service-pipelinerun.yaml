apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: account-service-build-
  namespace: payu-cicd
  labels:
    app: payu
    service: account-service
    type: build
spec:
  pipelineRef:
    name: account-service-pipeline
  params:
    - name: service-name
      value: account-service
    - name: git-url
      value: https://github.com/fajjarnr/payu.git
    - name: git-revision
      value: main
    - name: image
      value: image-registry.openshift-image-registry.svc:5000/payu-dev/account-service
    - name: image-tag
      value: "1.18.74"
    - name: target-env
      value: "dev"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    - name: dockerconfig
      secret:
        secretName: dockerconfig
    - name: m2-cache
      # Shared gp3 PVC (serial builds): warm .m2 across runs. First run
      # still cold (~20m); subsequent runs reuse artifacts (~3-5m).
      persistentVolumeClaim:
        claimName: m2-cache-shared
    - name: signing-secrets
      secret:
        secretName: signing-secrets
    - name: git-ssh
      secret:
        secretName: git-ssh-credentials
    - name: maven-settings
      secret:
        secretName: maven-settings

