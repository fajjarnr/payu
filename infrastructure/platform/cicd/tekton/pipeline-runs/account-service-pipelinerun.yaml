apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: account-service-build-
  namespace: payu-cicd
  labels:
    app: payu
    service: account-service
    type: build
spec:
  pipelineRef:
    name: payu-build-pipeline
  params:
    - name: service-name
      value: account-service
    - name: git-url
      value: https://github.com/fajjarnr/payu.git
    - name: git-revision
      value: main
    - name: service-type
      value: spring-boot
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    - name: maven-settings
      emptyDir: {}
    - name: dockerconfig
      secret:
        secretName: redhat-registry-pull
