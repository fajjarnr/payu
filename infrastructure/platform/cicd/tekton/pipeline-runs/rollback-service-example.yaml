apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: account-service-rollback-
  namespace: payu-cicd
  labels:
    app: payu
    service: account-service
    type: rollback
spec:
  pipelineRef:
    name: payu-rollback-pipeline
  params:
    - name: service-name
      value: account-service
    - name: environment
      value: sit
    - name: image-digest
      value: sha256:fe3a614b276c8bcb7e16c766c20f29cef41c4ee00e09719ffa2bbdd3dc61bb1f
    - name: push-changes
      value: "false"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  timeout: 30m
