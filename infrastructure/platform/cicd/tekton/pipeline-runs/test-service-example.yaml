apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: account-service-test-
  namespace: payu-cicd
  labels:
    app: payu
    service: account-service
    type: test
spec:
  pipelineRef:
    name: payu-test-pipeline
  params:
    - name: service-name
      value: account-service
    - name: git-url
      value: https://github.com/fajjarnr/payu.git
    - name: git-revision
      value: main
    - name: service-type
      value: spring-boot
    - name: coverage-threshold
      value: "80"
    - name: run-integration-tests
      value: "true"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  timeout: 2h
