apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: account-service-deploy-sit-$(TIMESTAMP)
  namespace: payu-cicd
  labels:
    app: payu
    service: account-service
    type: deploy
    environment: sit
spec:
  pipelineRef:
    name: payu-deploy-pipeline
  params:
    - name: service-name
      value: account-service
    - name: environment
      value: sit
    - name: image-tag
      value: latest
    - name: namespace
      value: payu-sit
    - name: replicas
      value: "3"
    - name: deployment-strategy
      value: bluegreen
    - name: rollback-on-failure
      value: "true"
  workspaces:
    - name: manifest-dir
      persistentVolumeClaim:
        claimName: tekton-manifests-pvc
      subPath: manifests
  timeout: 45m
