apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: payu-vault
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
spec:
  address: https://vault.payu-vault.svc.cluster.local:8200
  caCertPath: /etc/pki/payu/service-ca.crt
  skipTLSVerify: false
  timeout: 15s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: payu-vault
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
spec:
  vaultConnectionRef: payu-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: payu-cicd
    serviceAccount: vault-secrets-operator
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: redhat-registry-pull
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/cicd/redhat-registry
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: redhat-registry-pull
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      templates:
        .dockerconfigjson:
          text: '{{ get .Secrets "dockerconfigjson" }}'
