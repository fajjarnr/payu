apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: grype-scan
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Scan an image or SBOM with Grype and fail on configured severity."
  params:
    - name: IMAGE
      type: string
      description: "Image reference to scan"
    - name: SBOM_PATH
      type: string
      description: "Optional SBOM path to scan instead of the image directly"
      default: ""
    - name: FAIL_ON
      type: string
      description: "Minimum severity that should fail the task"
      default: "critical"
  steps:
    - name: scan
      image: docker.io/anchore/grype:v0.82.0
      script: |
        #!/bin/sh
        set -eu

        target="$(params.IMAGE)"
        if [ -n "$(params.SBOM_PATH)" ] && [ -f "$(params.SBOM_PATH)" ]; then
          target="sbom:$(params.SBOM_PATH)"
        fi

        grype "$target" --fail-on "$(params.FAIL_ON)"