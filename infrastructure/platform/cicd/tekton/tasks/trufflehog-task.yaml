apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trufflehog
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Scan git history and workspace contents for secrets using TruffleHog."
  params:
    - name: CONTEXT_DIR
      type: string
      description: "Directory to scan when .git metadata is unavailable"
      default: "."
    - name: RESULTS
      type: string
      description: "TruffleHog result classes to fail on"
      default: "verified,unknown"
    - name: EXCLUDE_DETECTORS
      type: string
      description: "Explicit non-secret detectors covered by the Gitleaks gate"
      default: "JDBC,Postgres"
  workspaces:
    - name: source
      description: "Workspace containing the cloned repository"
  stepTemplate:
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  steps:
    - name: scan
      image: docker.io/trufflesecurity/trufflehog@sha256:214da7bcbf60f71db229bc5b6d790bf46eb1e8d068faa59838c1dba59738bc85
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        if [ -d "$(workspaces.source.path)/.git" ]; then
          trufflehog git "file://$(workspaces.source.path)" --results=$(params.RESULTS) --exclude-detectors=$(params.EXCLUDE_DETECTORS) --no-update --fail
        else
          trufflehog filesystem "$(workspaces.source.path)/$(params.CONTEXT_DIR)" --results=$(params.RESULTS) --exclude-detectors=$(params.EXCLUDE_DETECTORS) --no-update --fail
        fi
