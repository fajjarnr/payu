apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: k6-load-test
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Run a k6 workload as an automated performance gate."
  params:
    - name: SCRIPT_PATH
      type: string
      description: "Path to the k6 script relative to the repository root"
    - name: VUS
      type: string
      description: "Virtual users override (empty = use script's options)"
      default: ""
    - name: DURATION
      type: string
      description: "Test duration override (empty = use script's options)"
      default: ""
    - name: BASE_URL
      type: string
      description: "Base URL of the target environment"
      default: ""
  workspaces:
    - name: source
      description: "Workspace containing repository sources and test scripts"
  steps:
    - name: run
      image: docker.io/grafana/k6@sha256:8cd78f9d0de5f50bc8821cceecf356d5d9e839e6611c226a3fcf13c591080fbd
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
      env:
        - name: BASE_URL
          value: $(params.BASE_URL)
        - name: GATEWAY_URL
          value: $(params.BASE_URL)
      script: |
        #!/bin/sh
        set -eu

        SCRIPT="$(workspaces.source.path)/$(params.SCRIPT_PATH)"
        if [ ! -f "$SCRIPT" ]; then
          echo "[✗] k6 script not found: $SCRIPT"
          exit 1
        fi

        # ponytail: wait 60s for service readiness before load (avoids connection refused during rolling update)
        echo "[*] waiting for $BASE_URL readiness (max 60s)"
        for i in $(seq 1 12); do
          if curl -sf "$BASE_URL/actuator/health/liveness" >/dev/null 2>&1 || curl -sf "$BASE_URL/q/health/live" >/dev/null 2>&1 || curl -sf "$BASE_URL/health" >/dev/null 2>&1 || curl -sf "$BASE_URL/api/health" >/dev/null 2>&1; then
            echo "[✓] service ready after $((i*5))s"
            break
          fi
          echo "[*] attempt $i/12 not ready, sleep 5s"
          sleep 5
        done

        # ponytail: only add --vus/--duration when param non-empty, otherwise script's own options win (Context7 grafana_k6: CLI overrides script)
        K6_ARGS=""
        if [ -n "$(params.VUS)" ]; then K6_ARGS="$K6_ARGS --vus $(params.VUS)"; fi
        if [ -n "$(params.DURATION)" ]; then K6_ARGS="$K6_ARGS --duration $(params.DURATION)"; fi
        echo "[*] k6 run $K6_ARGS $SCRIPT"
        # shellcheck disable=SC2086
        k6 run $K6_ARGS "$SCRIPT"
