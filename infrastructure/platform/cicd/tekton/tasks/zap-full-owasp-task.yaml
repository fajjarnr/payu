# OWASP Web + API Top 10 Test Suite Expansion
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zap-full-owasp-suite
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Run extended OWASP ZAP scan covering Web Top 10 2025 + API Security Top 10 2023"
  params:
    - name: TARGET_URL
      type: string
    - name: API_SPEC_URL
      type: string
      default: ""
    - name: SCAN_TYPE
      type: string
      default: "baseline"
  workspaces:
    - name: source
  steps:
    - name: zap-web-scan
      image: ghcr.io/zaproxy/zaproxy:stable
      script: |
        #!/bin/sh
        set -eu
        REPORT_DIR="$(workspaces.source.path)/reports"
        mkdir -p "$REPORT_DIR"
        if [ "$(params.SCAN_TYPE)" = "full" ]; then
          zap-full-scan.py -t "$(params.TARGET_URL)" -J "$REPORT_DIR/zap-full.json" -r "$REPORT_DIR/zap-full.html" -I
        else
          zap-baseline.py -t "$(params.TARGET_URL)" -J "$REPORT_DIR/zap-baseline.json" -r "$REPORT_DIR/zap-baseline.html" -I
        fi
    - name: zap-api-scan
      image: ghcr.io/zaproxy/zaproxy:stable
      when:
        - input: "$(params.API_SPEC_URL)"
          operator: notin
          values: [""]
      script: |
        #!/bin/sh
        set -eu
        REPORT_DIR="$(workspaces.source.path)/reports"
        mkdir -p "$REPORT_DIR"
        zap-api-scan.py -t "$(params.API_SPEC_URL)" -f openapi -J "$REPORT_DIR/zap-api.json" -r "$REPORT_DIR/zap-api.html" -I
