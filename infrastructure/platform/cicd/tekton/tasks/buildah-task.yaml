apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Build and push container images using Buildah (rootless)"
  params:
    - name: IMAGE
      type: string
      description: "Full image reference (registry/namespace/name:tag)"
    - name: CONTAINERFILE
      type: string
      description: Path to Containerfile
      default: "./Containerfile"
    - name: CONTEXT
      type: string
      description: Build context directory
      default: "."
    - name: BUILD_ARGS
      type: array
      description: Additional build arguments
      default: []
    - name: TLSVERIFY
      type: string
      description: Verify TLS when pushing
      default: "true"
  workspaces:
    - name: source
      description: Source code workspace
    - name: dockerconfig
      description: Docker registry credentials
      optional: true
  results:
    - name: IMAGE_DIGEST
      description: SHA digest of the built image
    - name: IMAGE_URL
      description: Full URL of the pushed image
  steps:
    - name: build-and-push
      image: "registry.redhat.io/rhel9/buildah:9.4"
      workingDir: $(workspaces.source.path)
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      script: |
        #!/bin/bash
        set -euo pipefail

        image_registry="$(params.IMAGE)"
        image_registry="${image_registry%%/*}"

        # Internal OpenShift registry auth is derived from the PipelineRun service account
        # token so pushes keep working even if a static dockerconfig secret goes stale.
        if [[ "$image_registry" == *"openshift-image-registry"* ]] && [[ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]]; then
          token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          auth=$(printf 'unused:%s' "$token" | base64 -w0)

          cat > /tmp/internal-registry-auth.json <<EOF
        {"auths":{"$image_registry":{"auth":"$auth"}}}
        EOF

          export REGISTRY_AUTH_FILE=/tmp/internal-registry-auth.json
        elif [[ -d "$(workspaces.dockerconfig.path)" && -f "$(workspaces.dockerconfig.path)/.dockerconfigjson" ]]; then
          export REGISTRY_AUTH_FILE="$(workspaces.dockerconfig.path)/.dockerconfigjson"
        fi

        echo "[*] Building image: $(params.IMAGE)"
        buildah build \
          --storage-driver=vfs \
          --format=oci \
          --tls-verify=$(params.TLSVERIFY) \
          -f $(params.CONTAINERFILE) \
          -t $(params.IMAGE) \
          $(params.CONTEXT)

        echo "[*] Pushing image: $(params.IMAGE)"
        buildah push \
          --storage-driver=vfs \
          --tls-verify=$(params.TLSVERIFY) \
          --digestfile /tmp/image-digest \
          $(params.IMAGE)

        DIGEST=$(cat /tmp/image-digest)
        echo -n "$DIGEST" | tee $(results.IMAGE_DIGEST.path)
        echo -n "$(params.IMAGE)@$DIGEST" | tee $(results.IMAGE_URL.path)

        echo ""
        echo "[✓] Image pushed: $(params.IMAGE)@$DIGEST"
      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers
  volumes:
    - name: varlibcontainers
      emptyDir: {}
