apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: security-scan
  namespace: payu-cicd
  labels:
    app: payu-ci-cd
spec:
  description: >-
    Comprehensive security scanning task that includes:
    - SpotBugs (SAST) for Java code
    - Security unit tests
  workspaces:
    - name: source
      description: Source code workspace
    - name: maven-settings
      description: Maven settings configuration
      optional: true

  params:
    - name: CONTEXT_DIR
      description: Context directory within source
      type: string
      default: "."

    - name: MAVEN_POM
      description: Reactor POM path within source
      type: string
      default: "backend/pom.xml"

    - name: MODULE
      description: Maven reactor module to scan
      type: string

    - name: MAVEN_IMAGE
      description: Maven image to use
      type: string
      default: "registry.redhat.io/ubi9/openjdk-25@sha256:f35678fbb52016a6b61ea586ee4413e616a300cdf0969bf0bfc5b7c6791033d6"

    - name: FAILURE_THRESHOLD
      description: Security issue threshold for failing the build
      type: string
      default: "high"

  results:
    - name: security-report-path
      description: Path to security scan report
    - name: high-severity-count
      description: Number of high severity issues found
    - name: medium-severity-count
      description: Number of medium severity issues found

  stepTemplate:
    env:
      - name: HOME
        value: /tekton/home
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

  steps:
    - name: spotbugs-sast
      image: $(params.MAVEN_IMAGE)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -euo pipefail

        echo "Running SpotBugs SAST scan..."

        # Copy Maven settings if provided
        if [ -f "$(workspaces.maven-settings.path)/settings.xml" ]; then
          mkdir -p ~/.m2
          cp $(workspaces.maven-settings.path)/settings.xml ~/.m2/
        fi

        # Install reactor dependencies first; direct plugin goals do not run a
        # lifecycle phase that makes upstream SNAPSHOT artifacts resolvable.
        mvn -f "$(params.MAVEN_POM)" -pl "$(params.MODULE)" -am install \
          -DskipTests

        # Missing plugin/configuration is a build failure, not a bypass.
        case "$(params.FAILURE_THRESHOLD)" in
          high) SPOTBUGS_THRESHOLD=High ;;
          medium) SPOTBUGS_THRESHOLD=Medium ;;
          *) echo "FAIL: unsupported FAILURE_THRESHOLD=$(params.FAILURE_THRESHOLD)"; exit 1 ;;
        esac
        mvn -f "$(params.CONTEXT_DIR)/pom.xml" \
          com.github.spotbugs:spotbugs-maven-plugin:4.10.3.0:check \
          -Dspotbugs.effort=Max \
          -Dspotbugs.threshold="$SPOTBUGS_THRESHOLD" \
          -Dspotbugs.failOnError=true \
          -Dspotbugs.includeFilterFile=$(workspaces.source.path)/scripts/security/spotbugs-filter.xml

        # Copy report to output
        mkdir -p $(workspaces.source.path)/reports
        test -f "$(params.CONTEXT_DIR)/target/spotbugsXml.xml"
        cp "$(params.CONTEXT_DIR)/target/spotbugsXml.xml" \
          "$(workspaces.source.path)/reports/spotbugsXml.xml"

        echo "SpotBugs scan completed"
        echo -n "$(workspaces.source.path)/reports/spotbugsXml.xml" > $(results.security-report-path.path)

    - name: security-unit-tests
      image: $(params.MAVEN_IMAGE)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -euo pipefail

        echo "Running security-focused unit tests..."

        mvn -f "$(params.CONTEXT_DIR)/pom.xml" test \
          -Dsecurity-tests=true

        echo "Security tests completed"

    - name: aggregate-results
      image: registry.redhat.io/ubi9/ubi-minimal@sha256:34880b64c07f28f64d95737f82f891516de9a3b43583f39970f7bf8e4cfa48b7
      script: |
        #!/bin/sh
        set -eu

        REPORTS_DIR="$(workspaces.source.path)/reports"

        echo "Aggregating security scan results..."

        # Count high severity issues
        HIGH_COUNT=0
        MEDIUM_COUNT=0

        if [ -f "$REPORTS_DIR/spotbugsXml.xml" ]; then
          HIGH_COUNT=$(grep -o "priority='1'" "$REPORTS_DIR/spotbugsXml.xml" | wc -l)
          MEDIUM_COUNT=$(grep -o "priority='2'" "$REPORTS_DIR/spotbugsXml.xml" | wc -l)
        fi

        echo -n "$HIGH_COUNT" > $(results.high-severity-count.path)
        echo -n "$MEDIUM_COUNT" > $(results.medium-severity-count.path)

        echo "Security Scan Results:"
        echo "  High Severity: $HIGH_COUNT"
        echo "  Medium Severity: $MEDIUM_COUNT"
        echo "  Report: $(cat $(results.security-report-path.path))"

        case "$(params.FAILURE_THRESHOLD)" in
          high)
            [ "$HIGH_COUNT" -eq 0 ] || exit 1
            ;;
          medium)
            [ "$HIGH_COUNT" -eq 0 ] && [ "$MEDIUM_COUNT" -eq 0 ] || exit 1
            ;;
          *)
            echo "FAIL: unsupported FAILURE_THRESHOLD=$(params.FAILURE_THRESHOLD)"
            exit 1
            ;;
        esac

        echo "SUCCESS: Security scan passed threshold"
