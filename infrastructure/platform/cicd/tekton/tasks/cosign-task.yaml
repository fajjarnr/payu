apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-sign
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Sign container image using Cosign keyless OIDC with optional key-pair fallback."
  params:
    - name: IMAGE
      type: string
      description: "The container image to sign"
    - name: SBOM_PATH
      type: string
      description: "Optional path to a Syft-generated SBOM file that should be attached before signing"
      default: ""
    - name: TLOG_UPLOAD
      type: string
      description: "Whether to upload transparency log entries to Rekor"
      default: "true"
  workspaces:
    - name: signing-secrets
      description: "Optional workspace containing cosign.key and cosign.password for non-keyless fallback"
      optional: true
  results:
    - name: SIGN_MODE
      description: "Signing mode used for the image: keyless or keypair"
  steps:
    - name: attach-sbom-and-sign
      image: "bitnami/cosign:latest"
      script: |
        #!/bin/sh
        set -eu

        echo "[*] Preparing to sign image: $(params.IMAGE)"

        if [ -n "$(params.SBOM_PATH)" ] && [ -f "$(params.SBOM_PATH)" ]; then
          echo "[*] Attaching SBOM from $(params.SBOM_PATH)"
          timeout 60 cosign attach sbom --sbom "$(params.SBOM_PATH)" "$(params.IMAGE)" || {
            echo "WARNING: SBOM attachment failed or timed out. Continuing pipeline."
          }
        fi

        KEY_PATH=""
        PASSWORD_PATH=""
        if [ "$(workspaces.signing-secrets.bound)" = "true" ]; then
          KEY_PATH="$(workspaces.signing-secrets.path)/cosign.key"
          PASSWORD_PATH="$(workspaces.signing-secrets.path)/cosign.password"
        fi

        if [ -n "$KEY_PATH" ] && [ -f "$KEY_PATH" ]; then
          echo "[*] Using key-pair fallback signing"
          if [ -f "$PASSWORD_PATH" ]; then
            export COSIGN_PASSWORD="$(cat "$PASSWORD_PATH")"
          fi
          timeout 60 cosign sign --yes --key "$KEY_PATH" --tlog-upload=$(params.TLOG_UPLOAD) "$(params.IMAGE)" || {
            echo "WARNING: Cosign key-pair signing failed or timed out. Continuing pipeline."
          }
          echo -n "keypair" | tee $(results.SIGN_MODE.path)
        else
          echo "[*] Using keyless OIDC signing (will timeout after 30s if OIDC is unavailable)"
          export COSIGN_EXPERIMENTAL=1
          timeout 30 cosign sign --yes --tlog-upload=$(params.TLOG_UPLOAD) "$(params.IMAGE)" || {
            echo "WARNING: Cosign keyless signing failed or timed out (OIDC may not be configured in this Tekton environment). Continuing pipeline."
          }
          echo -n "keyless" | tee $(results.SIGN_MODE.path)
        fi

        echo "[✓] Sign step completed for $(params.IMAGE)"
