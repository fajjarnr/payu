apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pytest
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Run Python pytest tests for PayU Python services (analytics, kyc)"
  params:
    - name: TEST_DIR
      type: string
      description: "Directory containing tests"
      default: "."
    - name: PYTHON_IMAGE
      type: string
      description: "Python image to use"
      default: "registry.redhat.io/ubi9/python-311@sha256:a0bdb55576fc5b8d6704279307817828ef027e1065533ceba133fe9516003a6c"
  workspaces:
    - name: source
      description: Source code workspace
  results:
    - name: TEST_RESULT
      description: PASS or FAIL
    - name: TESTS_RUN
      description: Number of tests run
  steps:
    - name: run-tests
      image: $(params.PYTHON_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.TEST_DIR)
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      script: |
        #!/bin/bash
        set -euo pipefail
        if [[ -f requirements.txt ]]; then
          python -m pip install -r requirements.txt
        fi
        python -m pip install pytest pytest-html

        echo "[*] Running pytest in $(params.TEST_DIR)"
        export PYTHONPATH=.:src:${PYTHONPATH:-}
        set +e
        python -m pytest -v --tb=short \
          --junitxml=/tmp/test-results.xml \
          --html=/tmp/test-report.html \
          --self-contained-html \
          2>&1 | tee /tmp/pytest-output.txt
        RESULT=${PIPESTATUS[0]}
        set -e
        TESTS=$(awk 'match($0, /[0-9]+ passed/) { value=substr($0, RSTART, RLENGTH); sub(/ passed/, "", value); count=value } END { print count+0 }' /tmp/pytest-output.txt)

        printf '%s' "$TESTS" | tee "$(results.TESTS_RUN.path)"

        if [[ $RESULT -eq 0 ]]; then
          printf 'PASS' | tee "$(results.TEST_RESULT.path)"
        else
          printf 'FAIL' | tee "$(results.TEST_RESULT.path)"
          echo "[!] pytest failed (non-blocking in dev)"
        fi
