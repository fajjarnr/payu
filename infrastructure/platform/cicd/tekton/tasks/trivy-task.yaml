apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Scan container images for vulnerabilities using Trivy"
  params:
    - name: IMAGE
      type: string
      description: "Image to scan"
    - name: SEVERITY
      type: string
      description: "Severity levels to check"
      default: "CRITICAL,HIGH"
    - name: EXIT_CODE
      type: string
      description: "Exit code when vulnerabilities found (0=warn, 1=fail)"
      default: "1"
  workspaces:
    - name: output
      description: Workspace for scan reports
      optional: true
    - name: dockerconfig
      description: Docker registry credentials
      optional: true
  results:
    - name: VULN_COUNT
      description: Number of vulnerabilities found
    - name: SCAN_RESULT
      description: PASS or FAIL
  stepTemplate:
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  steps:
    - name: scan
      image: "aquasec/trivy:0.58.0"
      env:
        - name: HOME
          value: /tmp
        - name: TRIVY_CACHE_DIR
          value: /tmp/trivy
      command:
        - /bin/sh
      args:
        - -ceu
        - |
          echo "[*] Scanning image: $(params.IMAGE)"
          echo "[*] Severity filter: $(params.SEVERITY)"

          mkdir -p "$HOME/.docker" "$TRIVY_CACHE_DIR"

          if [ -f "$(workspaces.dockerconfig.path)/.dockerconfigjson" ]; then
            cp "$(workspaces.dockerconfig.path)/.dockerconfigjson" "$HOME/.docker/config.json"
          fi

          trivy image \
            --severity $(params.SEVERITY) \
            --exit-code 0 \
            --format json \
            --output /tmp/trivy-report.json \
            $(params.IMAGE) 2>/dev/null || true

          if [ -f /tmp/trivy-report.json ]; then
            VULN_COUNT=$(grep -o '"VulnerabilityID"' /tmp/trivy-report.json | wc -l || echo "0")
          else
            VULN_COUNT=0
          fi
          echo -n "$VULN_COUNT" | tee $(results.VULN_COUNT.path)

          set +e
          trivy image \
            --severity $(params.SEVERITY) \
            --exit-code $(params.EXIT_CODE) \
            $(params.IMAGE)
          RESULT=$?
          set -e

          if [ $RESULT -eq 0 ]; then
            echo -n "PASS" | tee $(results.SCAN_RESULT.path)
            echo "[✓] No $(params.SEVERITY) vulnerabilities found"
          else
            echo -n "FAIL" | tee $(results.SCAN_RESULT.path)
            echo "[✗] Found $VULN_COUNT vulnerabilities at $(params.SEVERITY) level"
            exit $(params.EXIT_CODE)
          fi
