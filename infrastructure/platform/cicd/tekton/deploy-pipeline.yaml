apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-deploy-gitops-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: deploy-gitops
spec:
  description: |
    Enterprise GitOps Deployment Pipeline compliant with PayU DevSecOps PRD.
    Replaces imperative 'oc apply' with declarative Kustomize Git write-back.
    Mandatory gates per environment:
    - SIT: Argo sync wait → ZAP baseline → LitmusChaos
    - UAT: Argo sync wait → Schemathesis → k6
    - PREPROD: Argo sync wait → Cerberus + Kraken
  params:
    - name: service-name
      type: string
      description: Name of the service to deploy
    - name: environment
      type: string
      description: Target environment (sit, uat, preprod, prod)
      default: sit
    - name: image-tag
      type: string
      description: Image tag to promote
      default: ""
    - name: image-digest
      type: string
      description: Optional immutable image digest (sha256:...) used instead of image-tag
      default: ""
    - name: registry-url
      type: string
      default: image-registry.openshift-image-registry.svc:5000
    - name: registry-namespace
      type: string
      description: Registry namespace containing the image to promote
      default: payu-dev
    - name: infra-repo-url
      type: string
      description: GitOps repository URL
      default: "https://github.com/fajjarnr/payu.git"
    - name: git-revision
      type: string
      description: Git revision to update and optionally push
      default: main
    - name: push-changes
      type: string
      description: Whether the pipeline should push the Git write-back commit
      default: "false"
    - name: environment-base-url
      type: string
      description: Base URL of the deployed environment, used by DAST/fuzzing tasks
      default: ""
    - name: schema-url
      type: string
      description: OpenAPI schema URL for Schemathesis in UAT
      default: ""
    - name: k6-script-path
      type: string
      description: Repository-relative k6 script path for UAT load testing
      default: tests/performance/k6/crud-load-test.js
  workspaces:
    - name: source
      description: Workspace to hold the cloned infrastructure git repository
  tasks:
    # ── Step 1: Clone Infrastructure (GitOps) Repository ──
    - name: fetch-infra-repo
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: source
      params:
        - name: URL
          value: $(params.infra-repo-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: DELETE_EXISTING
          value: "true"

    # ── Step 2: OpenShift GitOps / Kustomize Write-Back ──
    - name: gitops-writeback
      runAfter:
        - fetch-infra-repo
      workspaces:
        - name: source
          workspace: source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            #!/bin/sh
            set -e
            echo "[*] Updating Kustomize image overlay for $(params.service-name) in environment $(params.environment)"
            
            cd $(workspaces.source.path)
            TARGET_DIR="infrastructure/workloads/overlays/$(params.environment)"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "[✗] Overlay directory $TARGET_DIR not found!"
              exit 1
            fi
            
            if [ -z "$(params.image-tag)" ] && [ -z "$(params.image-digest)" ]; then
              echo "[✗] Either image-tag or image-digest must be provided"
              exit 1
            fi

            cd $TARGET_DIR
            IMAGE_NAME="$(params.registry-url)/$(params.registry-namespace)/$(params.service-name)"
            if [ -n "$(params.image-digest)" ]; then
              IMAGE_REF="${IMAGE_NAME}@$(params.image-digest)"
            else
              IMAGE_REF="${IMAGE_NAME}:$(params.image-tag)"
            fi

            kustomize edit set image "${IMAGE_NAME}=${IMAGE_REF}"
            
            # Commit and push changes
            git config --global user.email "gitops-bot@payu.internal"
            git config --global user.name "Tekton GitOps Bot"
            git add kustomization.yaml
            git commit -m "chore(gitops): promote $(params.service-name) to ${IMAGE_REF} in $(params.environment)" || echo "No changes to commit"

            if [ "$(params.push-changes)" = "true" ]; then
              git push origin HEAD:$(params.git-revision)
              echo "[✓] GitOps write-back pushed to $(params.git-revision)"
            else
              echo "[*] push-changes=false, commit retained locally in workspace only"
            fi

    # ── Step 3: ArgoCD Sync Wait ──
    - name: argocd-sync-wait
      runAfter:
        - gitops-writeback
      taskRef:
        name: argocd-sync-wait
      params:
        - name: APPLICATION_NAME
          value: "payu-$(params.environment)"
        - name: NAMESPACE
          value: openshift-gitops

    # ── Step 4A: Security Gate (SIT) - DAST & App Chaos ──
    - name: sit-zap-baseline
      runAfter:
        - argocd-sync-wait
      when:
        - input: "$(params.environment)"
          operator: in
          values: ["sit"]
      taskRef:
        name: zap-baseline
      workspaces:
        - name: source
          workspace: source
      params:
        - name: TARGET_URL
          value: $(params.environment-base-url)

    - name: sit-litmus-gate
      runAfter:
        - sit-zap-baseline
      when:
        - input: "$(params.environment)"
          operator: in
          values: ["sit"]
      taskRef:
        name: litmus-chaos-gate
      workspaces:
        - name: source
          workspace: source

    # ── Step 4B: Security Gate (UAT) - API Fuzzing ──
    - name: uat-schemathesis
      runAfter:
        - argocd-sync-wait
      when:
        - input: "$(params.environment)"
          operator: in
          values: ["uat"]
      taskRef:
        name: schemathesis-scan
      workspaces:
        - name: source
          workspace: source
      params:
        - name: SCHEMA_URL
          value: $(params.schema-url)
        - name: BASE_URL
          value: $(params.environment-base-url)

    - name: uat-k6-load-test
      runAfter:
        - uat-schemathesis
      when:
        - input: "$(params.environment)"
          operator: in
          values: ["uat"]
      taskRef:
        name: k6-load-test
      workspaces:
        - name: source
          workspace: source
      params:
        - name: SCRIPT_PATH
          value: $(params.k6-script-path)
        - name: VUS
          value: "50"
        - name: DURATION
          value: "5m"

    # ── Step 4C: Security Gate (PREPROD) - Infra Chaos ──
    - name: preprod-kraken-gate
      runAfter:
        - argocd-sync-wait
      when:
        - input: "$(params.environment)"
          operator: in
          values: ["preprod"]
      taskRef:
        name: kraken-chaos-gate
      workspaces:
        - name: source
          workspace: source

    # ── Step 5: k6 Smoke Test Gate (SIT/UAT) ──
    - name: k6-smoke-test-gate
      runAfter:
        - argocd-sync-wait
      when:
        - input: "$(params.environment)"
          operator: in
          values: ["sit", "uat"]
      taskRef:
        name: k6-load-test
      workspaces:
        - name: source
          workspace: source
      params:
        - name: SCRIPT_PATH
          value: infrastructure/platform/cicd/tekton/k6-scripts/payu-smoke-test.js
        - name: VUS
          value: "10"
        - name: DURATION
          value: "1m"
        - name: BASE_URL
          value: $(params.environment-base-url)

    # ── Step 6: Notify Success ──
    - name: notify-success
      runAfter:
        - k6-smoke-test-gate
        - sit-litmus-gate
        - uat-k6-load-test
        - preprod-kraken-gate
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            #!/bin/sh
            echo "[✓] Deployment pipeline completed successfully"
            echo "Service: $(params.service-name)"
            echo "Environment: $(params.environment)"
