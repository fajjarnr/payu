apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-sign
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Sign container images with a required key pair supplied through a Secret workspace."
  params:
    - name: IMAGE
      type: string
      description: "The container image to sign"
    - name: SBOM_PATH
      type: string
      description: "Required path to the Syft-generated SBOM file attached before signing"
    - name: TLOG_UPLOAD
      type: string
      description: "Whether to upload transparency log entries to Rekor"
      default: "true"
  workspaces:
    - name: source
      description: "Shared source workspace containing the generated SBOM"
    - name: signing-secrets
      description: "Workspace containing cosign.key and cosign.password"
  results:
    - name: SIGN_MODE
      description: "Signing mode used for the image"
  steps:
    - name: attach-sbom-and-sign
      # ponytail: pinned to RHTAS 1.2.0 (cosign v2) - v3 referrers-fallback index PUT is rejected by
      # the OpenShift internal registry (Image dockerImageManifests requires arch/os); see LESSONS.md
      image: "registry.redhat.io/rhtas/cosign-rhel9@sha256:cb53dcc3bc912dd7f12147f33af1b435eae5ff4ab83b85c0277b4004b20a0248"
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "[*] Preparing to sign image: $(params.IMAGE)"

        test -s "$(params.SBOM_PATH)"
        KEY_PATH="$(workspaces.signing-secrets.path)/cosign.key"
        PASSWORD_PATH="$(workspaces.signing-secrets.path)/cosign.password"
        test -s "$KEY_PATH"
        # ponytail: empty-password keypair (lab) - tolerate missing/empty password file
        if [ -s "$PASSWORD_PATH" ]; then
          export COSIGN_PASSWORD="$(cat "$PASSWORD_PATH")"
        else
          export COSIGN_PASSWORD=""
        fi

        echo "[*] Attesting CycloneDX SBOM from $(params.SBOM_PATH)"
        timeout 300 cosign attest --yes --key "$KEY_PATH" --predicate "$(params.SBOM_PATH)" --type cyclonedx "$(params.IMAGE)"

        echo "[*] Signing with required key pair"
        timeout 300 cosign sign --yes --key "$KEY_PATH" --tlog-upload=$(params.TLOG_UPLOAD) --registry-referrers-mode legacy "$(params.IMAGE)"
        echo -n "keypair" | tee $(results.SIGN_MODE.path)

        echo "[✓] Sign step completed for $(params.IMAGE)"
