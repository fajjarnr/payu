apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zap-baseline
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: tekton-catalog
    payu.io/catalog-version: v1
spec:
  description: "Run an OWASP ZAP baseline scan against a deployed environment."
  params:
    - name: TARGET_URL
      type: string
      description: "Base URL to scan"
  workspaces:
    - name: source
      description: "Workspace used to persist reports"
  volumes:
    - name: zap-wrk
      emptyDir: {}
  steps:
    - name: scan
      image: ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
      volumeMounts:
        - name: zap-wrk
          mountPath: /zap/wrk
      script: |
        #!/bin/sh
        set -eu

        REPORT_DIR="$(workspaces.source.path)/reports"
        mkdir -p "$REPORT_DIR"

        # ponytail: readiness wait 120s — avoids Connection refused when service still starting (startup 100s)
        echo "[*] waiting for $(params.TARGET_URL) readiness (max 120s)"
        for i in $(seq 1 24); do
          if curl -sf --max-time 3 "$(params.TARGET_URL)/actuator/health/liveness" >/dev/null 2>&1 || curl -sf --max-time 3 "$(params.TARGET_URL)/q/health/live" >/dev/null 2>&1 || curl -sf --max-time 3 "$(params.TARGET_URL)/health" >/dev/null 2>&1 || curl -sf --max-time 3 "$(params.TARGET_URL)/api/health" >/dev/null 2>&1; then
            echo "[✓] service ready after $((i*5))s"
            break
          fi
          echo "[*] attempt $i/24 not ready, sleep 5s"
          sleep 5
          if [ "$i" = "24" ]; then
            echo "[⚠️] service not ready after 120s, proceeding with ZAP scan anyway"
          fi
        done

        set +e
        zap-baseline.py -t "$(params.TARGET_URL)" -J zap-baseline.json -r zap-baseline.html -I
        STATUS=$?
        if [ $STATUS -ne 0 ]; then
          echo "[⚠️] ZAP found $STATUS issues (dev non-blocking)"
        fi
        # preserve reports even when ZAP returns non-zero; /zap/wrk is emptyDir mount
        if [ -f /zap/wrk/zap-baseline.json ]; then
          cp /zap/wrk/zap-baseline.json "$REPORT_DIR/" 2>/dev/null || true
        fi
        if [ -f /zap/wrk/zap-baseline.html ]; then
          cp /zap/wrk/zap-baseline.html "$REPORT_DIR/" 2>/dev/null || true
        fi
        echo "[✓] ZAP baseline scan complete"
        exit 0
