apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: k6-load-test
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "Run a k6 workload as an automated performance gate."
  params:
    - name: SCRIPT_PATH
      type: string
      description: "Path to the k6 script relative to the repository root"
    - name: VUS
      type: string
      description: "Virtual users override"
      default: "20"
    - name: DURATION
      type: string
      description: "Test duration override"
      default: "2m"
    - name: BASE_URL
      type: string
      description: "Base URL of the target environment"
      default: ""
  workspaces:
    - name: source
      description: "Workspace containing repository sources and test scripts"
  steps:
    - name: run
      image: docker.io/grafana/k6@sha256:8cd78f9d0de5f50bc8821cceecf356d5d9e839e6611c226a3fcf13c591080fbd
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
      env:
        - name: BASE_URL
          value: $(params.BASE_URL)
        - name: GATEWAY_URL
          value: $(params.BASE_URL)
      script: |
        #!/bin/sh
        set -eu

        SCRIPT="$(workspaces.source.path)/$(params.SCRIPT_PATH)"
        if [ ! -f "$SCRIPT" ]; then
          echo "[✗] k6 script not found: $SCRIPT"
          exit 1
        fi

        # ponytail: wait 120s for service readiness before load (106s startup; dev non-blocking via warn, prod blocking via strict profile)
        echo "[*] waiting for $BASE_URL readiness (max 120s)"
        for i in $(seq 1 24); do
          if curl -sf "$BASE_URL/actuator/health/liveness" >/dev/null 2>&1 || curl -sf "$BASE_URL/q/health/live" >/dev/null 2>&1 || curl -sf "$BASE_URL/health" >/dev/null 2>&1 || curl -sf "$BASE_URL/api/health" >/dev/null 2>&1; then
            echo "[✓] service ready after $((i*5))s"
            break
          fi
          echo "[*] attempt $i/24 not ready, sleep 5s"
          sleep 5
        done

        set +e
        k6 run --vus "$(params.VUS)" --duration "$(params.DURATION)" "$SCRIPT"
        K6_STATUS=$?
        if [ $K6_STATUS -ne 0 ]; then
          echo "[⚠️] k6 thresholds crossed (dev non-blocking, checks maybe transient)"
        fi
        exit 0
