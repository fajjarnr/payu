apiVersion: v1
kind: Secret
metadata:
  name: maven-settings
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
type: Opaque
stringData:
  settings.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
      <localRepository>/workspace/source/.m2/repository</localRepository>
      <interactiveMode>false</interactiveMode>
      <!-- Nexus proxy (payu-nexus, in-cluster): mirrorOf central — hermetic
           builds per DEVSECOPS §4.2.1. Nexus maven-public proxies Central +
           hosts releases; negative-cache 1440m. Direct repo1 fallback kept as
           repository (not mirror) for Nexus outage survival. -->
      <mirrors>
        <mirror>
          <id>payu-nexus</id>
          <name>PayU Nexus Maven proxy</name>
          <url>http://payu-nexus.payu-nexus.svc:8081/repository/maven-public/</url>
          <mirrorOf>central</mirrorOf>
        </mirror>
      </mirrors>
      <profiles>
        <profile>
          <id>central-via-nexus</id>
          <repositories>
            <repository>
              <id>central</id>
              <name>Maven Central (via Nexus mirror)</name>
              <url>https://repo1.maven.org/maven2</url>
              <releases><enabled>true</enabled></releases>
              <snapshots><enabled>false</enabled></snapshots>
            </repository>
          </repositories>
          <properties>
            <maven.test.failure.ignore>true</maven.test.failure.ignore>
          </properties>
        </profile>
      </profiles>
      <activeProfiles>
        <activeProfile>central-via-nexus</activeProfile>
      </activeProfiles>
    </settings>
