apiVersion: v1
kind: Secret
metadata:
  name: maven-settings
  namespace: payu-cicd
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
type: Opaque
stringData:
  settings.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
      <localRepository>/workspace/source/.m2/repository</localRepository>
      <interactiveMode>false</interactiveMode>
      <!-- No <mirrors>: Maven has no mirror failover, so a mirror miss fails the
           build outright (aliyun lagged Central on fresh Quarkus releases and
           broke gateway-service builds). Plain repositories are tried in
           declaration order: aliyun first (avoids repo1 429 per-hostname
           throttle under parallel waves, CHANGELOG 1.17.1), direct repo1 as
           fallback when aliyun has not synced a new release yet. -->
      <profiles>
        <profile>
          <id>central-with-fallback</id>
          <repositories>
            <repository>
              <id>aliyun-central</id>
              <name>Aliyun mirror of Maven Central</name>
              <url>https://maven.aliyun.com/repository/public</url>
              <releases><enabled>true</enabled></releases>
              <snapshots><enabled>false</enabled></snapshots>
            </repository>
            <repository>
              <id>central-fallback</id>
              <name>Maven Central direct fallback for aliyun sync gaps</name>
              <url>https://repo1.maven.org/maven2</url>
              <releases><enabled>true</enabled></releases>
              <snapshots><enabled>false</enabled></snapshots>
            </repository>
          </repositories>
          <properties>
            <maven.test.failure.ignore>true</maven.test.failure.ignore>
          </properties>
        </profile>
      </profiles>
      <activeProfiles>
        <activeProfile>central-with-fallback</activeProfile>
      </activeProfiles>
    </settings>
