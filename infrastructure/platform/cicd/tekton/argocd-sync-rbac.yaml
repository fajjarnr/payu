apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-application-reader
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payu-tekton-argocd-reader
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-application-reader
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: payu-cicd
