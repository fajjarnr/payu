apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-rollback-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: rollback
spec:
  description: Roll back by writing a previously verified image digest to Git and letting ArgoCD reconcile it.
  params:
    - name: service-name
      type: string
      description: Name of the service to roll back
    - name: environment
      type: string
      description: Target environment (dev, sit, uat, preprod, prod)
      default: sit
    - name: image-digest
      type: string
      description: Previously verified immutable sha256 digest
    - name: infra-repo-url
      type: string
      default: https://github.com/fajjarnr/payu.git
    - name: git-revision
      type: string
      default: main
    - name: push-changes
      type: string
      description: Push the rollback commit; mandatory for production
      default: "false"
  workspaces:
    - name: source
      description: GitOps repository workspace
  tasks:
    - name: fetch-infra-repo
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: source
      params:
        - name: URL
          value: $(params.infra-repo-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: DELETE_EXISTING
          value: "true"

    - name: rollback-writeback
      runAfter:
        - promote-image
      taskRef:
        name: gitops-writeback
      workspaces:
        - name: source
          workspace: source
      params:
        - name: service-name
          value: $(params.service-name)
        - name: environment
          value: $(params.environment)
        - name: image-digest
          value: $(params.image-digest)
        - name: git-revision
          value: $(params.git-revision)
        - name: push-changes
          value: $(params.push-changes)

    - name: promote-image
      runAfter:
        - fetch-infra-repo
      taskRef:
        name: promote-image
      when:
        - input: "$(params.environment)"
          operator: in
          values: ["sit", "uat", "preprod", "prod"]
      params:
        - name: service-name
          value: $(params.service-name)
        - name: environment
          value: $(params.environment)
        - name: image-digest
          value: $(params.image-digest)
        - name: push-changes
          value: $(params.push-changes)

    - name: argocd-sync-wait
      runAfter:
        - rollback-writeback
      taskRef:
        name: argocd-sync-wait
      params:
        - name: APPLICATION_NAME
          value: payu-$(params.environment)
        - name: NAMESPACE
          value: openshift-gitops

  finally:
    - name: rollback-report
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "=== GitOps Rollback Summary ==="
            echo "Service: $(params.service-name)"
            echo "Environment: $(params.environment)"
            echo "Digest: $(params.image-digest)"
