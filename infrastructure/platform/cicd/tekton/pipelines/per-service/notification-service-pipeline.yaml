apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: notification-service-pipeline
  annotations:
    results.tekton.dev/result-retention: "365d" # PCI Req10 + §4.4 Tekton Results 12m
    payu.io/catalog-version: payu-catalog-v1
    payu.io/service: notification-service
    tekton.dev/chains: "true" # SLSA L2+ provenance
spec:
  description: |
    Polyrepo 6 stages DEVSECOPS_ARCHITECTURE v1.4.0 — payu-dev (auto) → payu-sit (ACS+Litmus) → payu-uat (manual+Schemathesis) → payu-preprod (Kraken+Cerberus) → payu prod (Blue/Green Rollouts)
    Stage1 gitleaks+trufflehog+semgrep/Bandit/SpotBugs, Stage2 Buildah+Syft+Grype+Trivy+RHACS+CVE gate+license, Stage3 ZAP+Nuclei+Schemathesis+Dredd+k6+Litmus/Kraken, Stage4 ArgoCD sync+cosign+Chains+gitops-writeback digest, Stage5 OSSM mTLS STRICT>VSO Vault, Stage6 Loki+Wazuh 12m.
  params:
    - name: service-name
      type: string
      default: "notification-service"
    - name: git-url
      type: string
      default: "https://github.com/fajjarnr/payu.git"
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/payu-dev/notification-service"
      description: registry/namespace/name (no tag)
    - name: image-tag
      type: string
      default: "1.18.30"
      description: semver tag, promote by digest @sha256
    - name: target-env
      type: string
      default: "dev"
      description: dev|sit|uat|preprod|prod — gates per NS matrix §3.1
    - name: push-changes
      type: string
      default: "false"
      description: "git push the GitOps write-back commit (required true for prod)"
    - name: catalog-revision
      type: string
      default: payu-catalog-v1
  workspaces:
    - name: source
    - name: maven-settings
      optional: true
    - name: m2-cache
    - name: dockerconfig
    - name: signing-secrets
    - name: git-ssh
      optional: true
  tasks:
    - name: clone
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      workspaces: [{name: output, workspace: source}]
      params: [{name: URL, value: $(params.git-url)}, {name: REVISION, value: $(params.git-revision)}, {name: DELETE_EXISTING, value: "true"}]
    - name: gitleaks
      runAfter: [clone]
      taskRef:
        name: gitleaks
        kind: Task
      workspaces: [{name: source, workspace: source}]
    - name: trufflehog
      runAfter: [gitleaks]
      taskRef:
        name: trufflehog
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: CONTEXT_DIR, value: backend/notification-service}]
    - name: semgrep
      runAfter: [trufflehog]
      taskRef:
        name: semgrep
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: CONTEXT_DIR, value: backend/notification-service}]
    - name: compile
      runAfter: [semgrep]
      taskRef:
        name: maven-java25
        kind: Task
      workspaces: [{name: source, workspace: source}, {name: maven-settings, workspace: maven-settings}]
      params: [{name: SUBDIRECTORY, value: backend}, {name: GOALS, value: ["-T1", "-pl", "notification-service", "-am", "package", "-DskipTests"]}]
    - name: build
      runAfter: [compile]
      taskRef:
        name: buildah
        kind: Task
      workspaces: [{name: source, workspace: source}, {name: dockerconfig, workspace: dockerconfig}]
      params: [{name: IMAGE, value: $(params.image):$(params.image-tag)}, {name: CONTEXT, value: backend/notification-service}, {name: CONTAINERFILE, value: backend/notification-service/Containerfile}]
    - name: syft
      runAfter: [build]
      taskRef:
        name: syft-sbom
        kind: Task
      workspaces: [{name: source, workspace: source}, {name: dockerconfig, workspace: dockerconfig}]
      params: [{name: IMAGE, value: $(params.image):$(params.image-tag)}, {name: OUTPUT_FILE, value: sbom.json}]
    - name: grype
      runAfter: [syft]
      taskRef:
        name: grype-scan
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: TARGET, value: $(params.image):$(params.image-tag)}]
    - name: trivy
      runAfter: [grype]
      taskRef:
        name: trivy
        kind: Task
      workspaces: [{name: output, workspace: source}, {name: dockerconfig, workspace: dockerconfig}]
      params: [{name: IMAGE, value: $(params.image):$(params.image-tag)}, {name: SEVERITY, value: CRITICAL}, {name: EXIT_CODE, value: "0"}]
    - name: rhacs-scan
      runAfter: [trivy]
      taskRef:
        name: rhacs-image-scan
        kind: Task
      params: [{name: IMAGE, value: $(params.image):$(params.image-tag)}, {name: ROX_CENTRAL_ENDPOINT, value: central.stackrox.svc:443}]
    - name: cosign-sign
      runAfter: [rhacs-scan]
      taskRef:
        name: cosign-sign
        kind: Task
      workspaces: [{name: source, workspace: source}, {name: signing-secrets, workspace: signing-secrets}]
      params: [{name: IMAGE, value: $(params.image):$(params.image-tag)}, {name: SBOM_PATH, value: sbom.json}]
    - name: argocd-sync
      runAfter: [cosign-sign]
      taskRef:
        name: argocd-sync-wait
        kind: Task
      params: [{name: APPLICATION_NAME, value: $(params.service-name)-$(params.target-env)}, {name: NAMESPACE, value: openshift-gitops}]
    - name: zap-baseline
      runAfter: [argocd-sync]
      when: [{input: $(params.target-env), operator: in, values: ["dev", "sit"]}]
      taskRef:
        name: zap-baseline
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: TARGET_URL, value: http://$(params.service-name).payu-$(params.target-env).svc:8080}]
    - name: schemathesis
      runAfter: [zap-baseline]
      when: [{input: $(params.target-env), operator: in, values: ["sit", "uat"]}]
      taskRef:
        name: schemathesis-scan
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: BASE_URL, value: http://$(params.service-name).payu-$(params.target-env).svc:8080}, {name: SCHEMA_URL, value: http://$(params.service-name).payu-$(params.target-env).svc:8080/api-docs}]
    - name: k6-smoke
      runAfter: [schemathesis]
      when: [{input: $(params.target-env), operator: in, values: ["dev", "sit"]}]
      taskRef:
        name: k6-load-test
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: BASE_URL, value: http://$(params.service-name).payu-$(params.target-env).svc:8080}, {name: SCRIPT_PATH, value: tests/performance/k6/local-smoke.js}]
    - name: litmus
      runAfter: [k6-smoke]
      when: [{input: $(params.target-env), operator: in, values: ["sit"]}]
      taskRef:
        name: litmus-chaos-gate
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: NAMESPACE, value: payu-$(params.target-env)}, {name: KUSTOMIZE_DIR, value: infrastructure/platform/security/chaos/litmus}, {name: CHAOSENGINE_NAME, value: $(params.service-name)-chaos}, {name: TIMEOUT_SECONDS, value: "60"}]
    - name: kraken
      runAfter: [litmus]
      when: [{input: $(params.target-env), operator: in, values: ["preprod"]}]
      taskRef:
        name: kraken-chaos-gate
        kind: Task
      workspaces: [{name: source, workspace: source}]
      params: [{name: NAMESPACE, value: payu-$(params.target-env)}, {name: KUSTOMIZE_DIR, value: infrastructure/platform/security/chaos/kraken}, {name: JOB_NAME, value: kraken}, {name: TIMEOUT, value: "300"}]
    - name: gitops-writeback
      runAfter: [kraken]
      taskRef:
        name: gitops-writeback
        kind: Task
      workspaces: [{name: source, workspace: source}, {name: git-ssh, workspace: git-ssh}]
      params: [{name: service-name, value: $(params.service-name)}, {name: environment, value: $(params.target-env)}, {name: image-digest, value: $(tasks.build.results.BUILT_IMAGE_DIGEST)}, {name: image-tag, value: $(params.image-tag)}, {name: push-changes, value: $(params.push-changes)}]
