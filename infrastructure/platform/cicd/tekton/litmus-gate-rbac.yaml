# RBAC for the Tekton pipeline ServiceAccount to run the LitmusChaos gate
# in payu-sit: apply the chaos overlay (SA/Role/RoleBinding, ChaosExperiment,
# ChaosEngine) and read the ChaosEngine verdict.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payu-tekton-litmus-gate
  namespace: payu-sit
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
rules:
  - apiGroups: [""]
    resources:
      - serviceaccounts
      - pods
      - pods/log
      - events
      - configmaps
      - secrets
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payu-tekton-litmus-gate
  namespace: payu-sit
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: payu-tekton-litmus-gate
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: payu-cicd
