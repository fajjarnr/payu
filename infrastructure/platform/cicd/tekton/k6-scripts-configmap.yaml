apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-smoke-test-script
  namespace: payu-cicd
  labels:
    app.kubernetes.io/name: k6-smoke-test
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/version: "1.0.0"
    team: platform
data:
  payu-smoke-test.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    export const options = {
      vus: 10,
      duration: '1m',
      thresholds: {
        http_req_duration: ['p(95)<500'],
        http_req_failed: ['rate<0.01'],
      },
    };

    const baseUrl = __ENV.BASE_URL || 'http://account-service.payu-sit.svc.cluster.local:8080';

    export default function () {
      const res = http.get(`${baseUrl}/actuator/health`);
      check(res, {
        'status is 200': (r) => r.status === 200,
        'response time < 500ms': (r) => r.timings.duration < 500,
      });
    }
