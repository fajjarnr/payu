apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payu-build-pipeline
  namespace: payu-cicd
  labels:
    app: payu
    type: build
spec:
  description: |
    Build pipeline for PayU services with DevSecOps gates.
    Supports Spring Boot, Quarkus (Java) and Python services.
    Security gate order:
    Gitleaks → TruffleHog → Semgrep → service-specific SAST/SCA → Buildah build
    → Trivy → RHACS scan/policy → Syft SBOM → License Compliance → Grype.
    Tekton Chains signs the resulting image and provenance after completion.
  params:
    - name: service-name
      type: string
    - name: service-path
      type: string
      description: "The directory path of the service"
      default: "$(params.service-name)"
    - name: service-base-dir
      type: string
      description: "Base directory (e.g., backend, frontend)"
      default: "backend"
    - name: git-url
      type: string
      default: "https://github.com/fajjarnr/payu.git"
    - name: git-revision
      type: string
      default: main
    - name: service-type
      type: string
      default: spring-boot
    - name: build-image-tag
      type: string
      default: ""
      description: "Optional explicit image tag. If empty, semantic versioning will be used."
    - name: version-bump-type
      type: string
      default: patch
      description: "Semver bump when auto-generating tag: major, minor, or patch"
    - name: registry-url
      type: string
      default: image-registry.openshift-image-registry.svc:5000
    - name: registry-namespace
      type: string
      default: payu-dev
  workspaces:
    - name: source
      description: Workspace for source code
    - name: maven-settings
      description: Optional Maven settings.xml workspace
    - name: dockerconfig
      description: Optional container registry credentials workspace
  tasks:
    # ── Step 1: Clone git repo ──
    - name: fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: source
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: DELETE_EXISTING
          value: "true"

    # ── Step 1b: Generate Semantic Version ──
    - name: generate-semver
      runAfter:
        - fetch-repository
      taskRef:
        name: semantic-version
      workspaces:
        - name: source
          workspace: source
      params:
        - name: bump-type
          value: $(params.version-bump-type)
        - name: service-name
          value: $(params.service-name)
        - name: override-version
          value: $(params.build-image-tag)

    # ── Step 2-1: Secret Scan (Gitleaks) ──
    - name: secret-scan
      runAfter:
        - fetch-repository
      taskRef:
        name: gitleaks
      workspaces:
        - name: source
          workspace: source

    # ── Step 2-2: Deep Secret Scan (TruffleHog) ──
    - name: deep-secret-scan
      runAfter:
        - fetch-repository
      taskRef:
        name: trufflehog
      workspaces:
        - name: source
          workspace: source

    # ── Step 2-3: Primary SAST (Semgrep OSS) ──
    - name: semgrep-scan
      runAfter:
        - fetch-repository
      taskRef:
        name: semgrep
      workspaces:
        - name: source
          workspace: source
      params:
        - name: CONTEXT_DIR
          value: $(params.service-base-dir)/$(params.service-path)

    # ── Step 2-4: Java SAST + tests; image SCA runs later via Trivy and Grype ──
    - name: sast-sca-scan
      runAfter:
        - semgrep-scan
      taskRef:
        name: security-scan
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["spring-boot", "quarkus"]
      workspaces:
        - name: source
          workspace: source
        - name: maven-settings
          workspace: maven-settings
      params:
        - name: CONTEXT_DIR
          value: $(params.service-base-dir)/$(params.service-path)
        - name: MODULE
          value: $(params.service-path)

    - name: python-unit-tests
      runAfter:
        - secret-scan
        - deep-secret-scan
        - semgrep-scan
      taskRef:
        name: pytest
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["python"]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: TEST_DIR
          value: $(params.service-base-dir)/$(params.service-path)

    - name: node-unit-tests
      runAfter:
        - secret-scan
        - deep-secret-scan
        - semgrep-scan
      taskRef:
        name: node-unit-tests
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["nextjs"]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: CONTEXT_DIR
          value: $(params.service-base-dir)/$(params.service-path)

    # ── Step 2a: Maven build (Spring Boot / Quarkus) — JDK 21 ──
    - name: build-java
      runAfter:
        - sast-sca-scan
        - secret-scan
        - deep-secret-scan
        - semgrep-scan
      taskRef:
        name: maven-java25
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["spring-boot", "quarkus"]
      workspaces:
        - name: source
          workspace: source
        - name: maven-settings
          workspace: maven-settings
      params:
        - name: GOALS
          value:
            - -f
            - backend/pom.xml
            - -pl
            - $(params.service-path)
            - -am
            - clean
            - package
            - -DskipTests
            - -T1C

    # ── Step 3a: Buildah image (Java services) ──
    - name: build-push-image
      runAfter:
        - build-java
      taskRef:
        name: buildah
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["spring-boot", "quarkus"]
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: IMAGE
          value: $(params.registry-url)/$(params.registry-namespace)/$(params.service-name):$(tasks.generate-semver.results.version)
        - name: CONTEXT
          value: $(params.service-base-dir)/$(params.service-path)
        - name: CONTAINERFILE
          value: $(params.service-base-dir)/$(params.service-path)/Containerfile
        - name: TLSVERIFY
          value: "false"
        - name: GIT_SHA
          value: $(tasks.fetch-repository.results.COMMIT)

    # ── Step 2b/3b: Buildah image (Services with direct Containerfile like Python/Node.js) ──
    - name: build-push-direct
      runAfter:
        - secret-scan
        - deep-secret-scan
        - semgrep-scan
        - python-unit-tests
        - node-unit-tests
      taskRef:
        name: buildah
      when:
        - input: "$(params.service-type)"
          operator: in
          values: ["python", "nextjs"]
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: IMAGE
          value: $(params.registry-url)/$(params.registry-namespace)/$(params.service-name):$(tasks.generate-semver.results.version)
        - name: CONTEXT
          value: $(params.service-base-dir)/$(params.service-path)
        - name: CONTAINERFILE
          value: $(params.service-base-dir)/$(params.service-path)/Containerfile
        - name: TLSVERIFY
          value: "false"
        - name: GIT_SHA
          value: $(tasks.fetch-repository.results.COMMIT)

    # ── Step 4: Resolve immutable image reference from the successful build branch ──
    - name: resolve-image-digest
      runAfter:
        - build-push-image
        - build-push-direct
      taskRef:
        name: resolve-image-digest
      workspaces:
        - name: source
          workspace: source

    # ── Step 5: Image Scan (Trivy) ──
    - name: trivy-image-scan
      runAfter:
        - resolve-image-digest
      taskRef:
        name: trivy
      workspaces:
        - name: output
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: IMAGE
          value: $(tasks.resolve-image-digest.results.IMAGE_URL)
        - name: SEVERITY
          value: "CRITICAL,HIGH"
        - name: EXIT_CODE
          value: "1"
        - name: IGNORE_FILE
          value: "$(params.service-base-dir)/$(params.service-path)/.trivyignore.yaml"

    # ── Step 5: RHACS Image Scan (CVE vulnerability report) ──
    - name: rhacs-image-scan
      runAfter:
        - trivy-image-scan
      taskRef:
        name: rhacs-image-scan
      params:
        - name: IMAGE
          value: $(tasks.resolve-image-digest.results.IMAGE_URL)
        - name: OUTPUT_FORMAT
          value: table

    # ── Step 6: RHACS Image Policy Check (gate — blocks on violations) ──
    - name: rhacs-image-check
      runAfter:
        - rhacs-image-scan
      taskRef:
        name: rhacs-image-check
      params:
        - name: IMAGE
          value: $(tasks.resolve-image-digest.results.IMAGE_URL)

    # ── Step 7: SBOM Generation (Syft) ──
    - name: generate-sbom
      runAfter:
        - rhacs-image-check
      taskRef:
        name: syft-sbom
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: IMAGE
          value: $(tasks.resolve-image-digest.results.IMAGE_URL)
        - name: OUTPUT_FILE
          value: $(workspaces.source.path)/reports/$(params.service-name)-sbom.cdx.json

    # ── Step 8: License Compliance Gate (Syft SBOM) ──
    - name: license-compliance-check
      runAfter:
        - generate-sbom
      taskRef:
        name: license-compliance-check
      workspaces:
        - name: source
          workspace: source
      params:
        - name: SBOM_PATH
          value: $(tasks.generate-sbom.results.SBOM_PATH)
        - name: FAIL_ON_VIOLATION
          value: "true"

    # ── Step 9: SBOM Vulnerability Gate (Grype) ──
    - name: grype-sbom-check
      runAfter:
        - license-compliance-check
      taskRef:
        name: grype-scan
      workspaces:
        - name: source
          workspace: source
      params:
        - name: TARGET
          value: sbom:$(tasks.generate-sbom.results.SBOM_PATH)
        - name: FAIL_ON
          value: critical

    # Only this post-gate Task emits canonical Chains image results.
    - name: release-signed-image
      runAfter:
        - grype-sbom-check
      taskRef:
        name: release-image-for-signing
      params:
        - name: IMAGE
          value: $(tasks.resolve-image-digest.results.IMAGE_URL)
