apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payu-environments
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: dev
            path: infrastructure/workloads/overlays/payu-dev
            namespace: payu-dev
            project: payu-dev
            promotionOrder: "0"
          - name: sit
            path: infrastructure/workloads/overlays/payu-sit
            namespace: payu-sit
            project: payu-sit
            promotionOrder: "1"
          - name: uat
            path: infrastructure/workloads/overlays/payu-uat
            namespace: payu-uat
            project: payu-uat
            promotionOrder: "2"
          - name: preprod
            path: infrastructure/workloads/overlays/payu-preprod
            namespace: payu-preprod
            project: payu-preprod
            promotionOrder: "3"
          - name: prod
            path: infrastructure/workloads/overlays/payu-prod
            namespace: payu
            project: payu
            promotionOrder: "4"

  template:
    metadata:
      name: "payu-{{.name}}"
      labels:
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: environment
        payu.io/environment: "{{.name}}"
      annotations:
        payu.io/deployment-stage: workloads
        payu.io/promotion-order: "{{.promotionOrder}}"
        payu.io/promotion-mode: manual
    spec:
      project: "{{.project}}"
      source:
        repoURL: https://github.com/fajjarnr/payu.git
        targetRevision: main
        path: "{{.path}}"
      destination:
        namespace: "{{.namespace}}"
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: payu
            app.kubernetes.io/managed-by: platform-team
            payu.io/environment: "{{.name}}"
            payu.io/environment-class: stable
            payu.io/managed-by: platform-team
            payu.fajjjar.my.id/ingress: shared
          annotations:
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.metadata.annotations
            - .spec.replicas
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payu-environment-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: environment-platform
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - name: sit
                  namespace: payu-sit
                  project: payu-sit
                  promotionOrder: "1"
                - name: uat
                  namespace: payu-uat
                  project: payu-uat
                  promotionOrder: "2"
                - name: preprod
                  namespace: payu-preprod
                  project: payu-preprod
                  promotionOrder: "3"
                - name: prod
                  namespace: payu
                  project: payu
                  promotionOrder: "4"
          - list:
              elements:
                - component: data
                  path: infrastructure/platform/data
                - component: messaging
                  path: infrastructure/platform/messaging
  template:
    metadata:
      name: "{{.component}}-{{.name}}"
      labels:
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: "{{.component}}"
        payu.io/environment: "{{.name}}"
      annotations:
        payu.io/deployment-stage: platform
        payu.io/promotion-mode: manual
        payu.io/promotion-order: "{{.promotionOrder}}"
    spec:
      project: "{{.project}}"
      source:
        repoURL: https://github.com/fajjarnr/payu.git
        targetRevision: main
        path: "{{.path}}/overlays/{{.name}}"
      destination:
        namespace: "{{.namespace}}"
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
