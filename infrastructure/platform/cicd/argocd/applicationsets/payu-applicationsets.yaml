spec:
  generators:
    - list:
        elements:
          - name: kyverno
            path: infrastructure/platform/security/kyverno
            namespace: kyverno
          - name: falco
            path: infrastructure/platform/security/falco
            namespace: falco-system
          - name: wazuh
            path: infrastructure/platform/security/wazuh
            namespace: wazuh
          - name: vault
            path: infrastructure/platform/security/vault
            namespace: payu-dev
          - name: acs
            path: infrastructure/platform/security/acs
            namespace: stackrox
          - name: cosign
            path: infrastructure/platform/security/cosign
            namespace: payu-cicd
          - name: compliance-operator
            path: infrastructure/platform/security/compliance-operator
            namespace: openshift-compliance
          - name: keycloak
            path: infrastructure/platform/identity/operator
            namespace: rhbk-operator
          - name: datagrid
