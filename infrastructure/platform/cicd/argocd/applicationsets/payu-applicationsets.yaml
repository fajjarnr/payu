  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: identity
spec:
  generators:
    - list:
        elements:
          - name: dev
            path: infrastructure/platform/identity/overlays/dev
            namespace: payu-dev
            project: payu-dev
            promotionOrder: "0"
          - name: sit
            path: infrastructure/platform/identity/overlays/sit
            namespace: payu-sit
            project: payu-sit
            promotionOrder: "1"
          - name: uat
            path: infrastructure/platform/identity/overlays/uat
            namespace: payu-uat
            project: payu-uat
            promotionOrder: "2"
          - name: preprod
            path: infrastructure/platform/identity/overlays/preprod
            namespace: payu-preprod
            project: payu-preprod
            promotionOrder: "3"
          - name: prod
            path: infrastructure/platform/identity/overlays/prod
            namespace: payu
            project: payu
            promotionOrder: "4"

  template:
    metadata:
      name: "identity-{{name}}"
      labels:
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: identity
        payu.io/environment: "{{name}}"
      annotations:
        payu.io/deployment-stage: platform
        payu.io/promotion-mode: manual
        payu.io/promotion-order: "{{promotionOrder}}"
    spec:
      project: "{{project}}"
      source:
        repoURL: https://github.com/fajjarnr/payu.git
        targetRevision: main
        path: "{{path}}"
      destination:
        namespace: "{{namespace}}"
        server: https://kubernetes.default.svc
      syncPolicy:
