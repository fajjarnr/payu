apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payu-pr-previews
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: pr-preview
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        github:
          owner: fajjarnr
          repo: payu
          tokenRef:
            secretName: github-token
            key: token
        requeueAfterSeconds: 180

  template:
    metadata:
      name: "payu-preview-pr-{{.number}}"
      labels:
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: pr-preview
        payu.io/pr-number: "{{.number}}"
        payu.io/commit-sha: "{{.head_short_sha}}"
      annotations:
        argocd.argoproj.io/preview-environment: "true"
        pr-url: "{{.url}}"
        branch-name: "{{.branch}}"
    spec:
      project: payu-preview
      source:
        repoURL: https://github.com/fajjarnr/payu.git
        targetRevision: "{{.head_sha}}"
        path: infrastructure/workloads/overlays/dev
        kustomize:
          namespace: "payu-dev-pr-{{.number}}"
          commonLabels:
            app.kubernetes.io/part-of: payu
            payu.io/environment: preview
            payu.io/pr-number: "{{.number}}"
      destination:
        namespace: "payu-dev-pr-{{.number}}"
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: payu
            payu.io/environment: preview
            payu.io/environment-class: ephemeral
            payu.io/pr-number: "{{.number}}"
            auto-cleanup: "true"
      ignoreDifferences:
        - group: argoproj.io
          kind: Application
          jsonPointers:
            - /status