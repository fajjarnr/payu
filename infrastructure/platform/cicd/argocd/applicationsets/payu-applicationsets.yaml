apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payu-environments
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: dev
            path: infrastructure/workloads/overlays/dev
            namespace: payu-dev
            project: payu-dev
          - name: sit
            path: infrastructure/workloads/overlays/sit
            namespace: payu-sit
            project: payu-sit
          - name: uat
            path: infrastructure/workloads/overlays/uat
            namespace: payu-uat
            project: payu-uat
          - name: preprod
            path: infrastructure/workloads/overlays/preprod
            namespace: payu-preprod
            project: payu-preprod
          - name: prod
            path: infrastructure/workloads/overlays/prod
            namespace: payu
            project: payu

  template:
    metadata:
      name: "payu-{{.name}}"
      labels:
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: environment
        payu.io/environment: "{{.name}}"
      annotations:
        argocd-image-updater.argoproj.io/update-strategy: "digest"
        argocd-image-updater.argoproj.io/write-back-method: "argocd"
        argocd-image-updater.argoproj.io/write-back-target: "kustomization"
    spec:
      project: "{{.project}}"
      source:
        repoURL: https://github.com/fajjarnr/payu.git
        targetRevision: main
        path: "{{.path}}"
      destination:
        namespace: "{{.namespace}}"
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: payu
            app.kubernetes.io/managed-by: platform-team
            payu.io/environment: "{{.name}}"
            payu.io/environment-class: stable
            payu.io/managed-by: platform-team
          annotations:
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.metadata.annotations
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payu-monitoring
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: observability
spec:
  generators:
    - list:
        elements:
          - name: observability
            path: infrastructure/platform/observability
            namespace: openshift-monitoring

  template:
    metadata:
      name: "monitoring-{{name}}"
      labels:
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: observability
    spec:
      project: payu-monitoring
      source:
        repoURL: https://github.com/fajjarnr/payu.git
        targetRevision: main
        path: "{{path}}"
      destination:
        namespace: "{{namespace}}"
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
