apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payu-integration-service
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: gitops
    payu.io/service: integration-service
    payu.io/catalog-version: payu-catalog-v1
  annotations:
    payu.io/description: "Per-service ApplicationSet for integration-service (ADR-0066 polyrepo) — generates 5 env Apps"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            namespace: payu-dev
            project: payu-dev
            path: infrastructure/workloads/overlays/payu-dev/integration-service
          - env: sit
            namespace: payu-sit
            project: payu-sit
            path: infrastructure/workloads/overlays/payu-sit/integration-service
          - env: uat
            namespace: payu-uat
            project: payu-uat
            path: infrastructure/workloads/overlays/payu-uat/integration-service
          - env: preprod
            namespace: payu-preprod
            project: payu-preprod
            path: infrastructure/workloads/overlays/payu-preprod/integration-service
          - env: prod
            namespace: payu
            project: payu
            path: infrastructure/workloads/overlays/payu-prod/integration-service
  template:
    metadata:
      name: "integration-service-{{.env}}"
      labels:
        app.kubernetes.io/name: integration-service
        app.kubernetes.io/part-of: payu
        payu.io/environment: "{{.env}}"
      annotations:
        payu.io/promotion-mode: digest
    spec:
      project: "{{.project}}"
      source:
        repoURL: https://github.com/fajjarnr/payu.git
        targetRevision: main
        path: "{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
