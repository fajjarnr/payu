apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payu-rhtas
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: supply-chain
spec:
  project: payu-platform
  source:
    repoURL: https://github.com/fajjarnr/payu.git
    targetRevision: main
    path: infrastructure/platform/security/rhtas-single-zone
  destination:
    server: https://kubernetes.default.svc
    namespace: trusted-artifact-signer
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: rhtas-service-ca
      namespace: trusted-artifact-signer
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
