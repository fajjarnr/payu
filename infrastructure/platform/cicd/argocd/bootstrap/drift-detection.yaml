---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-detection-scanner
  namespace: openshift-gitops
  labels:
    app: payu
    type: drift-detection
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: drift-detection-scanner
          containers:
            - name: drift-scanner
              image: registry.redhat.io/openshift4/ose-cli-rhel9@sha256:18d9d46126acfe8ca89549d0e56c3b0c6fe978578dd8c57b2c131adff663df26
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  echo "=== PayU Drift Detection Scan ==="
                  echo "Scan Time: $(date)"

                  apps=$(oc get applications.argoproj.io -n openshift-gitops \
                    -l app.kubernetes.io/part-of=payu \
                    -o jsonpath='{.items[*].metadata.name}')
                  drift_detected=false

                  for app in $apps; do
                    echo "Checking drift for: $app"
                    sync_status=$(oc get application.argoproj.io "$app" -n openshift-gitops \
                      -o jsonpath='{.status.sync.status}')
                    health_status=$(oc get application.argoproj.io "$app" -n openshift-gitops \
                      -o jsonpath='{.status.health.status}')
                    echo "  Sync Status: $sync_status"
                    echo "  Health Status: $health_status"

                    if [ "$sync_status" != "Synced" ] || [ "$health_status" != "Healthy" ]; then
                      drift_detected=true
                      echo "  Drift or unhealthy state detected"
                    fi
                  done

                  if [ "$drift_detected" = true ]; then
                    echo "DRIFT DETECTED"
                    if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
                      curl --fail --silent --show-error -X POST "$SLACK_WEBHOOK_URL" \
                        -H 'Content-Type: application/json' \
                        -d '{"text":"Drift detected in PayU cluster. Check ArgoCD."}'
                    else
                      echo "No alert endpoint configured; review the drift output above." >&2
                    fi
                  else
                    echo "No drift detected"
                  fi
              env:
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: drift-detection-webhook
                      key: url
                      optional: true
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-detection-scanner
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: drift-detection-scanner
    app.kubernetes.io/part-of: payu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-detection-scanner
  namespace: openshift-gitops
  labels:
    app: payu
    type: drift-detection
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-detection-scanner
  namespace: openshift-gitops
  labels:
    app: payu
    type: drift-detection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drift-detection-scanner
subjects:
  - kind: ServiceAccount
    name: drift-detection-scanner
    namespace: openshift-gitops
