# Preview Environment Auto-Cleanup CronJob
# Deletes namespaces with payu.io/environment=preview and TTL expired
apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-env-cleanup
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: preview-env-cleanup
    app.kubernetes.io/part-of: payu
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: openshift-gitops-argocd-application-controller
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: registry.redhat.io/openshift4/ose-cli:v4.16
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Preview Environment Cleanup ==="
                  echo "Checking for expired preview namespaces..."
                  
                  # Get all preview namespaces with TTL annotation
                  oc get ns -l payu.io/environment=preview -o json | \
                    jq -r '.items[] | select(.metadata.annotations["payu.io/ttl-hours"] != null) | \(.metadata.name) \(.metadata.annotations["payu.io/created-at"]) \(.metadata.annotations["payu.io/ttl-hours"])' | \
                    while read ns created_at ttl_hours; do
                      if [ -z "$created_at" ] || [ "$created_at" = "null" ]; then
                        echo "Namespace $ns: no created-at timestamp, using creationTimestamp fallback"
                        created_at=$(oc get ns "$ns" -o jsonpath='{.metadata.creationTimestamp}')
                      fi
                      
                      created_epoch=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
                      now_epoch=$(date +%s)
                      ttl_seconds=$(($ttl_hours * 3600))
                      age_seconds=$(($now_epoch - $created_epoch))
                      
                      echo "Namespace: $ns | Age: ${age_seconds}s | TTL: ${ttl_seconds}s"
                      
                      if [ "$age_seconds" -gt "$ttl_seconds" ]; then
                        echo "  -> EXPIRED. Deleting namespace $ns and associated ArgoCD Application..."
                        pr_num=$(oc get ns "$ns" -o jsonpath='{.metadata.labels.payu\.io/pr-number}')
                        
                        # Delete ArgoCD Application first
                        if [ -n "$pr_num" ]; then
                          oc delete application "payu-preview-pr-${pr_num}" -n openshift-gitops --ignore-not-found=true
                        fi
                        
                        # Delete namespace
                        oc delete ns "$ns" --ignore-not-found=true
                        echo "  -> Deleted."
                      else
                        echo "  -> OK (remaining: $(($ttl_seconds - $age_seconds))s)"
                      fi
                    done
                  
                  echo "Cleanup complete."
