---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-detection-scanner
  namespace: openshift-gitops
  labels:
    app: payu
    type: drift-detection
spec:
  schedule: "*/30 * * * *" # Every 30 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: argocd-application-controller
          containers:
          - name: drift-scanner
            image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
            command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash
              set -e

              echo "=== PayU Drift Detection Scan ==="
              echo "Scan Time: $(date)"
              echo ""

              # Get all ArgoCD applications
              apps=$(oc get applications -n openshift-gitops -l app=payu -o jsonpath='{.items[*].metadata.name}')

              drift_detected=false

              for app in $apps; do
                echo "Checking drift for: $app"

                # Check sync status
                sync_status=$(oc get application $app -n openshift-gitops -o jsonpath='{.status.sync.status}')
                health_status=$(oc get application $app -n openshift-gitops -o jsonpath='{.status.health.status}')

                echo "  Sync Status: $sync_status"
                echo "  Health Status: $health_status"

                if [ "$sync_status" != "Synced" ]; then
                  echo "  ⚠️  OutOfSync detected"
                  drift_detected=true
                fi

                if [ "$health_status" != "Healthy" ]; then
                  echo "  ⚠️  Unhealthy detected"
                  drift_detected=true
                fi

                # Check for operation state
                operation_state=$(oc get application $app -n openshift-gitops -o jsonpath='{.status.operationState.phase}')

                if [ -n "$operation_state" ] && [ "$operation_state" != "Succeeded" ]; then
                  echo "  ⚠️  Operation in progress: $operation_state"
                fi

                echo ""
              done

              # Send alert if drift detected
              if [ "$drift_detected" = true ]; then
                echo "🚨 DRIFT DETECTED - Sending alert"
                # Send to Slack/PagerDuty
                curl -X POST $SLACK_WEBHOOK_URL \
                  -H 'Content-Type: application/json' \
                  -d '{"text":"🚨 Drift detected in PayU cluster. Check ArgoCD for details."}' || true
              else
                echo "✅ No drift detected"
              fi
            env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: drift-detection-webhook
                  key: url
                  optional: true
          restartPolicy: OnFailure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-detection-scanner
  namespace: openshift-gitops
  labels:
    app: payu
    type: drift-detection
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-detection-scanner
  namespace: openshift-gitops
  labels:
    app: payu
    type: drift-detection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drift-detection-scanner
subjects:
  - kind: ServiceAccount
    name: drift-detection-scanner
    namespace: openshift-gitops
