# ArgoCD Projects — RBAC per Namespace
# Ref: DEVSECOPS_ARCHITECTURE.md §3.1 Namespace Matrix
# Each project maps to a namespace with appropriate RBAC and source restrictions

# ============================================================
# Development Project — payu-dev
# RBAC: Dev + SRE
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payu-dev
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
spec:
  description: "PayU Development Environment"
  sourceRepos:
    - "https://github.com/fajjarnr/payu.git"
  destinations:
    - namespace: payu-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: developer
      description: "Development team access"
      policies:
        - p, proj:payu-dev:developer, applications, *, payu-dev/*, allow
      groups:
        - payu-developers
        - payu-sre
---
