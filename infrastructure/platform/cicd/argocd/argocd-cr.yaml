# OpenShift GitOps — ArgoCD Instance Configuration
# Applied declaratively (no oc patch) so the repo stays the source of truth.
# This is required for Kyverno, Falco, Wazuh kustomize+HelmChartInflationGenerator.
# ===========================================================
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  kustomizeBuildOptions: "--enable-helm"
  controller:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 4
        memory: 4Gi
