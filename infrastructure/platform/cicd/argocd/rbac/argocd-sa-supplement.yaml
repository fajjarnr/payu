# Supplemental ClusterRole + ClusterRoleBinding for ArgoCD Application Controller
# Kubernetes resources NOT covered by the OpenShift GitOps operator's own RBAC.
# Managed via GitOps — deployed by payu-app-of-apps bootstrap.
# ============================================================
#
# The OpenShift GitOps operator manages its own ClusterRole but only grants:
#   - get/list/watch on *
#   - full access to openshift-operator APIs
# This supplement adds CRUD for standard K8s resources + DevSecOps CRDs
# needed by platform kyverno, falco, wazuh, vault Helm chart deployments.
# ============================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: payu-argocd-sa-supplement
  labels:
    app: payu
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: argocd
rules:
  # Core resources: create/update/patch/delete
  - apiGroups: [""]
    resources:
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - pods
      - pods/log
      - persistentvolumeclaims
      - events
      - endpoints
    verbs: ["create", "update", "patch", "delete"]
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["create", "update", "patch", "delete"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["create", "update", "patch", "delete"]
  # Batch
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["create", "update", "patch", "delete"]
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["create", "update", "patch", "delete"]
  # Policy
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["create", "update", "patch", "delete"]
  # CRDs for Helm chart deployments
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["create", "update", "patch", "delete"]
  # OpenShift Route
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["create", "update", "patch", "delete"]
  # OpenShift SCC (use only, NOT create/delete — too dangerous)
  - apiGroups: ["security.openshift.io"]
    resources:
      - securitycontextconstraints
    verbs: ["use"]
  # RHACS / StackRox
  - apiGroups: ["platform.stackrox.io"]
    resources: ["*"]
    verbs: ["*"]
  # Kyverno
  - apiGroups: ["kyverno.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["reports.kyverno.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["*"]
    verbs: ["*"]
  # External Secrets
  - apiGroups: ["external-secrets.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["generators.external-secrets.io"]
    resources: ["*"]
    verbs: ["*"]
  # Cert-Manager
  - apiGroups: ["cert-manager.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["*"]
    verbs: ["*"]
  # Compliance Operator
  - apiGroups: ["compliance.openshift.io"]
    resources: ["*"]
    verbs: ["*"]
  # Kafka / Strimzi
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["*"]
    verbs: ["*"]
  # Service Mesh / Istio
  - apiGroups: ["maistra.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["networking.istio.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["security.istio.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["telemetry.istio.io"]
    resources: ["*"]
    verbs: ["*"]
  # Monitoring (Prometheus Operator)
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs: ["create", "update", "patch", "delete"]
  # LitmusChaos
  - apiGroups: ["litmuschaos.io"]
    resources: ["*"]
    verbs: ["*"]
  # CNPG (CloudNative-PG)
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payu-argocd-sa-supplement
  labels:
    app: payu
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: payu-argocd-sa-supplement
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
