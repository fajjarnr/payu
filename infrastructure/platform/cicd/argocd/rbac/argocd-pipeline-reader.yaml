# RoleBinding: grant the Tekton pipeline ServiceAccount read access to
# ArgoCD Application resources so the argocd-sync-wait gate can query
# sync/health status. Lost in the OpenShift Pipelines 1.23.1 fresh install
# (L-163 regression), restored 2026-08-01.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-reader
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-application-reader
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: payu-cicd
