apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: partner-slo
  namespace: payu
  labels:
    role: alert-rules
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: observability
    app.kubernetes.io/name: partner-service
spec:
  groups:
    - name: payu.partner.slo.availability.burn
      interval: 30s
      rules:
        # ADR-0034 §3 Multi-Window Multi-Burn-Rate for partner-service (SLO 99.9% => error budget 0.1% = 0.001)
        # Page-1 Fast Burn: 2% budget in 1h (burn 14.4x)
        - alert: PartnerAvailabilityFastBurnCritical
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[1h]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[1h]))
            ) > (14.4 * 0.001)
            and
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[5m]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[5m]))
            ) > (14.4 * 0.001)
          for: 2m
          labels:
            severity: critical
            tier: page
            slo: availability
            service: partner-service
            burn_rate: "14.4"
          annotations:
            summary: "Partner Fast Error Budget Burn (14.4x) — 2% budget in 1h"
            description: "Partner-service error rate {{ $value | humanizePercentage }} burning monthly budget in ~2 days. Immediate triage."
            runbook: "https://docs.payu.fajjjar.my.id/runbooks/slo-partner-availability-burn"
        # Page-2 Medium Burn: 5% budget in 6h (burn 6x)
        - alert: PartnerAvailabilityMediumBurn
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[6h]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[6h]))
            ) > (6 * 0.001)
            and
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[30m]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[30m]))
            ) > (6 * 0.001)
          for: 5m
          labels:
            severity: critical
            tier: page
            slo: availability
            service: partner-service
            burn_rate: "6"
          annotations:
            summary: "Partner Medium Burn (6x) — 5% budget in 6h"
            description: "Partner-service sustained error rate {{ $value | humanizePercentage }}. PagerDuty SRE."
            runbook: "https://docs.payu.fajjjar.my.id/runbooks/slo-partner-availability-burn"
        # Ticket-1 Slow Burn: 10% budget in 24h (burn 3x)
        - alert: PartnerAvailabilitySlowBurn
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[24h]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[24h]))
            ) > (3 * 0.001)
            and
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[2h]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[2h]))
            ) > (3 * 0.001)
          for: 15m
          labels:
            severity: warning
            tier: ticket
            slo: availability
            service: partner-service
            burn_rate: "3"
          annotations:
            summary: "Partner Slow Burn (3x) — 10% budget in 24h"
            description: "Partner-service gradual burn {{ $value | humanizePercentage }} — Slack #alerts-reliability."
            runbook: "https://docs.payu.fajjjar.my.id/runbooks/slo-partner-availability-burn"
        # Ticket-2 Degradation: 10% budget in 3d (burn 1x)
        - alert: PartnerAvailabilityDegradation
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[3d]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[3d]))
            ) > (1 * 0.001)
            and
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[6h]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[6h]))
            ) > (1 * 0.001)
          for: 30m
          labels:
            severity: info
            tier: ticket
            slo: availability
            service: partner-service
            burn_rate: "1"
          annotations:
            summary: "Partner Degradation Burn (1x) — 10% budget in 3d"
            description: "Partner-service low-grade burn {{ $value | humanizePercentage }} — weekly review."
            runbook: "https://docs.payu.fajjjar.my.id/runbooks/slo-partner-availability-burn"
    - name: payu.partner.slo.latency
      interval: 30s
      rules:
        - alert: PartnerLatencyP95Breached
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{job="partner-service"}[5m])) by (le)
            ) > 0.5
          for: 5m
          labels:
            severity: critical
            slo: latency
            service: partner-service
            tier: p1
          annotations:
            summary: "Partner P95 > 500ms"
            description: "Partner-service P95 latency {{ $value }}s exceeds 500ms SLO (ADR-0034)."
            runbook: "https://docs.payu.fajjjar.my.id/runbooks/slo-partner-latency"
        - alert: PartnerLatencyP99Breached
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{job="partner-service"}[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: critical
            slo: latency
            service: partner-service
            tier: p1
          annotations:
            summary: "Partner P99 > 2000ms"
            description: "Partner-service P99 latency {{ $value }}s exceeds 2000ms SLO (ADR-0034)."
            runbook: "https://docs.payu.fajjjar.my.id/runbooks/slo-partner-latency"
    - name: payu.partner.slo.recording
      interval: 30s
      rules:
        - record: partner:slo:availability:ratio30d
          expr: |
            sum(rate(http_server_requests_seconds_count{job="partner-service",status!~"5.."}[30d]))
            /
            sum(rate(http_server_requests_seconds_count{job="partner-service"}[30d]))
        - record: partner:slo:availability:ratio5m
          expr: |
            sum(rate(http_server_requests_seconds_count{job="partner-service",status!~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="partner-service"}[5m]))
        - record: partner:slo:error_budget:remaining
          expr: |
            (partner:slo:availability:ratio30d - 0.999) / 0.001
        - record: partner:slo:availability:burn_rate_5m
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="partner-service",status=~"5.."}[5m]))
              /
              sum(rate(http_server_requests_seconds_count{job="partner-service"}[5m]))
            ) / 0.001
        - record: partner:slo:latency:p95_5m
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{job="partner-service"}[5m])) by (le)
            )
        - record: partner:slo:latency:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{job="partner-service"}[5m])) by (le)
            )
