apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/part-of: payu

resources:
  # Tracing Stack (Tempo & OTel Collector)
  - tracing/

  # Logging Stack
  - logging/

  # Network Observability
  - network-observability/

  # Monitoring (Alerts, Grafana, UI Plugins)
  - monitoring/cluster-observability.yaml
  - monitoring/alerts/slo-alerts.yaml
  - monitoring/alerts/partner-slo.yaml
  - monitoring/alerts/pagerduty-integration.yaml
  - monitoring/alerts/prometheus-rules.yaml
  - grafana/dashboard-partner.yaml
