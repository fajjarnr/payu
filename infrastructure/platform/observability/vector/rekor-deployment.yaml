# Rekor Transparency Log Server (Sigstore)
# Stores signed audit log hashes for PCI-DSS Requirement 10 integrity
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rekor-server
  namespace: payu-observability
  labels:
    app.kubernetes.io/name: rekor-server
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: transparency-log
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rekor-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rekor-server
        app.kubernetes.io/part-of: payu
    spec:
      containers:
        - name: rekor-server
          image: gcr.io/projectsigstore/rekor-server:v1.3.6
          args:
            - serve
            - --trillian_log_server.address=trillian-logserver.payu-observability.svc:8090
            - --rekor_server.address=0.0.0.0
            - --rekor_server.signer=memory
            - --enable_retrieve_api=true
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rekor-server
  namespace: payu-observability
spec:
  selector:
    app.kubernetes.io/name: rekor-server
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
# Trillian Log Server (backend for Rekor)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trillian-logserver
  namespace: payu-observability
  labels:
    app.kubernetes.io/name: trillian-logserver
    app.kubernetes.io/part-of: payu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trillian-logserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trillian-logserver
        app.kubernetes.io/part-of: payu
    spec:
      containers:
        - name: logserver
          image: gcr.io/trillian-opensource-ci/log_server:v1.6.1
          args:
            - --mysql_uri=root@tcp(trillian-mysql.payu-observability.svc:3306)/trillian
            - --rpc_endpoint=0.0.0.0:8090
            - --http_endpoint=0.0.0.0:8091
          ports:
            - containerPort: 8090
              name: grpc
            - containerPort: 8091
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: trillian-logserver
  namespace: payu-observability
spec:
  selector:
    app.kubernetes.io/name: trillian-logserver
  ports:
    - port: 8090
      targetPort: 8090
      name: grpc
---
# Trillian MySQL (simplified for lab; use Crunchy in production)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trillian-mysql
  namespace: payu-observability
  labels:
    app.kubernetes.io/name: trillian-mysql
    app.kubernetes.io/part-of: payu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trillian-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trillian-mysql
        app.kubernetes.io/part-of: payu
    spec:
      containers:
        - name: mysql
          image: docker.io/mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trillian-mysql-secret
                  key: password
            - name: MYSQL_DATABASE
              value: trillian
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mysql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trillian-mysql
  namespace: payu-observability
spec:
  selector:
    app.kubernetes.io/name: trillian-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Secret
metadata:
  name: trillian-mysql-secret
  namespace: payu-observability
type: Opaque
stringData:
  password: trillian-dev-password-change-in-prod
