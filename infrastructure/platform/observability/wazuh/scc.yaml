apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: wazuh-scc
  annotations:
    kubernetes.io/description: |
      Custom SCC for Wazuh SIEM components on OpenShift.
      Allows required UIDs and volumes for manager, indexer, and dashboard.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:wazuh:wazuh-manager
  - system:serviceaccount:wazuh:wazuh-indexer
  - system:serviceaccount:wazuh:wazuh-dashboard
