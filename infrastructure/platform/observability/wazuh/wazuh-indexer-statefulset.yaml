apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-indexer
    app.kubernetes.io/component: indexer
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-indexer
        app.kubernetes.io/component: indexer
    spec:
      serviceAccountName: wazuh-indexer
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.9.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          env:
            - name: cluster.name
              value: wazuh-cluster
            - name: node.name
              value: wazuh-indexer-0
            - name: discovery.type
              value: single-node
            - name: network.host
              value: "0.0.0.0"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: bootstrap.memory_lock
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "false"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: indexer-data
              mountPath: /var/lib/wazuh-indexer
          readinessProbe:
            httpGet:
              path: /
              port: 9200
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 9200
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: indexer-data
          emptyDir: {}
