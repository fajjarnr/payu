apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-manager
    app.kubernetes.io/component: manager
spec:
  selector:
    app.kubernetes.io/name: wazuh-manager
  ports:
    - name: agents
      port: 1514
      targetPort: 1514
      protocol: TCP
    - name: registration
      port: 1515
      targetPort: 1515
      protocol: TCP
    - name: api
      port: 55000
      targetPort: 55000
      protocol: TCP
    - name: cluster
      port: 1516
      targetPort: 1516
      protocol: TCP
    - name: syslog
      port: 514
      targetPort: 514
      protocol: UDP
  type: ClusterIP
