apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: payu-otel-collector
  namespace: payu-observability
spec:
  mode: deployment
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
          - name: drop-healthcheck
            properties:
              strategy: always_sample
            type: string_attribute
            string_attribute:
              key: http.target
              values: ["/actuator/health", "/q/health", "/readyz", "/livez", "/health"]
            inverted_match: true
          - name: financial-100pct
            properties:
              strategy: always_sample
            type: string_attribute
            string_attribute:
              key: http.target
              values: ["/v1/payments", "/v1/transfers", "/v1/snap-bi", "/v1/escrow"]
          - name: errors-100pct
            properties:
              strategy: status_code
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: reads-5pct
            properties:
              strategy: probabilistic
              probabilistic:
                sampling_percentage: 5
      "filter/drop-healthcheck":
        traces:
          exclude:
            match_type: regexp
            bodies: [".*health.*"]
    exporters:
      "otlp/tempo":
        endpoint: payu-tempo-distributor.payu-observability.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: ["otlp/tempo"]
