# Grafana Dashboard: PayU Partner Service SLO
# ConfigMap containing dashboard JSON for partner-service observability (PARTNER-PROD-009)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-payu-partner
  namespace: openshift-monitoring
  labels:
    grafana_dashboard: "true"
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: observability
    app.kubernetes.io/name: partner-service
data:
  payu-partner-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "PayU - Partner Service SLO",
        "tags": ["payu", "partner-service", "slo", "sli"],
        "timezone": "Asia/Jakarta",
        "refresh": "30s",
        "schemaVersion": 36,
        "panels": [
          {
            "id": 1,
            "title": "Request Rate (req/s)",
            "type": "timeseries",
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count{job=\"partner-service\"}[5m]))",
                "legendFormat": "requests/sec"
              }
            ],
            "fieldConfig": {
              "defaults": { "unit": "reqps" }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Error Rate (5xx / total)",
            "type": "timeseries",
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count{job=\"partner-service\",status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{job=\"partner-service\"}[5m]))",
                "legendFormat": "error rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 0.0005},
                    {"color": "red", "value": 0.001}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "P95 Latency",
            "type": "timeseries",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"partner-service\"}[5m])) by (le))",
                "legendFormat": "p95"
              },
              {
                "expr": "0.5",
                "legendFormat": "SLO 500ms"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 0.5}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "P99 Latency",
            "type": "timeseries",
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"partner-service\"}[5m])) by (le))",
                "legendFormat": "p99"
              },
              {
                "expr": "2",
                "legendFormat": "SLO 2s"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 2}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Availability SLI (30d)",
            "type": "stat",
            "targets": [
              {
                "expr": "partner:slo:availability:ratio30d",
                "legendFormat": "availability"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "decimals": 3,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "yellow", "value": 0.999},
                    {"color": "green", "value": 0.9995}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Error Budget Remaining (%)",
            "type": "gauge",
            "targets": [
              {
                "expr": "100 * (partner:slo:availability:ratio30d - 0.999) / 0.001",
                "legendFormat": "budget remaining %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": 0,
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "yellow", "value": 25},
                    {"color": "green", "value": 50}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16}
          },
          {
            "id": 7,
            "title": "Error Budget Burn Rate (5m)",
            "type": "timeseries",
            "targets": [
              {
                "expr": "partner:slo:availability:burn_rate_5m",
                "legendFormat": "burn rate"
              },
              {
                "expr": "14.4",
                "legendFormat": "fast burn 14.4x"
              },
              {
                "expr": "6",
                "legendFormat": "medium burn 6x"
              }
            ],
            "fieldConfig": {
              "defaults": { "unit": "short" }
            },
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16}
          },
          {
            "id": 8,
            "title": "Requests by Status",
            "type": "timeseries",
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count{job=\"partner-service\"}[5m])) by (status)",
                "legendFormat": "{{status}}"
              }
            ],
            "fieldConfig": {
              "defaults": { "unit": "reqps" }
            },
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24}
          }
        ],
        "templating": {
          "list": []
        }
      }
    }
