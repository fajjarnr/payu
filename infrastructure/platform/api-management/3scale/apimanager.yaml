# 3scale APIManager Custom Resource for PayU
# Deploys the full 3scale API Management platform on OpenShift via the 3scale Operator.
#
# Development deployment:
#   - 3scale Operator installed from OperatorHub (threescale-2.16 channel)
#   - Namespace: payu-api-management
#   - External PostgreSQL and Redis connection secrets
#   - MinIO S3-compatible storage for System file storage (see minio.yaml),
#     replacing the RWX PVC requirement
#
# NOTE: system.fileStorage is NOT a reconcilable APIManager parameter.
# Changing it after install requires deleting and recreating this CR.
#
# Usage:
#   oc apply -f apimanager.yaml -n payu-api-management
#
# Production must use dedicated external PostgreSQL/Redis and Vault-managed
# secrets. See README.md for the production boundary.
---
apiVersion: apps.3scale.net/v1alpha1
kind: APIManager
metadata:
  name: payu-apimanager
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: 3scale
    app.kubernetes.io/part-of: payu-api-management
    app.kubernetes.io/managed-by: 3scale-operator
spec:
  wildcardDomain: apps.fajjjar.my.id
  appLabel: payu-3scale
  tenantName: payu
  resourceRequirementsEnabled: true

  # External system PostgreSQL and Redis are mandatory since 3scale 2.16.
  # Zync remains operator-managed in development.
  externalComponents:
    system:
      database: true
      redis: true
    backend:
      redis: true

  system:
    # System file storage via EFS CSI shared volume. The sandbox cluster only
    # has RWO EBS storage classes; EFS (RWX) lets system-app run 2 replicas
    # against one shared filesystem. The AWS EFS CSI Driver operator provides
    # the efs-csi StorageClass (fs-0980fe4e0dd95acb4).
    fileStorage:
      persistentVolumeClaim:
        storageClassName: efs-csi
        resources:
          requests: 5Gi
    appSpec:
      replicas: 2
    sidekiqSpec:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  backend:
    listenerSpec:
      # PRODUCTION: Increase to 2+ replicas for HA
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    workerSpec:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    cronSpec:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

  apicast:
    productionSpec:
      replicas: 2
      resources:
        requests:
          cpu: 250m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      # Custom environment variables for PayU integration
      customEnvironments:
        - secretRef:
            name: apicast-payu-env
      # Enable custom policy for PayU header forwarding
      customPolicies:
        - name: payu-header-forwarding
          version: "1.0.0"
          secretRef:
            name: payu-policy
    stagingSpec:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # Custom environment variables for PayU integration
      customEnvironments:
        - secretRef:
            name: apicast-payu-env
      # Enable custom policy for PayU header forwarding
      customPolicies:
        - name: payu-header-forwarding
          version: "1.0.0"
          secretRef:
            name: payu-policy

  zync:
    appSpec:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    queSpec:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
