apiVersion: v1
kind: Namespace
metadata:
  name: payu-api-management
  labels:
    app.kubernetes.io/name: payu-api-management
    app.kubernetes.io/part-of: payu-platform
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: payu-api-management
  namespace: payu-api-management
spec:
  targetNamespaces:
    - payu-api-management
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: 3scale-operator
  namespace: payu-api-management
spec:
  channel: threescale-2.16
  installPlanApproval: Automatic
  name: 3scale-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
