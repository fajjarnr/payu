apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-3scale-data
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: redis-3scale
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: payu-api-management
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3-csi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-3scale
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: redis-3scale
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: payu-api-management
spec:
  selector:
    app.kubernetes.io/name: redis-3scale
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-3scale
  namespace: payu-api-management
  labels:
    app.kubernetes.io/name: redis-3scale
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: payu-api-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-3scale
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis-3scale
        app.kubernetes.io/name: redis-3scale
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: payu-api-management
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:9.8-1784783161
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-3scale-credentials
                  key: REDIS_PASSWORD
            - name: REDIS_DATADIR
              value: /opt/app-root/src
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: runtime
              mountPath: /var/lib/redis
            - name: data
              mountPath: /opt/app-root/src
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: redis-3scale-data
        - name: tmp
          emptyDir: {}
