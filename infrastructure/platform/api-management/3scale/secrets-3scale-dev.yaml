# 3scale system file storage via MinIO S3-compatible endpoint.
# Referenced from APIManager .spec.system.fileStorage.simpleStorageService.
apiVersion: v1
kind: Secret
metadata:
  name: system-s3
  namespace: payu-api-management
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minio_dev_secret_2026
  AWS_BUCKET: payu-3scale
  AWS_REGION: default
  AWS_HOSTNAME: minio
  AWS_PROTOCOL: http
  AWS_PATH_STYLE: "true"
---
# 3scale provider account used by capabilities CRs (Backend/Product/Application).
# adminURL must resolve from the cluster; the sandbox cluster uses the
# *.apps.cluster-<id>.sandbox<id>.opentlc.com domain, not apps.fajjjar.my.id.
apiVersion: v1
kind: Secret
metadata:
  name: threescale-provider-account
  namespace: payu-api-management
type: Opaque
stringData:
  adminURL: https://payu-admin.apps.cluster-9knnm.9knnm.sandbox2980.opentlc.com
  token: admin_token_2026_dev_32bytes
