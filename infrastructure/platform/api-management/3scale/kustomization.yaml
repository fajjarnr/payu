apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Runtime resources. Install the operator first:
#   oc apply -k infrastructure/platform/api-management
# Then apply this directory:
#   oc apply -k infrastructure/platform/api-management/3scale

resources:
  - externalsecrets.yaml
  - apicast-policy.yaml
  - redis.yaml
  - minio.yaml
  - secrets-3scale-dev.yaml
  - 3scale-network-policy.yaml
  - payu-dev-network-policy.yaml
  - allow-dev-gateway-to-redis-3scale.yaml
  - apimanager.yaml
