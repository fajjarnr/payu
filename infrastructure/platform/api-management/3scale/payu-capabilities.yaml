apiVersion: capabilities.3scale.net/v1beta1
kind: Backend
metadata:
  name: payu-backend
  namespace: payu-api-management
spec:
  name: "PayU Backend API"
  systemName: "payu_backend"
  privateBaseURL: "http://gateway-service.payu-dev.svc.cluster.local:8080"
  providerAccountRef:
    name: threescale-provider-account
---
apiVersion: capabilities.3scale.net/v1beta1
kind: Product
metadata:
  name: payu-product
  namespace: payu-api-management
spec:
  name: "PayU Product API"
  systemName: "payu_product"
  description: "Declarative Product for PayU Gateway Services"
  providerAccountRef:
    name: threescale-provider-account
  deployment:
    apicastHosted:
      authentication:
        userkey:
          authUserKey: "user_key"
          credentials: "headers"
  backendUsages:
    payu_backend:
      path: "/"
  policies:
    - name: apicast
      version: builtin
      enabled: true
      configuration: {}
    - name: payu-header-forwarding
      version: "1.0.0"
      enabled: true
      configuration:
        partner_id_header: "X-Partner-Id"
        plan_id_header: "X-PayU-Plan-Id"
        request_id_header: "X-PayU-Request-Id"
        include_rate_limit_info: true
  applicationPlans:
    basic:
      name: "Basic Plan"
      published: true
    unlimited:
      name: "Unlimited Plan"
      published: true
  mappingRules:
    - httpMethod: GET
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: POST
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: PUT
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: DELETE
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: PATCH
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: GET
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: POST
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: PUT
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: DELETE
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: PATCH
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
---
apiVersion: capabilities.3scale.net/v1beta1
kind: DeveloperAccount
metadata:
  name: payu-partner-account
  namespace: payu-api-management
spec:
  orgName: "PayU Partner"
  monthlyBillingEnabled: false
  monthlyChargingEnabled: false
  providerAccountRef:
    name: threescale-provider-account
---
apiVersion: capabilities.3scale.net/v1beta1
kind: Application
metadata:
  name: payu-partner-app
  namespace: payu-api-management
spec:
  name: "PayU Partner Application"
  description: "Partner integration application for the PayU API"
  accountCR:
    name: payu-partner-account
  productCR:
    name: payu-api
  applicationPlanName: "basic"
---
apiVersion: capabilities.3scale.net/v1beta1
kind: Product
metadata:
  name: payu-api
  namespace: payu-api-management
spec:
  name: "PayU API"
  systemName: "api"
  description: "PayU API gateway services"
  providerAccountRef:
    name: threescale-provider-account
  deployment:
    apicastHosted:
      authentication:
        userkey:
          authUserKey: "user_key"
          credentials: "headers"
  backendUsages:
    payu_backend:
      path: "/"
  policies:
    - name: apicast
      version: builtin
      enabled: true
      configuration: {}
  applicationPlans:
    basic:
      name: "Basic"
      published: true
  mappingRules:
    - httpMethod: GET
      pattern: "/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: GET
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: POST
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: PUT
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: DELETE
      pattern: "/api/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: GET
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: POST
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: PUT
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: DELETE
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
    - httpMethod: PATCH
      pattern: "/v1/partner/"
      increment: 1
      metricMethodRef: "hits"
---
apiVersion: capabilities.3scale.net/v1beta1
kind: DeveloperUser
metadata:
  name: payu-partner-admin
  namespace: payu-api-management
spec:
  email: "partner@payu.dev"
  username: "partneradmin"
  role: "admin"
  passwordCredentialsRef:
    name: payu-partner-user-credentials
  developerAccountRef:
    name: payu-partner-account
  providerAccountRef:
    name: threescale-provider-account
---
apiVersion: capabilities.3scale.net/v1beta1
kind: ProxyConfigPromote
metadata:
  name: payu-api-production
  namespace: payu-api-management
spec:
  productCRName: payu-api
  production: true
