# Istio ingress gateway for the preprod API on the shared domain.
#
# Mirrors infrastructure/platform/mesh/ingress/gateway.yaml (MESH-008).
# OSSM 3.4 (Sail Operator) reconciles a gateway.networking.k8s.io/v1 Gateway
# with gatewayClassName: istio into an istio-proxy Deployment + Service named
# <gateway>-istio in the Gateway's own namespace.
#
# networking.istio.io/service-type: ClusterIP keeps the generated Service
# internal: the shared OpenShift router is the only public entry point, so no
# second AWS NLB is provisioned.
#
# The gateway never owns the domain: it is a backend behind the shared
# router (ADR-0073).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: payu-public-gateway-preprod
  namespace: payu-mesh-gateway-preprod
  annotations:
    networking.istio.io/service-type: ClusterIP
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: service-mesh
spec:
  gatewayClassName: istio
  listeners:
    # The shared router terminates TLS (edge) and forwards plain HTTP here,
    # so the gateway listener is HTTP only — no certificate is needed here.
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: payu
