# Mesh routing for the preprod API.
#
# Mirrors infrastructure/platform/mesh/ingress/http-route.yaml (MESH-008).
# The route lives in payu-preprod (namespace of the backend) so the backendRef
# needs no ReferenceGrant; the gateway lives in payu-mesh-gateway-preprod and
# its listener only admits namespaces labelled app.kubernetes.io/part-of: payu.
#
# Only the public API prefixes are routed. Management endpoints of
# gateway-service (/q/metrics, /q/openapi, /q/swagger-ui, /actuator) stay
# unreachable from the internet: the shared router forwards everything under
# the host, the mesh gateway answers 404 for anything not matched here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payu-gateway-preprod
  namespace: payu-preprod
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: service-mesh
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: payu-public-gateway-preprod
      namespace: payu-mesh-gateway-preprod
      sectionName: http
  hostnames:
    - api-preprod.apps.fajjjar.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
        - path:
            type: PathPrefix
            value: /v1/partner
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-PayU-Environment
                value: preprod
              - name: X-PayU-Ingress
                value: gateway-api
      backendRefs:
        - group: ""
          kind: Service
          name: gateway-service
          port: 8080
          # explicit: the API server defaults weight to 1, so without this
          # every `oc apply` reports the object as changed
          weight: 1
