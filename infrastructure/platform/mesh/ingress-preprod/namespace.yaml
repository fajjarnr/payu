# Dedicated namespace for the Istio ingress gateway that fronts the preprod
# API on the shared domain apps.fajjjar.my.id.
#
# Mirrors infrastructure/platform/mesh/ingress/namespace.yaml (MESH-008):
# the shared OpenShift IngressController (shared-ingress) only admits Routes
# from namespaces labelled payu.fajjjar.my.id/ingress: shared. This namespace
# carries that label; payu-preprod and istio-system deliberately do NOT, so
# the live workloads stay on the default IngressController.
#
# app.kubernetes.io/part-of: payu is the label the Gateway listener's
# allowedRoutes namespace selector matches on.
apiVersion: v1
kind: Namespace
metadata:
  name: payu-mesh-gateway-preprod
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: service-mesh
    payu.fajjjar.my.id/ingress: shared
