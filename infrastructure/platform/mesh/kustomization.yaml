# Kustomization for OpenShift Service Mesh 3.x (Sail Operator)
# OSSM 3.x uses sailoperator.io/v1 instead of maistra.io/v2

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources in order of application:
# 1. Namespace + control plane support (network policies, HPA, PDB)
# 2. IstioCNI (must be ready before Istio CR)
# 3. Istio CR (creates the control plane: istiod + ingress/egress gateways)
# 4. Gateway + VirtualService (depends on control plane)
# 5. DestinationRules (depends on control plane)
# 6. PeerAuthentication + AuthorizationPolicy (depends on services being in mesh)
# 7. Rate limit service (depends on control plane)
# 8. Security headers (depends on ingress gateway)
resources:
  - control-plane.yaml
  - istio-cni.yaml
  - service-mesh.yaml
  - gateway.yaml
  - destination-rules.yaml
  - peer-authentication.yaml
  - ratelimit-service.yaml
  - security-headers.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: payu
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/component: service-mesh
    includeSelectors: true

configMapGenerator:
  - name: mesh-config
    literals:
      - MESH_ID=mesh1
      - TRUST_DOMAIN=payu.local
      - ENABLE_AUTO_MTLS=true
      - ENABLE_TRACING=true
      - TRACING_SAMPLING=10000

# `payu-ingress-cert` and `payu-ingress-ca` are provisioned externally by the
# certificate workflow. Private keys must not be kept in this repository.

images:
  - name: gcr.io/istio-testing/pilot
    newName: registry.redhat.io/openshift-service-mesh/istio-pilot-rhel8
    newTag: 2.6.0
  - name: gcr.io/istio-testing/proxyv2
    newName: registry.redhat.io/openshift-service-mesh/istio-proxyv2-rhel8
    newTag: 2.6.0
