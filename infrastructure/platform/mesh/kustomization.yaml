# Root entrypoint for the OpenShift Service Mesh 3.4 control plane.
#
# OSSM 3.x installs the control plane through the sailoperator.io/v1
# `Istio` and `IstioCNI` custom resources — there is no
# ServiceMeshControlPlane/ServiceMeshMemberRoll any more (ADR-0069).
#
# `base/` holds the cluster-wide control plane: the istio-system and
# istio-cni namespaces, the IstioCNI CR and the Istio CR. Per-environment
# policy overlays live in `overlays/<env>/` and are applied on top of this
# root:
#
#   oc apply -k infrastructure/platform/mesh
#   oc apply -k infrastructure/platform/mesh/overlays/payu-dev
#
# The overlays are deliberately not referenced from here: the payu-dev
# overlay sets `namespace: payu-dev`, which would move the namespaced
# `Istio` CR out of istio-system and break the control plane.
#
# Labels are applied by base/kustomization.yaml (includeSelectors: false),
# so this root stays free of transformers and image overrides.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base
