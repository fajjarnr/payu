# Dev mesh posture: PERMISSIVE mTLS for payu-dev.
#
# Dev runs PERMISSIVE at the mesh layer so the plain-text path stays usable
# while debugging; NetworkPolicy carries the dev ingress/egress rules.
# STRICT mTLS is enforced from UAT upward — see ADR-0037
# (docs/adr/0037-internal-synchronous-inter-service-communication-via-grpc-and-protobuf-governance.md)
# and docs/architecture/DEVSECOPS_ARCHITECTURE.md.
#
# Namespace-scoped on purpose: a mesh-wide (istio-system) STRICT policy would
# also bind the sibling payu-sit / payu-uat namespaces on this same cluster.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: permissive-mtls
  namespace: payu-dev
spec:
  mtls:
    mode: PERMISSIVE
