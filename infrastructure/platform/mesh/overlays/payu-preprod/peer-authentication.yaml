# Pre-production mesh posture: STRICT mTLS for payu-preprod, plaintext on edge ports.
#
# STRICT from UAT upward per ADR-0037, but the OpenShift router speaks
# plain HTTP to the pods (UAT L-496: filter_chain_not_found → 502 without
# a port-level exception).
#
# Namespace-scoped on purpose: a mesh-wide (istio-system) STRICT policy would
# also bind the sibling payu-dev / payu-sit / payu-uat namespaces on this same
# cluster.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: strict-mtls
  namespace: payu-preprod
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: edge-plaintext-8080
  namespace: payu-preprod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: payu
  mtls:
    mode: STRICT
  portLevelMtls:
    8080:
      mode: PERMISSIVE
