# MESH-013: UAT external hosts for the mesh (ServiceEntry, MESH_EXTERNAL).
#
# Hosts are taken from repo config only — nothing invented:
# - api-sandbox.bifast.or.id / api-sandbox.qris-processor.co.id:
#   SERVICES_BIFAST_URL / SERVICES_QRIS_URL defaults in
#   backend/transaction-service/src/main/resources/application-uat.yml
# - sso-uat.payu.id: OIDC issuer default in
#   backend/*/src/main/resources/application-uat.yml
# All UAT external calls are https, so only port 443 is declared.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: payu-external-services
  namespace: payu-uat
spec:
  hosts:
    - api-sandbox.bifast.or.id
    - api-sandbox.qris-processor.co.id
    - sso-uat.payu.id
  ports:
    - number: 443
      name: https
      protocol: TLS
  location: MESH_EXTERNAL
  resolution: DNS
