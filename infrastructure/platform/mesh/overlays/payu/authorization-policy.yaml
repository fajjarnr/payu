# MESH-001: prod zero-trust policy for the `payu` namespace (OSSM 3.4).
#
# Reworked from the legacy `base/peer-authentication.yaml`
# AuthorizationPolicy / RequestAuthentication section (MESH-001): every
# `app:` selector there never matched the real workload labels
# (`app.kubernetes.io/name:` on Deployments/pods), so those policies
# selected nothing. This package is the single source: `overlays/payu/` —
# no new directory, no per-env fan-out — chosen because the same two files
# (peer-authentication.yaml + service-entry.yaml, MESH-013) already live
# there and the kustomization's `namespace: payu` transformer scopes every
# object to the prod namespace.
#
# Namespace-wide default is namespace-scoped AuthorizationPolicy only
# (per-namespace DENY-by-default: no selector, empty spec); the namespace
# STRICT mTLS already lives in overlays/payu/peer-authentication.yaml
# (MESH-002). Principals use trustDomain payu.local (live Istio CR) and the
# real ServiceAccount names (infrastructure/workloads/base/*/serviceaccount.yaml,
# e.g. `auth-service` in namespace `payu`). Gateway rules reference the
# Gateway-API gateway namespace (payu-mesh-gateway, MESH-008 follow-up will
# add its own prod gateway) via source.namespaces, not the removed
# istio-ingressgateway ServiceAccount principal.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: payu
spec: {}
---
# AuthorizationPolicy: Allow Same Namespace
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-same-namespace
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: payu
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - payu
---
# AuthorizationPolicy: Account Service Specific Rules
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: account-service-policy
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: account-service
  action: ALLOW
  rules:
    # Allow from gateway + in-namespace services
    - from:
        - source:
            namespaces:
              - payu-mesh-gateway
              - payu
      to:
        - operation:
            methods:
              - GET
              - POST
              - PUT
              - PATCH
            paths:
              - /v1/accounts/*
    # Allow from auth-service (for account verification)
    - from:
        - source:
            principals:
              - payu.local/ns/payu/sa/auth-service
      to:
        - operation:
            methods:
              - GET
            paths:
              - /v1/accounts/*/verify
---
# AuthorizationPolicy: Transaction Service Specific Rules
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: transaction-service-policy
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
  action: ALLOW
  rules:
    # Allow from gateway + in-namespace services
    - from:
        - source:
            namespaces:
              - payu-mesh-gateway
              - payu
      to:
        - operation:
            methods:
              - POST
              - GET
            paths:
              - /v1/transactions/*
    # Allow from wallet-service (for balance operations)
    - from:
        - source:
            principals:
              - payu.local/ns/payu/sa/wallet-service
      to:
        - operation:
            methods:
              - POST
            paths:
              - /v1/transactions/internal/*
    # Allow from account-service (for account validation)
    - from:
        - source:
            principals:
              - payu.local/ns/payu/sa/account-service
      to:
        - operation:
            methods:
              - GET
            paths:
              - /v1/transactions/internal/accounts/*
---
# AuthorizationPolicy: Wallet Service Specific Rules
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: wallet-service-policy
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-service
  action: ALLOW
  rules:
    # Allow from gateway + in-namespace services
    - from:
        - source:
            namespaces:
              - payu-mesh-gateway
              - payu
      to:
        - operation:
            methods:
              - GET
              - POST
            paths:
              - /v1/wallet/*
    # Allow from transaction-service (for balance updates)
    - from:
        - source:
            principals:
              - payu.local/ns/payu/sa/transaction-service
      to:
        - operation:
            methods:
              - POST
              - PUT
            paths:
              - /v1/wallet/internal/*
---
# AuthorizationPolicy: Auth Service Specific Rules
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: auth-service-policy
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  action: ALLOW
  rules:
    # Allow from gateway (public endpoints)
    - from:
        - source:
            namespaces:
              - payu-mesh-gateway
      to:
        - operation:
            methods:
              - POST
              - GET
            paths:
              - /v1/auth/*
    # Allow from any in-namespace service (for token validation)
    - from:
        - source:
            namespaces:
              - payu
      to:
        - operation:
            methods:
              - POST
            paths:
              - /v1/auth/validate
              - /v1/auth/introspect
---
# AuthorizationPolicy: KYC Service Specific Rules
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: kyc-service-policy
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-service
  action: ALLOW
  rules:
    # Allow from gateway + in-namespace services
    - from:
        - source:
            namespaces:
              - payu-mesh-gateway
              - payu
      to:
        - operation:
            methods:
              - POST
              - GET
            paths:
              - /v1/kyc/*
    # Allow from account-service (for KYC verification)
    - from:
        - source:
            principals:
              - payu.local/ns/payu/sa/account-service
      to:
        - operation:
            methods:
              - POST
              - GET
            paths:
              - /v1/kyc/internal/*
---
# RequestAuthentication: JWT Validation for Account Service
#
# Issuer is the live prod SSO from the payu-prod workload overlay
# (sso-prod.apps.fajjjar.my.id), not the stale sso.payu.fajjjar.my.id in
# the legacy file.
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: account-service-jwt
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: account-service
  jwtRules:
    - issuer: "https://sso-prod.apps.fajjjar.my.id/realms/payu"
      jwksUri: https://sso-prod.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
      outputPayloadToHeader: x-jwt-payload-account
---
# RequestAuthentication: JWT Validation for Transaction Service
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: transaction-service-jwt
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
  jwtRules:
    - issuer: "https://sso-prod.apps.fajjjar.my.id/realms/payu"
      jwksUri: https://sso-prod.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
      outputPayloadToHeader: x-jwt-payload-transaction
---
# RequestAuthentication: JWT Validation for Wallet Service
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: wallet-service-jwt
  namespace: payu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-service
  jwtRules:
    - issuer: "https://sso-prod.apps.fajjjar.my.id/realms/payu"
      jwksUri: https://sso-prod.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
      outputPayloadToHeader: x-jwt-payload-wallet
