# Mesh telemetry for the PayU dev mesh (OSSM 3.4 / Sail Operator).
#
# Scrapes the Envoy sidecar metrics of the meshed workloads in payu-dev
# (port 15090) and the istiod control-plane metrics (port 15014) into the
# OpenShift cluster Prometheus. That Prometheus is the only one the Kiali CR
# queries (https://thanos-querier.openshift-monitoring.svc:9091), and it
# holds no istio_* series today, which is why the Kiali service graph
# renders empty.
#
# Why the cluster Prometheus instead of user-workload monitoring:
# - the cluster Prometheus (openshift-monitoring/k8s) selects ServiceMonitors
#   only in namespaces labelled openshift.io/cluster-monitoring=true
#   (spec.serviceMonitorNamespaceSelector); this cluster runs no
#   user-workload Prometheus, so there is no other scrape target.
# - Kiali is pinned to thanos-querier, which fronts the cluster Prometheus.
#   Metrics scraped anywhere else would never reach the service graph.
#
# Applied separately from infrastructure/platform/mesh/base:
#   oc apply -k infrastructure/platform/mesh/telemetry
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - servicemonitor.yaml
  - rbac.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: payu
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/component: service-mesh
    includeSelectors: false
