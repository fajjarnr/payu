apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: payu-public-gateway
  namespace: istio-system
  labels:
    app.kubernetes.io/name: payu-public-gateway
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: service-mesh
spec:
  gatewayClassName: istio
  addresses:
    - type: Hostname
      value: istio-ingressgateway.istio-system.svc.cluster.local
  listeners:
    - name: http
      # Reuse the existing Istio ingress Service exposed by ServiceMeshControlPlane.
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: payu
    - name: https
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: payu-ingress-cert
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: payu
