###############################################################################
# RHBK - KeycloakRealmImport
# Separate from Keycloak CR to allow independent realm updates.
# Apply after Keycloak CR is running.
###############################################################################
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: payu-realm-import
  namespace: payu-sso
  labels:
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
spec:
  keycloakCRName: payu-keycloak
  realm:
    realm: payu
    displayName: PayU Digital Banking
    enabled: true
    sslRequired: external
    registrationAllowed: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: true
    bruteForceProtected: true
    rememberMe: true
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 43200
    ssoSessionIdleTimeoutRememberMe: 0
    ssoSessionMaxLifespanRememberMe: 0
    offlineSessionIdleTimeout: 2592000
    accessTokenLifespan: 300
    accessTokenLifespanForImplicitFlow: 900
    # --- Realm Roles ---
    roles:
      realm:
        - name: USER
          description: Standard customer user role
          composite: false
          clientRole: false
        - name: ADMIN
          description: Administrator role with full access
          composite: false
          clientRole: false
        - name: BACKOFFICE
          description: Backoffice staff role
          composite: false
          clientRole: false
        - name: KYC_VERIFIED
          description: User with completed KYC verification
          composite: false
          clientRole: false
        - name: PREMIUM
          description: Premium user with access to investment and lending
          composite: false
          clientRole: false

    # --- Users (dev/test only — never commit prod credentials) ---
    users:
      - username: customer1
        enabled: true
        emailVerified: true
        email: customer1@payu.fajjjar.my.id
        firstName: Customer
        lastName: One
        attributes:
          phoneNumber:
            - "+6281234567890"
          nik:
            - "3201234567890001"
          externalId:
            - "EXT-CUST-001"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - USER
          - KYC_VERIFIED
          - PREMIUM

      - username: customer2
        enabled: true
        emailVerified: true
        email: customer2@payu.fajjjar.my.id
        firstName: Customer
        lastName: Two
        attributes:
          phoneNumber:
            - "+6281234567891"
          nik:
            - "3201234567890002"
          externalId:
            - "EXT-CUST-002"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - USER

      - username: admin
        enabled: true
        emailVerified: true
        email: admin@payu.fajjjar.my.id
        firstName: System
        lastName: Administrator
        attributes:
          phoneNumber:
            - "+628111111111"
          externalId:
            - "EXT-ADMIN-001"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - ADMIN
          - USER

      - username: backoffice
        enabled: true
        emailVerified: true
        email: backoffice@payu.fajjjar.my.id
        firstName: Backoffice
        lastName: Staff
        attributes:
          phoneNumber:
            - "+628222222222"
          employeeId:
            - "EMP-001"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - BACKOFFICE
          - USER

    # --- Clients ---
    clients:
      - clientId: payu-web-app
        name: PayU Web Application
        description: "Next.js 15 web application for PayU Digital Banking — BFF + DPoP RFC9449 + PKCE S256"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: payu-web-secret-dev-2026!
        redirectUris:
          - "https://payu-dev.apps.fajjjar.my.id/api/auth/callback"
          - "https://payu-dev.apps.fajjjar.my.id/*"
          - "https://payu.fajjjar.my.id/*"
          - "http://localhost:3001/*"
        webOrigins:
          - "https://payu-dev.apps.fajjjar.my.id"
          - "https://payu.fajjjar.my.id"
          - "http://localhost:3001"
          - "+"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        protocol: openid-connect
        attributes:
          access.token.lifespan: "300"
          pkce.code.challenge.method: "S256"
          dpop.bound.access.tokens: "false"
          DPoPBound: "false"
          oauth2.device.authorization.grant.enabled: "false"
        protocolMappers:
          - name: preferred_username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: preferred_username
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: preferred_username
              jsonType.label: String
          - name: phone
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: phoneNumber
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: phone_number
              jsonType.label: String
          - name: nik
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: nik
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: nik
              jsonType.label: String
      - clientId: payu-backend
        name: PayU Backend Services
        description: "Backend microservices for PayU platform"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: payu-backend-secret-dev-2026!
        redirectUris:
          - "http://localhost:8080/*"
          - "*"
        webOrigins:
          - "+"
        publicClient: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: true
        protocol: openid-connect

      - clientId: payu-gateway
        name: PayU API Gateway
        description: "Quarkus API Gateway for routing and OIDC validation"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: payu-gateway-secret-dev-only
        redirectUris:
          - "http://localhost:8080/*"
        webOrigins:
          - "http://localhost:8080"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: false
        protocol: openid-connect
      - clientId: payu-mobile
        name: PayU Mobile App
        description: "React Native mobile application — DPoP RFC9449 + PKCE S256"
        enabled: true
        redirectUris:
          - "payu://auth/*"
          - "exp://payu.auth/*"
        webOrigins:
          - "payu://auth"
          - "exp://payu.auth"
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        protocol: openid-connect
        attributes:
          pkce.code.challenge.method: "S256"
          dpop.bound.access.tokens: "true"
          DPoPBound: "true"
          oauth2.device.authorization.grant.enabled: "true"
    # --- Browser Security Headers ---
    browserSecurityHeaders:
      contentSecurityPolicyReportOnly: ""
      xContentTypeOptions: nosniff
      xRobotsTag: none
      xFrameOptions: SAMEORIGIN
      contentSecurityPolicy: ""
      xXSSProtection: "1; mode=block"
      strictTransportSecurity: "max-age=31536000; includeSubDomains"
