apiVersion: v1
kind: Service
metadata:
  name: payu-keycloak-service
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/component: sso
    app.kubernetes.io/part-of: payu
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    app: keycloak
    app.kubernetes.io/instance: payu-keycloak
