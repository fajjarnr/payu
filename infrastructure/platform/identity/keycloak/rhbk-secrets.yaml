###############################################################################
# Red Hat Build of Keycloak (RHBK) - Secrets
#
# RHBK uses a different secret format than RHSSO:
# - Bootstrap admin:  payu-keycloak-admin (username + password)
# - Database:         payu-keycloak-db   (username + password)
#
# Referenced by Keycloak CR spec.bootstrapAdmin.user.secret
#   and spec.db.usernameSecret / spec.db.passwordSecret
#
# WARNING: These are DEVELOPMENT-ONLY placeholder values.
# DO NOT use these values in staging or production environments.
# For staging/prod, use SealedSecrets, ExternalSecrets, or Vault.
#
# NOTE: Update passwords before applying in production!
#       Consider using SealedSecrets or ExternalSecrets for production.
###############################################################################
---
# Bootstrap Admin Secret
apiVersion: v1
kind: Secret
metadata:
  name: payu-keycloak-admin
  labels:
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
type: Opaque
stringData:
  username: admin
  password: "payu-keycloak-admin-dev-only"
---
# Database Credentials Secret (for RHBK Keycloak CR)
apiVersion: v1
kind: Secret
metadata:
  name: payu-keycloak-db
  labels:
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
type: Opaque
stringData:
  username: keycloak
  password: "keycloak-dev-password"
