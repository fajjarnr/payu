###############################################################################
# Red Hat Build of Keycloak (RHBK) - Keycloak CR
# Migrated from RHSSO (keycloak.org/v1alpha1) → RHBK (k8s.keycloak.org/v2alpha1)
# API Reference: https://www.keycloak.org/operator/basic-deployment
#
# IMPORTANT:
# 1. Install the rhbk-operator in payu-sso namespace.
# 2. Apply this Keycloak CR to payu-sso namespace.
# 3. payu-keycloak-db secret MUST exist in payu-sso namespace.
# 4. The 'keycloak' database must exist in the PostgresCluster.
# 5. Hostname is set via environment overlay (see overlays/).
###############################################################################
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: payu-keycloak
  namespace: payu-sso
  labels:
    app: payu-keycloak
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
spec:
  instances: 1

  # --- Bootstrap Admin (initial admin user) ---
  bootstrapAdmin:
    user:
      secret: payu-keycloak-admin

  # --- Database Configuration (Crunchy PGO) ---
  db:
    vendor: postgres
    host: payu-postgres.payu-sso.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: payu-keycloak-db
      key: username
    passwordSecret:
      name: payu-keycloak-db
      key: password

  # --- HTTP Configuration ---
  http:
    httpEnabled: true
    httpPort: 8080
    httpsPort: 8443

  # --- Hostname Configuration ---
  # Override per environment via overlay patch
  hostname:
    hostname: ${KEYCLOAK_HOSTNAME:sso-payu-dev.apps.payu.ocp.fajjjar.my.id}
    admin: ${KEYCLOAK_ADMIN_HOSTNAME:sso.payu.fajjjar.my.id}
    strict: false
    backchannelDynamic: true

  # --- Ingress (OpenShift Route) ---
  ingress:
    enabled: true

  # --- Proxy Headers ---
  proxy:
    headers: xforwarded

  # --- Features ---
  features:
    enabled:
      - token-exchange
      - admin-fine-grained-authz

  # --- Additional Keycloak server options ---
  additionalOptions:
    # Health endpoint
    - name: health-enabled
      value: "true"
    # Metrics endpoint (for Prometheus)
    - name: metrics-enabled
      value: "true"
