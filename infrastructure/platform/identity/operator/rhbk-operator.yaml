apiVersion: v1
kind: Namespace
metadata:
  name: payu-sso
  labels:
    app.kubernetes.io/name: payu-sso
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhbk-operator-group
  namespace: payu-sso
spec:
  targetNamespaces:
    - payu-sso
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: payu-sso
spec:
  channel: stable-v26
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
