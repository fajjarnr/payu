apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PayU Identity - Dev Overlay
# Dev-specific patches for identity infrastructure
# Apply with: oc apply -k infrastructure/platform/identity/overlays/dev/

resources:
  - ../common

namespace: payu-dev

# Dev-specific patches
patches:
  # Keycloak: Dev (1 instance)
  - target:
      kind: Keycloak
      name: payu-keycloak
    patch: |
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/hostname/hostname
        value: https://sso.dev.payu.fajjjar.my.id
  - target:
      kind: KeycloakRealmImport
      name: payu-realm-import
    patch: |
      - op: replace
        path: /spec/realm/clients/0/redirectUris
        value:
          - http://localhost:3001/*
          - https://dev.payu.fajjjar.my.id/*
      - op: replace
        path: /spec/realm/clients/0/webOrigins
        value:
          - http://localhost:3001
          - https://dev.payu.fajjjar.my.id
          - "+"
