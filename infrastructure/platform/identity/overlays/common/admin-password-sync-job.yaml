# IDN-002 — GitOps-only master admin password reconciliation.
# Problem: `payu-keycloak-admin` secret only takes effect at RHBK bootstrap
# (empty DB). If the live master admin password drifts (wrong password for
# both the live secret and git; e.g. SIT `payu-sit-kc-admin-2026`), no
# declarative path existed to converge it back to the git-managed value —
# operators had to reset the DB or log in via the Keycloak console.
#
# This PostSync hook logs into the master realm with the git secret
# credentials and resets the master admin user's password to the same value.
# It is idempotent (resetting to the current value is a no-op) and fails
# loudly (non-zero exit) when even the git credentials do not work, so the
# operator knows manual intervention is required.
#
# Apply: `oc apply -n payu-sso -f admin-password-sync-job.yaml`
# As Argo hook it runs after each identity sync (HookSucceeded self-cleanup).
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-admin-password-sync
  namespace: payu-sso
  labels:
    app.kubernetes.io/name: payu-keycloak
    payu.io/component: identity-reconcile
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payu-keycloak
        payu.io/component: identity-reconcile
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              KC="http://payu-keycloak-service:8080"
              USER_NAME="$(cat /etc/payu-keycloak-admin/username)"
              PW="$(cat /etc/payu-keycloak-admin/password)"

              token() {
                curl -s --max-time 15 -X POST "$KC/realms/master/protocol/openid-connect/token" \
                  -d grant_type=password -d client_id=admin-cli \
                  -d "username=$1" -d "password=$PW" \
                  | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p'
              }

              BEFORE="$(token "$USER_NAME")"
              if [ -z "$BEFORE" ]; then
                echo "keycloak-admin-password-sync: git credentials FAILED for user '$USER_NAME' on $KC" >&2
                echo "manual intervention required: reset the master admin password via Keycloak console" >&2
                exit 1
              fi
              echo "keycloak-admin-password-sync: git credentials valid for '$USER_NAME'"

              # Idempotent convergence: reset master user password to the git value.
              # The admin endpoint takes the user UUID, not the username.
              USER_ID="$(curl -s --max-time 15 -H "Authorization: Bearer $BEFORE" \
                "$KC/admin/realms/master/users?username=$USER_NAME&exact=true" \
                | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)"
              if [ -z "$USER_ID" ]; then
                echo "keycloak-admin-password-sync: could not resolve user id for '$USER_NAME'" >&2
                exit 1
              fi
              code="$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' \
                -X PUT "$KC/admin/realms/master/users/$USER_ID/reset-password" \
                -H "Authorization: Bearer $BEFORE" -H 'Content-Type: application/json' \
                -d "{\"type\":\"password\",\"value\":\"$PW\",\"temporary\":false}")"
              if [ "$code" != "204" ]; then
                echo "keycloak-admin-password-sync: reset-password unexpected status $code" >&2
                exit 1
              fi

              AFTER="$(token "$USER_NAME")"
              if [ -z "$AFTER" ]; then
                echo "keycloak-admin-password-sync: login FAILED after reset" >&2
                exit 1
              fi
              echo "keycloak-admin-password-sync: OK master admin password converged to git secret value"
          volumeMounts:
            - name: keycloak-admin
              mountPath: /etc/payu-keycloak-admin
              readOnly: true
      volumes:
        - name: keycloak-admin
          secret:
            secretName: payu-keycloak-admin
