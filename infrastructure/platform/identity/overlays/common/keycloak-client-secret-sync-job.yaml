# E2E-CLIENTSECRET-001 — converge the realm client secrets to the ESO values.
# Problem: `keycloak-db-secret-sync.yaml` mirrors the ESO-generated
# `payu-keycloak-client-secrets` (payu-dev) into the `payu-sso` namespace, but
# nothing writes those values into the `payu` realm in Keycloak's own
# database. The realm import only seeds on creation, and the payu-dev overlay
# deletes the import CR (L-377), so a fresh cluster ends up with realm
# secrets != ESO secrets and `client_credentials` logins fail with
# `unauthorized_client` until an operator syncs them by hand.
#
# This PostSync hook reads the mirrored `payu-keycloak-client-secrets` in
# `payu-sso` (same values as payu-dev) and PUTs them onto the matching realm
# clients. It is idempotent (setting the current secret is a no-op) and fails
# loudly (non-zero exit) when the realm or the clients cannot be reached, so
# the operator knows manual intervention is required.
#
# Apply: `oc apply -n payu-sso -f keycloak-client-secret-sync-job.yaml`
# As Argo hook it runs after each identity sync (HookSucceeded self-cleanup).
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-client-secret-sync
  namespace: payu-sso
  labels:
    app.kubernetes.io/name: payu-keycloak
    payu.io/component: identity-reconcile
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payu-keycloak
        payu.io/component: identity-reconcile
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              KC="http://payu-keycloak-service:8080"
              REALM="payu"
              USER_NAME="$(cat /etc/payu-keycloak-admin/username)"
              PW="$(cat /etc/payu-keycloak-admin/password)"
              BACKEND_SECRET="$(cat /etc/payu-keycloak-client-secrets/payu-backend-client-secret)"
              WEB_SECRET="$(cat /etc/payu-keycloak-client-secrets/payu-web-client-secret)"

              TOKEN="$(curl -s --max-time 15 -X POST "$KC/realms/master/protocol/openid-connect/token" \
                -d grant_type=password -d client_id=admin-cli \
                --data-urlencode "username=$USER_NAME" --data-urlencode "password=$PW" \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
              if [ -z "$TOKEN" ]; then
                echo "keycloak-client-secret-sync: master login FAILED for user '$USER_NAME' on $KC" >&2
                exit 1
              fi

              # L-482: POST .../client-secret IGNORES {"value":...} and regenerates
              # a random secret (200 with a value we never sent) — the only write
              # path that honors our value is GET-modify-PUT on the client
              # representation. Escape " and \ so the JSON stays valid.
              converge() {
                CLIENT_ID="$1"
                SECRET="$2"
                UUID="$(curl -s --max-time 15 -H "Authorization: Bearer $TOKEN" \
                  "$KC/admin/realms/$REALM/clients?clientId=$CLIENT_ID" \
                  | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)"
                if [ -z "$UUID" ]; then
                  echo "keycloak-client-secret-sync: client '$CLIENT_ID' not found in realm '$REALM'" >&2
                  exit 1
                fi
                ESCAPED="$(printf '%s' "$SECRET" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')"
                BODY="$(curl -s --max-time 15 -H "Authorization: Bearer $TOKEN" \
                  "$KC/admin/realms/$REALM/clients/$UUID" \
                  | sed -e "s/\"secret\":\"[^\"]*\"/\"secret\":\"$ESCAPED\"/")"
                case "$BODY" in
                  *"\"secret\":\"$ESCAPED\""*) ;;
                  *) echo "keycloak-client-secret-sync: could not set secret field for '$CLIENT_ID'" >&2
                     exit 1 ;;
                esac
                code="$(printf '%s' "$BODY" | curl -s --max-time 15 -o /dev/null -w '%{http_code}' \
                  -X PUT "$KC/admin/realms/$REALM/clients/$UUID" \
                  -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                  -d @-)"
                if [ "$code" != "204" ]; then
                  echo "keycloak-client-secret-sync: PUT client '$CLIENT_ID' unexpected status $code" >&2
                  exit 1
                fi
                echo "keycloak-client-secret-sync: client '$CLIENT_ID' converged"
              }

              converge payu-backend "$BACKEND_SECRET"
              converge payu-web-app "$WEB_SECRET"

              # Prove the new backend secret authenticates before reporting success.
              CHECK="$(curl -s --max-time 15 -X POST "$KC/realms/$REALM/protocol/openid-connect/token" \
                -d grant_type=client_credentials -d client_id=payu-backend \
                --data-urlencode "client_secret=$BACKEND_SECRET" \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
              if [ -z "$CHECK" ]; then
                echo "keycloak-client-secret-sync: client_credentials check FAILED after converge" >&2
                exit 1
              fi
              echo "keycloak-client-secret-sync: OK realm client secrets converged to ESO values"
          volumeMounts:
            - name: keycloak-admin
              mountPath: /etc/payu-keycloak-admin
              readOnly: true
            - name: keycloak-client-secrets
              mountPath: /etc/payu-keycloak-client-secrets
              readOnly: true
      volumes:
        - name: keycloak-admin
          secret:
            secretName: payu-keycloak-admin
        - name: keycloak-client-secrets
          secret:
            secretName: payu-keycloak-client-secrets
