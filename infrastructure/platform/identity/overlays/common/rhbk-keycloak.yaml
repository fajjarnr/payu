###############################################################################
# Red Hat Build of Keycloak (RHBK) - Keycloak CR
# Migrated from RHSSO (keycloak.org/v1alpha1) → RHBK (k8s.keycloak.org/v2beta1)
# API Reference: https://www.keycloak.org/operator/basic-deployment
#
# IMPORTANT:
# 1. Install the rhbk-operator in payu-sso namespace.
# 2. Apply this Keycloak CR via an environment overlay so it lands in payu-dev,
#    payu-sit, payu-uat, payu-preprod, or payu.
# 3. payu-keycloak-db secret MUST exist in the target environment namespace.
# 4. The 'keycloak' database must exist in the PostgresCluster.
###############################################################################
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: payu-keycloak
  labels:
    app: payu-keycloak
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
spec:
  instances: 1

  # --- Bootstrap Admin (initial admin user) ---
  bootstrapAdmin:
    user:
      secret: payu-keycloak-admin

  # --- Database Configuration (CloudNativePG) ---
  db:
    vendor: postgres
    host: payu-database-rw.payu-dev.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: payu-keycloak-db
      key: username
    passwordSecret:
      name: payu-keycloak-db
      key: password

  # --- HTTP Configuration ---
  http:
    httpEnabled: true
    httpPort: 8080
    httpsPort: 8443

  # --- Hostname Configuration ---
  hostname:
    strict: true
    backchannelDynamic: false

  # --- Ingress (OpenShift Route) ---
  ingress:
    enabled: true
    className: openshift-default

  # --- Proxy Headers ---
  proxy:
    headers: xforwarded

  # --- Features ---
  features:
    enabled:
      - token-exchange-standard
      - admin-fine-grained-authz

  # --- Additional Keycloak server options ---
  additionalOptions:
    # Health endpoint
    - name: health-enabled
      value: "true"
    # Metrics endpoint (for Prometheus)
    - name: metrics-enabled
      value: "true"
---
###############################################################################
# RHBK - KeycloakRealmImport
# Replaces RHSSO's separate KeycloakRealm + KeycloakClient CRs
# Single CR for realm, roles, users, and clients
###############################################################################
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: payu-realm-import
  labels:
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-realm
    app.kubernetes.io/part-of: payu
spec:
  keycloakCRName: payu-keycloak
  realm:
    realm: payu
    displayName: PayU Digital Banking
    enabled: true
    sslRequired: external
    registrationAllowed: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: true
    bruteForceProtected: true
    rememberMe: true

    # --- Realm Roles ---
    roles:
      realm:
        - name: USER
          description: Standard customer user role
          composite: false
          clientRole: false
        - name: ADMIN
          description: Administrator role with full access
          composite: false
          clientRole: false
        - name: BACKOFFICE
          description: Backoffice staff role
          composite: false
          clientRole: false
        - name: KYC_VERIFIED
          description: User with completed KYC verification
          composite: false
          clientRole: false
        - name: PREMIUM
          description: Premium user with access to investment and lending
          composite: false
          clientRole: false

    # --- Users (dev/test only — never commit prod credentials) ---
    users:
      - username: customer1
        enabled: true
        emailVerified: true
        email: customer1@payu.fajjjar.my.id
        firstName: Customer
        lastName: One
        attributes:
          phoneNumber:
            - "+6281234567890"
          nik:
            - "3201234567890001"
          externalId:
            - "EXT-CUST-001"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - USER
          - KYC_VERIFIED
          - PREMIUM

      - username: customer2
        enabled: true
        emailVerified: true
        email: customer2@payu.fajjjar.my.id
        firstName: Customer
        lastName: Two
        attributes:
          phoneNumber:
            - "+6281234567891"
          nik:
            - "3201234567890002"
          externalId:
            - "EXT-CUST-002"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - USER

      - username: admin
        enabled: true
        emailVerified: true
        email: admin@payu.fajjjar.my.id
        firstName: System
        lastName: Administrator
        attributes:
          phoneNumber:
            - "+628111111111"
          externalId:
            - "EXT-ADMIN-001"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - ADMIN
          - USER

      - username: backoffice
        enabled: true
        emailVerified: true
        email: backoffice@payu.fajjjar.my.id
        firstName: Backoffice
        lastName: Staff
        attributes:
          phoneNumber:
            - "+628222222222"
          employeeId:
            - "EMP-001"
        credentials:
          - type: password
            value: "P@ssw0rd123"
            temporary: false
        realmRoles:
          - BACKOFFICE
          - USER

    # --- Clients ---
    clients:
      - clientId: payu-web-app
        name: PayU Web Application
        description: "Next.js 15 web application for PayU Digital Banking"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: payu-web-secret-dev-only
        redirectUris:
          - "https://payu.fajjjar.my.id/*"
        webOrigins:
          - "https://payu.fajjjar.my.id"
          - "+"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: false
        protocol: openid-connect
        attributes:
          access.token.lifespan: "3600"
        protocolMappers:
          - name: preferred_username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: preferred_username
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: preferred_username
              jsonType.label: String
          - name: phone
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: phoneNumber
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: phone_number
              jsonType.label: String
          - name: nik
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: nik
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: nik
              jsonType.label: String

      - clientId: payu-backend
        name: PayU Backend Services
        description: "Backend microservices for PayU platform"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: payu-backend-d3v-0nly-a7c2f1e8b4d9063e5c8a2b7f1d4e9a3c
        redirectUris:
          - "http://localhost:8080/*"
          - "*"
        webOrigins:
          - "http://localhost:8080"
          - "+"
        publicClient: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: true
        protocol: openid-connect

      - clientId: payu-gateway
        name: PayU API Gateway
        description: "Quarkus API Gateway for routing and OIDC validation"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: payu-gateway-secret-dev-only
        redirectUris:
          - "http://localhost:8080/*"
        webOrigins:
          - "http://localhost:8080"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: false
        protocol: openid-connect

      - clientId: payu-mobile
        name: PayU Mobile App
        description: "React Native mobile application"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: payu-mobile-secret-dev-only
        redirectUris:
          - "payu://auth/*"
          - "exp://payu.auth/*"
        webOrigins:
          - "payu://auth"
          - "exp://payu.auth"
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: false
        protocol: openid-connect

    # --- Browser Security Headers ---
    browserSecurityHeaders:
      contentSecurityPolicyReportOnly: ""
      xContentTypeOptions: nosniff
      xRobotsTag: none
      xFrameOptions: SAMEORIGIN
      contentSecurityPolicy: ""
      xXSSProtection: "1; mode=block"
      strictTransportSecurity: "max-age=31536000; includeSubDomains"
