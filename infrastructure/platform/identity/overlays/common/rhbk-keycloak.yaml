###############################################################################
# Red Hat Build of Keycloak (RHBK) - Keycloak CR
# Migrated from RHSSO (keycloak.org/v1alpha1) → RHBK (k8s.keycloak.org/v2beta1)
# API Reference: https://www.keycloak.org/operator/basic-deployment
#
# IMPORTANT:
# 1. Install the rhbk-operator in payu-sso namespace.
# 2. Apply this Keycloak CR via an environment overlay so it lands in payu-dev,
#    payu-sit, payu-uat, payu-preprod, or payu.
# 3. payu-keycloak-db secret MUST exist in the target environment namespace.
# 4. The 'keycloak' database must exist in the PostgresCluster.
###############################################################################
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: payu-keycloak
  labels:
    app: payu-keycloak
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-keycloak
    app.kubernetes.io/part-of: payu
spec:
  instances: 1

  # Force a declarative pod-template revision after syncing the DB Secret.
  unsupported:
    podTemplate:
      metadata:
        annotations:
          payu.io/keycloak-db-secret-revision: "2026-08-04"

  # --- Bootstrap Admin (initial admin user) ---
  bootstrapAdmin:
    user:
      secret: payu-keycloak-admin

  # --- Database Configuration (CloudNativePG) ---
  db:
    vendor: postgres
    host: payu-database-rw
    port: 5432
    database: keycloak
    usernameSecret:
      name: payu-keycloak-db
      key: username
    passwordSecret:
      name: payu-keycloak-db
      key: password

  # --- HTTP Configuration ---
  http:
    httpEnabled: true
    httpPort: 8080
    httpsPort: 8443

  # --- Hostname Configuration ---
  hostname:
    strict: true
    backchannelDynamic: false

  # --- Ingress (OpenShift Route) ---
  ingress:
    enabled: true
    className: openshift-shared-ingress

  # --- Proxy Headers ---
  proxy:
    headers: xforwarded

  # --- Features ---
  features:
    enabled:
      - token-exchange-standard
      - admin-fine-grained-authz

  # --- Additional Keycloak server options ---
  additionalOptions:
    # Health endpoint
    - name: health-enabled
      value: "true"
    # Metrics endpoint (for Prometheus)
    - name: metrics-enabled
      value: "true"
---
###############################################################################
# RHBK - KeycloakRealmImport
# Replaces RHSSO's separate KeycloakRealm + KeycloakClient CRs
# Single CR for realm, roles, users, and clients
###############################################################################
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: payu-realm-import
  labels:
    app.kubernetes.io/component: sso
    app.kubernetes.io/name: payu-realm
    app.kubernetes.io/part-of: payu
spec:
  keycloakCRName: payu-keycloak
  placeholders:
    PAYU_WEB_CLIENT_SECRET:
      secret:
        name: payu-keycloak-client-secrets
        key: payu-web-client-secret
    PAYU_BACKEND_CLIENT_SECRET:
      secret:
        name: payu-keycloak-client-secrets
        key: payu-backend-client-secret
  realm:
    realm: payu
    displayName: PayU Digital Banking
    enabled: true
    sslRequired: external
    registrationAllowed: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: true
    bruteForceProtected: true
    rememberMe: true

    # --- Realm Roles ---
    roles:
      realm:
        - name: USER
          description: Standard customer user role
          composite: false
          clientRole: false
        - name: ADMIN
          description: Administrator role with full access
          composite: false
          clientRole: false
        - name: BACKOFFICE
          description: Backoffice staff role
          composite: false
          clientRole: false
        - name: KYC_VERIFIED
          description: User with completed KYC verification
          composite: false
          clientRole: false
        - name: PREMIUM
          description: Premium user with access to investment and lending
          composite: false
          clientRole: false

    users: []

    # --- Clients ---
    clients:
      - clientId: payu-web-app
        name: PayU Web Application
        description: "Next.js 15 web application for PayU Digital Banking"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: ${PAYU_WEB_CLIENT_SECRET}
        redirectUris:
          - "https://payu.fajjjar.my.id/*"
        webOrigins:
          - "https://payu.fajjjar.my.id"
          - "+"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        protocol: openid-connect
        attributes:
          access.token.lifespan: "3600"
        protocolMappers:
          - name: preferred_username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: preferred_username
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: preferred_username
              jsonType.label: String
          - name: phone
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: phoneNumber
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: phone_number
              jsonType.label: String
          - name: nik
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              userinfo.token.claim: "true"
              user.attribute: nik
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: nik
              jsonType.label: String

      - clientId: payu-backend
        name: PayU Backend Services
        description: "Backend microservices for PayU platform"
        enabled: true
        clientAuthenticatorType: client-secret
        secret: ${PAYU_BACKEND_CLIENT_SECRET}
        redirectUris: []
        webOrigins: []
        publicClient: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        protocol: openid-connect

      - clientId: payu-gateway
        name: PayU API Gateway
        description: "Quarkus API Gateway for routing and OIDC validation"
        enabled: true
        clientAuthenticatorType: client-secret
        redirectUris: []
        webOrigins: []
        publicClient: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        protocol: openid-connect

      - clientId: payu-mobile
        name: PayU Mobile App
        description: "React Native mobile application"
        enabled: true
        clientAuthenticatorType: client-secret
        redirectUris:
          - "payu://auth/*"
          - "exp://payu.auth/*"
        webOrigins:
          - "payu://auth"
          - "exp://payu.auth"
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        protocol: openid-connect

    # --- Browser Security Headers ---
    browserSecurityHeaders:
      contentSecurityPolicyReportOnly: ""
      xContentTypeOptions: nosniff
      xRobotsTag: none
      xFrameOptions: SAMEORIGIN
      contentSecurityPolicy: ""
      xXSSProtection: "1; mode=block"
      strictTransportSecurity: "max-age=31536000; includeSubDomains"
