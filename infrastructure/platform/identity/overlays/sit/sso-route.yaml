apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sso-sit
  namespace: payu-sit
  labels:
    app: keycloak
    app.kubernetes.io/instance: payu-keycloak
    app.kubernetes.io/managed-by: platform-team
    app.kubernetes.io/part-of: payu
spec:
  host: sso-sit.apps.fajjjar.my.id
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: payu-keycloak-service
    weight: 100
  wildcardPolicy: None
