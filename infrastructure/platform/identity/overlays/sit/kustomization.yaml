apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../operator
  - ../common
  # Plain secrets replace VaultStaticSecrets (rhbk-externalsecrets.yaml is not
  # wired into common) until Vault/VSO ships (DEVSECOPS-017).
  - keycloak-secrets.yaml

namespace: payu-sit

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: identity-environment
    literals:
      - environment=sit
replacements:
  - source:
      kind: ConfigMap
      name: identity-environment
      fieldPath: data.environment
    targets:
      - select:
          group: secrets.hashicorp.com
          version: v1beta1
          kind: VaultStaticSecret
        fieldPaths:
          - spec.path
        options:
          delimiter: /
          index: 1

patches:
  - target:
      kind: OperatorGroup
      name: rhbk-operator-group
    patch: |
      - op: replace
        path: /spec/targetNamespaces/0
        value: payu-sit
  - target:
      kind: Keycloak
      name: payu-keycloak
    patch: |
      - op: add
        path: /spec/hostname/hostname
        value: https://sso-sit.payu.fajjjar.my.id
  - target:
      kind: KeycloakRealmImport
      name: payu-realm-import
    patch: |
      - op: replace
        path: /spec/realm/clients/0/redirectUris
        value:
          - https://sit.payu.fajjjar.my.id/*
      - op: replace
        path: /spec/realm/clients/0/webOrigins
        value:
          - https://sit.payu.fajjjar.my.id
          - "+"
