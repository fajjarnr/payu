global:
  resolve_timeout: 5m
  # PRODUCTION: Configure a real SMTP relay (e.g., SES, SendGrid). localhost:25 is dev-only.
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@payu.fajjjar.my.id'
  smtp_require_tls: false
  # PRODUCTION: Set slack_api_url globally or per-receiver using ${SLACK_WEBHOOK_URL}
  # PRODUCTION: Set pagerduty_url if using PagerDuty
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    # Critical alerts go to Slack and PagerDuty
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: false
    # Warning alerts go to Slack only
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: false
    # Info alerts go to a separate channel
    - match:
        severity: info
      receiver: 'info-alerts'
      continue: false
    # Business alerts go to business team
    - match:
        team: business
      receiver: 'business-alerts'
      continue: false
    # Platform alerts go to platform team
    - match:
        team: platform
      receiver: 'platform-alerts'
      continue: false
receivers:
  - name: 'default-receiver'
    email_configs:
      # PRODUCTION: Replace with actual ops team distribution list
      - to: 'platform@payu.fajjjar.my.id'
        headers:
          Subject: '[PayU Alert] {{ .GroupLabels.alertname }}'
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:8080/alerts/critical'
        send_resolved: true
    slack_configs:
      # PRODUCTION: Replace with ${SLACK_WEBHOOK_URL} from K8s Secret or Vault
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#payu-critical'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }} *Alert:* {{ .Labels.alertname }} *Severity:* {{ .Labels.severity }} *Service:* {{ .Labels.job }} *Description:* {{ .Annotations.description }} {{ end }}
        send_resolved: true
    pagerduty_configs:
      # PRODUCTION: Replace with ${PAGERDUTY_SERVICE_KEY} from K8s Secret or Vault
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        severity: critical
  - name: 'warning-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#payu-warnings'
        title: 'WARNING: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }} *Alert:* {{ .Labels.alertname }} *Severity:* {{ .Labels.severity }} *Service:* {{ .Labels.job }} *Description:* {{ .Annotations.description }} {{ end }}
        send_resolved: true
  - name: 'info-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#payu-info'
        title: 'INFO: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }} *Alert:* {{ .Labels.alertname }} *Severity:* {{ .Labels.severity }} *Service:* {{ .Labels.job }} *Description:* {{ .Annotations.description }} {{ end }}
        send_resolved: true
  - name: 'business-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#payu-business'
        title: 'BUSINESS ALERT: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }} *Alert:* {{ .Labels.alertname }} *Severity:* {{ .Labels.severity }} *Service:* {{ .Labels.job }} *Description:* {{ .Annotations.description }} {{ end }}
        send_resolved: true
  - name: 'platform-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#payu-platform'
        title: 'PLATFORM ALERT: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }} *Alert:* {{ .Labels.alertname }} *Severity:* {{ .Labels.severity }} *Service:* {{ .Labels.job }} *Description:* {{ .Annotations.description }} {{ end }}
        send_resolved: true
inhibit_rules:
  # Inhibit warning alerts if a critical alert exists for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
  # Inhibit alerts if the service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']
