global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "payu-local"
    environment: "development"
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  # ──────────────────────────────────────────────
  # Core Banking Services (Spring Boot 3.4)
  # ──────────────────────────────────────────────
  - job_name: "account-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["account-service:8001"]
        labels:
          service: "account-service"
          tier: "core"
  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["auth-service:8002"]
        labels:
          service: "auth-service"
          tier: "core"
  - job_name: "transaction-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["transaction-service:8003"]
        labels:
          service: "transaction-service"
          tier: "core"
  - job_name: "wallet-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["wallet-service:8004"]
        labels:
          service: "wallet-service"
          tier: "core"
  # ──────────────────────────────────────────────
  # Supporting Services (Quarkus)
  # ──────────────────────────────────────────────
  - job_name: "billing-service"
    metrics_path: "/q/metrics"
    static_configs:
      - targets: ["billing-service:8080"]
        labels:
          service: "billing-service"
          tier: "supporting"
  - job_name: "notification-service"
    metrics_path: "/q/metrics"
    static_configs:
      - targets: ["notification-service:8080"]
        labels:
          service: "notification-service"
          tier: "supporting"
  - job_name: "gateway-service"
    metrics_path: "/q/metrics"
    static_configs:
      - targets: ["gateway-service:8080"]
        labels:
          service: "gateway-service"
          tier: "gateway"
  - job_name: "api-portal-service"
    metrics_path: "/q/metrics"
    static_configs:
      - targets: ["api-portal-service:8080"]
        labels:
          service: "api-portal-service"
          tier: "supporting"
  # ──────────────────────────────────────────────
  # ML/Analytics Services (FastAPI)
  # ──────────────────────────────────────────────
  - job_name: "kyc-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["kyc-service:8007"]
        labels:
          service: "kyc-service"
          tier: "ml"
  - job_name: "analytics-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["analytics-service:8008"]
        labels:
          service: "analytics-service"
          tier: "ml"
  # ──────────────────────────────────────────────
  # Business & Operations Services (Spring Boot)
  # ──────────────────────────────────────────────
  - job_name: "investment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["investment-service:8080"]
        labels:
          service: "investment-service"
          tier: "business"
  - job_name: "lending-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["lending-service:8087"]
        labels:
          service: "lending-service"
          tier: "business"
  - job_name: "fx-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["fx-service:8080"]
        labels:
          service: "fx-service"
          tier: "business"
  - job_name: "statement-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["statement-service:8080"]
        labels:
          service: "statement-service"
          tier: "business"
  - job_name: "compliance-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["compliance-service:8087"]
        labels:
          service: "compliance-service"
          tier: "business"
  - job_name: "cms-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["cms-service:8080"]
        labels:
          service: "cms-service"
          tier: "business"
  # ──────────────────────────────────────────────
  # Operations Services
  # ──────────────────────────────────────────────
  - job_name: "backoffice-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backoffice-service:8080"]
        labels:
          service: "backoffice-service"
          tier: "operations"
  - job_name: "partner-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["partner-service:8080"]
        labels:
          service: "partner-service"
          tier: "operations"
  - job_name: "promotion-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["promotion-service:8080"]
        labels:
          service: "promotion-service"
          tier: "operations"
  - job_name: "support-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["support-service:8080"]
        labels:
          service: "support-service"
          tier: "operations"
  # ──────────────────────────────────────────────
  # Infrastructure Components (scrape at 30s)
  # ──────────────────────────────────────────────
  - job_name: "postgres-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"
          tier: "data"
  - job_name: "redis-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
          tier: "cache"
  - job_name: "kafka-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: "kafka"
          tier: "messaging"
  # Alertmanager
  - job_name: "alertmanager"
    scrape_interval: 30s
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: "alertmanager"
          tier: "monitoring"
# Alerting Configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
# Rule Files
rule_files:
  - "/etc/prometheus/prometheus-alerts.yml"
