# PayU Digital Banking - Podman Compose Test Environment
# Isolated test environment with clean databases and test data

services:
  # ============================================
  # DATA LAYER (Test-specific)
  # ============================================
  postgres-test:
    image: postgres:17-alpine
    container_name: payu-postgres-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "5433:5432"
    environment:
      # REQUIRED: Set in .env file
      POSTGRES_USER: ${TEST_POSTGRES_USER:-payu_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-payu_test_account}
    volumes:
      - type: persistent
        source: postgres_test_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./infrastructure/containers/init-test-db.sql
        target: /docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payu_test"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  redis-test:
    image: redis:7.4-alpine
    container_name: payu-redis-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # TimescaleDB for Analytics Service
  timescaledb-test:
    image: timescale/timescaledb:2.25.2-pg17
    container_name: payu-timescaledb-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: payu_test_analytics
      # REQUIRED: Set in .env file
      POSTGRES_USER: ${TEST_POSTGRES_USER:-payu_test}
      POSTGRES_PASSWORD: ${TEST_TIMESCALE_PASSWORD:-test_secret}
    volumes:
      - type: persistent
        source: timescaledb_test_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payu_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # MESSAGE BROKER (Test) - KRaft mode (no Zookeeper)
  # ============================================
  kafka-test:
    image: confluentinc/cp-kafka:7.8.7
    container_name: payu-kafka-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "9093:9092"
      - "29093:29092"
    environment:
      # KRaft mode - aligned with AMQ Streams on OpenShift
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # IDENTITY (Test)
  # ============================================
  keycloak-test:
    image: quay.io/keycloak/keycloak:26.5
    container_name: payu-keycloak-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8100:8080"
    environment:
      # REQUIRED: Set in .env file
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-test:5432/keycloak_test
      KC_DB_USERNAME: ${TEST_POSTGRES_USER:-payu_test}
      # REQUIRED: Set in .env file
      KC_DB_PASSWORD: ${TEST_KEYCLOAK_DB_PASSWORD:-test_secret}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xmx512M -Xms256M"
    command: start-dev
    depends_on:
      - postgres-test
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # SIMULATORS (Test)
  # ============================================
  bi-fast-simulator-test:
    build:
      context: ./backend/simulators/bi-fast-simulator
      dockerfile: Containerfile
    container_name: payu-bifast-simulator-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8094:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-test:5432/payu_test_bifast
      QUARKUS_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      QUARKUS_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
    depends_on:
      - postgres-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  dukcapil-simulator-test:
    build:
      context: ./backend/simulators/dukcapil-simulator
      dockerfile: Containerfile
    container_name: payu-dukcapil-simulator-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8095:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-test:5432/payu_test_dukcapil
      QUARKUS_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      QUARKUS_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
    depends_on:
      - postgres-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  qris-simulator-test:
    build:
      context: ./backend/simulators/qris-simulator
      dockerfile: Containerfile
    container_name: payu-qris-simulator-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8096:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-test:5432/payu_test_qris
      QUARKUS_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      QUARKUS_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
    depends_on:
      - postgres-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # CORE BANKING SERVICES (Test)
  # ============================================
  account-service-test:
    build:
      context: ./backend/account-service
      dockerfile: Containerfile
    container_name: payu-account-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8101:8001"
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_account
      SPRING_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
      SERVICES_DUKCAPIL_URL: http://dukcapil-simulator-test:8080
      SERVICES_AUTH_URL: http://auth-service-test:8002
      JAVA_OPTS: >-
        -Xmx384M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      - postgres-test
      - kafka-test
      - dukcapil-simulator-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  auth-service-test:
    build:
      context: ./backend/auth-service
      dockerfile: Containerfile
    container_name: payu-auth-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8102:8002"
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_auth
      SPRING_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      KEYCLOAK_SERVER_URL: http://keycloak-test:8080
      KEYCLOAK_REALM: payu-test
      KEYCLOAK_CLIENT_ID: payu-backend-test
      # REQUIRED: Set in .env file
      KEYCLOAK_CLIENT_SECRET: ${TEST_KEYCLOAK_CLIENT_SECRET:-test_secret}
      JAVA_OPTS: >-
        -Xmx384M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      - postgres-test
      - keycloak-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  transaction-service-test:
    build:
      context: ./backend/transaction-service
      dockerfile: Containerfile
    container_name: payu-transaction-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8103:8003"
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_transaction
      SPRING_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
      SERVICES_WALLET_URL: http://wallet-service-test:8004
      SERVICES_BIFAST_URL: http://bi-fast-simulator-test:8080
      SERVICES_QRIS_URL: http://qris-simulator-test:8080
      JAVA_OPTS: >-
        -Xmx384M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      - postgres-test
      - kafka-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  wallet-service-test:
    build:
      context: ./backend/wallet-service
      dockerfile: Containerfile
    container_name: payu-wallet-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8104:8004"
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/payu_test_wallet
      SPRING_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
      JAVA_OPTS: >-
        -Xmx384M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      - postgres-test
      - kafka-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  billing-service-test:
    build:
      context: ./backend/billing-service
      dockerfile: Containerfile
    container_name: payu-billing-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8105:8080"
    environment:
      QUARKUS_PROFILE: test
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-test:5432/payu_test_billing
      QUARKUS_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      QUARKUS_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
      SERVICES_WALLET_URL: http://wallet-service-test:8004
    depends_on:
      - postgres-test
      - kafka-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  notification-service-test:
    build:
      context: ./backend/notification-service
      dockerfile: Containerfile
    container_name: payu-notification-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8106:8080"
    environment:
      QUARKUS_PROFILE: test
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-test:5432/payu_test_notification
      QUARKUS_DATASOURCE_USERNAME: payu_test
      # REQUIRED: Set in .env file
      QUARKUS_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
    depends_on:
      - postgres-test
      - kafka-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  gateway-service-test:
    build:
      context: ./backend/gateway-service
      dockerfile: Containerfile
    container_name: payu-gateway-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8180:8080"
    environment:
      QUARKUS_PROFILE: test
      QUARKUS_REDIS_HOSTS: redis-test:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
      KEYCLOAK_URL: http://keycloak-test:8080
      ROUTES_ACCOUNT_URL: http://account-service-test:8001
      ROUTES_AUTH_URL: http://auth-service-test:8002
      ROUTES_TRANSACTION_URL: http://transaction-service-test:8003
      ROUTES_WALLET_URL: http://wallet-service-test:8004
      ROUTES_BILLING_URL: http://billing-service-test:8080
      ROUTES_NOTIFICATION_URL: http://notification-service-test:8080
    depends_on:
      - redis-test
      - keycloak-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # ML SERVICES (Test)
  # ============================================
  kyc-service-test:
    build:
      context: ./backend/kyc-service
      dockerfile: Containerfile
    container_name: payu-kyc-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8107:8007"
    environment:
      # REQUIRED: Set in .env file
      DATABASE_URL: postgresql+asyncpg://${TEST_POSTGRES_USER:-payu_test}:${TEST_POSTGRES_PASSWORD:-test_secret}@postgres-test:5432/payu_test_kyc
      KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
      DUKCAPIL_URL: http://dukcapil-simulator-test:8080/api/v1
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - postgres-test
      - kafka-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  analytics-service-test:
    build:
      context: ./backend/analytics-service
      dockerfile: Containerfile
    container_name: payu-analytics-service-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "8108:8008"
    environment:
      # REQUIRED: Set in .env file
      DATABASE_URL: postgresql+asyncpg://${TEST_POSTGRES_USER:-payu_test}:${TEST_TIMESCALE_PASSWORD:-test_secret}@timescaledb-test:5432/payu_test_analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka-test:29092
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - timescaledb-test
      - kafka-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # FRONTEND (Test)
  # ============================================
  web-app-test:
    build:
      context: ./frontend/web-app
      dockerfile: Containerfile
    container_name: payu-web-app-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "3101:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8180/api/v1
      NODE_ENV: test
    depends_on:
      - gateway-service-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  # ============================================
  # MONITORING (Test)
  # ============================================
  jaeger-test:
    image: jaegertracing/all-in-one:1.76.0
    container_name: payu-jaeger-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "5776:5775/udp"
      - "6832:6831/udp"
      - "6833:6832/udp"
      - "5779:5778"
      - "16687:16686"
      - "14269:14268"
      - "14251:14250"
      - "4319:4317"
      - "4320:4318"
      - "9412:9411"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    command:
      - "--collector.otlp.enabled=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/api/services"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  prometheus-test:
    image: prom/prometheus:v2.55.1
    container_name: payu-prometheus-test
    podman_networks:
      - name: payu-test-network
    ports:
      - "9190:9090"
    volumes:
      - type: bind
        source: ./infrastructure/containers/prometheus.yml
        target: /etc/prometheus/prometheus.yml:ro
      - type: persistent
        source: prometheus_test_data
        target: /prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
# ============================================
# VOLUMES (Test)
# ============================================
volumes:
  postgres_test_data:
    driver: local
  timescaledb_test_data:
    driver: local
  prometheus_test_data:
    driver: local
# ============================================
# NETWORKS (Test)
# ============================================
networks:
  payu-test-network:
    driver: bridge
