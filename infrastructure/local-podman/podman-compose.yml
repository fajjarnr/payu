    image: docker.io/jaegertracing/all-in-one:1.76.0
    container_name: payu-jaeger
    podman_networks:
      - name: payu-network
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
      - 14268:14268
      - 14250:14250
      - 4317:4317
      - 4318:4318
      - 9411:9411
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    command:
      - --collector.otlp.enabled=true
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:16686/api/services
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: payu-prometheus
    podman_networks:
      - name: payu-network
    ports:
      - 9090:9090
    volumes:
      - ../containers/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../containers/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9090/-/healthy
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
