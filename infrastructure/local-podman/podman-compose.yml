    - 16686:16686
    - 14268:14268
    - 14250:14250
    - 4317:4317
    - 4318:4318
    - 9411:9411
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    command:
    - --collector.otlp.enabled=true
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:16686/api/services
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    container_name: payu-prometheus
    podman_networks:
    - name: payu-network
    ports:
    - 9090:9090
    volumes:
    - ../containers/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../containers/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --web.enable-lifecycle
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  loki:
    image: docker.io/grafana/loki:2.9.10
    container_name: payu-loki
    podman_networks:
    - name: payu-network
    ports:
    - 3100:3100
    volumes:
    - ../containers/loki-config.yml:/etc/loki/local-config.yaml:ro
    - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3100/ready
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  promtail:
    image: docker.io/grafana/promtail:2.9.10
    container_name: payu-promtail
    podman_networks:
    - name: payu-network
    volumes:
    - ../containers/promtail-config.yml:/etc/promtail/config.yml:ro
    - /var/log:/var/log:ro
    - /var/lib/containers:/var/lib/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
    - loki
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  grafana:
    image: docker.io/grafana/grafana:11.1.4
    container_name: payu-grafana
    podman_networks:
    - name: payu-network
    ports:
    - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
    - ../containers/grafana/provisioning:/etc/grafana/provisioning:ro
    - ../containers/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
    depends_on:
    - prometheus
    - loki
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit
        1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: payu-alertmanager
    podman_networks:
    - name: payu-network
    ports:
    - 9093:9093
    volumes:
    - ../containers/alertmanager-config.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager_data:/alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9093/-/healthy
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    cgroupns: host
    annotation:
      io.containers.autoupdate: registry
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
networks:
  payu-network:
    driver: bridge
