    image: docker.io/grafana/loki:3.5.12
    container_name: payu-loki
    podman_networks:
      - name: payu-network
    ports:
      - 3100:3100
    volumes:
      - ../containers/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:3100/ready
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
  promtail:
    image: docker.io/grafana/promtail:3.5.12
    container_name: payu-promtail
    podman_networks:
      - name: payu-network
    volumes:
      - ../containers/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/containers:/var/lib/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
  grafana:
    image: docker.io/grafana/grafana:11.6.13
    container_name: payu-grafana
    podman_networks:
      - name: payu-network
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../containers/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../containers/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
  alertmanager:
    image: docker.io/prom/alertmanager:v0.31.1
    container_name: payu-alertmanager
    podman_networks:
      - name: payu-network
    ports:
      - 9093:9093
    volumes:
      - ../containers/alertmanager-config.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9093/-/healthy
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: payu-rustfs
    podman_networks:
      - name: payu-network
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-payu-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-payu-secret-key-change-me}
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    command: server /data --console-address :9001
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  rustfs_data:
    driver: local
  rustfs_logs:
    driver: local
networks:
  payu-network:
    driver: bridge
