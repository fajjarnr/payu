services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: payu-postgres
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    podman_networks:
      - name: payu-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      POSTGRES_DB: ${POSTGRES_DB:-payu_account}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../containers/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U payu -d payu_account
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: docker.io/library/redis:7.4-alpine
    container_name: payu-redis
    podman_networks:
      - name: payu-network
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  kafka:
    image: docker.io/confluentinc/cp-kafka:7.8.7
    container_name: payu-kafka
    podman_networks:
      - name: payu-network
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      # KRaft mode (no Zookeeper) - aligned with AMQ Streams on OpenShift
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        - CMD
        - kafka-broker-api-versions
        - --bootstrap-server
        - localhost:9092
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:v0.7.2
    container_name: payu-kafka-ui
    podman_networks:
      - name: payu-network
    ports:
      - 8088:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: payu-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: -Xmx512M -Xms256M
    depends_on:
      - kafka
  vault:
    image: docker.io/hashicorp/vault:1.21
    container_name: payu-vault
    podman_networks:
      - name: payu-network
    ports:
      - 8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    security_opt:
      - label=disable
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test:
        - CMD
        - vault
        - status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: payu-keycloak
    podman_networks:
      - name: payu-network
    ports:
      - 8099:8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-payu}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-payu_secret}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xmx1024M -Xms512M
    volumes:
      - ../../infrastructure/keycloak/payu-realm-export.json:/opt/keycloak/data/import/payu-realm.json:ro,z
    command: start-dev --import-realm
    depends_on:
      - postgres
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
  account-service:
    build:
      context: ../../backend/account-service
      dockerfile: Containerfile
    container_name: payu-account-service
    podman_networks:
      - name: payu-network
    ports:
      - 8001:8080
    environment:
      SERVICES_DUKCAPIL_URL: http://dukcapil-simulator:8080
      SERVICES_AUTH_URL: http://auth-service:8080
      GATEWAY_URL: http://gateway-service:8080
      OTEL_ENDPOINT: http://jaeger:4317
      JAVA_OPTS: -Xmx768M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
      DB_URL: jdbc:postgresql://postgres:5432/payu_account
      DATABASE_URL: jdbc:postgresql://postgres:5432/payu_account
      SERVER_PORT: "8080"
      PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: container
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PAYU_CACHE_REDIS_HOST: redis
      PAYU_CACHE_REDIS_PORT: "6379"
      KAFKA_BROKERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      OIDC_ISSUER: http://keycloak:8080/realms/payu
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/payu/protocol/openid-connect/certs
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payu_account
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-payu-dev-encryption-key-change-in-production-minimum-32-chars}
    depends_on:
      - postgres
      - kafka
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/actuator/health/liveness
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    image: localhost/payu-account-service:1.4.0
  auth-service:
