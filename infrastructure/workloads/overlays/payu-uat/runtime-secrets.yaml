apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payu-runtime-secrets
  labels:
    app.kubernetes.io/part-of: payu
    environment: uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: payu-vault-uat
  target:
    name: payu-runtime-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: payu/uat/workloads/runtime
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payu-security-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: payu-vault-uat
  target:
    name: payu-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET
      remoteRef: {key: payu/uat/workloads/runtime, property: JWT_SECRET}
    - secretKey: BLIND_INDEX_KEY
      remoteRef: {key: payu/uat/workloads/runtime, property: BLIND_INDEX_KEY}
    - secretKey: BLIND_INDEX_PREVIOUS_KEYS
      remoteRef: {key: payu/uat/workloads/runtime, property: BLIND_INDEX_PREVIOUS_KEYS}
    - secretKey: secret-key
      remoteRef: {key: payu/uat/workloads/runtime, property: secret-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payu-session-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: payu-vault-uat
  target:
    name: session-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: next-server-actions-encryption-key
      remoteRef:
        key: payu/uat/workloads/runtime
        property: encryption-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payu-cache-client-tls
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: payu-vault-uat
  target:
    name: payu-cache-client-tls
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: keystore.p12
      remoteRef: {key: payu/uat/cache/client-tls, property: keystore.p12, decodingStrategy: Base64}
    - secretKey: truststore.p12
      remoteRef: {key: payu/uat/cache/client-tls, property: truststore.p12, decodingStrategy: Base64}
    - secretKey: keystore-password
      remoteRef: {key: payu/uat/cache/client-tls, property: keystore-password}
    - secretKey: truststore-password
      remoteRef: {key: payu/uat/cache/client-tls, property: truststore-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payu-keycloak-client-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: payu-vault-uat
  target:
    name: payu-keycloak-client-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: payu-backend-client-secret
      remoteRef:
        key: payu/uat/keycloak/clients
        property: payu-backend
    - secretKey: payu-web-client-secret
      remoteRef:
        key: payu/uat/keycloak/clients
        property: payu-web-app
