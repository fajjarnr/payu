apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-uat
resources:
  - ../../../base/compliance-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/compliance-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-uat/compliance-service
    newTag: "1.18.37"
patches:
  - target:
      kind: Deployment
      name: compliance-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
