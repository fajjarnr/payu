apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-uat
resources:
  - namespace.yaml
  - gateway-route.yaml
  - ../../base
components:
- ../promotion-common
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: workload-environment
  literals:
  - environment=uat
replacements:
- source:
    kind: ConfigMap
    name: workload-environment
    fieldPath: data.environment
  targets:
  - select:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
    fieldPaths:
    - spec.path
    options:
      delimiter: /
      index: 1
images:
- name: image-registry.openshift-image-registry.svc:5000/payu-dev/analytics-service
  newName: image-registry.openshift-image-registry.svc:5000/payu-uat/analytics-service
