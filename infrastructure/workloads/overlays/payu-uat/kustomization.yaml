patches:
# Development still consumes the shared Keycloak instance in payu-sso.
- target:
    kind: ConfigMap
    name: service-endpoints
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: service-endpoints
    data:
      KEYCLOAK_SERVER_URL: http://payu-keycloak-service.payu-uat.svc.cluster.local:8080
      KEYCLOAK_URL: http://payu-keycloak-service.payu-uat.svc.cluster.local:8080
# Web app route uses shared ingress domain (apps.fajjjar.my.id)
- target:
    kind: Route
    name: web-app
  patch: |-
    apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: web-app
      labels:
        ingress.payu.io/class: shared
    spec:
      host: app-uat.apps.fajjjar.my.id
# Env-aligned database credentials + FQDNs (matches data layer CNPG app secret)
- target:
    kind: Secret
    name: db-secrets
  patch: |-
    apiVersion: v1
    kind: Secret
    metadata:
      name: db-secrets
    stringData:
      ANALYTICS_DATABASE_URL: "postgresql+asyncpg://payu:payu-uat-app-pass-2026@payu-database-rw:5432/payu_analytics"
      KYC_DATABASE_URL: "postgresql+asyncpg://payu:payu-uat-app-pass-2026@payu-database-rw:5432/payu_kyc"
      DB_USERNAME: "payu"
      DB_PASSWORD: "payu-uat-app-pass-2026"
