  - gateway-route.yaml
  - ../../base
components:
- ../promotion-common
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: workload-environment
  literals:
  - environment=uat
replacements:
- source:
    kind: ConfigMap
    name: workload-environment
    fieldPath: data.environment
  targets:
  - select:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
    fieldPaths:
    - spec.path
    options:
      delimiter: /
      index: 1
