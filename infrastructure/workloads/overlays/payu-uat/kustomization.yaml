# Keep the single dev replica deployable when the namespace CPU quota has no surge capacity.
- target:
    kind: Deployment
    name: web-app
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web-app
    spec:
      strategy:
        type: Recreate
        rollingUpdate: null

# OIDC Issuer patches - Spring Boot services (OIDC_ISSUER + OIDC_JWK_SET_URI)
- target:
    kind: Deployment
    name: auth-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: OIDC_ISSUER
              value: "https://sso-uat.apps.fajjjar.my.id/realms/payu"
            - name: OIDC_JWK_SET_URI
              value: "https://sso-uat.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "https://sso-uat.apps.fajjjar.my.id/realms/payu"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "https://sso-uat.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
            - name: PAYU_KEYCLOAK_SERVER_URL
              value: "http://payu-keycloak-service.payu-uat.svc.cluster.local:8080"
            - name: PAYU_KEYCLOAK_WEB_CLIENT_ID
              value: "payu-web-app"
            - name: PAYU_KEYCLOAK_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payu-keycloak-client-secrets
                  key: payu-web-client-secret
- target:
    kind: Deployment
    name: backoffice-service
  patch: |
