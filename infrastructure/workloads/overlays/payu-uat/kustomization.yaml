# OIDC Issuer patch - web-app (Next.js) — env-driven via frontend-config ConfigMap (no hardcoded Deployment env)
- target:
    kind: ConfigMap
    name: frontend-config
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: frontend-config
    data:
      OIDC_ISSUER: "https://sso-uat.apps.fajjjar.my.id/realms/payu"
      OIDC_JWK_SET_URI: "https://sso-uat.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
      KEYCLOAK_URL: "https://sso-uat.apps.fajjjar.my.id"
      NEXT_PUBLIC_BASE_URL: "https://uat.payu.fajjjar.my.id"

# Dev-only: use the pre-provisioned runtime key in payu-dev.
- target:
    kind: Deployment
    name: web-app
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web-app
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dev-env-secrets
                  key: encryption-key
                  optional: false

