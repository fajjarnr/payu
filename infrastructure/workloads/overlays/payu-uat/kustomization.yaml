    kind: Deployment
    name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: springdoc-enabled
    spec:
      template:
        spec:
          containers:
            - name: app
              env:
                - name: SPRINGDOC_API_DOCS_ENABLED
                  value: "true"
# UAT runs the same standalone plain Hot Rod cache as dev/SIT (operator
# webhook panics on the CR in this cluster). Strip base mTLS/auth env +
# client-tls volume — mirror of sit-plain-cache.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: uat-plain-cache
    spec:
      template:
        spec:
          containers:
            - name: app
              env:
              - name: PAYU_CACHE_HOTROD_AUTH_USERNAME
                $patch: delete
              - name: PAYU_CACHE_HOTROD_AUTH_PASSWORD
                $patch: delete
              - name: PAYU_CACHE_HOTROD_USE_SSL
                value: "false"
              - name: PAYU_CACHE_HOTROD_TRUST_STORE_FILE_NAME
                $patch: delete
              - name: PAYU_CACHE_HOTROD_TRUST_STORE_PASSWORD
                $patch: delete
              - name: PAYU_CACHE_HOTROD_KEY_STORE_FILE_NAME
                $patch: delete
              - name: PAYU_CACHE_HOTROD_KEY_STORE_PASSWORD
                $patch: delete
- target:
    group: apps
    version: v1
    kind: Deployment
    name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/1
    - op: remove
      path: /spec/template/spec/volumes/1
