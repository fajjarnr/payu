apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-uat
resources:
  - ../../../base/auth-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/auth-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-uat/auth-service
    newTag: "1.18.74"
patches:
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-uat.apps.fajjjar.my.id/realms/payu"
                  - name: OIDC_JWK_SET_URI
                    value: "https://sso-uat.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
                  - name: PAYU_KEYCLOAK_SERVER_URL
                    value: "http://payu-keycloak-service.payu-uat.svc.cluster.local:8080"
                  - name: PAYU_KEYCLOAK_WEB_CLIENT_ID
                    value: "payu-web-app"
                  - name: PAYU_KEYCLOAK_WEB_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: payu-keycloak-client-secrets
                        key: payu-web-client-secret
