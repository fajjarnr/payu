# PreProd Secrets Template — Replace placeholders with actual values via Vault/ESO
apiVersion: v1
kind: Secret
metadata:
  name: preprod-secrets
  namespace: payu-preprod
  labels:
    app.kubernetes.io/part-of: payu
  annotations:
    external-secrets.io/note: "Managed by External Secrets Operator from Vault"
type: Opaque
stringData:
  DB_PASSWORD: "${VAULT:secret/data/payu-preprod/db#password}"
  DB_USERNAME: "${VAULT:secret/data/payu-preprod/db#username}"
  REDIS_PASSWORD: "${VAULT:secret/data/payu-preprod/redis#password}"
  KEYCLOAK_CLIENT_SECRET: "${VAULT:secret/data/payu-preprod/keycloak#client-secret}"
  KAFKA_SASL_PASSWORD: "${VAULT:secret/data/payu-preprod/kafka#password}"
