apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pre-Production Environment — Mirror of Production
# Ref: DEVSECOPS_ARCHITECTURE.md §3.1
# Approval Gate: Pen test + CAB + Kraken chaos pass
# RBAC: SRE + Security only

resources:
  - ../../base
  - config/configmaps.yaml
  - secrets/secrets-template.yaml

namespace: payu-preprod

images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev
    newName: image-registry.openshift-image-registry.svc:5000/payu-preprod

patches:
  # PreProd: 3 replicas — mirrors production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=payu"

configMapGenerator:
  - name: preprod-shared-config
    literals:
      - SPRING_PROFILES_ACTIVE=container
      - LOG_LEVEL=WARN
      - OTEL_TRACES_SAMPLER_ARG=0.1
