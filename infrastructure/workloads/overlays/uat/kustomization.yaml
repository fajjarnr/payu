apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# UAT Environment — User Acceptance Testing
# Ref: DEVSECOPS_ARCHITECTURE.md §3.1
# Approval Gate: Manual PO/QA + ACS + Schemathesis pass
# RBAC: QA + PM + SRE

resources:
  - ../../base
  - config/configmaps.yaml
  - secrets/secrets-template.yaml

namespace: payu-uat

images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev
    newName: image-registry.openshift-image-registry.svc:5000/payu-uat

patches:
  # UAT: 2 replicas for stability testing
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=payu"

configMapGenerator:
  - name: uat-shared-config
    literals:
      - SPRING_PROFILES_ACTIVE=container
      - LOG_LEVEL=INFO
      - OTEL_TRACES_SAMPLER_ARG=0.5
