apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu
resources:
  - ../../../base/gateway-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service
    newName: image-registry.openshift-image-registry.svc:5000/payu/gateway-service
    newTag: "1.18.45"
patches:
  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_OTEL_SDK_DISABLED
          value: "true"
