apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu
resources:
  - ../../../base/web-app
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newName: image-registry.openshift-image-registry.svc:5000/payu/web-app
    newTag: "1.18.74"
patches:
  - target:
      kind: ConfigMap
      name: frontend-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: frontend-config
      data:
        OIDC_ISSUER: "https://sso-prod.apps.fajjjar.my.id/realms/payu"
        OIDC_JWK_SET_URI: "https://sso-prod.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
        KEYCLOAK_URL: "https://sso-prod.apps.fajjjar.my.id"
        NEXT_PUBLIC_BASE_URL: "https://payu.fajjjar.my.id"
