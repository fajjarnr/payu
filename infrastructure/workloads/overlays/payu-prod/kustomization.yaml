    name: compliance-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: dispute-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: fx-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: gateway-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: integration-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: investment-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: kyc-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: lending-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: notification-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: partner-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: product-catalog-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: promotion-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: statement-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: support-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: transaction-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: wallet-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: web-app
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
# Production PDB for web-app (minAvailable: 2 for 3 replicas)
- target:
    kind: PodDisruptionBudget
    name: web-app-pdb
  patch: '[{"op": "replace", "path": "/spec/minAvailable", "value": 2}]'
# Production resource limits (higher than dev)
- target:
    kind: Deployment
    labelSelector: app.kubernetes.io/component=backend
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-important
    spec:
      template:
        spec:
          containers:
          - name: app
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 1536Mi
# Production OIDC (HTTPS endpoints)
- target:
    kind: Deployment
    labelSelector: app.kubernetes.io/component=backend
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-important
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: OIDC_ISSUER
              value: "https://sso-payu.apps.payu.ocp.fajjjar.my.id/realms/payu"
            - name: OIDC_JWK_SET_URI
              value: "https://sso-payu.apps.payu.ocp.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: "https://sso-payu.apps.payu.ocp.fajjjar.my.id/realms/payu"
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: "https://sso-payu.apps.payu.ocp.fajjjar.my.id/realms/payu"
# Production secrets — override hardcoded dev passwords with secretKeyRef
- target:
    kind: Deployment
    labelSelector: app.kubernetes.io/component=backend
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-important
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payu-db-credentials
                  key: password
            - name: PAYU_CACHE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: payu-secrets
                  key: ENCRYPTION_KEY
labels:
- pairs:
    environment: prod
  includeSelectors: false
