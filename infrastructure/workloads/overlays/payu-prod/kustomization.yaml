# Replica count patches (3 replicas for production HA)
- target:
    kind: Deployment
    name: account-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: analytics-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
