  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: auth-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
    kind: Deployment
    name: backoffice-service
  patch: '[{"op": "replace", "path": "/spec/replicas", "value": 3}]'
- target:
