# Production PDB for web-app (minAvailable: 2 for 3 replicas)
- target:
    kind: PodDisruptionBudget
    name: web-app-pdb
  patch: '[{"op": "replace", "path": "/spec/minAvailable", "value": 2}]'
# Production resource limits (higher than dev)
- target:
    kind: Deployment
    labelSelector: app.kubernetes.io/component=backend
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-important
    spec:
      template:
        spec:
          containers:
          - name: app
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 1536Mi
labels:
- pairs:
    environment: prod
  includeSelectors: false
