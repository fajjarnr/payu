apiVersion: v1
kind: Secret
metadata:
  name: payu-secrets
  namespace: payu
type: Opaque
stringData:
  JWT_SECRET: dummy-jwt-secret-for-prod-32chars-long-12345
  WEBHOOK_SECRET: dummy-webhook-secret
  ENCRYPTION_KEY: dummy-encryption-key-32chars
  ENCRYPTION_SALT: PayU-PROD-PBKDF2-Salt-v3-2026-!SafeForDevOnly!
  secret-key: PayU-PROD-SecretKey-2026-!SafeForDevOnly!
  encryption-key: PayU-PROD-PBKDF2-Salt-v3-2026-!SafeForDevOnly!
  BLIND_INDEX_KEY: PayU-PROD-BlindIndexKey-2026-32BytesLongSecret!
