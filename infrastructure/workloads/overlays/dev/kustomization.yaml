                    valueFrom:
                      secretKeyRef:
                        name: db-credentials
                        key: password
                  - name: DATABASE_URL
                    value: "postgresql+asyncpg://payu:$(DATABASE_PASSWORD)@payu-postgres-primary.payu-dev.svc:5432/payu_kyc"
                  - name: KAFKA_BOOTSTRAP_SERVERS
                    value: "kafka-kafka-bootstrap.payu-dev.svc:9092"
