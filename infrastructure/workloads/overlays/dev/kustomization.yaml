# ============================================================
# Strategic merge patches: override env vars for operator-deployed infra
# DB: payu-postgres-primary.payu-dev.svc:5432
# Kafka: kafka-kafka-bootstrap.payu-dev.svc:9092
# Redis/DataGrid: payu-datagrid.payu-dev.svc:11222
# ============================================================
patches:
  # --- Scale all to 1 replica ---
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=payu"

  # --- Disable simulators (no images built yet) ---
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: bi-fast-simulator
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: dukcapil-simulator
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: qris-simulator

  # biller-simulator: keep running (billing-service depends on it)
  - target:
      kind: Deployment
      name: biller-simulator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: biller-simulator
      spec:
        template:
          spec:
            containers:
              - name: biller-simulator
                env:
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: "jdbc:postgresql://payu-postgres-primary.payu-dev.svc:5432/payu_biller_simulator"
                  - name: QUARKUS_DATASOURCE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: payu-postgres-pguser-payu
                        key: password

