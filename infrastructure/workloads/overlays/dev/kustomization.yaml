                      secretKeyRef:
                        name: redis-credentials
                        key: REDIS_PASSWORD
                  - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
                    value: "true"
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "1Gi"
                livenessProbe:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  initialDelaySeconds: 120
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 5
                startupProbe:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  failureThreshold: 30

