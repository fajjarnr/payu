# ============================================================
# Strategic merge patches: override env vars for operator-deployed infra
# DB: payu-postgres-primary.payu-dev.svc:5432
# Kafka: kafka-kafka-bootstrap.payu-dev.svc:9092
# Redis/DataGrid: payu-cache.payu-dev.svc:6379
# ============================================================
patches:
  # --- Scale all to 1 replica ---
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=payu"

  # --- Disable simulators (no images built yet) ---
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: bi-fast-simulator
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: dukcapil-simulator
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: qris-simulator

  # biller-simulator: keep running (billing-service depends on it)
  - target:
      kind: Deployment
      name: biller-simulator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: biller-simulator
      spec:
        template:
          spec:
            containers:
              - name: biller-simulator
                env:
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: "jdbc:postgresql://payu-postgres-primary.payu-dev.svc:5432/payu_biller_simulator"
                  - name: QUARKUS_DATASOURCE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: payu-postgres-pguser-payu
                        key: password

  # ============================================================
  # Spring Boot services: DB + Kafka + Redis overrides
  # ============================================================
  - target:
      kind: Deployment
      name: account-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: account-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: "container"
                  - name: DB_URL
                    value: "jdbc:postgresql://payu-postgres-primary.payu-dev.svc:5432/payu_account"
                  - name: DB_USERNAME
                    valueFrom:
                      secretKeyRef:
                        name: db-credentials
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: db-credentials
                        key: password
                  - name: ENCRYPTION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: encryption-keys
                        key: AES_ENCRYPTION_KEY
                  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
                    value: "kafka-kafka-bootstrap.payu-dev.svc:9092"
                  - name: KAFKA_BROKERS
                    value: "kafka-kafka-bootstrap.payu-dev.svc:9092"
                  - name: REDIS_HOST
                    value: "payu-cache.payu-dev.svc"
                  - name: REDIS_PORT
                    value: "6379"
                  - name: SPRING_DATA_REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: redis-credentials
                        key: REDIS_PASSWORD
                  - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
                    value: "true"

