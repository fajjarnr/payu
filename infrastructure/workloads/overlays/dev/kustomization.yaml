                  timeoutSeconds: 3
                startupProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  failureThreshold: 30

  # ============================================================
  # Web App: override gateway URL for actual OCP domain
  # ============================================================
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-app
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: NEXT_PUBLIC_GATEWAY_URL
                    value: "https://gateway-dev.payu.fajjjar.my.id"
                  - name: NEXTAUTH_URL
                    value: "https://dev.payu.fajjjar.my.id"
                  - name: GATEWAY_URL
                    value: "http://gateway-service:8080"

  # ============================================================
  # Route host patches: base service routes redirect to match TLS routes
  # We keep the base routes but give them unique hostnames to avoid conflicts
  # The -tls routes from tls-certificates.yaml are the primary routes
  # ============================================================
  - target:
      kind: Route
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/host
        value: gateway-internal.dev.payu.fajjjar.my.id

  - target:
      kind: Route
      name: web-app
    patch: |-
      - op: add
        path: /spec/host
        value: app-internal.dev.payu.fajjjar.my.id

  # ============================================================
  # Disable deny network policies in dev (operator infra lacks payu-banking labels)
  # ============================================================
  - target:
      kind: NetworkPolicy
      name: default-deny-ingress
    patch: |-
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            disable-in-dev: "true"
  - target:
      kind: NetworkPolicy
      name: default-deny-egress
    patch: |-
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            disable-in-dev: "true"
