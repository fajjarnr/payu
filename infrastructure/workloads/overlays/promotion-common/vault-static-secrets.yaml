apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-runtime-secrets
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/workloads/runtime
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-runtime-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-security-secrets
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/workloads/runtime
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^(JWT_SECRET|BLIND_INDEX_KEY|BLIND_INDEX_PREVIOUS_KEYS|secret-key)$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-session-secrets
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/workloads/runtime
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: session-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        next-server-actions-encryption-key:
          text: '{{ get .Secrets "encryption-key" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-keycloak-client-secrets
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/keycloak/clients
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-keycloak-client-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^(payu-backend-client-secret|payu-web-client-secret)$
---
# Simulators (bi-fast/biller/dukcapil/qris/va) still reference dev-env-secrets,
# which this component deletes from base — recreate it from the runtime path.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-dev-env-secrets
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/workloads/runtime
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: dev-env-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^(WEBHOOK_SECRET|JWT_SECRET|ENCRYPTION_SALT|secret-key|encryption-key|BLIND_INDEX_KEY|BLIND_INDEX_PREVIOUS_KEYS|api-key)$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payu-cache-client-tls
spec:
  vaultAuthRef: payu-vault
  mount: secret
  type: kv-v2
  path: payu/environment/cache/client-tls
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: payu-cache-client-tls
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^(keystore-password|truststore-password|keystore\.p12|truststore\.p12)$
      templates:
        keystore.p12:
          text: '{{ get .Secrets "keystore.p12" | b64dec }}'
        truststore.p12:
          text: '{{ get .Secrets "truststore.p12" | b64dec }}'
