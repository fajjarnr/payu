apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Secret
      name: dev-env-secrets
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: dev-env-secrets
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: runtime-secret-consumer
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: PAYU_SECURITY_ENCRYPTION_SALT
                    valueFrom:
                      secretKeyRef:
                        name: payu-runtime-secrets
                        key: ENCRYPTION_SALT
                  - name: WEBHOOK_SECURITY_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: payu-runtime-secrets
                        key: WEBHOOK_SECRET
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: account-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: account-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: ENCRYPTION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: payu-runtime-secrets
                        key: ENCRYPTION_SALT
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gateway-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: payu-runtime-secrets
                        key: JWT_SECRET
                  - name: WEBHOOK_PARTNER_1_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: payu-runtime-secrets
                        key: WEBHOOK_SECRET
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: transaction-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: transaction-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: PAYU_CALLBACK_SIGNATURE_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: payu-runtime-secrets
                        key: WEBHOOK_SECRET
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api-portal-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-portal-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
                    value: http://otel-collector:4317
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: loan-origination-process
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loan-origination-process
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: DATABASE_URL
                    value: jdbc:postgresql://payu-database-rw:5432/payu_loan_origination
                  - name: LENDING_RULES_URL
                    value: http://lending-rules:8080
  - target:
      kind: ConfigMap
      name: workload-resource-budget
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workload-resource-budget
        annotations:
          payu.fajjjar.my.id/linked-quota: workload-quota
