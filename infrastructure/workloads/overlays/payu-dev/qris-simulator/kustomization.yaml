apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/qris-simulator.yaml
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/qris-simulator
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/qris-simulator
    newTag: "1.18.45"
  # WEB-CSP-001 issuer alignment: tokens carry the PUBLIC SSO issuer
  # (https://sso-dev...); validators must expect it. JWK/auth-server URLs stay
  # internal (in-cluster).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: qris-simulator
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
