# Strategic merge patch example for resource limits
# Apply per-service by replacing REPLACE_ME with service name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: REPLACE_ME
spec:
  template:
    spec:
      containers:
      - name: app
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
