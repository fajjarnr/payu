apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/web-app
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newTag: "1.18.54"
patches:
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  # WEB-CSP-001: browser-facing OIDC must use the public SSO route + dev domain.
  # Strategic merge on env (mergeKey name) — replaces existing, adds missing.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-app
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
                  - name: OIDC_JWK_SET_URI
                    value: "https://sso-dev.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
                  - name: KEYCLOAK_URL
                    value: "https://sso-dev.apps.fajjjar.my.id"
                  - name: NEXT_PUBLIC_BASE_URL
                    value: "https://payu-dev.apps.fajjjar.my.id"
