apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/web-app
components:
  - ../components/dev-cache
  - ../components/dev-oidc

images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newTag: "1.18.135"
patches:
  # OVERLAY-STRUCT-001: dev-only runtime key (promoted from the root overlay
  # so per-service apply carries the same contract). Base points at the
  # Vault-provisioned session-secrets (absent in dev); dev uses the
  # pre-provisioned key in dev-env-secrets. Strategic merge REPLACES the
  # whole valueFrom (no dual value+valueFrom).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-app
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: dev-env-secrets
                        key: encryption-key
                        optional: false
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
      # WEB-OS-008: analytics real-time stream — browser connects to the
      # dedicated WS route; the BFF signs tickets with the shared secret.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NEXT_PUBLIC_WS_URL
          value: "wss://analytics-ws.apps.payu.ocp.fajjjar.my.id"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WS_TICKET_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WS_TICKET_SECRET
  - target:
      kind: ConfigMap
      name: frontend-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: frontend-config
      data:
        OIDC_ISSUER: "https://sso-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
        OIDC_JWK_SET_URI: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
        KEYCLOAK_URL: "https://sso-dev.apps.payu.ocp.fajjjar.my.id"
        NEXT_PUBLIC_BASE_URL: "https://payu-dev.apps.payu.ocp.fajjjar.my.id"
