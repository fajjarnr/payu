apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/web-app
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newTag: "1.18.74"
patches:
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  - target:
      kind: ConfigMap
      name: frontend-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: frontend-config
      data:
        OIDC_ISSUER: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
        OIDC_JWK_SET_URI: "https://sso-dev.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
        KEYCLOAK_URL: "https://sso-dev.apps.fajjjar.my.id"
        NEXT_PUBLIC_BASE_URL: "https://payu-dev.apps.fajjjar.my.id"
