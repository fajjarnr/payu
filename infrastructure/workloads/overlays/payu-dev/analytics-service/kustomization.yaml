apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/analytics-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/analytics-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/analytics-service
    newTag: "1.18.74"
patches:
  - target:
      kind: Deployment
      name: analytics-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  # WEB-CSP-001 issuer alignment: tokens carry the PUBLIC SSO issuer
  # (https://sso-dev...); validators must expect it. JWK/auth-server URLs stay
  # internal (in-cluster).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: analytics-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
                  # RELAY-009: jwt_auth requires KEYCLOAK_URL for JWKS; without
                  # it every authenticated call 401s (fraud scoring included).
                  # In-cluster URL per L-408 (public route 503s from pods).
                  - name: KEYCLOAK_URL
                    value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080"
