patches:
# Dev cache is an internal, non-TLS Hot Rod endpoint. Keep mTLS in promoted
# environments; do not make dev depend on Vault-provisioned client material.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-rules|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dev-cache-client
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: PAYU_CACHE_HOTROD_AUTH_USERNAME
              $patch: delete
            - name: PAYU_CACHE_HOTROD_AUTH_PASSWORD
              $patch: delete
            - name: PAYU_CACHE_HOTROD_USE_SSL
              value: "false"
            - name: PAYU_CACHE_HOTROD_TRUST_STORE_FILE_NAME
              $patch: delete
            - name: PAYU_CACHE_HOTROD_TRUST_STORE_PASSWORD
              $patch: delete
            - name: PAYU_CACHE_HOTROD_KEY_STORE_FILE_NAME
              $patch: delete
            - name: PAYU_CACHE_HOTROD_KEY_STORE_PASSWORD
              $patch: delete

- target:
    group: apps
    version: v1
    kind: Deployment
    name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-rules|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/1
    - op: remove
      path: /spec/template/spec/volumes/1

# Dev runs fixed single replicas; do not let inherited HPAs consume the namespace quota.
- target:
    group: autoscaling
    version: v2
    kind: HorizontalPodAutoscaler
    name: .*-hpa
  patch: |-
    $patch: delete
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: dev-hpa
# Development still consumes the shared Keycloak instance in payu-sso.
- target:
    kind: ConfigMap
    name: service-endpoints
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: service-endpoints
    data:
      KEYCLOAK_SERVER_URL: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080
      KEYCLOAK_URL: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080
# Web app route uses shared ingress domain (apps.fajjjar.my.id)
- target:
    kind: Route
    name: web-app
  patch: |-
    apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: web-app
      labels:
        ingress.payu.io/class: shared
    spec:
      host: payu-dev.apps.fajjjar.my.id
