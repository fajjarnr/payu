# OIDC Issuer patch - web-app (Next.js)
- target:
    kind: Deployment
    name: web-app
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
    # WEB-004: sitemap/robots must advertise the dev domain, not prod.
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: NEXT_PUBLIC_BASE_URL
        value: "https://payu-dev.apps.fajjjar.my.id"

# Dev-only: use the pre-provisioned runtime key in payu-dev.
- target:
    kind: Deployment
    name: web-app
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web-app
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dev-env-secrets
                  key: encryption-key
                  optional: false

# Dev-only: Enable rate limit test mode for e2e testing
- target:
    kind: Deployment
    name: gateway-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: gateway-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: GATEWAY_RATE_LIMIT_TEST_MODE
              value: "true"

- target:
    kind: Deployment
    name: gateway-service
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector.payu-dev.svc.cluster.local:4317"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: QUARKUS_OTEL_SDK_DISABLED
        value: "true"