    newTag: "1.18.133"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/loan-origination-process
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/loan-origination-process
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/notification-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/notification-service
    newTag: "1.18.125"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/partner-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/partner-service
    newTag: "1.18.128"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/product-catalog-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/product-catalog-service
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/promotion-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/promotion-service
    newTag: "1.18.133"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/statement-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/statement-service
    newTag: "1.18.133"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/support-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/support-service
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/transaction-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/transaction-service
    newTag: "1.18.138"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/wallet-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/wallet-service
    newTag: "1.18.133"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newTag: "1.18.135"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/bi-fast-simulator
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/bi-fast-simulator
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/biller-simulator
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/biller-simulator
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/dukcapil-simulator
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/dukcapil-simulator
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/qris-simulator
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/qris-simulator
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/va-simulator
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/va-simulator
    newTag: "1.18.104"
components:
  - ./components/dev-cache
  - ./components/dev-oidc
patches:
  # OVERLAY-STRUCT-001: the datagrid-client-tls mount the shared base injects
  # does not exist on the per-service render path (per-service overlays
  # reference the leaf base, not the shared base). This JSON patch removes it
  # here so the root render matches what per-service apply leaves live.
  # OVERLAY-STRUCT-001: dev-only rate-limit bypass for E2E (X-E2E-Test
  # header, E2E-RLS-001) — mirrors the gateway per-service patch so the root
  # render carries the same contract. Prod profile ignores it (BUG-AUTH-025).
  - target:
      kind: Deployment
      name: gateway-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway-service
      spec:
        template:
          spec:
            containers:
            - name: app
              env:
              - name: GATEWAY_RATE_LIMIT_TEST_MODE
                value: "true"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/1
      - op: remove
        path: /spec/template/spec/volumes/1
  # Dev runs fixed single replicas; do not let inherited HPAs consume the namespace quota.
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: .*-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: dev-hpa
  # Development still consumes the shared Keycloak instance in payu-sso.
  - target:
      kind: ConfigMap
      name: service-endpoints
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: service-endpoints
      data:
        KEYCLOAK_SERVER_URL: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080
        KEYCLOAK_URL: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080
  # Web app route uses the cluster domain (apps.payu.ocp.fajjjar.my.id).
  # No ingress.payu.io/class label: the route host no longer sits on the
  # shared domain, and cluster-config/ingress/default.yaml EXCLUDES
  # class=shared from the default router - a "shared" label here would
  # leave the route served by neither controller.
  - target:
      kind: Route
      name: web-app
    patch: |-
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: web-app
      spec:
        host: payu-dev.apps.payu.ocp.fajjjar.my.id
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-app
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: SPRINGDOC_API_DOCS_ENABLED
                    value: "true"
  # Replica count patches
  - target:
      kind: Deployment
      name: auth-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-service
      spec:
        template:
          metadata:
            annotations:
              payu.io/keycloak-client-secret-revision: "2026-08-04"
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-app
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null

  - target:
      kind: Deployment
      name: bi-fast-simulator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_ENDPOINT
          value: "http://localhost:4317"
  - target:
      kind: Deployment
      name: qris-simulator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_ENDPOINT
          value: "http://localhost:4317"
  - target:
      kind: Deployment
      name: dukcapil-simulator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_ENDPOINT
          value: "http://localhost:4317"

  # OIDC Issuer patch - web-app (Next.js) — env-driven via frontend-config ConfigMap (no hardcoded Deployment env)
  - target:
      kind: ConfigMap
      name: frontend-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: frontend-config
      data:
        OIDC_ISSUER: "https://sso-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
        OIDC_JWK_SET_URI: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
        KEYCLOAK_URL: "https://sso-dev.apps.payu.ocp.fajjjar.my.id"
        NEXT_PUBLIC_BASE_URL: "https://payu-dev.apps.payu.ocp.fajjjar.my.id"

  # Dev-only: use the pre-provisioned runtime key in payu-dev.
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-app
      spec:
        template:
          spec:
            containers:
            - name: app
              env:
              - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
                valueFrom:
                  secretKeyRef:
                    name: dev-env-secrets
                    key: encryption-key
                    optional: false

  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.payu-dev.svc.cluster.local:4317"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_OTEL_SDK_DISABLED
          value: "true"
  # Non-prod: expose OpenAPI docs for contract testing (Schemathesis gate)
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: springdoc-enabled
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: SPRINGDOC_API_DOCS_ENABLED
                    value: "true"
