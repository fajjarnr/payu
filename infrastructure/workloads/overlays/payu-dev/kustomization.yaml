# OIDC Issuer patches - Spring Boot services (OIDC_ISSUER + OIDC_JWK_SET_URI)
- target:
    kind: Deployment
    name: account-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: account-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: OIDC_ISSUER
              value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
            - name: OIDC_JWK_SET_URI
              value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
