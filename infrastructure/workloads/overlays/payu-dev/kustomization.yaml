apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - payu-secrets.yaml
  # OVERLAY-STRUCT-001: account-service is excluded from the shared base
  # (ADR-0066 polyrepo: its own per-service ApplicationSet), so the root
  # overlay references the leaf base directly. Without this, one root
  # `oc apply -k` can never reproduce the live fleet (29/30 before).
  - ../../base/account-service
  # FX-CRED-001: dev-only dummy for the optional FX_PROVIDER_API_KEY env
  - fx-provider-credentials.yaml
  # WEB-OS-008: analytics real-time WebSocket route
  - analytics-ws-route.yaml
  - namespace.yaml
  - ../../base
  - keycloak-client-secret-generator.yaml
  - network-policy-payu-sso-postgres.yaml
replicas:
  - name: analytics-service
    count: 1
  - name: api-portal-service
    count: 1
  - name: auth-service
    count: 1
  - name: backoffice-service
    count: 1
  - name: bi-fast-simulator
    count: 1
  - name: biller-simulator
    count: 1
  - name: billing-service
    count: 1
  - name: cms-service
    count: 1
  - name: compliance-service
    count: 1
  - name: dispute-service
    count: 1
  - name: dukcapil-simulator
    count: 1
  - name: fx-service
    count: 1
  - name: gateway-service
    count: 1
  - name: integration-service
    count: 1
  - name: investment-service
    count: 1
  - name: kyc-service
    count: 1
  - name: lending-service
    count: 1
  - name: loan-origination-process
    count: 1
  - name: notification-service
    count: 1
  - name: partner-service
    count: 1
  - name: product-catalog-service
    count: 1
  - name: promotion-service
    count: 1
  - name: qris-simulator
    count: 1
  - name: statement-service
    count: 1
  - name: support-service
    count: 1
  - name: transaction-service
    count: 1
  - name: va-simulator
    count: 1
  - name: wallet-service
    count: 1
  - name: web-app
    count: 1
# ponytail: scale 1 dev single replica; HPA/PDB disabled via patch delete for quota
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/account-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/account-service
    newTag: "1.18.136"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/analytics-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/analytics-service
    newTag: "1.18.128"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/api-portal-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/api-portal-service
    newTag: "1.18.125"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/auth-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/auth-service
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/backoffice-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/backoffice-service
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/billing-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/billing-service
    newTag: "1.18.133"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/cms-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/cms-service
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/compliance-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/compliance-service
    newTag: "1.18.137"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/dispute-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/dispute-service
    newTag: "1.18.128"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/fx-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/fx-service
    newTag: "1.18.133"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service
    newTag: "1.18.136"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/integration-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/integration-service
    newTag: "1.18.131"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/investment-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/investment-service
    newTag: "1.18.133"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/kyc-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/kyc-service
    newTag: "1.18.74"
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/lending-service
