# OIDC Issuer patches - Quarkus services
# Note: Quarkus reads QUARKUS_OIDC_TOKEN_ISSUER, not OIDC_ISSUER.
# OIDC_ISSUER/JWK_SET_URI in base deployments are unused by Quarkus.
- target:
    kind: Deployment
    name: api-portal-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api-portal-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
            - name: QUARKUS_TLS_TRUST_ALL
              value: "true"
- target:
    kind: Deployment
    name: gateway-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: gateway-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
            - name: QUARKUS_TLS_TRUST_ALL
              value: "true"
- target:
    kind: Deployment
    name: notification-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: notification-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
            - name: QUARKUS_TLS_TRUST_ALL
              value: "true"
            - name: OIDC_ISSUER
              value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
            - name: OIDC_JWK_SET_URI
              value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"

# OIDC Issuer patch - web-app (Next.js)
- target:
    kind: Deployment
    name: web-app
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "https://sso-payu-dev.apps.payu.ocp.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"

# Dev-only: Enable rate limit test mode for e2e testing
- target:
    kind: Deployment
    name: gateway-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: gateway-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: GATEWAY_RATE_LIMIT_TEST_MODE
              value: "true"

- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: OTEL_ENDPOINT
        value: "http://localhost:4317"

# Cache starter publishes CacheAutoConfiguration but HotRodCacheConfig is not
# listed in the deployed starter's auto-configuration metadata. Register it as
# an additional Spring source until images include the corrected metadata.
- target:
    kind: Deployment
    labelSelector: app.kubernetes.io/component=backend
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_MAIN_SOURCES
        value: id.payu.cache.config.HotRodCacheConfig
