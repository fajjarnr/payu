# OVERLAY-STRUCT-001 — shared dev OIDC-issuer patches as a Kustomize Component.
#
# Byte-identical to the OIDC block that lived in the payu-dev root overlay
# (Spring Boot issuer env + Quarkus OIDC env + loan-origination in-cluster
# shape). Both the root overlay and every per-service overlay consume this
# component, so one `oc apply -k` of either unit carries the same contract.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # OIDC Issuer patches - Spring Boot services (OIDC_ISSUER + OIDC_JWK_SET_URI)
  - target:
      kind: Deployment
      name: auth-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-service
      spec:
        template:
          spec:
            containers:
            - name: app
              env:
              - name: OIDC_ISSUER
                value: "https://sso-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
              - name: OIDC_JWK_SET_URI
                value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
              - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
                value: "https://sso-dev.apps.payu.ocp.fajjjar.my.id/realms/payu"
              - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
                value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
              - name: PAYU_KEYCLOAK_SERVER_URL
                value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080"
  - target:
      kind: Deployment
