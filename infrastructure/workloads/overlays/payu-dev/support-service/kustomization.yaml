apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/support-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/support-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/support-service
    newTag: "1.18.57"
patches:
  - target:
      kind: Deployment
      name: support-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  # WEB-CSP-001 issuer alignment: tokens carry the PUBLIC SSO issuer
  # (https://sso-dev...); validators must expect it. JWK/auth-server URLs stay
  # internal (in-cluster).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: support-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
