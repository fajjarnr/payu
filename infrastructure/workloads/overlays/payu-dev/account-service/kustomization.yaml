apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payu-dev

resources:
  - ../../../base/account-service

components:
  - ../components/dev-cache
  - ../components/dev-oidc

images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/account-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/account-service
    newTag: "1.18.136"

patches:
  - target:
      kind: Deployment
      name: account-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: account-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: SPRINGDOC_API_DOCS_ENABLED
                    value: "true"
                  # Dev-only: expose Hot Rod round-trip latency for the ARCH-007
                  # 24-hour canary p95 evidence.
                  - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
                    value: "always"
