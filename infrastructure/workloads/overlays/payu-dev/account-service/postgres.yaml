apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: account-postgres
  labels:
    app.kubernetes.io/name: account-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: account-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-postgres
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              value: "payu"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-postgres-credentials
                  key: password
            - name: POSTGRESQL_DATABASE
              value: "payu_account"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: pgsql-tmp
              mountPath: /var/lib/pgsql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: pgsql-tmp
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-csi
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: account-postgres
  labels:
    app.kubernetes.io/name: account-postgres
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: account-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
      protocol: TCP
  type: ClusterIP
