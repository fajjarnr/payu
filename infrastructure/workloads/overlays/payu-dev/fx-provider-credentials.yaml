# FX-CRED-001 — dev-only FX provider credential placeholder.
# `fx-service` reads key `api-key` from Secret `fx-provider-credentials`
# (optional: true). This repo-owned manifest makes fresh clusters reproducible
# without an out-of-band `oc create secret` step.
#
# The value is an explicit DUMMY — the dev FX adapter never calls a real
# provider. Replace with the real provider API key (via Vault/ESO, never a
# static manifest) before promoting beyond dev.
apiVersion: v1
kind: Secret
metadata:
  name: fx-provider-credentials
  namespace: payu-dev
  labels:
    app.kubernetes.io/name: fx-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  api-key: "dev-placeholder-fx-provider-key"
