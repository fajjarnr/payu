apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/gateway-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service
    newTag: "1.18.56"
patches:
  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_OTEL_SDK_DISABLED
          value: "true"
  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.payu-dev.svc.cluster.local:4317"
  # WEB-CSP-001 issuer alignment: tokens carry the PUBLIC SSO issuer
  # (https://sso-dev...); validators must expect it. JWK/auth-server URLs stay
  # internal (in-cluster).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: QUARKUS_OIDC_TOKEN_ISSUER
                    value: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
