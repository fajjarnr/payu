apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/lending-rules
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/lending-rules
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/lending-rules
    newTag: "1.18.3"
patches:
  - target:
      kind: Deployment
      name: lending-rules
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
