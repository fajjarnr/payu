apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/auth-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/auth-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/auth-service
    newTag: "1.18.45"
patches:
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  # WEB-AUTH-001: token-exchange client secret must match live realm client payu-web-app
  # (dev-only value, same pattern as keycloak-realm-import.yaml).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: PAYU_KEYCLOAK_WEB_CLIENT_SECRET
                    value: "payu-web-secret-dev-2026!"
