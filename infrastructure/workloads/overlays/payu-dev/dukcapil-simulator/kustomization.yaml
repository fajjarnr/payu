apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-dev
resources:
  - ../../../base/dukcapil-simulator
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/dukcapil-simulator
    newName: image-registry.openshift-image-registry.svc:5000/payu-dev/dukcapil-simulator
    newTag: "1.18.74"
patches:
  - target:
      kind: Deployment
      name: dukcapil-simulator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dukcapil-simulator
      spec:
        template:
          spec:
            containers:
              - name: dukcapil-simulator
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-dev.apps.fajjjar.my.id/realms/payu"
  # OTEL_ENDPOINT must exist or the Quarkus config expansion of
  # quarkus.otel.exporter.otlp.endpoint fails (SRCFG00011) — same env the
  # root overlay adds; per-service apply must not strip it.
  - target:
      kind: Deployment
      name: dukcapil-simulator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_ENDPOINT
          value: "http://localhost:4317"
