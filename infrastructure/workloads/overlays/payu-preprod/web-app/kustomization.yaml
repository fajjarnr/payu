apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-preprod
resources:
  - ../../../base/web-app
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/web-app
    newName: image-registry.openshift-image-registry.svc:5000/payu-preprod/web-app
    newTag: "1.18.36"
patches:
  - target:
      kind: Deployment
      name: web-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
