apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-preprod
resources:
  - ../../../base/billing-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/billing-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-preprod/billing-service
    newTag: "1.18.54"
patches:
  - target:
      kind: Deployment
      name: billing-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: billing-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-preprod.apps.fajjjar.my.id/realms/payu"
                  - name: OIDC_JWK_SET_URI
                    value: "https://sso-preprod.apps.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
