apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payu-preprod

resources:
  - ../../../base/account-service

images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/account-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-preprod/account-service
    newTag: "1.18.17"

patches:
  - target:
      kind: Deployment
      name: account-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: account-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: PAYU_CACHE_HOTROD_SNI_HOST_NAME
                    value: payu-cache.payu-preprod.svc.cluster.local
                  - name: OIDC_ISSUER
                    value: https://sso.preprod.payu.fajjjar.my.id/realms/payu
                  - name: OIDC_JWK_SET_URI
                    value: https://sso.preprod.payu.fajjjar.my.id/realms/payu/protocol/openid-connect/certs
                  - name: QUARKUS_OIDC_AUTH_SERVER_URL
                    value: https://sso.preprod.payu.fajjjar.my.id/realms/payu
                  - name: QUARKUS_OIDC_TOKEN_ISSUER
                    value: https://sso.preprod.payu.fajjjar.my.id/realms/payu
                  - name: PAYU_KEYCLOAK_SERVER_URL
                    value: https://sso.preprod.payu.fajjjar.my.id
