apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - config/configmaps.yaml
  - secrets/secrets-template.yaml

namespace: payu-sit

# SIT: 1 replica per service, relaxed resource limits
# Ref: DEVSECOPS_ARCHITECTURE.md §3.1 — payu-sit namespace
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev
    newName: image-registry.openshift-image-registry.svc:5000/payu-sit

patches:
  # Scale down to 1 replica for cost savings
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=payu"

configMapGenerator:
  - name: sit-shared-config
    literals:
      - SPRING_PROFILES_ACTIVE=container
      - LOG_LEVEL=DEBUG
      - OTEL_TRACES_SAMPLER_ARG=1.0
