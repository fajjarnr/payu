apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-sit
resources:
  - ../../../base/analytics-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/analytics-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-sit/analytics-service
    newTag: "1.18.103"
patches:
  - target:
      kind: Deployment
      name: analytics-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
      # RELAY-009 parity: jwt_auth requires KEYCLOAK_URL for JWKS; without
      # it every authenticated call 401s (fraud scoring included).
      # In-cluster URL per L-408 (public route 503s from pods).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OIDC_ISSUER
          value: "https://sso-sit.apps.fajjjar.my.id/realms/payu"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KEYCLOAK_URL
          value: "http://payu-keycloak-service.payu-sit.svc.cluster.local:8080"
