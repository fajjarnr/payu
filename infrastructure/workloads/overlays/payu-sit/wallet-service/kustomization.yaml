apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-sit
resources:
  - ../../../base/wallet-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/wallet-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-sit/wallet-service
    newTag: "1.18.35"
patches:
  - target:
      kind: Deployment
      name: wallet-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
