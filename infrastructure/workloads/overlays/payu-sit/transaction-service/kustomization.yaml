apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-sit
resources:
  - ../../../base/transaction-service
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/transaction-service
    newName: image-registry.openshift-image-registry.svc:5000/payu-sit/transaction-service
    newTag: "1.8.116"
patches:
  - target:
      kind: Deployment
      name: transaction-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
      # RELAY-006 parity: SIT Redis (payu-cache-resp:11222, user developer).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_DATA_REDIS_HOST
          value: payu-cache-resp
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_DATA_REDIS_PORT
          value: "11222"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_DATA_REDIS_USERNAME
          value: developer
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-credentials
              key: password
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SERVICES_ANALYTICS_URL
          value: "http://analytics-service:8080"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: transaction-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: OIDC_ISSUER
                    value: "https://sso-sit.apps.fajjjar.my.id/realms/payu"
                  - name: OIDC_JWK_SET_URI
                    value: "http://payu-keycloak-service.payu-sit.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
