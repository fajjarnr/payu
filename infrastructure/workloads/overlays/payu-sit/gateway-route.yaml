# Gateway route for SIT — used by DAST (ZAP), API fuzzing (Schemathesis)
# and E2E integration tests. Edge TLS, restricted to SIT hostname.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: gateway
    ingress.payu.io/class: shared
spec:
  host: gateway-sit.apps.fajjjar.my.id
  to:
    kind: Service
    name: gateway-service
    port:
      name: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
