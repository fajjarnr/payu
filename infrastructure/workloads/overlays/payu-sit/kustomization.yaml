    metadata:
      name: web-app
    spec:
      strategy:
        type: Recreate
        rollingUpdate: null

# OIDC Issuer patches - Spring Boot services (OIDC_ISSUER + OIDC_JWK_SET_URI)
- target:
    kind: Deployment
    name: auth-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: OIDC_ISSUER
              value: "https://sso-sit.apps.fajjjar.my.id/realms/payu"
            - name: OIDC_JWK_SET_URI
              value: "http://payu-keycloak-service.payu-sit.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "https://sso-sit.apps.fajjjar.my.id/realms/payu"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
