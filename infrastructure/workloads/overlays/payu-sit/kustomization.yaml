# OIDC Issuer patches for sit environment
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/14/value
      value: "https://sso-payu-sit.apps.payu.ocp.fajjjar.my.id/realms/payu"
    - op: replace
      path: /spec/template/spec/containers/0/env/15/value
      value: "https://sso-payu-sit.apps.payu.ocp.fajjjar.my.id/realms/payu/protocol/openid-connect/certs"
