# OIDC Issuer patches - Quarkus services
# Note: Quarkus reads QUARKUS_OIDC_TOKEN_ISSUER, not OIDC_ISSUER.
# OIDC_ISSUER/JWK_SET_URI in base deployments are unused by Quarkus.
- target:
    kind: Deployment
    name: api-portal-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api-portal-service
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: "any"
            - name: QUARKUS_TLS_TRUST_ALL
              value: "true"
            - name: QUARKUS_OIDC_DISCOVERY_ENABLED
              value: "false"
            - name: QUARKUS_OIDC_JWKS_PATH
              value: "/protocol/openid-connect/certs"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: "http://payu-keycloak-service.payu-sit.svc.cluster.local:8080/realms/payu"
- target:
    kind: Deployment
    name: gateway-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: gateway-service
    spec:
      template:
        metadata:
          annotations:
            payu.io/cache-protocol: "plain-2026-08-04"
        spec:
          containers:
          - name: app
            resources:
              limits:
                memory: 2Gi
            env:
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: "https://sso-sit.apps.fajjjar.my.id/realms/payu"
            - name: QUARKUS_TLS_TRUST_ALL
              value: "true"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: "http://payu-keycloak-service.payu-sit.svc.cluster.local:8080/realms/payu"
