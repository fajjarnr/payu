apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payu-sit
resources:
  - ../../../base/loan-origination-process
images:
  - name: image-registry.openshift-image-registry.svc:5000/payu-dev/loan-origination-process
    newName: image-registry.openshift-image-registry.svc:5000/payu-sit/loan-origination-process
    newTag: "1.18.8"
patches:
  - target:
      kind: Deployment
      name: loan-origination-process
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRINGDOC_API_DOCS_ENABLED
          value: "true"
