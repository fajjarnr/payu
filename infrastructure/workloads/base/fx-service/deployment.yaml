apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-service
  labels:
    app.kubernetes.io/name: fx-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.8.2
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fx-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fx-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.8.2
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: fx-service
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/fx-service:1.8.2
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            cpu: 150m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: container
        - name: SERVER_PORT
          value: '8080'
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://payu-postgres:5432/payu_fx"
        - name: SPRING_DATASOURCE_USERNAME
          value: "payu"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "payu-dev-password"
        - name: PAYU_CACHE_REDIS_HOST
          value: payu-datagrid
        - name: PAYU_CACHE_REDIS_PORT
          value: "11222"
        - name: PAYU_CACHE_REDIS_PASSWORD
          value: payu-cache-dev-password
        - name: PAYU_CACHE_REDIS_USERNAME
          value: developer
        - name: REDIS_HOST
          value: payu-datagrid
        - name: REDIS_PORT
          value: "11222"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          value: payu-datagrid
        - name: SPRING_DATA_REDIS_PORT
          value: "11222"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: SPRING_DATA_REDIS_PASSWORD
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "3"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "payu-kafka-kafka-bootstrap:9092"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "payu-kafka-kafka-bootstrap:9092"
        - name: OIDC_ISSUER
          value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu"
        - name: OIDC_JWK_SET_URI
          value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
