apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: account-service-db-credentials
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: payu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: payu-vault
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: payu/dev/account-service/db-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payu/dev/account-service/db-credentials
        property: password
  # ponytail: per-service Vault path; VSO VaultStaticSecret equivalent commented for future
  # VaultStaticSecret mount: payu path: dev/account-service/db-credentials rolloutRestartTargets Deployment/account-service
