# PAYU-TB: allow TokoBapak dev namespace to reach partner-service SNAP-BI (8080).
# payu-dev default-deny-all + allow-intra-namespace (part-of=payu only) otherwise
# drops cross-namespace partner traffic (TokoBapak payment-service → /v1.0/*).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: partner-service-allow-tokobapak
  labels:
    app.kubernetes.io/name: partner-service
    app.kubernetes.io/part-of: payu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: partner-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same-namespace platform traffic (gateway → SNAP-BI). Without this,
        # selecting these pods denies everything except tokobapak-dev in
        # environments without a separate intra-namespace allow policy.
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tokobapak-dev
        # Tekton CI/CD probes (k6/zap/schemathesis run from payu-cicd).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payu-cicd
      ports:
        - protocol: TCP
          port: 8080
