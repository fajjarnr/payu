# PayU Workload Resource Budget
# Maps service resource allocations against namespace ResourceQuotas
# Prevents deployment failures from quota exhaustion
#
# Linked Quota: infrastructure/foundation/namespaces/base/resource-quotas.yaml
# Reference:  https://kubernetes.io/docs/concepts/policy/resource-quotas/

# ─────────────────────────────────────────────────────────
# payu-dev Quota Budget (requests.cpu: 8, requests.memory: 20Gi, limits.cpu: 36, limits.memory: 64Gi)
# ─────────────────────────────────────────────────────────
# 23 microservices × typical profile:
#   requests: 100-150m CPU / 256-384Mi memory
#   limits:   500-1000m CPU / 512-768Mi memory
# ─────────────────────────────────────────────────────────
# Tier 1 (Core): gateway, account, transaction, wallet, auth — higher limits
# Tier 2 (Standard): All other Spring Boot services
# Tier 3 (Python): analytics, kyc — different profile
# ─────────────────────────────────────────────────────────
# Total budget with slack:
#   CPU requests:  ~3.45 / 8  (43%)  ✅
#   Mem requests:  ~8.8Gi / 20Gi (44%)  ✅
#   CPU limits:    ~23 / 36 (64%)  ✅
#   Mem limits:    ~17.6Gi / 48Gi (37%)  ✅
# ─────────────────────────────────────────────────────────
# Warning threshold: 80% quota utilization triggers alert
# Action: scale down non-critical services or increase quota
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-resource-budget
  namespace: payu-dev
  labels:
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: ops
  annotations:
    payu.fajjjar.my.id/linked-quota: "payu-dev-quota"
    payu.fajjjar.my.id/total-services: "23"
    payu.fajjjar.my.id/cpu-requests-budget: "3450m"
    payu.fajjjar.my.id/memory-requests-budget: "8.8Gi"
    payu.fajjjar.my.id/cpu-limits-budget: "23"
    payu.fajjjar.my.id/memory-limits-budget: "17.6Gi"
data:
  tier-core: |
    gateway-service:    requests=100m/256Mi limits=500m/512Mi
    account-service:    requests=100m/256Mi limits=500m/512Mi
    transaction-service: requests=150m/384Mi limits=1000m/768Mi
    wallet-service:     requests=100m/256Mi limits=500m/512Mi
    auth-service:       requests=100m/256Mi limits=500m/512Mi
  tier-standard: |
    (18 Spring Boot services): requests=100m/256Mi limits=500m/512Mi each
  tier-python: |
    analytics-service:  requests=100m/256Mi limits=200m/512Mi
    kyc-service:        requests=100m/256Mi limits=200m/512Mi
