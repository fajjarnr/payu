apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-service
  labels:
    app.kubernetes.io/name: cms-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.9.4
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cms-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cms-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.9.4
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: cms-service
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cms-service
      volumes:
      - name: tmp
        emptyDir: {}
      - name: datagrid-client-tls
        secret:
          secretName: payu-cache-client-tls
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/cms-service:1.8.81
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: datagrid-client-tls
          mountPath: /var/run/payu-cache/tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 90
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
        - name: SPRING_APPLICATION_NAME
          value: cms-service
        - name: SERVICE_VERSION
          value: 1.8.81
        - name: SPRING_PROFILES_ACTIVE
          value: container
        - name: SERVER_PORT
          value: '8080'
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: CMS_DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: PAYU_CACHE_PROVIDER
          value: hotrod
        - name: PAYU_CACHE_HOTROD_SERVER_LIST
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: DATAGRID_HOTROD_SERVER_LIST
        - name: PAYU_CACHE_HOTROD_CACHE_NAME
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: DATAGRID_CACHE_NAME
        - name: PAYU_CACHE_HOTROD_AUTH_USERNAME
          value: developer
        - name: PAYU_CACHE_HOTROD_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-credentials
              key: password
        - name: PAYU_CACHE_HOTROD_USE_SSL
          value: 'true'
        - name: PAYU_CACHE_HOTROD_TRUST_STORE_FILE_NAME
          value: /var/run/payu-cache/tls/truststore.p12
        - name: PAYU_CACHE_HOTROD_TRUST_STORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-client-tls
              key: truststore-password
        - name: PAYU_CACHE_HOTROD_KEY_STORE_FILE_NAME
          value: /var/run/payu-cache/tls/keystore.p12
        - name: PAYU_CACHE_HOTROD_KEY_STORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-client-tls
              key: keystore-password
        - name: PAYU_CACHE_HOTROD_SNI_HOST_NAME
          value: payu-cache.payu-dev.svc.cluster.local
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: '3'
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: '1'
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: OIDC_ISSUER
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: OIDC_JWK_SET_URI
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs
        - name: JAVA_TOOL_OPTIONS
          value: "--enable-native-access=ALL-UNNAMED"
        - name: PAYU_SECURITY_ENCRYPTION_SALT
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: ENCRYPTION_SALT
              optional: true
        - name: WEBHOOK_SECURITY_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WEBHOOK_SECRET
              optional: true
