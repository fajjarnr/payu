apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: platform-team
    app.kubernetes.io/version: 1.9.4
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: platform-team
        app.kubernetes.io/version: 1.9.4
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: billing-service
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: billing-service
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/billing-service:1.8.82
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 90
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
        - name: SPRING_APPLICATION_NAME
          value: billing-service
        - name: SERVICE_VERSION
          value: 1.8.82
        - name: SPRING_PROFILES_ACTIVE
          value: container
        - name: SERVER_PORT
          value: '8080'
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: BILLING_DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: PAYU_CACHE_REDIS_HOST
          value: payu-cache-resp.payu-dev.svc.cluster.local
        - name: PAYU_CACHE_REDIS_PORT
          value: '11222'
        - name: PAYU_CACHE_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-credentials
              key: password
        - name: PAYU_CACHE_REDIS_USERNAME
          value: developer
        - name: SPRING_DATA_REDIS_USERNAME
          value: developer
        - name: REDIS_HOST
          value: payu-cache-resp.payu-dev.svc.cluster.local
        - name: REDIS_PORT
          value: '11222'
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-credentials
              key: password
        - name: SPRING_DATA_REDIS_HOST
          value: payu-cache-resp.payu-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: '11222'
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-credentials
              key: password
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: '3'
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: '1'
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: ARTEMIS_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: ARTEMIS_URL

        - name: ARTEMIS_PORT
          value: '61616'
        - name: ARTEMIS_HOST
          value: payu-broker-hdls-svc
        - name: ARTEMIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: payu-broker-credentials-secret
              key: AMQ_USER
        - name: ARTEMIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-broker-credentials-secret
              key: AMQ_PASSWORD

        - name: OIDC_ISSUER
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: OIDC_JWK_SET_URI
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs
        - name: JAVA_TOOL_OPTIONS
          value: "--enable-native-access=ALL-UNNAMED"
        - name: PAYU_SECURITY_ENCRYPTION_SALT
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: ENCRYPTION_SALT
              optional: true
        - name: WEBHOOK_SECURITY_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WEBHOOK_SECRET
              optional: true
