apiVersion: apps/v1
kind: Deployment
metadata:
  name: lending-rules
  labels:
    app.kubernetes.io/name: lending-rules
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: rules-engine
    app.kubernetes.io/managed-by: platform-team
    app.kubernetes.io/version: 1.9.4
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lending-rules
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lending-rules
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: rules-engine
        app.kubernetes.io/managed-by: platform-team
        app.kubernetes.io/version: 1.9.4
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: lending-rules
      terminationGracePeriodSeconds: 60
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/lending-rules:1.8.85
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 4
          failureThreshold: 90
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: container
        - name: SERVER_PORT
          value: '8080'
