# =============================================================================
# Horizontal Pod Autoscaler (HPA) for PayU Services
# =============================================================================
# Auto-scaling configuration based on CPU utilization (70% target)
# Min: 1 replica (cost optimization during low traffic)
# Max: 5 replicas (handle traffic spikes)
# =============================================================================

# Critical Services - Scale 1-5 replicas
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service-hpa
  labels:
    app: gateway-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

