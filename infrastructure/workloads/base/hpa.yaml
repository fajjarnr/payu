# =============================================================================
# Horizontal Pod Autoscaler (HPA) for PayU Workloads
# =============================================================================
# CPU utilization target 70%; min 1, max 5 for services; max 2 for simulators.
# sync-wave -1: HPAs apply BEFORE Deployments so Kyverno require-hpa admission
# (payu-uat/preprod/prod) passes during ArgoCD sync.
# =============================================================================
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-service-hpa
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: payu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: account-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
