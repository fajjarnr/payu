apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.8.1
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.8.1
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service:1.8.1
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: SERVER_PORT
          value: '8080'
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://payu-postgres:5432/payu_gateway"
        - name: SPRING_DATASOURCE_USERNAME
          value: "payu"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "payu-dev-password"
        - name: QUARKUS_REDIS_HOSTS
          value: "redis://developer:payu-cache-dev-password@payu-datagrid:11222"
        - name: REDIS_HOST
          value: "payu-datagrid"
        - name: REDIS_PORT
          value: "11222"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          value: "payu-datagrid"
        - name: SPRING_DATA_REDIS_PORT
          value: "11222"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: SPRING_DATA_REDIS_PASSWORD
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "3"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          value: "http://payu-keycloak-service:8080/realms/payu"
        - name: OIDC_ISSUER
          value: "http://payu-keycloak-service:8080/realms/payu"
        - name: OIDC_JWK_SET_URI
          value: "http://payu-keycloak-service:8080/realms/payu/protocol/openid-connect/certs"
        - name: GATEWAY_RATE_LIMIT_TEST_MODE
          value: "true"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: payu-secrets
              key: JWT_SECRET
        - name: WEBHOOK_PARTNER_1_SECRET
          value: "dev_partner_1_secret"
