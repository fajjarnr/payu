apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.8.2
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.8.2
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: gateway-service
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: gateway-service
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service:1.8.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: "jdbc:postgresql://payu-postgres-primary.payu-dev.svc.cluster.local:5432/payu_gateway"
        - name: REDIS_HOST
          value: "payu-datagrid.payu-dev.svc.cluster.local"
        - name: REDIS_PORT
          value: "11222"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-kafka-bootstrap.payu-dev.svc.cluster.local:9092"
        - name: QUARKUS_REDIS_HOSTS
          value: "redis://developer:payu-cache-dev-password@payu-datagrid.payu-dev.svc.cluster.local:11222"
        - name: REDIS_PASSWORD
          value: "payu-cache-dev-password"
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu"
        - name: QUARKUS_OIDC_TOKEN_ISSUER
          value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu"
        - name: QUARKUS_TLS_TRUST_ALL
          value: "false"
        - name: GATEWAY_RATE_LIMIT_TEST_MODE
          value: "false"
        - name: JWT_SECRET
          value: "payu-dev-jwt-secret-key-2026"
        - name: WEBHOOK_PARTNER_1_SECRET
          value: "webhook-dev-secret-partner-1"
