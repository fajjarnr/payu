apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.9.4
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.9.4
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: gateway-service
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: gateway-service
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service:1.9.5
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 30
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: GATEWAY_DB_URL
        - name: REDIS_HOST
          value: payu-cache-resp.payu-dev.svc.cluster.local
        - name: REDIS_PORT
          value: '11222'
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: QUARKUS_REDIS_HOSTS
          value: redis://payu-cache-resp.payu-dev.svc.cluster.local:11222
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-credentials
              key: password
        - name: QUARKUS_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payu-cache-credentials
              key: password
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: QUARKUS_OIDC_TOKEN_ISSUER
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: QUARKUS_TLS_TRUST_ALL
          value: 'false'
        - name: GATEWAY_RATE_LIMIT_TEST_MODE
          value: 'false'
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: JWT_SECRET
        - name: WEBHOOK_PARTNER_1_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WEBHOOK_SECRET
        - name: JAVA_TOOL_OPTIONS
          value: "--enable-native-access=ALL-UNNAMED"
        - name: PAYU_SECURITY_ENCRYPTION_SALT
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: ENCRYPTION_SALT
              optional: true
        - name: WEBHOOK_SECURITY_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WEBHOOK_SECRET
              optional: true
