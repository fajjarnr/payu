apiVersion: apps/v1
kind: Deployment
metadata:
  name: biller-simulator
  labels:
    app: biller-simulator
    app.kubernetes.io/name: biller-simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/version: "1.8.80"
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biller-simulator
  template:
    metadata:
      labels:
        app: biller-simulator
        app.kubernetes.io/name: biller-simulator
        app.kubernetes.io/part-of: payu
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /q/metrics
        prometheus.io/port: '8080'
    spec:
      securityContext:
        runAsNonRoot: true
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: biller-simulator
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/biller-simulator:1.8.80
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: BILLER_DB_URL
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USERNAME
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION
          value: drop-and-create
        - name: QUARKUS_HIBERNATE_ORM_ENABLED
          value: 'true'
        - name: QUARKUS_HIBERNATE_ORM_ACTIVE
          value: 'true'
        - name: QUARKUS_DATASOURCE_DB_KIND
          value: postgresql
        envFrom:
        - configMapRef:
            name: biller-simulator-config
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /api/v1/biller/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/biller/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: biller-simulator
  labels:
    app: biller-simulator
spec:
  selector:
    app: biller-simulator
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: biller-simulator-config
data:
  SIMULATOR_LATENCY_MIN: '100'
  SIMULATOR_LATENCY_MAX: '600'
  SIMULATOR_FAILURE_RATE: '3'
