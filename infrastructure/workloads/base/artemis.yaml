apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis
  labels:
    app.kubernetes.io/name: artemis
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: message-queue
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artemis
  template:
    metadata:
      labels:
        app: artemis
        app.kubernetes.io/name: artemis
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: message-queue
    spec:
      containers:
      - name: artemis
        image: quay.io/artemiscloud/activemq-artemis-broker:artemis.2.37.0
        env:
        - name: AMQ_USER
          value: admin
        - name: AMQ_PASSWORD
          value: admin
        - name: AMQ_QUEUES
          value: payu.notification.commands,payu.integration.commands,payu.billing.scheduled,payu.kyc.commands
        ports:
        - containerPort: 61616
          name: core
        - containerPort: 5672
          name: amqp
        - containerPort: 8161
          name: web
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
  labels:
    app.kubernetes.io/name: artemis
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: message-queue
spec:
  selector:
    app: artemis
  ports:
  - name: core
    port: 61616
    targetPort: 61616
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: web
    port: 8161
    targetPort: 8161
