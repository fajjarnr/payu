apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
# account-service is managed by its own per-service ApplicationSet (ADR-0066
# polyrepo): infrastructure/workloads/overlays/payu-<env>/account-service
- ./analytics-service
- ./api-portal-service
- ./auth-service
- ./backoffice-service
- ./billing-service
- ./cms-service
- ./compliance-service
- ./dispute-service
- ./fx-service
- ./gateway-service
- ./integration-service
- ./investment-service
- ./kyc-service
- ./lending-service
- ./loan-origination-process
- ./notification-service
- ./partner-service
- ./product-catalog-service
- ./promotion-service
- ./statement-service
- ./support-service
- ./transaction-service
- ./wallet-service
- ./web-app
- ./hpa.yaml
- ./pdb.yaml
- ./resource-budget.yaml
- ./bi-fast-simulator
- ./biller-simulator
- ./dukcapil-simulator
- ./qris-simulator
- ./va-simulator
- ./service-endpoints.yaml
- ./dev-env-secrets.yaml

# ARCH-007: all remaining JVM workloads use the shared Hot Rod/mTLS contract.
# The referenced secrets are provisioned externally; no credential material is
# stored in this repository.
# OVERLAY-STRUCT-001: the tls-client mount (volumeMounts/volumes index 1) and
# the mTLS env injected below are DEVOURED on the payu-dev render path by
# overlays/payu-dev/components/dev-cache (strategic $patch: delete + no-mount
# since per-service renders never include this base patch). Promoted envs keep
# the mTLS shape. Do NOT move this patch into per-service bases.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(account-service|analytics-service|api-portal-service|auth-service|backoffice-service|billing-service|cms-service|compliance-service|dispute-service|fx-service|gateway-service|integration-service|investment-service|kyc-service|lending-service|loan-origination-process|notification-service|partner-service|product-catalog-service|promotion-service|statement-service|support-service|transaction-service|wallet-service)$"
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hotrod-client-workload
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            volumes:
              - name: tmp
                emptyDir: {}
              - name: datagrid-client-tls
                secret:
                  secretName: payu-cache-client-tls
            containers:
              - name: app
                resources:
                  requests:
                    cpu: 20m
                    memory: 128Mi
                startupProbe:
                  failureThreshold: 90
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
                  - name: datagrid-client-tls
                    mountPath: /var/run/payu-cache/tls
                    readOnly: true
                env:
                  - name: SPRING_FLYWAY_LOCK_RETRY_COUNT
                    value: "120"
                  - name: PAYU_CACHE_PROVIDER
                    value: hotrod
                  - name: PAYU_CACHE_HOTROD_SERVER_LIST
                    valueFrom:
                      configMapKeyRef:
                        name: service-endpoints
                        key: DATAGRID_HOTROD_SERVER_LIST
                  - name: PAYU_CACHE_HOTROD_CACHE_NAME
                    valueFrom:
                      configMapKeyRef:
                        name: service-endpoints
                        key: DATAGRID_CACHE_NAME
                  - name: PAYU_CACHE_HOTROD_AUTH_USERNAME
                    value: developer
                  - name: PAYU_CACHE_HOTROD_AUTH_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: payu-cache-credentials
                        key: password
                  - name: PAYU_CACHE_HOTROD_USE_SSL
                    value: 'true'
                  - name: PAYU_CACHE_HOTROD_TRUST_STORE_FILE_NAME
                    value: /var/run/payu-cache/tls/truststore.p12
                  - name: PAYU_CACHE_HOTROD_TRUST_STORE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: payu-cache-client-tls
                        key: truststore-password
                  - name: PAYU_CACHE_HOTROD_KEY_STORE_FILE_NAME
                    value: /var/run/payu-cache/tls/keystore.p12
                  - name: PAYU_CACHE_HOTROD_KEY_STORE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: payu-cache-client-tls
                        key: keystore-password
                  - name: WALLET_GRPC_ADDRESS
                    value: static://wallet-service:9090
                  - name: DUKCAPIL_SIMULATOR_URL
                    value: http://dukcapil-simulator:8080
                  - name: BIFAST_SIMULATOR_URL
                    value: http://bi-fast-simulator:8080
                  - name: QRIS_SIMULATOR_URL
                    value: http://qris-simulator:8080
                  - name: PAYU_CACHE_HOTROD_SNI_HOST_NAME
                    value: payu-cache
                  # OVERLAY-STRUCT-001: NO redis $patch:delete here. The leaf
                  # bases carry the dev RESP triple (payu-cache-resp:11222) and
                  # BOTH render paths (root + per-service) must keep it — the
                  # 2026-10-12 wallet-only re-add proved per-target exceptions
                  # do not scale. Promoted envs override via their own overlays.

