apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.8.1
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.8.1
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: transaction-service
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: transaction-service
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: default-route-openshift-image-registry.apps.payu.ocp.fajjjar.my.id/payu-dev/transaction-service:1.8.63
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        resources:
          requests:
            cpu: 150m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: container
        - name: SERVER_PORT
          value: '8080'
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: TRANSACTION_DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: PAYU_CACHE_REDIS_HOST
          value: payu-cache.payu-dev.svc.cluster.local
        - name: PAYU_CACHE_REDIS_PORT
          value: '6379'
        - name: PAYU_CACHE_REDIS_PASSWORD
          value: payu-cache-dev-password
        - name: PAYU_CACHE_REDIS_USERNAME
          value: ""
        - name: PAYU_CACHE_REDIS_URL
          value: redis://:payu-cache-dev-password@payu-cache:6379
        - name: REDIS_HOST
          value: payu-cache.payu-dev.svc.cluster.local
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_PASSWORD
          value: payu-cache-dev-password
        - name: SPRING_DATA_REDIS_HOST
          value: payu-cache.payu-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: SPRING_DATA_REDIS_PASSWORD
          value: payu-cache-dev-password
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: '3'
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: '1'
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: OIDC_ISSUER
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: OIDC_JWK_SET_URI
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs
        # Services URL config (read by id.payu.transaction.adapter.client.* adapters)
        # Code reads these via @Value("${services.<name>.url}") which Spring resolves
        # from env var SERVICES_<NAME>_URL (uppercase, dots->underscores).
        - name: SERVICES_WALLET_URL
          value: "http://wallet-service:8080"
        - name: SERVICES_ACCOUNT_URL
          value: "http://account-service:8080"
        - name: SERVICES_BIFAST_URL
          value: "http://bifast-service:8080"
        - name: SERVICES_QRIS_URL
          value: "http://qris-service:8080"
        - name: SERVICES_RGS_URL
          value: "http://rgs-service:8080"
        - name: SERVICES_SKN_URL
          value: "http://skn-service:8080"
