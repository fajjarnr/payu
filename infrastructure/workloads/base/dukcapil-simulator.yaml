apiVersion: apps/v1
kind: Deployment
metadata:
  name: dukcapil-simulator
  labels:
    app: dukcapil-simulator
    app.kubernetes.io/name: dukcapil-simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/part-of: payu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dukcapil-simulator
  template:
    metadata:
      labels:
        app: dukcapil-simulator
        app.kubernetes.io/name: dukcapil-simulator
        app.kubernetes.io/part-of: payu
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /q/metrics
        prometheus.io/port: '8080'
    spec:
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: dukcapil-simulator
        image: default-route-openshift-image-registry.apps.payu.ocp.fajjjar.my.id/payu-dev/dukcapil-simulator:1.8.80
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: DUKCAPIL_DB_URL
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USERNAME
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        envFrom:
        - configMapRef:
            name: dukcapil-simulator-config
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: dukcapil-simulator
  labels:
    app: dukcapil-simulator
spec:
  selector:
    app: dukcapil-simulator
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dukcapil-simulator-config
data:
  SIMULATOR_LATENCY_MIN: '100'
  SIMULATOR_LATENCY_MAX: '800'
  SIMULATOR_FAILURE_RATE: '3'
  SIMULATOR_FACE_MATCH_THRESHOLD: '75'
  SIMULATOR_FACE_MATCH_VARIANCE: '10'
