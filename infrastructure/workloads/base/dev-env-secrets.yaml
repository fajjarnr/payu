apiVersion: v1
kind: Secret
metadata:
  name: dev-env-secrets
  labels:
    app.kubernetes.io/part-of: payu
type: Opaque
stringData:
  ENCRYPTION_SALT: "PayU-DEV-PBKDF2-Salt-v3-2026-!SafeForDevOnly!"
  WEBHOOK_SECRET: "payu-dev-webhook-secret-2026-not-default-value"
  JWT_SECRET: "PayU-DEV-JWT-Secret-Key-2026-VerySecure32BytesLengthKey!"
  secret-key: "PayU-DEV-SecretKey-2026-!SafeForDevOnly!"
  encryption-key: "PayU-DEV-PBKDF2-Salt-v3-2026-!SafeForDevOnly!"
  BLIND_INDEX_KEY: "PayU-DEV-BlindIndexKey-2026-32BytesLongSecret!"
  # WEB-OS-008: shared HMAC secret for BFF-issued WebSocket tickets (web-app <-> analytics-service)
  WS_TICKET_SECRET: "PayU-DEV-WS-Ticket-Secret-2026-!SafeForDevOnly!"
  # SEC-003: shared HMAC secret for dispute->wallet refund commands (fail-closed when empty).
  # Dev value only — sit/uat/preprod/prod MUST source this from Vault/ESO.
  REFUND_EVENT_HMAC_SECRET: "PayU-DEV-Refund-HMAC-2026-!SafeForDevOnly!-rotate-via-vault"
