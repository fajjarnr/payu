apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.8.1
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.8.1
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: notification-service
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: notification-service
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/notification-service:1.8.23
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: ARTEMIS_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: ARTEMIS_URL

        - name: QUARKUS_DATASOURCE_JDBC_URL

          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: NOTIFICATION_DB_URL
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USERNAME
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: PAYU_CACHE_REDIS_HOST
          value: payu-datagrid.payu-dev.svc.cluster.local
        - name: PAYU_CACHE_REDIS_PORT
          value: '11222'
        - name: PAYU_CACHE_REDIS_PASSWORD
          value: payu-cache-dev-password
        - name: PAYU_CACHE_REDIS_USERNAME
          value: developer
        - name: REDIS_HOST
          value: payu-datagrid.payu-dev.svc.cluster.local
        - name: REDIS_PORT
          value: '11222'
        - name: REDIS_PASSWORD
          value: payu-cache-dev-password
        - name: SPRING_DATA_REDIS_HOST
          value: payu-datagrid.payu-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: '11222'
        - name: SPRING_DATA_REDIS_PASSWORD
          value: payu-cache-dev-password
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: QUARKUS_KAFKA_STREAMS_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: OIDC_ISSUER
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: OIDC_JWK_SET_URI
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs
