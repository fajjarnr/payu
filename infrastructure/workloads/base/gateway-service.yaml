apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: payu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: payu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: gateway-service
          image: image-registry.openshift-image-registry.svc:5000/payu-dev/gateway-service:1.7.9
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: url
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_AUTH_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: oidc-auth-server-url
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://payu-postgres-primary.payu-dev.svc:5432/payu_gateway_service"
            - name: REDIS_HOST
              value: "payu-cache.payu-dev.svc"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: JWT_SECRET
            - name: WEBHOOK_PARTNER_1_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: WEBHOOK_PARTNER_1_SECRET
          envFrom:
            - configMapRef:
                name: gateway-services-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-services-config
data:
  ACCOUNT_SERVICE_URL: "http://account-service:8080"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  TRANSACTION_SERVICE_URL: "http://transaction-service:8080"
  WALLET_SERVICE_URL: "http://wallet-service:8080"
  BILLING_SERVICE_URL: "http://billing-service:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
  KYC_SERVICE_URL: "http://kyc-service:8080"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8080"
  BIFAST_SIMULATOR_URL: "http://bi-fast-simulator:8080"
  DUKCAPIL_SIMULATOR_URL: "http://dukcapil-simulator:8080"
  QRIS_SIMULATOR_URL: "http://qris-simulator:8080"
  # New services
  INVESTMENT_SERVICE_URL: "http://investment-service:8080"
  LENDING_SERVICE_URL: "http://lending-service:8080"
  FX_SERVICE_URL: "http://fx-service:8080"
  STATEMENT_SERVICE_URL: "http://statement-service:8080"
  PARTNER_SERVICE_URL: "http://partner-service:8080"
  PROMOTION_SERVICE_URL: "http://promotion-service:8080"
  SUPPORT_SERVICE_URL: "http://support-service:8080"
  COMPLIANCE_SERVICE_URL: "http://compliance-service:8080"
  API_PORTAL_SERVICE_URL: "http://api-portal-service:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  oidc-auth-server-url: "http://payu-keycloak-service:8080/realms/payu"
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: gateway-service
    weight: 100
  wildcardPolicy: None
