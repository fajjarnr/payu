apiVersion: apps/v1
kind: Deployment
metadata:
  name: va-simulator
  labels:
    app: va-simulator
    app.kubernetes.io/name: va-simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/managed-by: platform-team
    app.kubernetes.io/part-of: payu
    team: backend
    app.kubernetes.io/version: 1.8.80
spec:
  replicas: 1
  selector:
    matchLabels:
      app: va-simulator
  template:
    metadata:
      labels:
        app: va-simulator
        app.kubernetes.io/name: va-simulator
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/managed-by: platform-team
        app.kubernetes.io/version: 1.8.80
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8085'
    spec:
      securityContext:
        runAsNonRoot: true
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: va-simulator
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/va-simulator:1.8.81
        imagePullPolicy: Always
        ports:
        - containerPort: 8085
          name: http
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: SPRING_APPLICATION_NAME
          value: va-simulator
        - name: SERVICE_VERSION
          value: 1.8.80
        - name: QUARKUS_DATASOURCE_JDBC_URL
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: VA_SIMULATOR_DB_URL
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USERNAME
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: QUARKUS_DATASOURCE_DB_KIND
          value: postgresql
        - name: VA_CALLBACK_URL
          value: http://transaction-service:8080/api/v1/payments/va/callback
        - name: PAYU_CALLBACK_SIGNATURE_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WEBHOOK_SECRET
        envFrom:
        - configMapRef:
            name: va-simulator-config
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        startupProbe:
          httpGet:
            path: /q/health/live
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: va-simulator
  labels:
    app: va-simulator
spec:
  selector:
    app: va-simulator
  ports:
  - port: 8085
    targetPort: 8085
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: va-simulator-config
data:
  SIMULATOR_LATENCY_MIN: '50'
  SIMULATOR_LATENCY_MAX: '500'
  SIMULATOR_FAILURE_RATE: '5'
  SIMULATOR_WEBHOOK_ENABLED: 'true'
  SIMULATOR_WEBHOOK_DELAY_MS: '2000'
