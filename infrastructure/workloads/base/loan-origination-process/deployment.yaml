apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-origination-process
  labels:
    app.kubernetes.io/name: loan-origination-process
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: process-orchestration
    app.kubernetes.io/managed-by: platform-team
    app.kubernetes.io/version: 1.18.74
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loan-origination-process
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loan-origination-process
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: process-orchestration
        app.kubernetes.io/managed-by: platform-team
        app.kubernetes.io/version: 1.18.74
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: loan-origination-process
      terminationGracePeriodSeconds: 60
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/loan-origination-process:1.18.74
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 90
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 768Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: container
        - name: SERVER_PORT
          value: '8080'
        - name: DATABASE_URL
          value: jdbc:postgresql://payu-database-rw:5432/payu_loan_origination
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: DB_USERNAME
              name: db-secrets
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: db-secrets
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              key: KAFKA_URL
              name: service-endpoints
        - name: OIDC_ISSUER
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu
        - name: OIDC_JWK_SET_URI
          value: http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs
        - name: JAVA_TOOL_OPTIONS
          value: "--enable-native-access=ALL-UNNAMED"
        - name: PAYU_SECURITY_ENCRYPTION_SALT
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: ENCRYPTION_SALT
              optional: true
        - name: WEBHOOK_SECURITY_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WEBHOOK_SECRET
              optional: true
