apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: 1.5.2
    team: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-app
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: frontend
        app.kubernetes.io/version: 1.5.2
        team: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: web-app
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: web-app
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: default-route-openshift-image-registry.apps.payu.ocp.fajjjar.my.id/payu-dev/web-app:1.5.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 90
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
        - name: OIDC_ISSUER
          value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu"
        - name: OIDC_JWK_SET_URI
          value: "http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs"
        - name: NODE_ENV
          value: "production"
        - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: session-secrets
              key: next-server-actions-encryption-key
              optional: true
