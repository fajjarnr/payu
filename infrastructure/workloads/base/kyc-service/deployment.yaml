apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-service
  labels:
    app.kubernetes.io/name: kyc-service
    app.kubernetes.io/part-of: payu
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: 1.8.1
    team: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-service
        app.kubernetes.io/part-of: payu
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: 1.8.1
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: kyc-service
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kyc-service
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/payu-dev/kyc-service:1.8.8
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 20
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: KYC_DATABASE_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: KAFKA_URL
        - name: DUKCAPIL_URL
          value: "http://dukcapil-simulator:8091/api/v1"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: payu-secrets
              key: secret-key
        - name: ENVIRONMENT
          value: "container"
        - name: ARTEMIS_HOST
          value: payu-broker-hdls-svc
        - name: ARTEMIS_STOMP_PORT
          value: "61613"
        - name: ARTEMIS_USERNAME
          value: admin
        - name: ARTEMIS_PASSWORD
          value: payu-dev-artemis-pwd-2026
        - name: JAVA_TOOL_OPTIONS
          value: "--enable-native-access=ALL-UNNAMED"
        - name: PAYU_SECURITY_ENCRYPTION_SALT
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: ENCRYPTION_SALT
              optional: true
        - name: WEBHOOK_SECURITY_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: WEBHOOK_SECRET
              optional: true
