{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/part-of: payu-banking
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
spec:
  replicas: {{ $svc.replicaCount | default $.Values.defaults.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-service
        app.kubernetes.io/part-of: payu-banking
      annotations:
        {{- toYaml $.Values.defaults.podAnnotations | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.defaults.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            {{- if $svc.springProfile }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $svc.springProfile | quote }}
            {{- else if $svc.quarkusProfile }}
            - name: QUARKUS_PROFILE
              value: {{ $svc.quarkusProfile | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.defaults.otelEndpoint | default "http://jaeger-collector:4317" | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name }}-service
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
                optional: true
            - secretRef:
                name: {{ $name }}-secrets
                optional: true
            {{- if $.Values.defaults.sharedConfigMap }}
            - configMapRef:
                name: {{ $.Values.defaults.sharedConfigMap }}
                optional: true
            {{- end }}
          livenessProbe:
            {{- if $svc.livenessProbe }}
            {{- toYaml $svc.livenessProbe | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.defaults.livenessProbe | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- if $svc.readinessProbe }}
            {{- toYaml $svc.readinessProbe | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.defaults.readinessProbe | nindent 12 }}
            {{- end }}
          resources:
            {{- if $svc.resources }}
            {{- toYaml $svc.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.defaults.resources | nindent 12 }}
            {{- end }}
{{- end }}
{{- end }}
