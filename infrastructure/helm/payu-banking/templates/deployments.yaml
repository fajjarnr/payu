{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/part-of: payu-banking
    app.kubernetes.io/managed-by: helm
spec:
  replicas: {{ $svc.replicaCount | default $.Values.defaults.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-service
        app.kubernetes.io/part-of: payu-banking
      annotations:
        {{- toYaml $.Values.defaults.podAnnotations | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.defaults.securityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
                optional: true
            - secretRef:
                name: {{ $name }}-secrets
                optional: true
          livenessProbe:
            {{- toYaml $.Values.defaults.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $.Values.defaults.readinessProbe | nindent 12 }}
          resources:
            {{- if $svc.resources }}
            {{- toYaml $svc.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.defaults.resources | nindent 12 }}
            {{- end }}
{{- end }}
{{- end }}
