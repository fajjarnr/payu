{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $replicas := $svc.replicaCount | default $.Values.defaults.replicaCount | int }}
{{- if gt $replicas 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-service
  labels:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/part-of: payu-banking
    app.kubernetes.io/managed-by: helm
spec:
  {{- if ge $replicas 3 }}
  maxUnavailable: 1
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-service
{{- end }}
{{- end }}
{{- end }}
