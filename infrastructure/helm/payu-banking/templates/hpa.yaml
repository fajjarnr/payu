{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-service
  labels:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/part-of: payu-banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-service
  minReplicas: {{ $svc.replicaCount | default $.Values.defaults.replicaCount }}
  maxReplicas: {{ mul ($svc.replicaCount | default $.Values.defaults.replicaCount | int) 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
{{- end }}
{{- end }}
