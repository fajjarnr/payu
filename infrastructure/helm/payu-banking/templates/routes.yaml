{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (hasKey $svc "route") }}
{{- if $svc.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}-service
  labels:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/part-of: payu-banking
  annotations:
    haproxy.router.openshift.io/timeout: {{ $svc.route.timeout | default "60s" | quote }}
    {{- if $svc.route.rateLimit }}
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: {{ $svc.route.rateLimit | default "100" | quote }}
    {{- end }}
spec:
  {{- if $svc.route.host }}
  host: {{ $svc.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ $name }}-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ $svc.route.tls.termination | default "edge" }}
    insecureEdgeTerminationPolicy: {{ $svc.route.tls.insecureEdgeTerminationPolicy | default "Redirect" }}
  wildcardPolicy: None
{{- end }}
{{- end }}
{{- end }}
