# PayU Banking Platform - Default Values
# Override per environment using values-dev.yaml, values-prod.yaml

global:
  imageRegistry: "registry.payu.id"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: payu-registry-secret
  storageClass: "gp3-csi"

# ============================================
# Service Defaults
# ============================================
defaults:
  replicaCount: 2
  sharedConfigMap: "payu-shared-config"
  otelEndpoint: "http://jaeger-collector:4317"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
  podAnnotations:
    sidecar.istio.io/inject: "true"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

# ============================================
# Core Banking Services
# ============================================
services:
  gateway:
    enabled: true
    replicaCount: 3
    quarkusProfile: "prod"
    image:
      repository: gateway-service
      tag: latest
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    livenessProbe:
      httpGet:
        path: /q/health/live
        port: http
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /q/health/ready
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3
    route:
      enabled: true
      host: api.payu.id
      timeout: "120s"
      rateLimit: "200"
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  account:
    enabled: true
    springProfile: "container"
    image:
      repository: account-service
      tag: latest
    port: 8080

  auth:
    enabled: true
    springProfile: "container"
    image:
      repository: auth-service
      tag: latest
    port: 8080

  transaction:
    enabled: true
    springProfile: "container"
    image:
      repository: transaction-service
      tag: latest
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 768Mi

  wallet:
    enabled: true
    springProfile: "container"
    image:
      repository: wallet-service
      tag: latest
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 768Mi

  lending:
    enabled: true
    springProfile: "container"
    image:
      repository: lending-service
      tag: latest
    port: 8080

  billing:
    enabled: true
    springProfile: "container"
    image:
      repository: billing-service
      tag: latest
    port: 8080

  notification:
    enabled: true
    quarkusProfile: "prod"
    image:
      repository: notification-service
      tag: latest
    port: 8080
    configMap:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/notificationdb"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "payu"
    livenessProbe:
      httpGet:
        path: /q/health/live
        port: http
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /q/health/ready
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3

  kyc:
    enabled: true
    # Python/FastAPI — env vars via ConfigMap
    image:
      repository: kyc-service
      tag: latest
    port: 8080
    configMap:
      DATABASE_URL: "postgresql://postgres:5432/kycdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      DUKCAPIL_URL: "http://dukcapil-simulator:8080"
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3

  compliance:
    enabled: true
    springProfile: "container"
    image:
      repository: compliance-service
      tag: latest
    port: 8080

  fx:
    enabled: true
    springProfile: "container"
    image:
      repository: fx-service
      tag: latest
    port: 8080

  investment:
    enabled: true
    springProfile: "container"
    image:
      repository: investment-service
      tag: latest
    port: 8080

  statement:
    enabled: true
    springProfile: "container"
    image:
      repository: statement-service
      tag: latest
    port: 8080

  cms:
    enabled: true
    springProfile: "container"
    image:
      repository: cms-service
      tag: latest
    port: 8080

  partner:
    enabled: true
    springProfile: "container"
    image:
      repository: partner-service
      tag: latest
    port: 8080

  support:
    enabled: true
    springProfile: "container"
    image:
      repository: support-service
      tag: latest
    port: 8080

  analytics:
    enabled: true
    # Python/FastAPI — env vars via ConfigMap
    image:
      repository: analytics-service
      tag: latest
    port: 8080
    configMap:
      DATABASE_URL: "postgresql://postgres:5432/analyticsdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3

  backoffice:
    enabled: true
    springProfile: "container"
    image:
      repository: backoffice-service
      tag: latest
    port: 8080

  promotion:
    enabled: true
    springProfile: "container"
    image:
      repository: promotion-service
      tag: latest
    port: 8080

  abTesting:
    enabled: true
    springProfile: "container"
    image:
      repository: ab-testing-service
      tag: latest
    port: 8080

  apiPortal:
    enabled: true
    quarkusProfile: "prod"
    image:
      repository: api-portal-service
      tag: latest
    port: 8080
    configMap:
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "payu"
      PORTAL_SERVICES_ACCOUNT_SERVICE_URL: "http://account-service:8080"
      PORTAL_SERVICES_AUTH_SERVICE_URL: "http://auth-service:8080"
      PORTAL_SERVICES_TRANSACTION_SERVICE_URL: "http://transaction-service:8080"
      PORTAL_SERVICES_WALLET_SERVICE_URL: "http://wallet-service:8080"
      PORTAL_SERVICES_BILLING_SERVICE_URL: "http://billing-service:8080"
      PORTAL_SERVICES_NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
      PORTAL_SERVICES_KYC_SERVICE_URL: "http://kyc-service:8080"
      PORTAL_SERVICES_ANALYTICS_SERVICE_URL: "http://analytics-service:8080"
      PORTAL_SERVICES_INVESTMENT_SERVICE_URL: "http://investment-service:8080"
      PORTAL_SERVICES_LENDING_SERVICE_URL: "http://lending-service:8080"
      PORTAL_SERVICES_GATEWAY_SERVICE_URL: "http://gateway-service:8080"
      PORTAL_SERVICES_COMPLIANCE_SERVICE_URL: "http://compliance-service:8080"
    livenessProbe:
      httpGet:
        path: /q/health/live
        port: http
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /q/health/ready
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3

  webApp:
    enabled: true
    # Next.js standalone — env vars via ConfigMap
    image:
      repository: web-app
      tag: latest
    port: 3000
    configMap:
      NEXT_PUBLIC_API_URL: "https://api.payu.id"
      NEXT_PUBLIC_WS_URL: "wss://api.payu.id/ws"
      NODE_ENV: "production"
    livenessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
    route:
      enabled: true
      host: app.payu.id
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

# ============================================
# Infrastructure
# ============================================
postgresql:
  enabled: false  # Use external managed PostgreSQL in production
  host: "${DB_HOST}"
  port: 5432

redis:
  enabled: false  # Use external managed Redis in production
  host: "${REDIS_HOST}"
  port: 6379

kafka:
  enabled: false  # Use external managed Kafka in production
  bootstrapServers: "${KAFKA_BROKERS}"

keycloak:
  enabled: false  # Use external managed Keycloak in production
  issuerUri: "${OIDC_ISSUER}"

# ============================================
# Observability
# ============================================
monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: false  # Use OpenShift built-in
  loki:
    enabled: false  # Use OpenShift Logging

networkPolicies:
  enabled: true
