# PayU Banking Platform - Default Values
# Override per environment using values-dev.yaml, values-prod.yaml

global:
  imageRegistry: "registry.payu.id"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: payu-registry-secret
  storageClass: "gp3-csi"

# ============================================
# Service Defaults
# ============================================
defaults:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
  podAnnotations:
    sidecar.istio.io/inject: "true"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

# ============================================
# Core Banking Services
# ============================================
services:
  gateway:
    enabled: true
    replicaCount: 3
    image:
      repository: gateway-service
      tag: latest
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    route:
      enabled: true
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  account:
    enabled: true
    image:
      repository: account-service
      tag: latest
    port: 8080

  auth:
    enabled: true
    image:
      repository: auth-service
      tag: latest
    port: 8080

  transaction:
