# LOGIN-006 login release gate — minimal chain that proves browser login works
# end-to-end: web-app BFF → gateway → auth-service → Keycloak (OIDC auth-code + PKCE).
# Only PUBLIC base images (no Red Hat registry auth) so it runs on CI runners.
# The gate fails closed: any failed Playwright assertion fails the job.
name: payu-login-gate
services:
  postgres:
    image: docker.io/library/postgres:16.8
    environment:
      POSTGRES_USER: payu
      POSTGRES_PASSWORD: payu_secret
      POSTGRES_DB: payu_account
    volumes:
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payu -d payu_account"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [gate]

  infinispan:
    image: quay.io/infinispan/server:16.2.1
    environment:
      JAVA_OPTS_BASE: -Djava.awt.headless=true -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./config/infinispan-config.xml:/opt/infinispan/server/conf/infinispan.xml:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11222/rest/v2/container/health/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [gate]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: payu
      KC_DB_PASSWORD: payu_secret
      KC_HEALTH_ENABLED: "true"
      # Pinned hostname so every token carries one stable issuer (see podman-compose.yml)
      KC_HOSTNAME: http://keycloak:8099
      KC_HOSTNAME_STRICT: "true"
    ports:
      - 8099:8080
    volumes:
      - ../../../infrastructure/platform/identity/keycloak/payu-realm-export.json:/opt/keycloak/data/import/payu-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [gate]

  auth-service:
    image: localhost/payu-auth-service:gate
    build:
      context: ../../../backend/auth-service
      dockerfile: Containerfile
    environment:
      PAYU_KEYCLOAK_SERVER_URL: http://keycloak:8099
      PAYU_KEYCLOAK_REALM: payu
      PAYU_KEYCLOAK_CLIENT_ID: payu-backend
      PAYU_KEYCLOAK_CLIENT_SECRET: payu-backend-d3v-0nly-a7c2f1e8b4d9063e5c8a2b7f1d4e9a3c
      PAYU_KEYCLOAK_WEB_CLIENT_ID: payu-web-app
      PAYU_KEYCLOAK_WEB_CLIENT_SECRET: payu-web-d3v-0nly-s3cr3t-f84a9b2c7e1d6a0f5b3e8c4d9a7f2e1b
      PAYU_KEYCLOAK_ADMIN_USERNAME: admin
      PAYU_KEYCLOAK_ADMIN_PASSWORD: admin
      SPRING_PROFILES_ACTIVE: container
      DB_URL: jdbc:postgresql://postgres:5432/payu_auth
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payu_auth
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: payu_secret
      DB_USERNAME: payu
      DB_PASSWORD: payu_secret
      SERVER_PORT: "8080"
      PORT: "8080"
      OIDC_ISSUER: http://keycloak:8099/realms/payu
      OIDC_JWK_SET_URI: http://keycloak:8099/realms/payu/protocol/openid-connect/certs
      PAYU_CACHE_PROVIDER: hotrod
      PAYU_CACHE_HOTROD_SERVER_LIST: infinispan:11222
      PAYU_CACHE_HOTROD_CACHE_NAME: payu
      PAYU_CACHE_HOTROD_USE_SSL: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "unused:9092"
      KAFKA_BOOTSTRAP_SERVERS: "unused:9092"
      PAYU_SECURITY_ENCRYPTION_SALT: gate-salt-0123456789abcdef
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
    ports:
      - 8002:8080
    depends_on:
      infinispan:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [gate]

  gateway-service:
    image: localhost/payu-gateway-service:gate
    build:
      context: ../../../backend/gateway-service
      dockerfile: Containerfile
    environment:
      JWT_SECRET: dev_jwt_secret_must_be_long_enough_for_dev_only_usage
      GATEWAY_AUTHORIZATION_JWT_SECRET: dev_jwt_secret_must_be_long_enough_for_dev_only_usage
      WEBHOOK_PARTNER_1_SECRET: dummy_secret_for_dev_only
      OIDC_ISSUER: http://keycloak:8099/realms/payu
      OIDC_JWK_SET_URI: http://keycloak:8099/realms/payu/protocol/openid-connect/certs
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8099/realms/payu
      OIDC_CLIENT_SECRET: payu-web-local-client-secret
      KEYCLOAK_URL: http://keycloak:8099
      ROUTES_AUTH_URL: http://auth-service:8080
      AUTH_SERVICE_URL: http://auth-service:8080
      ROUTES_ACCOUNT_URL: http://auth-service:8080
      ACCOUNT_SERVICE_URL: http://auth-service:8080
      ROUTES_CMS_URL: http://auth-service:8080
      CMS_SERVICE_URL: http://auth-service:8080
      KAFKA_BOOTSTRAP_SERVERS: "unused:9092"
      PAYU_CACHE_PROVIDER: hotrod
      PAYU_CACHE_HOTROD_SERVER_LIST: infinispan:11222
      PAYU_CACHE_HOTROD_CACHE_NAME: payu
      PAYU_CACHE_HOTROD_USE_SSL: "false"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/payu_gateway
      QUARKUS_DATASOURCE_USERNAME: payu
      QUARKUS_DATASOURCE_PASSWORD: payu_secret
      QUARKUS_HEALTH_SECURITY_ENABLED: "false"
      SERVER_PORT: "8080"
      PORT: "8080"
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
    ports:
      - 8080:8080
    depends_on:
      auth-service:
        condition: service_healthy
      infinispan:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [gate]

  web-app:
    image: localhost/payu-web-app:gate
    build:
      context: ../../../frontend/web-app
      dockerfile: Containerfile
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_BASE_URL: http://localhost:3001
      GATEWAY_URL: http://gateway-service:8080
      KEYCLOAK_URL: http://keycloak:8099
      OIDC_ISSUER: http://keycloak:8099/realms/payu
      OIDC_JWK_SET_URI: http://keycloak:8099/realms/payu/protocol/openid-connect/certs
      NODE_ENV: production
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: gate-next-server-actions-encryption-key-000
    ports:
      - 3001:8080
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [gate]

networks:
  gate:
    driver: bridge
