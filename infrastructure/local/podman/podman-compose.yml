        - CMD-SHELL
        - curl -sf http://localhost:9000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================
  # DevSecOps Tool Stack — Complete Local Security Pipeline
  # ============================================================
  # These containers provide a local DevSecOps lab environment
  # matching the tool stack defined in DEVSECOPS_ARCHITECTURE.md.
  # Long-running servers (SonarQube, Trivy, ZAP) run continuously.
  # CLI tools (Gitleaks, Nuclei, k6, Syft, Grype) sleep until
  # invoked via: podman compose run --rm <service> <args>
  # ============================================================

  sonarqube:
    <<: *infra-defaults
    profiles:
      - devsecops
    image: docker.io/sonarqube:community
    container_name: payu-sonarqube
    networks:
      - payu-network
    ports:
      - 9004:9000
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://payu-database-rw:5432/payu_sonarqube
      SONAR_JDBC_USERNAME: payu
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      # SONAR_WEB_JAVAADDITIONALOPTS: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin.jar=web"
      # SONAR_CE_JAVAADDITIONALOPTS: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin.jar=ce"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      payu-database-rw:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9000/api/system/status | grep -q "UP" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  trivy:
    <<: *infra-defaults
    profiles:
      - devsecops
    image: docker.io/aquasec/trivy:latest
    container_name: payu-trivy
    networks:
      - payu-network
    ports:
      - 4954:4954
    volumes:
      - trivy_cache:/root/.cache/trivy
      - /var/lib/containers:/var/lib/containers:ro
    command:
      - server
      - --listen
      - 0.0.0.0:4954
    healthcheck:
      test:
        - CMD-SHELL
        - trivy version || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zap:
    <<: *infra-defaults
    profiles:
      - devsecops
    image: docker.io/zaproxy/zap-stable
    container_name: payu-zap
    networks:
      - payu-network
    ports:
      - 8094:8080
    volumes:
      - zap_data:/zap/wrk
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=payu-zap-dev-key-change-in-prod
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # CLI tools — run on-demand via: podman compose run --rm <service> <args>
  gitleaks:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/zricethezav/gitleaks:latest
    container_name: payu-gitleaks
    networks:
      - payu-network
    volumes:
      - ../../../:/repo:ro,z
    working_dir: /repo
    command:
      - detect
      - --source=/repo
      - --verbose
      - --redact
    profiles:
      - devsecops

  nuclei:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/projectdiscovery/nuclei:latest
    container_name: payu-nuclei
    networks:
      - payu-network
    volumes:
      - nuclei_data:/root/.cache/nuclei
    command:
      - -update-templates
    profiles:
      - devsecops

  k6:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/grafana/k6:latest
    container_name: payu-k6
    networks:
      - payu-network
    volumes:
      - ../../../tests/performance/k6:/tests:ro,z
    working_dir: /tests
    command:
      - run
      - /tests/local-smoke.js
    profiles:
      - devsecops

  syft:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/anchore/syft:latest
    container_name: payu-syft
    networks:
      - payu-network
    volumes:
      - /var/lib/containers:/var/lib/containers:ro
      - ../../../:/repo:ro,z
    working_dir: /repo
    command:
      - --version
    profiles:
      - devsecops

  grype:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/anchore/grype:latest
    container_name: payu-grype
    networks:
      - payu-network
    volumes:
      - grype_cache:/root/.cache/grype
      - /var/lib/containers:/var/lib/containers:ro
      - ../../../:/repo:ro,z
    working_dir: /repo
    command:
      - --version
    profiles:
      - devsecops

volumes:
  postgres_data:
    driver: local
  vault_data:
    driver: local
  rustfs_data:
    driver: local
  rustfs_logs:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  trivy_cache:
    driver: local
  zap_data:
    driver: local
  nuclei_data:
    driver: local
  grype_cache:
    driver: local
networks:
  payu-network:
    driver: bridge
