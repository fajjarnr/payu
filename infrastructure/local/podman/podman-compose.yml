      start_period: 120s
    image: localhost/payu-transaction-service:${PAYU_VERSION:-1.18.65}
  wallet-service:
    <<: *app-defaults
    build:
      context: ../../../backend/wallet-service
      dockerfile: Containerfile
    container_name: payu-wallet-service
    networks:
      - payu-network
    ports:
      - 8004:8080
      - 9090:9090
    environment:
      <<: *local-security-environment
      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      JAVA_OPTS: -Xmx768M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
      DB_URL: jdbc:postgresql://payu-database-rw:5432/payu_wallet
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_wallet
      SERVER_PORT: "8080"
      PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      SPRING_PROFILES_ACTIVE: container
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs

      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_wallet
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
    depends_on:
      payu-cache:
        condition: service_healthy
      payu-database-rw:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/actuator/health/liveness
      interval: 15s
