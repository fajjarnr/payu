      SPRING_DATA_REDIS_PASSWORD: payu-cache-dev-password
      PAYU_CACHE_REDIS_HOST: payu-cache-resp
      PAYU_CACHE_REDIS_USERNAME: developer
      PAYU_CACHE_REDIS_PASSWORD: payu-cache-dev-password
      PAYU_CACHE_REDIS_PORT: "11222"
      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_auth
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-payu-dev-encryption-key-change-in-production-minimum-32-chars}
    depends_on:
      payu-cache-resp:
        condition: service_healthy
      payu-database-rw:
        condition: service_healthy
      payu-keycloak-service:
        condition: service_healthy
    healthcheck:
