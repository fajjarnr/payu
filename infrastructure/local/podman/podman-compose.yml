# Prerequisite: authenticate Podman to registry.redhat.io with a Red Hat
# registry service-account token. Never copy a cluster pull-secret into Git.
# Core: podman compose -f podman-compose.yml up -d payu-database-rw
#       payu-cache payu-kafka-kafka-bootstrap payu-broker-hdls-svc payu-keycloak-service
# Optional example: COMPOSE_PROFILES=api-management podman compose
#       -f podman-compose.yml up -d apicast
# Local substitutions are intentional: single-node infrastructure, locally built
# app images, Kafka's internal 29092 listener, plain dev Hot Rod, and
# development-only secret defaults.

x-local-security-environment: &local-security-environment
  PAYU_SECURITY_ENCRYPTION_SALT: ${ENCRYPTION_SALT:-PayU-local-PBKDF2-salt-change-outside-development}
  WEBHOOK_SECURITY_SECRET: ${WEBHOOK_SECRET:-payu-local-webhook-secret-change-outside-development}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:-payu-local-blind-index-key-dev-only-32}
  BLIND_INDEX_KEY_VERSION: ${BLIND_INDEX_KEY_VERSION:-local-v1}
  BLIND_INDEX_PREVIOUS_KEYS: ${BLIND_INDEX_PREVIOUS_KEYS:-}
  PAYU_CACHE_PROVIDER: hotrod
  PAYU_CACHE_HOTROD_SERVER_LIST: ${PAYU_CACHE_HOTROD_SERVER_LIST:-payu-cache:11222}
  PAYU_CACHE_HOTROD_CACHE_NAME: payu
  PAYU_CACHE_HOTROD_USE_SSL: "false"
  PAYU_CACHE_HOTROD_SNI_HOST_NAME: ${PAYU_CACHE_HOTROD_SNI_HOST_NAME:-payu-cache}
  SPRING_FLYWAY_LOCK_RETRY_COUNT: "120"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
  WALLET_GRPC_ADDRESS: static://wallet-service:9090
  DUKCAPIL_SIMULATOR_URL: http://dukcapil-simulator:8080
  BIFAST_SIMULATOR_URL: http://bi-fast-simulator:8080
  QRIS_SIMULATOR_URL: http://qris-simulator:8080
  JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"

x-app-defaults: &app-defaults
  pull_policy: build
  user: "1001"
  # Keycloak is pinned to http://localhost:8099 (KC_HOSTNAME_STRICT=true) so all
  # tokens carry one issuer. Containers reach it through the host's published
  # port via the host-gateway mapping. Healthchecks target 127.0.0.1 explicitly
  # (the minimal hosts file has no loopback entry for "localhost").
  extra_hosts:
    - "localhost:host-gateway"
  # L-225: extra_hosts alone is NOT enough for the JVM — the JDK resolves
  # "localhost" to 127.0.0.1 first (regardless of /etc/hosts order) and
  # Socket.connect never falls back, so JWT validation against the pinned
  # issuer would get "Connection refused". Bind-mount a minimal hosts file
  # WITHOUT the loopback entry; curl still reaches the host-gateway.
  volumes:
    - ./config/hosts:/etc/hosts:ro,z
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  pids_limit: 512
  mem_limit: 768m
  cpus: 1.0
  restart: unless-stopped
  networks:
    - payu-network
  profiles:
    - apps

x-infra-defaults: &infra-defaults
  pull_policy: always  # digest-pinned Red Hat images; pull to stay in lockstep with payu-dev
  restart: unless-stopped
  networks:
    - payu-network

services:
  payu-database-rw:
    <<: *infra-defaults
    image: docker.io/library/postgres:16.8
    container_name: payu-database-rw
    command: postgres -c max_connections=500 -c shared_buffers=256MB
    networks:
      - payu-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      POSTGRES_DB: ${POSTGRES_DB:-payu_account}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U payu -d payu_account
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  audit-syslog:
    <<: *infra-defaults
    image: docker.io/rsyslog/rsyslog:2026-04
    container_name: payu-audit-syslog
    networks:
      - payu-network
    ports:
      - 5514:514/tcp
      - 5514:514/udp
  payu-cache:
    <<: *infra-defaults
    mem_limit: 1g
    cpus: 1.0
    image: quay.io/infinispan/server:16.2.1
    container_name: payu-cache
    networks:
      - payu-network
    environment:
      # The upstream image enables the incubator vector module by default; cache development does not need it.
      JAVA_OPTS_BASE: -Djava.awt.headless=true -XX:+ExitOnOutOfMemoryError -Dinfinispan.server.jmx.enabled=false -Dcom.sun.management.jmxremote=false
    ports:
      - 11222:11222
    volumes:
      - ./config/infinispan-config.xml:/opt/infinispan/server/conf/infinispan.xml:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11222/rest/v2/container/health/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  payu-kafka-kafka-bootstrap:
    <<: *infra-defaults
    image: registry.redhat.io/amq-streams/kafka-41-rhel9@sha256:7ae5bdd78e89ecfcb8bfb8bb916fa9520326217cadf73d079d9841fa2c58b700
    container_name: payu-kafka
    networks:
      - payu-network
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      LOG_DIR: /tmp/kafka-logs
    volumes:
      - ./config/kafka-server.properties:/opt/kafka/custom-config/server.properties:ro,z
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted
        --cluster-id "$${KAFKA_CLUSTER_ID}"
        --config /opt/kafka/custom-config/server.properties &&
        exec /opt/kafka/bin/kafka-server-start.sh
        /opt/kafka/custom-config/server.properties
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  kafbat-ui:
    <<: *infra-defaults
    profiles:
      - tools
    image: ghcr.io/kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: payu-kafbat-ui
    networks:
      - payu-network
    ports:
      - 8088:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      SWAGGER_UI_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: payu-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: payu-kafka-kafka-bootstrap:29092
      JAVA_OPTS: -Xmx512M -Xms256M
    depends_on:
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
  payu-broker-hdls-svc:
    <<: *infra-defaults
    mem_limit: 1g
    cpus: 1.0
    image: registry.redhat.io/amq7/amq-broker-rhel9@sha256:ec6a178d76a1521ea68ef312b43db6b952802d02431ad81f1b9bd107015c621d
    container_name: payu-artemis
    networks:
      - payu-network
    environment:
      AMQ_USER: admin
      AMQ_PASSWORD: payu-local-artemis-2026-x7q
      AMQ_QUEUES: payu.notification.commands,payu.integration.commands,payu.billing.scheduled,payu.kyc.commands
      AMQ_REQUIRE_LOGIN: "true"
      AMQ_JOURNAL_TYPE: nio
      AMQ_EXTRA_ARGS: --no-autotune
    ports:
      - 61616:61616    # CORE
      - 5672:5672      # AMQP
      - 61613:61613    # STOMP
      - 8161:8161      # Web Console
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/$(hostname -i)/61616 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  vault:
    <<: *infra-defaults
    profiles:
      - secrets
    image: docker.io/hashicorp/vault:2.0.0
    container_name: payu-vault
    networks:
      - payu-network
    ports:
      - 8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
      - SETFCAP
    security_opt:
      - label=disable
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test:
        - CMD
        - vault
        - status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  payu-keycloak-service:
    <<: *infra-defaults
    image: registry.redhat.io/rhbk/keycloak-rhel9@sha256:52d3b0a986484ef8428d81b4db512f94741e89761fe47217dbc7529b5bcfa623
    container_name: payu-keycloak
    networks:
      - payu-network
    ports:
      - 8099:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Resolve URLs from the caller so both container DNS (:8080) and host-run
      # development (:8099) receive an issuer they can reach.
      # Pin the frontend hostname so every token (browser-issued or internal)
      # carries the SAME issuer — otherwise refresh/revoke fail with
      # "Invalid token issuer" (L-116 pattern applied locally).
      # Full URL so the issuer is exactly http://localhost:8099 regardless of
      # which host each request arrives on (browser or container).
      KC_HOSTNAME: http://localhost:8099
      KC_HOSTNAME_STRICT: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://payu-database-rw:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-payu}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-payu_secret}
      KC_HEALTH_ENABLED: "true"
      LIQUIBASE_ANALYTICS_ENABLED: "false"
      JAVA_OPTS_APPEND: -Xmx1024M -Xms512M
    volumes:
      - ../../../infrastructure/platform/identity/keycloak/payu-realm-export.json:/opt/keycloak/data/import/payu-realm.json:ro,z
    command: start-dev --import-realm
    depends_on:
      payu-database-rw:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
  apicast:
    <<: *infra-defaults
    profiles:
      - api-management
    image: registry.redhat.io/3scale-amp2/apicast-gateway-rhel8@sha256:f4cda75503b72c59922e3bdb59ad0d02cf1ff7d64f19455b4fa411dc2519ad55
    container_name: payu-apicast
    mem_limit: 512m
    cpus: 1.0
    ports:
      - 8095:8080
    environment:
      THREESCALE_CONFIG_FILE: /opt/app/config/apicast-config.json
      APICAST_CONFIGURATION_LOADER: lazy
      APICAST_CONFIGURATION_CACHE: "0"
      APICAST_LOG_LEVEL: info
      APICAST_WORKERS: "1"
    volumes:
      - ./config/apicast-config.json:/opt/app/config/apicast-config.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  account-service:
    <<: *app-defaults
    build:
      context: ../../../backend/account-service
      dockerfile: Containerfile
    container_name: payu-account-service
    networks:
      - payu-network
    ports:
      - 8001:8080
    environment:
      <<: *local-security-environment
      SERVICES_DUKCAPIL_URL: http://dukcapil-simulator:8080
      SERVICES_AUTH_URL: http://auth-service:8080
      GATEWAY_URL: http://gateway-service:8080
      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      JAVA_OPTS: -Xmx768M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
      DB_URL: jdbc:postgresql://payu-database-rw:5432/payu_account
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_account
      SERVER_PORT: "8080"
      PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      SPRING_PROFILES_ACTIVE: container
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:-payu-local-blind-index-key-dev-only-32}
      BLIND_INDEX_KEY_VERSION: ${BLIND_INDEX_KEY_VERSION:-local-v1}
      BLIND_INDEX_PREVIOUS_KEYS: ${BLIND_INDEX_PREVIOUS_KEYS:-}

      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_account
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-payu-dev-encryption-key-change-in-production-minimum-32-chars}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_must_be_long_enough_for_dev_only_usage}
    depends_on:
      payu-cache:
        condition: service_healthy
      payu-database-rw:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/actuator/health/liveness
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    image: localhost/payu-account-service:${PAYU_VERSION:-1.18.65}
  auth-service:
    <<: *app-defaults
    build:
      context: ../../../backend/auth-service
      dockerfile: Containerfile
    container_name: payu-auth-service
    networks:
      - payu-network
    ports:
      - 8002:8080
    environment:
      <<: *local-security-environment
      PAYU_KEYCLOAK_SERVER_URL: http://localhost:8099
      PAYU_KEYCLOAK_REALM: payu
      PAYU_KEYCLOAK_CLIENT_ID: payu-backend
      PAYU_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-payu-backend-d3v-0nly-a7c2f1e8b4d9063e5c8a2b7f1d4e9a3c}
      PAYU_KEYCLOAK_WEB_CLIENT_ID: ${PAYU_KEYCLOAK_WEB_CLIENT_ID:-payu-web-app}
      PAYU_KEYCLOAK_WEB_CLIENT_SECRET: ${PAYU_KEYCLOAK_WEB_CLIENT_SECRET:-payu-web-d3v-0nly-s3cr3t-f84a9b2c7e1d6a0f5b3e8c4d9a7f2e1b}
      PAYU_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      PAYU_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      JAVA_OPTS: -Xmx768M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
      DB_URL: jdbc:postgresql://payu-database-rw:5432/payu_auth
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_auth
      SERVER_PORT: "8080"
      PORT: "8080"
      KEYCLOAK_URL: http://localhost:8099
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      SPRING_PROFILES_ACTIVE: container
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs

      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_auth
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-payu-dev-encryption-key-change-in-production-minimum-32-chars}
    depends_on:
      payu-cache:
        condition: service_healthy
      payu-database-rw:
        condition: service_healthy
      payu-keycloak-service:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/actuator/health/liveness
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    image: localhost/payu-auth-service:${PAYU_VERSION:-1.18.65}
  transaction-service:
    <<: *app-defaults
    build:
      context: ../../../backend/transaction-service
      dockerfile: Containerfile
    container_name: payu-transaction-service
    networks:
      - payu-network
    ports:
      - 8003:8080
    environment:
      <<: *local-security-environment
      SERVICES_WALLET_URL: http://wallet-service:8080
      SERVICES_BIFAST_URL: http://bi-fast-simulator:8080
      SERVICES_QRIS_URL: http://qris-simulator:8080
      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      JAVA_OPTS: -Xmx768M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
      DB_URL: jdbc:postgresql://payu-database-rw:5432/payu_transaction
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_transaction
      SERVER_PORT: "8080"
      PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      SPRING_PROFILES_ACTIVE: container
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs

      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_transaction
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      PAYU_CALLBACK_SIGNATURE_SECRET: ${CALLBACK_SIGNATURE_SECRET:-local-development-callback-signature-secret}
