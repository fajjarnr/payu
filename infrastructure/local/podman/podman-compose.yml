      start_period: 120s
    image: localhost/payu-wallet-service:${PAYU_VERSION:-1.18.65}
  compliance-service:
    <<: *app-defaults
    build:
      context: ../../../backend/compliance-service
      dockerfile: Containerfile
    container_name: payu-compliance-service
    networks:
      - payu-network
    ports:
      - 8087:8080
    environment:
