# Prerequisite: authenticate Podman to registry.redhat.io with a Red Hat
# registry service-account token. Never copy a cluster pull-secret into Git.
# Core: podman compose -f podman-compose.yml up -d payu-database-rw
#       payu-cache-resp payu-kafka-kafka-bootstrap artemis payu-keycloak-service
# Optional example: COMPOSE_PROFILES=api-management podman compose
#       -f podman-compose.yml up -d apicast

x-app-defaults: &app-defaults
  pull_policy: build
  user: "1001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  pids_limit: 512
  mem_limit: 768m
  cpus: 1.0
  restart: unless-stopped
  networks:
    - payu-network
  profiles:
    - apps

x-infra-defaults: &infra-defaults
  pull_policy: always
  restart: unless-stopped
  networks:
    - payu-network

services:
  payu-database-rw:
    <<: *infra-defaults
    image: docker.io/library/postgres:16.8
    container_name: payu-database-rw
    command: postgres -c max_connections=500 -c shared_buffers=256MB
    networks:
      - payu-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      POSTGRES_DB: ${POSTGRES_DB:-payu_account}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U payu -d payu_account
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  payu-cache-resp:
    <<: *infra-defaults
    mem_limit: 1g
    cpus: 1.0
    image: registry.redhat.io/datagrid/datagrid-8-rhel9@sha256:66e76900551564dcb58ed37fb978fa27101849316dba1024a594bf027b25adc6
    container_name: payu-cache
    networks:
      payu-network:
        aliases:
          - redis
    environment:
      USER: developer
      PASS: payu-cache-dev-password
      REDIS_PASSWORD: payu-cache-dev-password
    ports:
      - 11222:11222
    volumes:
      - ./config/infinispan-config.xml:/opt/infinispan/server/conf/infinispan.xml:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "developer:payu-cache-dev-password", "http://localhost:11222/rest/v2/container/health/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  payu-kafka-kafka-bootstrap:
    <<: *infra-defaults
    image: registry.redhat.io/amq-streams/kafka-41-rhel9@sha256:cf93e2ca48fa3596cfead6f01791f672108a160491088d4b02e8e203c4ae76ff
    container_name: payu-kafka
    networks:
      - payu-network
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      LOG_DIR: /tmp/kafka-logs
    volumes:
      - ./config/kafka-server.properties:/opt/kafka/custom-config/server.properties:ro,z
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted
        --cluster-id "$${KAFKA_CLUSTER_ID}"
        --config /opt/kafka/custom-config/server.properties &&
        exec /opt/kafka/bin/kafka-server-start.sh
        /opt/kafka/custom-config/server.properties
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  kafbat-ui:
    <<: *infra-defaults
    profiles:
      - tools
    image: ghcr.io/kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: payu-kafbat-ui
    networks:
      - payu-network
    ports:
      - 8088:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      SWAGGER_UI_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: payu-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: payu-kafka-kafka-bootstrap:29092
      JAVA_OPTS: -Xmx512M -Xms256M
    depends_on:
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
  artemis:
    <<: *infra-defaults
    mem_limit: 1g
    cpus: 1.0
    image: registry.redhat.io/amq7/amq-broker-rhel9@sha256:ec6a178d76a1521ea68ef312b43db6b952802d02431ad81f1b9bd107015c621d
    container_name: payu-artemis
    networks:
      - payu-network
    environment:
      AMQ_USER: admin
      AMQ_PASSWORD: admin
      AMQ_QUEUES: payu.notification.commands,payu.integration.commands,payu.billing.scheduled,payu.kyc.commands
      AMQ_REQUIRE_LOGIN: "true"
      AMQ_JOURNAL_TYPE: nio
      AMQ_EXTRA_ARGS: --no-autotune
    ports:
      - 61616:61616    # CORE
      - 5672:5672      # AMQP
      - 61613:61613    # STOMP
      - 8161:8161      # Web Console
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/$(hostname -i)/61616 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  vault:
    <<: *infra-defaults
    profiles:
      - secrets
    image: docker.io/hashicorp/vault:2.0.0
    container_name: payu-vault
    networks:
      - payu-network
    ports:
      - 8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
      - SETFCAP
    security_opt:
      - label=disable
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test:
        - CMD
        - vault
        - status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  payu-keycloak-service:
    <<: *infra-defaults
    image: registry.redhat.io/rhbk/keycloak-rhel9@sha256:4224e2d27ea23af7b50e15ba6df41fc35c2a550ab1e108dd8debed9f7d23fb45
    container_name: payu-keycloak
    networks:
      - payu-network
    ports:
      - 8099:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://payu-keycloak-service:8080
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://payu-database-rw:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-payu}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-payu_secret}
      KC_HEALTH_ENABLED: "true"
      LIQUIBASE_ANALYTICS_ENABLED: "false"
      JAVA_OPTS_APPEND: -Xmx1024M -Xms512M
    volumes:
      - ../../../infrastructure/platform/identity/keycloak/payu-realm-export.json:/opt/keycloak/data/import/payu-realm.json:ro,z
    command: start-dev --import-realm
    depends_on:
      payu-database-rw:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
  apicast:
    <<: *infra-defaults
    profiles:
      - api-management
    image: registry.redhat.io/3scale-amp2/apicast-gateway-rhel8@sha256:f4cda75503b72c59922e3bdb59ad0d02cf1ff7d64f19455b4fa411dc2519ad55
    container_name: payu-apicast
    mem_limit: 512m
    cpus: 1.0
    ports:
      - 8095:8080
    environment:
      THREESCALE_CONFIG_FILE: /opt/app/config/apicast-config.json
      APICAST_CONFIGURATION_LOADER: lazy
      APICAST_CONFIGURATION_CACHE: "0"
      APICAST_LOG_LEVEL: info
      APICAST_WORKERS: "1"
    volumes:
      - ./config/apicast-config.json:/opt/app/config/apicast-config.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  account-service:
    <<: *app-defaults
    build:
      context: ../../../backend/account-service
      dockerfile: Containerfile
    container_name: payu-account-service
    networks:
      - payu-network
    ports:
      - 8001:8080
    environment:
      SERVICES_DUKCAPIL_URL: http://dukcapil-simulator:8080
      SERVICES_AUTH_URL: http://auth-service:8080
      GATEWAY_URL: http://gateway-service:8080
      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      JAVA_OPTS: -Xmx768M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
      DB_URL: jdbc:postgresql://payu-database-rw:5432/payu_account
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_account
      SERVER_PORT: "8080"
      PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      SPRING_PROFILES_ACTIVE: container
      REDIS_HOST: payu-cache-resp
      REDIS_USERNAME: developer
      REDIS_PORT: "11222"
      REDIS_PASSWORD: payu-cache-dev-password
      SPRING_DATA_REDIS_HOST: payu-cache-resp
      SPRING_DATA_REDIS_USERNAME: developer
      SPRING_DATA_REDIS_PORT: "11222"
      OIDC_ISSUER: http://payu-keycloak-service:8080/realms/payu
      OIDC_JWK_SET_URI: http://payu-keycloak-service:8080/realms/payu/protocol/openid-connect/certs

      SPRING_DATA_REDIS_PASSWORD: payu-cache-dev-password
      PAYU_CACHE_REDIS_HOST: payu-cache-resp
      PAYU_CACHE_REDIS_USERNAME: developer
      PAYU_CACHE_REDIS_PASSWORD: payu-cache-dev-password
      PAYU_CACHE_REDIS_PORT: "11222"
      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_account
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-payu-dev-encryption-key-change-in-production-minimum-32-chars}
    depends_on:
      payu-cache-resp:
        condition: service_healthy
      payu-database-rw:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/actuator/health/liveness
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    image: localhost/payu-account-service:local
