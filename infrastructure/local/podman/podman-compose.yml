      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs

      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8099/realms/payu
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs
    depends_on:
      payu-cache:
        condition: service_healthy
      payu-database-rw:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/actuator/health/liveness
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    image: localhost/payu-dispute-service:${PAYU_VERSION:-1.18.65}
  integration-service:
    <<: *app-defaults
    build:
      context: ../../../backend/integration-service
      dockerfile: Containerfile
    container_name: payu-integration-service
    networks:
      - payu-network
    ports:
      - "8101:8080"
    environment:
      <<: *local-security-environment
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: "8080"
      PORT: "8080"
      JAVA_OPTS: -Xmx512M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_NAME: payu_integration
      DB_USER: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_integration
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_integration
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      KAFKA_BOOTSTRAP: payu-kafka-kafka-bootstrap:29092
      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs

      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      ARTEMIS_URL: tcp://payu-broker-hdls-svc:61616
      ARTEMIS_HOST: payu-broker-hdls-svc
      ARTEMIS_PORT: "61616"
      ARTEMIS_USERNAME: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-payu-local-artemis-2026-x7q}
    depends_on:
      payu-cache:
        condition: service_healthy
      payu-database-rw:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
      payu-broker-hdls-svc:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/actuator/health/liveness
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    image: localhost/payu-integration-service:${PAYU_VERSION:-1.18.65}
  product-catalog-service:
    <<: *app-defaults
    build:
      context: ../../../backend/product-catalog-service
      dockerfile: Containerfile
    container_name: payu-product-catalog-service
    networks:
      - payu-network
    ports:
      - "8100:8080"
    environment:
      <<: *local-security-environment
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: "8080"
      PORT: "8080"
      JAVA_OPTS: -Xmx512M -Xms256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom
      DB_HOST: payu-database-rw
      DB_PORT: "5432"
      DB_USERNAME: payu
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_products
      SPRING_DATASOURCE_URL: jdbc:postgresql://payu-database-rw:5432/payu_products
      SPRING_DATASOURCE_USERNAME: payu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      KAFKA_BROKERS: payu-kafka-kafka-bootstrap:29092
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs

      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      PAYU_CACHE_ENABLED: "false"
      SPRING_CACHE_TYPE: "none"
    depends_on:
      payu-database-rw:
        condition: service_healthy
      payu-cache:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/actuator/health/liveness
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    image: localhost/payu-product-catalog-service:${PAYU_VERSION:-1.18.65}
  web-app:
    <<: *app-defaults
    build:
      context: ../../../frontend/web-app
      dockerfile: Containerfile
    container_name: payu-web-app
    networks:
      - payu-network
    ports:
      - 3001:8080
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3001}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway-service:8080}
      NODE_ENV: production
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs
      APP_VERSION: ${APP_VERSION:-1.5.16}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-payu-local-next-server-actions-key-change-outside-development}
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      OTEL_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/api/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    image: localhost/payu-web-app:${PAYU_VERSION:-1.18.65}

  loan-origination-process:
    <<: *app-defaults
    image: localhost/payu-loan-origination-process:${PAYU_VERSION:-1.18.65}
    build:
      context: ../../../backend/loan-origination-process
      dockerfile: Containerfile
    container_name: payu-loan-origination-process
    ports:
      - 8103:8080
    environment:
      <<: *local-security-environment
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://payu-database-rw:5432/payu_loan_origination
      DATABASE_USER: payu
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      KAFKA_BOOTSTRAP_SERVERS: payu-kafka-kafka-bootstrap:29092
      OIDC_ISSUER: http://localhost:8099/realms/payu
      OIDC_JWK_SET_URI: http://localhost:8099/realms/payu/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
      PAYU_SECURITY_ENCRYPTION_SALT: ${ENCRYPTION_SALT:-local-development-salt}
      WEBHOOK_SECURITY_SECRET: ${WEBHOOK_SECRET:-local-development-webhook-secret}
    depends_on:
      payu-database-rw:
        condition: service_healthy
      payu-kafka-kafka-bootstrap:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:8080/actuator/health/liveness]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  biller-simulator:
    <<: *app-defaults
    image: localhost/payu-biller-simulator:${PAYU_VERSION:-1.18.65}
    build:
      context: ../../../backend/simulators/biller-simulator
      dockerfile: Containerfile
    container_name: payu-biller-simulator
    ports:
      - 8093:8080
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://payu-database-rw:5432/payu_biller
      QUARKUS_DATASOURCE_USERNAME: payu
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create
      QUARKUS_HIBERNATE_ORM_ENABLED: "true"
      QUARKUS_HIBERNATE_ORM_ACTIVE: "true"
      SIMULATOR_LATENCY_MIN: "100"
      SIMULATOR_LATENCY_MAX: "600"
      SIMULATOR_FAILURE_RATE: "3"
    depends_on:
      payu-database-rw:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:8080/api/v1/biller/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  va-simulator:
    <<: *app-defaults
    image: localhost/payu-va-simulator:${PAYU_VERSION:-1.18.65}
    build:
      context: ../../../backend/simulators/va-simulator
      dockerfile: Containerfile
    container_name: payu-va-simulator
    ports:
      - 8085:8085
    environment:
      QUARKUS_HTTP_PORT: "8085"
      SPRING_APPLICATION_NAME: va-simulator
      SERVICE_VERSION: ${VA_SIMULATOR_VERSION:-1.8.80}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://payu-database-rw:5432/payu_va_simulator
      QUARKUS_DATASOURCE_USERNAME: payu
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      VA_CALLBACK_URL: http://transaction-service:8080/api/v1/payments/va/callback
      PAYU_CALLBACK_SIGNATURE_SECRET: ${CALLBACK_SIGNATURE_SECRET:-local-development-callback-signature-secret}
      SIMULATOR_LATENCY_MIN: "50"
      SIMULATOR_LATENCY_MAX: "500"
      SIMULATOR_FAILURE_RATE: "5"
      SIMULATOR_WEBHOOK_ENABLED: "true"
      SIMULATOR_WEBHOOK_DELAY_MS: "2000"
    depends_on:
      payu-database-rw:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8085/q/health/live]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  jaeger:
    <<: *infra-defaults
    image: quay.io/jaegertracing/all-in-one:1.76.0
    container_name: payu-jaeger
    profiles:
      - observability
    ports:
      - 16686:16686
      - 4317:4317
      - 4318:4318
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:14269/]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rustfs:
    <<: *infra-defaults
    image: docker.io/rustfs/rustfs@sha256:3c2d55977829620284ece8593901bf776bcfc0fc9972784352de4dcffdb92416
    container_name: payu-rustfs
    networks:
      - payu-network
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-payu-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-payu-secret-key-change-me}
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    # Uses image defaults: RUSTFS_VOLUMES=/data, RUSTFS_CONSOLE_ADDRESS=:9001
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================
  # DevSecOps Tool Stack — Complete Local Security Pipeline
  # ============================================================
  # These containers provide a local DevSecOps lab environment
  # matching the tool stack defined in DEVSECOPS_ARCHITECTURE.md.
  # Long-running servers (SonarQube, Trivy, ZAP) run continuously.
  # CLI tools (Gitleaks, Nuclei, k6, Syft, Grype) sleep until
  # invoked via: podman compose run --rm <service> <args>
  # ============================================================

  sonarqube:
    <<: *infra-defaults
    profiles:
      - devsecops
    image: docker.io/sonarqube:community
    container_name: payu-sonarqube
    networks:
      - payu-network
    ports:
      - 9004:9000
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://payu-database-rw:5432/payu_sonarqube
      SONAR_JDBC_USERNAME: payu
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-payu_secret}
      # SONAR_WEB_JAVAADDITIONALOPTS: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin.jar=web"
      # SONAR_CE_JAVAADDITIONALOPTS: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin.jar=ce"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      payu-database-rw:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9000/api/system/status | grep -q "UP" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  trivy:
    <<: *infra-defaults
    profiles:
      - devsecops
    image: docker.io/aquasec/trivy:0.66.0
    container_name: payu-trivy
    networks:
      - payu-network
    ports:
      - 4954:4954
    volumes:
      - trivy_cache:/root/.cache/trivy
      - /var/lib/containers:/var/lib/containers:ro
    command:
      - server
      - --listen
      - 0.0.0.0:4954
    healthcheck:
      test:
        - CMD-SHELL
        - trivy version || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zap:
    <<: *infra-defaults
    profiles:
      - devsecops
    image: docker.io/zaproxy/zap-stable
    container_name: payu-zap
    networks:
      - payu-network
    ports:
      - 8094:8080
    volumes:
      - zap_data:/zap/wrk
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=payu-zap-dev-key-change-in-prod
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # CLI tools — run on-demand via: podman compose run --rm <service> <args>
  gitleaks:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/zricethezav/gitleaks:v8.22.1
    container_name: payu-gitleaks
    networks:
      - payu-network
    volumes:
      - ../../../:/repo:ro,z
    working_dir: /repo
    command:
      - detect
      - --source=/repo
      - --verbose
      - --redact
    profiles:
      - devsecops

  nuclei:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/projectdiscovery/nuclei:v3.4.7
    container_name: payu-nuclei
    networks:
      - payu-network
    volumes:
      - nuclei_data:/root/.cache/nuclei
    command:
      - -update-templates
    profiles:
      - devsecops

  k6:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/grafana/k6:1.1.0
    container_name: payu-k6
    networks:
      - payu-network
    volumes:
      - ../../../tests/performance/k6:/tests:ro,z
    working_dir: /tests
    command:
      - run
      - /tests/local-smoke.js
    profiles:
      - devsecops

  syft:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/anchore/syft:v1.27.0
    container_name: payu-syft
    networks:
      - payu-network
    volumes:
      - /var/lib/containers:/var/lib/containers:ro
      - ../../../:/repo:ro,z
    working_dir: /repo
    command:
      - --version
    profiles:
      - devsecops

  grype:
    <<: *infra-defaults
    restart: "no"
    image: docker.io/anchore/grype:v0.99.1
    container_name: payu-grype
    networks:
      - payu-network
    volumes:
      - grype_cache:/root/.cache/grype
      - /var/lib/containers:/var/lib/containers:ro
      - ../../../:/repo:ro,z
    working_dir: /repo
    command:
      - --version
    profiles:
      - devsecops

  # Sigstore local signing lab — cosign sign/attest/verify + Rekor transparency log.
  # NOT a replacement for RHTAS (Fulcio/CTlog/policy-controller remain cluster-only:
  # admission enforcement needs kube-apiserver). Use for pipeline signing tests.
  rekor-redis:
    <<: *infra-defaults
    image: docker.io/library/redis:7-alpine
    container_name: payu-rekor-redis
    networks:
      - payu-network
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - rekor_redis:/data
    profiles:
      - devsecops
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rekor-server:
    <<: *infra-defaults
    image: ghcr.io/sigstore/rekor/rekor-server:v1.3.6
    container_name: payu-rekor-server
    networks:
      - payu-network
    ports:
      - 3000:3000
    command:
      - rekor-server
      - serve
      - --rekor_server.address=0.0.0.0
      - --rekor_server.port=3000
      - --redis_server.address=rekor-redis:6379
      - --trillian_log_server.address=rekor-redis:6379
    depends_on:
      rekor-redis:
        condition: service_healthy
    profiles:
      - devsecops
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/log || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cosign:
    <<: *infra-defaults
    restart: "no"
    image: ghcr.io/sigstore/cosign/cosign:v2.4.3
    container_name: payu-cosign
    networks:
      - payu-network
    volumes:
      - ../../../:/repo:ro,z
      - cosign_keys:/keys
    working_dir: /repo
    command:
      - version
    profiles:
      - devsecops

volumes:
  postgres_data:
    driver: local
  vault_data:
    driver: local
  rustfs_data:
    driver: local
  rustfs_logs:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  trivy_cache:
    driver: local
  zap_data:
    driver: local
  nuclei_data:
    driver: local
  grype_cache:
    driver: local
  rekor_redis:
    driver: local
  cosign_keys:
    driver: local
networks:
  payu-network:
    driver: bridge
