apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: debezium-db-credentials
  namespace: payu-data-platform
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.payu-internal.svc:8200"
    roleName: "debezium-connect"
    objects: |
      - objectName: "db-credentials"
        secretPath: "database/creds/debezium"
        secretKey: "username"
      - objectName: "db-credentials"
        secretPath: "database/creds/debezium"
        secretKey: "password"
  secretObjects:
    - secretName: debezium-db-credentials
      type: Opaque
      data:
        - objectName: db-credentials
          key: username
        - objectName: db-credentials
          key: password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debezium-connect
  namespace: payu-data-platform
  annotations:
    vault.hashicorp.com/role: "debezium-connect"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debezium-connect-role
  namespace: payu-data-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debezium-connect-rolebinding
  namespace: payu-data-platform
subjects:
  - kind: ServiceAccount
    name: debezium-connect
    namespace: payu-data-platform
roleRef:
  kind: Role
  name: debezium-connect-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: debezium-connect-pdb
  namespace: payu-data-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: debezium-connect
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: debezium-connect-hpa
  namespace: payu-data-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: debezium-connect
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
