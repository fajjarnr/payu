apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: payu-data-platform
  labels:
    app: debezium-connect
    component: kafka-connect
    part-of: payu-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: debezium-connect
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None
  publishNotReadyAddresses: false
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect-headless
  namespace: payu-data-platform
  labels:
    app: debezium-connect
    component: kafka-connect
    part-of: payu-platform
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: debezium-connect
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: debezium-connect-network-policy
  namespace: payu-data-platform
spec:
  podSelector:
    matchLabels:
      app: debezium-connect
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: payu-data-platform
        - namespaceSelector:
            matchLabels:
              name: payu-monitoring
      ports:
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: payu-data-platform
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8083
    - to:
        - namespaceSelector:
            matchLabels:
              name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
