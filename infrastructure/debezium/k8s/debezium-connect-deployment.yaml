apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: payu-data-platform
  labels:
    app: debezium-connect
    component: kafka-connect
    part-of: payu-platform
    version: "2.5"
    managed-by: argocd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
        component: kafka-connect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "debezium-connect"
        vault.hashicorp.com/agent-inject-secret-db-credentials: "database/creds/debezium"
        vault.hashicorp.com/agent-inject-template-db-credentials: |
          {{ with secret "database/creds/debezium" -}}
          hostname=postgres.payu-data-platform.svc.cluster.local
          port=5432
          database=payu_core
          username={{ .Data.username }}
          password={{ .Data.password }}
          {{- end }}
    spec:
      serviceAccountName: debezium-connect
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: quay.io/debezium/connect:2.5.3.Final
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.payu-data-platform.svc:9093"
            - name: GROUP_ID
              value: "debezium-connect-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium-connect-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium-connect-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium-connect-status"
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_INTERNAL_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_INTERNAL_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_OFFSET_STORAGE_PARTITIONS
              value: "25"
            - name: CONNECT_STATUS_STORAGE_PARTITIONS
              value: "5"
            - name: CONNECT_CONFIG_STORAGE_PARTITIONS
              value: "1"
            - name: CONNECT_OFFSET_FLUSH_INTERVAL_MS
              value: "10000"
            - name: CONNECT_OFFSET_FLUSH_TIMEOUT_MS
              value: "5000"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: CONNECT_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONNECT_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: debezium-kafka-auth
                  key: sasl.jaas.config
            - name: CONNECT_SSL_TRUSTSTORE_LOCATION
              value: "/etc/debezium/certs/truststore.jks"
            - name: CONNECT_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: debezium-kafka-auth
                  key: truststore.password
            - name: CONNECT_PRODUCER_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: CONNECT_PRODUCER_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONNECT_PRODUCER_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: debezium-kafka-auth
                  key: sasl.jaas.config
            - name: CONNECT_CONSUMER_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: CONNECT_CONSUMER_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONNECT_CONSUMER_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: debezium-kafka-auth
                  key: sasl.jaas.config
            - name: CONNECT_PLUGIN_PATH
              value: "/kafka/connect,/kafka/connect/debezium-connector-postgres"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms1g -Xmx6g -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ParallelRefProcEnabled"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-server -XX:+ExplicitGCInvokesConcurrent -XX:+DisableExplicitGC -Djava.awt.headless=true"
            - name: JMX_PORT
              value: "8080"
            - name: ENABLE_JMX_EXPORTER
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-connect-offsets
              mountPath: /kafka/connect-offsets
            - name: certs
              mountPath: /etc/debezium/certs
              readOnly: true
            - name: secrets
              mountPath: /secrets/debezium
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: kafka-connect-offsets
          emptyDir:
            sizeLimit: 100Mi
        - name: certs
          secret:
            secretName: kafka-cluster-cluster-ca-cert
            items:
              - key: ca.p12
                path: truststore.jks
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "debezium-db-credentials"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - debezium-connect
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - data-platform
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "data-platform"
          effect: "NoSchedule"
