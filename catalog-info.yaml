# Backstage / Red Hat Developer Hub — Root Catalog
# OSS: Backstage.io (CNCF Incubating)
# Red Hat: Red Hat Developer Hub (included in OpenShift Platform Plus)
#
# This file registers the PayU platform and all its components.
# Import this single file in Backstage to discover the entire ecosystem.
#
# Backstage version compatibility: 1.25+ / RHDH 1.2+
# Spec: https://backstage.io/docs/features/software-catalog/descriptor-format

apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: payu
  title: PayU Digital Banking Platform
  description: |
    Core banking & payment gateway platform built with microservices architecture
    on Red Hat OpenShift 4.20+. Serves as payment infrastructure for TokoBapak,
    Nobar, Dolan, Sinau, and Maca.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/sumbermakmur/payu
  tags:
    - java
    - spring-boot
    - quarkus
    - python
    - typescript
    - openshift
    - payment-gateway
    - core-banking
  links:
    - url: https://payu.fajjjar.my.id
      title: PayU Web App
    - url: https://developer.payu.fajjjar.my.id
      title: Developer Docs (Partner Portal)
    - url: https://api-portal.payu.fajjjar.my.id
      title: API Portal & Sandbox
spec:
  owner: group:payu-engineering
  domain: digital-banking

