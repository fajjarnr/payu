[pytest]
minversion = 7.0
addopts =
    -v
    --strict-markers
    --tb=short
    --strict-config

markers =
    smoke: marks tests as smoke tests (fast, critical path)
    critical: marks tests as critical for production
    integration: marks tests as integration tests (cross-service)
    e2e: marks tests as end-to-end tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    investment: marks tests related to investment service
    lending: marks tests related to lending service
    promotion: marks tests related to promotion service
    compliance: marks tests related to compliance service
    support: marks tests related to support service
    partner: marks tests related to partner service
    analytics: marks tests related to analytics service
    backoffice: marks tests related to backoffice service
    fx: marks tests related to fx service
    cms: marks tests related to cms service
    statement: marks tests related to statement service
    billing: marks tests related to billing service
    notification: marks tests related to notification service
    dispute: marks tests related to dispute service
    kyc: marks tests related to kyc service
    gateway: marks tests related to gateway service
    abtesting: marks tests related to ab testing service
    product_catalog: marks tests related to product catalog service
    integration_svc: marks tests related to integration service

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
