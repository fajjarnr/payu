# Quarkus Test Configuration - Disables external dependencies

quarkus:

  # Disable OIDC for tests
  oidc:
    enabled: false
    # GAP-23 fix: TLS verification must be 'required' in ALL profiles (was 'none' — MITM).
    tls:
      verification: required

  # Disable health check dependency on external services
  smallrye-health:
    check-default-procedures: false

# Gateway test overrides
gateway:
  # Disable authorization in tests (AuthorizationFilterTest has its own @TestProfile)
  authorization:
    enabled: false

  # Disable rate limiting in tests (requires Redis)
  rate-limit:
    enabled: false
  rate-limit-v2:
    enabled: false

  # Disable circuit breaker tests
  circuit-breaker:
    enabled: false

  # Disable analytics (requires persistence)
  analytics:
    enabled: false

  # Disable IP whitelist
  ip-whitelist:
    enabled: false

  # Disable request signing
  request-signing:
    enabled: false

  # Disable API key management
  api-keys:
    enabled: false
    rotation:
      enabled: false
    bypass-paths:
      - "/health"
      - "/q/"
      - "/status"
      - "/version"

  # Disable Idempotency
  idempotency:
    enabled: false

  # Disable Retry
  retry:
    enabled: false

  # Disable Timeout
  timeout:
    enabled: false
