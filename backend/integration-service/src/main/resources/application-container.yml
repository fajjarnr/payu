# Container Deployment Profile
# Activated via: SPRING_PROFILES_ACTIVE=container
spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://payu-postgres:5432/payu_integration}
    username: ${DB_USERNAME:payu}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      pool-name: container-pool
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        connection:
          provider_disables_autocommit: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:payu-kafka-kafka-bootstrap:9092}
    consumer:
      auto-startup: true
      group-id: integration-service-container
      auto-offset-reset: earliest
    producer:
      retries: 3
      acks: all

  data:
    redis:
      host: ${REDIS_HOST:payu-datagrid}
      port: ${REDIS_PORT:11222}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs}

  cloud:
    vault:
      enabled: false

management:
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

payu:
  gateway:
    url: ${GATEWAY_URL:http://gateway-service:8080}
  security:
    encryption-enabled: true
    encryption:
      password: ${ENCRYPTION_KEY}
    masking-enabled: false
    audit-enabled: false
  jms:
    broker-url: tcp://${ARTEMIS_HOST:artemis}:${ARTEMIS_PORT:61616}
    username: ${ARTEMIS_USERNAME:admin}
    password: ${ARTEMIS_PASSWORD}
