spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18080/realms/payu
          jwk-set-uri: http://localhost:18080/realms/payu/protocol/openid-connect/certs
  kafka:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

REDIS_HOST: localhost
REDIS_PORT: 6379

payu:
  cache:
    enabled: false

camel:
  springboot:
    main-run-controller: false
  component:
    kafka:
      enabled: false

logging:
  level:
    root: WARN
    id.payu: INFO
