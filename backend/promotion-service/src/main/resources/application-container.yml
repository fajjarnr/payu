# Container Integration Test Profile
# Activated via: SPRING_PROFILES_ACTIVE=container
spring:
  # Simple single datasource (override multi-datasource config)
  datasource:
    url: ${DB_URL:jdbc:postgresql://payu-postgres:5432/payu_test_promotion}
    username: ${DB_USERNAME:payu_test}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      pool-name: container-pool
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:payu-kafka-kafka-bootstrap:9092}
    consumer:
      auto-startup: true
      group-id: promotion-service-container
      auto-offset-reset: earliest
    producer:
      retries: 3
      acks: all

  data:
    redis:
      host: ${REDIS_HOST:payu-datagrid}
      port: ${REDIS_PORT:11222}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs}

  cloud:
    vault:
      enabled: false

# Disable health checks for external services in container mode
management:
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
    kafka:
      enabled: true
    db:
      enabled: true

# Application-specific overrides
payu:
  security:
    encryption-enabled: true
    encryption:
      password: ${ENCRYPTION_KEY}
    masking-enabled: false
    audit-enabled: false

server:
  port: 8080
