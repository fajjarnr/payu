server:
  port: ${PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: promotion-service
  profiles:
    active: ${SPRING_PROFILE:local}
    include: grpc

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/promotiondb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: promotion-service
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWK_SET_URI}

# OpenTelemetry Configuration
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_ENDPOINT}
  service:
    name: promotion-service
  resource:
    attributes:
      service.name: promotion-service
      service.version: 1.0.0

logging:
  level:
    root: INFO
    id.payu.promotion: DEBUG

# Service URLs
services:
  wallet:
    url: ${WALLET_SERVICE_URL:http://wallet-service:8080}

# PayU gRPC Configuration (IMP-028)
payu:
  grpc:
    clients:
      wallet-service:
        address: ${WALLET_GRPC_ADDRESS}

# App Configuration
app:
  kafka:
    topics:
      transaction-completed: transaction.completed
      notifications: notifications

---
# Development Profile
spring:
  threads:
    virtual:
      enabled: true
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

---
# Test Profile
spring:
  threads:
    virtual:
      enabled: true
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
