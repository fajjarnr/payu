syntax = "proto3";
package payu.wallet;

import "payu/common/common.proto";

option java_multiple_files = true;
option java_package = "id.payu.wallet.grpc";
option java_outer_classname = "WalletServiceProto";

/**
 * WalletService provides gRPC interface for wallet operations.
 * This service is used for inter-service communication.
 */
service WalletService {
  /**
   * Get wallet balance
   */
  rpc GetBalance(GetBalanceRequest) returns (BalanceResponse);

  /**
   * Debit from wallet
   */
  rpc Debit(DebitRequest) returns (TransactionResponse);

  /**
   * Credit to wallet
   */
  rpc Credit(CreditRequest) returns (TransactionResponse);

  /**
   * Transfer between wallets
   */
  rpc Transfer(TransferRequest) returns (TransactionResponse);

  /**
   * Get transaction history (streaming response)
   */
  rpc GetHistory(GetHistoryRequest) returns (stream LedgerEntry);

  /**
   * Get wallet details
   */
  rpc GetWallet(GetWalletRequest) returns (WalletResponse);

  /**
   * Reserve balance for later use
   */
  rpc ReserveBalance(ReserveBalanceRequest) returns (ReservationResponse);

  /**
   * Commit a reservation
   */
  rpc CommitReservation(CommitReservationRequest) returns (TransactionResponse);

  /**
   * Release a reservation
   */
  rpc ReleaseReservation(ReleaseReservationRequest) returns (TransactionResponse);

  /**
   * Get available balance
   */
  rpc GetAvailableBalance(GetBalanceRequest) returns (BalanceResponse);
}

message GetBalanceRequest {
  string wallet_id = 1;
  string account_id = 2;
}

message BalanceResponse {
  string wallet_id = 1;
  string account_id = 2;
  payu.common.Money balance = 3;
  payu.common.Money available_balance = 4;
  payu.common.Money reserved_balance = 5;
  payu.common.Timestamp timestamp = 6;
}

message DebitRequest {
  string wallet_id = 1;
  string account_id = 2;
  payu.common.Money amount = 3;
  string reference_id = 4;
  string description = 5;
}

message CreditRequest {
  string wallet_id = 1;
  string account_id = 2;
  payu.common.Money amount = 3;
  string reference_id = 4;
  string description = 5;
}

message TransferRequest {
  string from_wallet_id = 1;
  string to_wallet_id = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  payu.common.Money amount = 5;
  string reference_id = 6;
  string description = 7;
}

message TransactionResponse {
  bool success = 1;
  string transaction_id = 2;
  string ledger_entry_id = 3;
  payu.common.Money new_balance = 4;
  payu.common.Timestamp timestamp = 5;
  payu.common.ErrorDetail error = 6;
}

message GetHistoryRequest {
  string wallet_id = 1;
  string account_id = 2;
  payu.common.PageRequest page = 3;
  string start_date = 4;  // ISO-8601 format
  string end_date = 5;    // ISO-8601 format
}

message LedgerEntry {
  string entry_id = 1;
  string wallet_id = 2;
  string account_id = 3;
  string transaction_id = 4;
  EntryType type = 5;
  payu.common.Money amount = 6;
  payu.common.Money balance_after = 7;
  string reference_type = 8;
  string reference_id = 9;
  string description = 10;
  payu.common.Timestamp timestamp = 11;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  DEBIT = 1;
  CREDIT = 2;
}

message GetWalletRequest {
  string wallet_id = 1;
  string account_id = 2;
}

message WalletResponse {
  string wallet_id = 1;
  string account_id = 2;
  string account_number = 3;
  payu.common.Money balance = 4;
  payu.common.Money available_balance = 5;
  payu.common.Money reserved_balance = 6;
  string currency = 7;
  WalletStatus status = 8;
  payu.common.Timestamp created_at = 9;
  payu.common.Timestamp updated_at = 10;
}

enum WalletStatus {
  WALLET_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  FROZEN = 2;
  CLOSED = 3;
}

message ReserveBalanceRequest {
  string wallet_id = 1;
  string account_id = 2;
  payu.common.Money amount = 3;
  string reference_id = 4;
  string description = 5;
}

message ReservationResponse {
  bool success = 1;
  string reservation_id = 2;
  payu.common.Money reserved_amount = 3;
  payu.common.Money available_balance = 4;
  payu.common.Timestamp timestamp = 5;
  payu.common.ErrorDetail error = 6;
}

message CommitReservationRequest {
  string reservation_id = 1;
}

message ReleaseReservationRequest {
  string reservation_id = 1;
}
