spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Allow test config beans to override component-scanned beans (e.g., wallet adapters)
spring.main.allow-bean-definition-overriding=true

# Fast Kafka fail to prevent test hangs
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.retries=0
spring.kafka.consumer.properties.session.timeout.ms=1000
spring.kafka.consumer.properties.heartbeat.interval.ms=300
