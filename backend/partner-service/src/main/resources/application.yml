quarkus:
  application:
    name: partner-service
  http:
    port: 8089
  otel:
    service:
      name: partner-service
    exporter:
      otlp:
        endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    resource:
      attributes:
        - service.name=partner-service
        - service.version=1.0.0
  datasource:
    db-kind: postgresql
    username: postgres
    password: postgres # pragma: allowlist secret
    jdbc:
      url: jdbc:postgresql://localhost:5432/partnerdb
    health: true
    metrics: true
  hibernate-orm:
    database:
      generation: validate
      # Explicitly map entity packages to avoid persistence unit issues
      # Only include our entities (exclude Kafka checkpoint entities)
      packages: "id.payu.partner.domain"
    log:
      sql: false
  kafka:
    bootstrap-servers: localhost:9092
    # Disable Kafka checkpointing store entirely to avoid Hibernate Reactive dependency
  smallrye:
    kafka:
      checkpoint:
        enabled: false
        state-store: none
  smallrye-openapi:
    info-title: PayU Partner Service API
    info-version: 1.0.0
    info-description: API for managing external partners
  log:
    level: INFO
    category:
      "id.payu.partner":
        level: DEBUG
"%dev":
  quarkus:
    datasource:
      db-kind: h2
      jdbc:
        url: jdbc:h2:mem:devdb
      health: false
      metrics: false
    hibernate-orm:
      database:
        generation: drop-and-create
      packages: "id.payu.partner.domain"
"%test":
  quarkus:
    datasource:
      db-kind: h2
      jdbc:
        url: jdbc:h2:mem:testdb
      username: sa
      password:
      health: false
      metrics: false
    hibernate-orm:
      database:
        generation: drop-and-create
        dialect: org.hibernate.dialect.H2Dialect
      packages: "id.payu.partner.domain"
      log:
        sql: false
    # Configure datasource for Kafka checkpointing "database" persistence unit
    datasource:
      "database":
        db-kind: h2
        jdbc:
          url: jdbc:h2:mem:testdb-checkpoint
        username: sa
        password:
    # Completely disable SmallRye Reactive Messaging and Kafka checkpointing
    kafka:
      enabled: false
      devservices:
        enabled: false
    messaging:
      enabled: false
    smallrye:
      messaging:
        health:
          enabled: false
      kafka:
        checkpoint:
          enabled: false
          state-store: none
    # Disable reactive messaging
    mp:
      messaging:
        incoming:
          payment-events: not-used
        outgoing:
          payment-events: not-used
