server:
  port: ${PORT:8080}

spring:
  application:
    name: partner-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payu_partner}
    username: ${DB_USERNAME:payu}
    password: ${DB_PASSWORD:payu}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /q/openapi
  swagger-ui:
    path: /q/swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

# Custom properties
partner:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiration-ms: 900000 # 15 minutes

logging:
  level:
    id.payu.partner: INFO
    org.springframework.web: INFO
