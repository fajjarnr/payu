server:
  port: ${PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILE:local}
  application:
    name: partner-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payu_partner}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # NOTE: spring.jackson.serialization.write-dates-as-timestamps removed for SB 4.1.0 Jackson 3 compatibility.
  # Jackson 3 default is `false` (ISO-8601 strings), matching previous behavior. Kebab-case binding to
  # tools.jackson.databind.SerializationFeature enum fails in SB 4.1.0 (would need SCREAMING_SNAKE_CASE).
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: partner-service
      auto-offset-reset: latest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "id.payu.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# Custom properties
partner:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000 # 15 minutes

logging:
  level:
    id.payu.partner: INFO
    org.springframework.web: INFO
