# Test Configuration for Partner Service
#
# Docker Requirements:
# - Unit tests (Architecture tests): No Docker required
# - Integration tests (@QuarkusTest tests): Require Docker for Kafka DevServices
#
# Run tests with Docker (enables all tests including integration tests):
#   mvn test -Ddocker.enabled=true
# Run unit tests only (no Docker required):
#   mvn test
#
# Note: Integration tests are annotated with @EnabledIfSystemProperty and will be
# skipped when docker.enabled system property is not set to "true"

# Use H2 in-memory database for unit tests (no Docker required)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;IGNORE_UNKNOWN_SETTINGS=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Configure Hibernate ORM packages (required at build time)
quarkus.hibernate-orm.packages=id.payu.partner.domain
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.dialect=org.hibernate.dialect.H2Dialect

# Disable Kafka for unit tests - use In-Memory connector instead
quarkus.kafka.enabled=false
quarkus.kafka.devservices.enabled=false

# Reactive Messaging: Override outgoing channels with In-Memory connector
# This prevents Kafka checkpointing from creating a "database" persistence unit
mp.messaging.outgoing.payment-events.connector=smallrye-in-memory

# Disable OpenTelemetry in tests
quarkus.opentelemetry.enabled=false

# Test continuous testing disabled
quarkus.test.continuous-testing=disabled

# Debug logging
quarkus.log.category."id.payu.partner".level=DEBUG

# Workaround for Kafka Checkpointing "database" Persistence Unit
quarkus.datasource.database.db-kind=h2
quarkus.datasource.database.jdbc.url=jdbc:h2:mem:testdb-checkpoint;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.database.username=sa
quarkus.datasource.database.password=
