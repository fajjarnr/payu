# Test environment placeholders override
REDIS_HOST: localhost
REDIS_PORT: 6379
KAFKA_BOOTSTRAP_SERVERS: localhost:9092
JWT_SECRET: "test-secret-key-for-jwt-token-generation-validation-for-testing-only"
DB_USERNAME: sa
DB_PASSWORD: ""

spring:
  application:
    name: partner-service

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false

  # spring.jackson.serialization.* removed for SB 4.1.0 Jackson 3 compat (kebab-case to
  # tools.jackson.databind.SerializationFeature enum binding fails).

# Custom properties
partner:
  jwt:
    secret: "test-secret-key-for-jwt-token-generation-validation-for-testing-only"
    expiration-ms: 900000 # 15 minutes

logging:
  level:
    id.payu.partner: DEBUG
    org.springframework.web: INFO
    org.springframework.test: INFO
