# Disable DevServices for tests (no container runtime required)
quarkus:
  datasource:
    devservices:
      enabled: false
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;IGNORE_UNKNOWN_SETTINGS=TRUE
    username: sa
    password: ""
  otel:
    sdk:
      disabled: true
    exporter:
      otlp:
        endpoint: http://localhost:4317
  http:
    test-port: 0
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
    log:
      sql: false
simulator:
  failure-rate: 0
  latency:
    min: 1
    max: 2
  face-match:
    threshold: 0
    variance: 0
