# Biller Simulator Configuration
quarkus:
  application:
    name: biller-simulator
    version: 1.0.0

  # HTTP Server
  http:
    port: 8080
    cors:
      ~: true
      origins: "*"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: "*"

  # Database
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/biller_simulator}
      max-size: 10

  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: true

  # Health & Metrics
  smallrye-health:
    ui:
      enable: true

  micrometer:
    export:
      prometheus:
        path: /q/metrics

  # Logging
  log:
    level: INFO
    category:
      "id.payu.simulator":
        level: DEBUG
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      json: false

# Simulator Configuration
simulator:
  latency:
    min: 100
    max: 600
  failure-rate: 3
