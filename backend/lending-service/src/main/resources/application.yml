# PayU Lending Service Configuration

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: lending-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        generate_statistics: false
        use_sql_comments: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      retries: 3
      acks: all
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaProducerInterceptor
        retry.backoff.ms: 1000
    consumer:
      group-id: lending-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaConsumerInterceptor
        spring.json.trusted.packages: "*"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWK_SET_URI}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
      creditScoring:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      creditScoring:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
  timelimiter:
    instances:
      default:
        timeout-duration: 10s
      creditScoring:
        timeout-duration: 5s

# PayU Configuration
payu:
  logging:
    service-name: ${spring.application.name}
    service-version: "1.0.0"
    environment: ${SPRING_PROFILES_ACTIVE:dev}
    correlation:
      enabled: true
      header-name: "X-Correlation-Id"
    tracing:
      enabled: true
  outbox:
    enabled: true
    publisher:
      batch-size: 100
      poll-interval-ms: 1000
      max-retries: 3
    cleanup:
      enabled: true
      retention-days: 30
      cron: "0 0 2 * * *"
  cache:
    enabled: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      pool-size: 20
      timeout: 5s
    default-ttl: 5m
    local-cache:
      enabled: true
      max-size: 1000
      ttl: 1m
  lending:
    min-credit-score: 600
    max-loan-amount: 50000000

# Management Endpoints
management:
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT}
  zipkin:
    tracing:
      endpoint: ${OTEL_ENDPOINT}/v1/spans

# Logging
logging:
  level:
    id.payu.lending: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# OpenAPI Documentation
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
  show-actuator: true
  packages-to-scan: id.payu.lending
