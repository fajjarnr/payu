server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: transaction-service
  profiles:
    include: grpc
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/payu/protocol/openid-connect/certs}
  datasource:
    # Primary datasource for write operations
    primary:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/payu_transactions
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        # Pool configuration
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: false
        leak-detection-threshold: 60000
        pool-name: primary-pool
    # Read replica datasource for reporting/analytics queries
    read-replica:
      enabled: ${READ_REPLICA_ENABLED:false}
      jdbc-url: jdbc:postgresql://${READ_REPLICA_HOST}:${READ_REPLICA_PORT}/payu_transactions_replica
      username: ${READ_REPLICA_USERNAME}
      password: ${READ_REPLICA_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        # Larger pool for reads (typically 2x primary)
        maximum-pool-size: 40
        minimum-idle: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: true
        leak-detection-threshold: 60000
        pool-name: read-replica-pool
        read-only: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        # Query optimization
        generate_statistics: false
        use_sql_comments: true
        # Connection pool optimization
        connection:
          provider_disables_autocommit: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Improved producer settings
      retries: 3
      acks: all
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaProducerInterceptor
        linger.ms: 10
        batch.size: 16384
        buffer.memory: 33554432
        retry.backoff.ms: 1000
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
    consumer:
      group-id: transaction-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaConsumerInterceptor
        spring.json.trusted.packages: "*"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        max.poll.interval.ms: 300000
        max.poll.records: 500
services:
  wallet:
    url: http://localhost:8080
  bifast:
    url: http://localhost:9000
  qris:
    url: http://localhost:9001
  account:
    url: http://account-service:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      db:
        enabled: true
      redis:
        enabled: true
      kafka:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    headers:
      Authorization:
  zipkin:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4317}/v1/spans
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  level:
    id.payu.transaction: DEBUG
    org.springframework.kafka: INFO
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true
  packages-to-scan: id.payu.transaction
# Data Archival Configuration
archival:
  enabled: true
  retention-months: 12
  batch-size: 1000
  schedule:
    cron: "0 0 2 * * ?"
# Database Sharding/Partitioning Configuration
sharding:
  enabled: false # Set to true after running V5 migration and migrating data
  partition-count: 8 # Must be a power of 2: 4, 8, 16, or 32
  auto-migrate: true
  migration-batch-size: 1000
  enable-cross-partition-queries: true
  max-query-parallelism: 4
  partition-key: senderAccountId
# Resilience4j configuration for external service calls
resilience4j:
  circuitbreaker:
    instances:
      walletService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
      accountService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
  retry:
    instances:
      walletService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.ConnectException
      accountService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.ConnectException
# PayU Configuration
payu:
  grpc:
    clients:
      wallet-service:
        address: ${WALLET_GRPC_ADDRESS:static://wallet-service:9090}
  events:
    enabled: true
    kafka:
      enabled: true
      default-topic: payu.transactions
  saga:
    enabled: true
    persistent: true
    compensation-enabled: true
    monitoring-enabled: true
    events-enabled: true
    event-topic: transaction.saga.events
    default-max-retries: 3
    default-timeout: PT2M
    default-step-timeout: PT30S
  outbox:
    enabled: true
    publisher:
      batch-size: 100
      poll-interval-ms: 1000
      max-retries: 3
    cleanup:
      enabled: true
      retention-days: 30
      cron: "0 0 2 * * *"
  cache:
    enabled: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      pool-size: 20
      timeout: 5s
      command-timeout: 3s
    default-ttl: 5m
    cache-warming:
      enabled: true
      startup-delay: 10s
      async: true
      thread-pool-size: 4
    invalidation:
      enabled: true
      topic: cache-invalidation
      consumer-group: transaction-cache-invalidation-group
    local-cache:
      enabled: true
      max-size: 1000
      ttl: 1m
      record-stats: true
    caches:
      transactions:
        ttl: 5m
        stale-while-revalidate: true
      rates:
        ttl: 30m
        stale-while-revalidate: false
    metrics:
      enabled: true
      prefix: cache
      percentiles: true
      histogram: true
