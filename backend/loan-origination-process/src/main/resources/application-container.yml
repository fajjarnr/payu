spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://payu-postgres:5432/payu_loan_origination}
    username: ${DATABASE_USER:payu}
    password: ${DATABASE_PASSWORD:payu}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      pool-name: container-pool

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:payu-kafka-kafka-bootstrap:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

payu:
  lending-rules:
    url: ${LENDING_RULES_URL:http://lending-rules:8080}
  kogito:
    task-api:
      url: ${KOGITO_TASK_API_URL:http://loan-origination-process:8080}
  outbox:
    enabled: true
    persistence:
      enabled: true

management:
  endpoint:
    health:
      show-details: when-authorized
  health:
    kafka:
      enabled: true
