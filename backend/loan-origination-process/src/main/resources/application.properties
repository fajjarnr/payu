spring.application.name=loan-origination-process
server.port=8080
server.shutdown=graceful

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payu_loan_origination}
spring.datasource.username=${DATABASE_USER:payu}
spring.datasource.password=${DATABASE_PASSWORD:payu}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8080/realms/payu}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8080/realms/payu/protocol/openid-connect/certs}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

payu.lending-rules.url=${LENDING_RULES_URL:http://lending-service:8080}
