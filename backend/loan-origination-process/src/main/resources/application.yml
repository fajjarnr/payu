spring:
  application:
    name: loan-origination-process
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payu_loan_origination}
    username: ${DATABASE_USER:payu}
    password: ${DATABASE_PASSWORD:payu}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Kogito / jBPM config
kogito:
  persistence:
    type: jdbc
  usertasks:
    lifecycle: ws-human-task

# Lending-rules REST endpoint
payu:
  lending-rules:
    url: ${LENDING_RULES_URL:http://lending-rules:8080}
  outbox:
    enabled: true
    publisher:
      batch-size: 100
      poll-interval-ms: 1000
      max-retries: 3
    cleanup:
      enabled: true
      retention-days: 30
      cron: "0 0 2 * * *"
  rest-client:
    services:
      lending-rules:
        base-url: ${LENDING_RULES_URL:http://lending-rules:8080}
        read-timeout: 10000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

# Logging
logging:
  level:
    id.payu.loanorigination: ${LOG_LEVEL:INFO}
    org.jbpm: INFO
    org.kie: INFO
