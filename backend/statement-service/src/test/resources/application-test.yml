# Test configuration for statement-service integration tests
# Uses H2 in-memory database for fast test execution

spring:
  datasource:
    url: jdbc:h2:mem:statement_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://fake-issuer.example.com
          jwk-set-uri: https://fake-issuer.example.com/.well-known/jwks.json

# Statement service specific settings
statement:
  storage:
    type: filesystem
    path: /tmp/statements
  pdf:
    template-path: templates/statement-template.html

payu:
  outbox:
    enabled: false
  events:
    enabled: false
  cache:
    enabled: false

logging:
  level:
    id.payu.statement: DEBUG
    org.springframework.security: DEBUG
