# Container Integration Test Profile
spring:
  main:
    allow-bean-definition-overriding: true
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://payu-postgres:5432/payu_test_statement}
    username: ${DB_USERNAME:payu_test}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      pool-name: container-pool
  
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:payu-kafka-kafka-bootstrap:9092}
    consumer:
      auto-startup: true
      group-id: statement-service-container
  
  data:
    redis:
      host: ${REDIS_HOST:payu-datagrid}
      port: ${REDIS_PORT:11222}
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://payu-keycloak-service.payu-sso.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs}
management:
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
    kafka:
      enabled: true

statement:
  storage:
    type: ${STATEMENT_STORAGE_TYPE:s3}
    s3:
      bucket: ${STATEMENT_STORAGE_S3_BUCKET:payu-statements}
      region: ${STATEMENT_STORAGE_S3_REGION:ap-southeast-1}
      # On OpenShift: empty endpoint = AWS S3 native, creds from AWS_ACCESS_KEY_ID env
      # On local compose: override with RustFS endpoint + static keys
      endpoint: ${STATEMENT_STORAGE_S3_ENDPOINT:}
      access-key: ${STATEMENT_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STATEMENT_STORAGE_S3_SECRET_KEY:}
      prefix: ${STATEMENT_STORAGE_S3_PREFIX:statements/}

payu:
  security:
    encryption-enabled: false
  cache:
    invalidation:
      enabled: false
