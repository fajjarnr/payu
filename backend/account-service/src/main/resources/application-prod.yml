# Environment-specific configuration for Production
spring:
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}  # Vault is enabled by default in prod
  datasource:
    primary:
      jdbc-url: ${DB_URL}  # FAIL-FAST: No default value for production URL
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWK_SET_URI}

payu:
  gateway:
    url: ${GATEWAY_URL}
  cache:
    hotrod:
      server-list: ${PAYU_CACHE_HOTROD_SERVER_LIST}
      cache-name: payu

management:
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT}
  zipkin:
    tracing:
      endpoint: ${OTEL_ENDPOINT}/v1/spans
