server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: account-service
  profiles:
    active: ${SPRING_PROFILE:local}
  config:
    import: optional:vault
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI}
      token: ${VAULT_TOKEN}
      scheme: http
      connection-timeout: 5000
      read-timeout: 15000
      kv:
        enabled: true
        backend: secret
        application-name: account-service
  datasource:
    # Primary datasource for write operations
    primary:
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: false
        leak-detection-threshold: 60000
        pool-name: primary-pool
    # Read replica datasource for reporting/analytics queries
    read-replica:
      enabled: ${READ_REPLICA_ENABLED:false}
      jdbc-url: ${READ_REPLICA_URL}
      username: ${READ_REPLICA_USERNAME}
      password: ${READ_REPLICA_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 40
        minimum-idle: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: true
        leak-detection-threshold: 60000
        pool-name: read-replica-pool
        read-only: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        generate_statistics: false
        use_sql_comments: true
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaConsumerInterceptor
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    producer:
      retries: 3
      acks: all
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaProducerInterceptor
        retry.backoff.ms: 1000
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithm: RS256
  cache:
    redis:
      time-to-live: 300000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      db:
        enabled: true
      redis:
        enabled: true
      kafka:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    export:
      prometheus:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      gatewayService:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
      dukcapilService:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 3000ms
  retry:
    instances:
      gatewayService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
      dukcapilService:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - id.payu.account.exception.AccountDomainException$InvalidNikException
  timelimiter:
    instances:
      gatewayService:
        timeout-duration: 5s
      dukcapilService:
        timeout-duration: 10s
  bulkhead:
    instances:
      dukcapilService:
        max-concurrent-calls: 50
        max-wait-duration: 2s
payu:
  kyc:
    auto-approve-score: 80
  resilience:
    enabled: true
    circuit-breaker:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      permitted-number-of-calls-in-half-open-state: 5
      sliding-window-size: 100
      minimum-number-of-calls: 10
      sliding-window-type: COUNT_BASED
      automatic-transition-from-open-to-half-open-enabled: true
    retry:
      max-attempts: 3
      wait-duration: 500ms
      enable-exponential-backoff: true
      exponential-backoff-multiplier: 2.0
      randomize-wait: true
    bulkhead:
      max-concurrent-calls: 25
      max-wait-duration: 1s
    time-limiter:
      timeout-duration: 5s
      cancel-running-future: true
    services:
      gateway-service:
        circuit-breaker:
          failure-rate-threshold: 60
          wait-duration-in-open-state: 20s
        retry:
          max-attempts: 3
        bulkhead:
          max-concurrent-calls: 20
      authService:
        circuit-breaker:
          failure-rate-threshold: 50
          wait-duration-in-open-state: 30s
        retry:
          max-attempts: 2
        bulkhead:
          max-concurrent-calls: 10
  security:
    enabled: true
    encryption-enabled: true
    masking-enabled: true
    audit-enabled: true
    blind-index-key: ${BLIND_INDEX_KEY:payu-local-blind-index-dev-only-32}
    blind-index-key-version: ${BLIND_INDEX_KEY_VERSION:local-v1}
    blind-index-previous-keys: ${BLIND_INDEX_PREVIOUS_KEYS:}
    encryption:
      algorithm: PBEWITHHMACSHA512ANDAES_256
      password: ${ENCRYPTION_KEY}
      fields:
        - .*password.*
        - .*ssn.*
        - .*creditCard.*
        - .*accountNumber.*
        - .*idCard.*
        - .*nik.*
        - .*secret.*
    masking:
      pattern: (?<=.{4}).
      mask-char: '*'
      fields:
        - password
        - ssn
        - creditCard
        - accountNumber
        - idCard
        - nik
        - email
        - phoneNumber
        - token
        - secret
    audit:
      enabled: true
      retention-days: 365
      operations:
        - CREATE
        - UPDATE
        - DELETE
        - TRANSFER
        - LOGIN
        - LOGOUT
        - KYC_APPROVE
        - KYC_REJECT
  cache:
    enabled: true
    pool-size: 20
    timeout: 5s
    command-timeout: 3s
    default-ttl: 5m
    cache-warming:
      enabled: true
      startup-delay: 10s
      async: true
      thread-pool-size: 4
    invalidation:
      enabled: true
      topic: payu.cache.invalidation.v1
      consumer-group: account-cache-invalidation-group
    local-cache:
      enabled: true
      max-size: 1000
      ttl: 1m
      record-stats: true
    caches:
      accounts:
        ttl: 10m
        stale-while-revalidate: true
      profiles:
        ttl: 5m
        stale-while-revalidate: false
    metrics:
      enabled: true
      prefix: cache
      percentiles: true
      histogram: true
logging:
  level:
    id.payu.account: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
  show-actuator: true
  packages-to-scan: id.payu.account
