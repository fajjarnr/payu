# Environment-specific configuration for UAT
spring:
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://payu-postgres-uat.payu-db-uat.svc.cluster.local:5432/payu_compliances}
    username: ${DATABASE_USERNAME:payu_uat_app}
    password: ${DATABASE_PASSWORD}
    primary:
      jdbc-url: ${DB_URL:jdbc:postgresql://payu-postgres-uat.payu-db-uat.svc.cluster.local:5432/payu_compliances}
      username: ${DB_USERNAME:payu_uat_app}
      password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:payu-kafka-uat-kafka-bootstrap.payu-messaging-uat.svc.cluster.local:9092}
    bootstrap: ${KAFKA_BOOTSTRAP_SERVERS:payu-kafka-uat-kafka-bootstrap.payu-messaging-uat.svc.cluster.local:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:https://sso-uat.payu.id/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:https://sso-uat.payu.id/realms/payu/protocol/openid-connect/certs}

payu:
  gateway:
    url: ${GATEWAY_URL:https://gateway-uat.payu.id}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:https://sso-uat.payu.id}
    realm: ${KEYCLOAK_REALM:payu}
    client-id: ${KEYCLOAK_CLIENT_ID:payu-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    admin:
      username: ${KEYCLOAK_ADMIN_USERNAME}
      password: ${KEYCLOAK_ADMIN_PASSWORD}
  cache:
    hotrod:
      server-list: ${PAYU_CACHE_HOTROD_SERVER_LIST}
      cache-name: payu

management:
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://otel-collector-uat.payu-monitoring-uat.svc.cluster.local:4317}
  zipkin:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://otel-collector-uat.payu-monitoring-uat.svc.cluster.local:4317}/v1/spans
