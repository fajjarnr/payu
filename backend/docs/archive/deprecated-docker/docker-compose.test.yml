  # ============================================
  # OBSERVABILITY STACK
  # ============================================

  # Prometheus - Metrics Scraping
  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: payu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/containers/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/containers/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - payu-test-network
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: docker.io/grafana/grafana:11.3.1
    container_name: payu-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/containers/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/containers/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - payu-test-network
    restart: unless-stopped

  # Loki - Log Aggregation
  loki:
    image: docker.io/grafana/loki:v2.9.2
    container_name: payu-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/containers/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - payu-test-network
    restart: unless-stopped

  # Promtail - Log Shipping
  promtail:
    image: docker.io/grafana/promtail:v2.9.2
    container_name: payu-promtail
    volumes:
      - ./infrastructure/containers/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - payu-test-network
    restart: unless-stopped

  # Alertmanager - Alert Routing
  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: payu-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/containers/alertmanager-config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - payu-test-network
    restart: unless-stopped

  # Jaeger - Distributed Tracing
  jaeger:
    image: docker.io/jaegertracing/all-in-one:v1.57
    container_name: payu-jaeger
    ports:
      - "5775:5775/udp" # accept zipkin.thrift over compact thrift protocol
      - "6831:6831/udp" # accept jaeger.thrift over compact thrift protocol
      - "6832:6832/udp" # accept jaeger.thrift over binary thrift protocol
      - "5778:5778"     # serve configs
      - "16686:16686"   # serve frontend (Jaeger UI)
      - "14268:14268"   # accept jaeger.thrift directly from clients
      - "14250:14250"   # accept model.proto
      - "9411:9411"     # Zipkin compatible endpoint
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - payu-test-network
    restart: unless-stopped

volumes:
  postgres_test_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
  
networks:
  payu-test-network:
    driver: bridge
