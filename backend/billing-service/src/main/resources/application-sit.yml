# Environment-specific configuration for SIT
spring:
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://payu-postgres-sit.payu-db-sit.svc.cluster.local:5432/payu_billings}
    username: ${DATABASE_USERNAME:payu_sit_app}
    password: ${DATABASE_PASSWORD}
    primary:
      jdbc-url: ${DB_URL:jdbc:postgresql://payu-postgres-sit.payu-db-sit.svc.cluster.local:5432/payu_billings}
      username: ${DB_USERNAME:payu_sit_app}
      password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:payu-kafka-sit-kafka-bootstrap.payu-messaging-sit.svc.cluster.local:9092}
    bootstrap: ${KAFKA_BOOTSTRAP_SERVERS:payu-kafka-sit-kafka-bootstrap.payu-messaging-sit.svc.cluster.local:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://payu-keycloak-sit.payu-sso-sit.svc.cluster.local:8080/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://payu-keycloak-sit.payu-sso-sit.svc.cluster.local:8080/realms/payu/protocol/openid-connect/certs}

payu:
  gateway:
    url: ${GATEWAY_URL:http://gateway-service-sit:8080}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://payu-keycloak-sit.payu-sso-sit.svc.cluster.local:8080}
    realm: ${KEYCLOAK_REALM:payu}
    client-id: ${KEYCLOAK_CLIENT_ID:payu-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    admin:
      username: ${KEYCLOAK_ADMIN_USERNAME}
      password: ${KEYCLOAK_ADMIN_PASSWORD}
  cache:
    redis:
      host: ${REDIS_HOST:payu-redis-sit.payu-cache-sit.svc.cluster.local}
      port: ${REDIS_PORT:6379}

management:
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://otel-collector-sit.payu-monitoring-sit.svc.cluster.local:4317}
  zipkin:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://otel-collector-sit.payu-monitoring-sit.svc.cluster.local:4317}/v1/spans
