server:
  port: ${PORT:8080}

spring:
  profiles:
    include: grpc

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billingdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaProducerInterceptor
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaConsumerInterceptor
        spring.json.trusted.packages: "*"

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/payu/protocol/openid-connect/certs}

  # REST Client for Wallet Service
  web:
    client:
      wallet-service:
        base-url: http://localhost:8080

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: PayU Billing Service API
    version: 1.0.0
    description: Bill payment API for PLN, PDAM, Pulsa, E-wallet top-up, etc.

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      walletService:
        register-health-indicator: true
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      walletService:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.net.ConnectException
  timelimiter:
    instances:
      walletService:
        timeout-duration: 5s
  bulkhead:
    instances:
      walletService:
        max-concurrent-calls: 20
        max-wait-duration: 10ms

# Logging Configuration
logging:
  level:
    root: INFO
    id.payu.billing: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0



# Vault Configuration for Secrets (optional)
vault:
  url: ${VAULT_URL:http://localhost:8200}
  token: ${VAULT_TOKEN:dev-only-token}
  secrets:
    - path: secret/billing-service
      key: encryption.key

payu:
  grpc:
    clients:
      wallet-service:
        address: ${WALLET_GRPC_ADDRESS:static://wallet-service:9090}
  outbox:
    enabled: true
    publisher:
      batch-size: 100
      poll-interval-ms: 1000
      max-retries: 3
    cleanup:
      enabled: true
      retention-days: 30
      cron: "0 0 2 * * *"

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: drop-and-create
    show-sql: true
  flyway:
    enabled: false

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;IGNORE_UNKNOWN_SETTINGS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: drop-and-create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092} # Use testcontainers for tests
