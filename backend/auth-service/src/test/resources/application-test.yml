# Test configuration for auth-service
spring:
  main:
    allow-bean-definition-overriding: true
  config:
    import: optional:vault://
  cloud:
    vault:
      enabled: false

  # H2 Database for unit tests
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Flyway for tests
  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/payu

# Keycloak and Security Config (for integration tests)
payu:
  keycloak:
    server-url: http://localhost:8080
    realm: payu
    client-id: payu-client
    client-secret: test-secret
    admin:
      username: admin
      password: ${TEST_KEYCLOAK_ADMIN_PASSWORD:admin}
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    password-policy:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true

# Resilience4j Rate Limiter
resilience4j:
  ratelimiter:
    instances:
      loginRateLimiter:
        limitRefreshPeriod: 60s
        limitForPeriod: 5
        timeoutDuration: 0

# Logging
logging:
  level:
    id.payu: DEBUG
