server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILE:local}
  config:
    import: optional:vault
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI}
      token: ${VAULT_TOKEN}
      scheme: http
      connection-timeout: 5000
      read-timeout: 15000
      kv:
        enabled: true
        backend: secret
        application-name: auth-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Explicitly configure RS256 algorithm to prevent algorithm confusion attacks
          jws-algorithm: RS256
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        generate_statistics: false
        use_sql_comments: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
resilience4j:
  circuitbreaker:
    instances:
      keycloakService:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      keycloakService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      loginRateLimiter:
        # Global ceiling across the whole service; the per-IP/per-account
        # brute-force control is the @RateLimit aspect (10/min). Without an
        # explicit config Resilience4j defaults (50 permits / 500ns refresh)
        # deny almost every login.
        limit-for-period: 30
        limit-refresh-period: 1m
        timeout-duration: 0s
# Account Lockout Configuration
payu:
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    password-policy:
      min-length: 12
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true
    dpop:
      enabled: ${PAYU_DPOP_ENABLED:true}
      max-iat-skew-seconds: 300
      jti-ttl-seconds: 300
      nonce-ttl-seconds: 300
      require-for-bound-tokens: true
      allowed-algs: "ES256,ES384,ES512,PS256,PS384,PS512,RS256,RS384,RS512,EdDSA"
  biometric:
    challenge-expiry-seconds: 300
    max-registrations-per-user: 5
  logging:
    service-name: ${spring.application.name}
    service-version: "1.0.0"
    environment: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    enabled: true
    redis:
      pool-size: 20
      timeout: 5s
    default-ttl: 5m
    local-cache:
      enabled: true
      max-size: 1000
      ttl: 1m
# Logging
logging:
  level:
    id.payu.auth: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
# OpenAPI Documentation
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
  show-actuator: true
  packages-to-scan: id.payu.auth
