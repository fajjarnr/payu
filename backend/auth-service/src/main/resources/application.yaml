server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILE:local}
  config:
    import: optional:vault
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI}
      token: ${VAULT_TOKEN}
      scheme: http
      connection-timeout: 5000
      read-timeout: 15000
      kv:
        enabled: true
        backend: secret
        application-name: auth-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Explicitly configure RS256 algorithm to prevent algorithm confusion attacks
          # This mitigates the "none" algorithm attack and ensures asymmetric encryption
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/payu}
          jws-algorithm: RS256
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/payu/protocol/openid-connect/certs}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payu_auth}
    username: ${DATABASE_USERNAME:payu}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        generate_statistics: false
        use_sql_comments: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    headers:
      Authorization:
  zipkin:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4317}/v1/spans
resilience4j:
  ratelimiter:
    instances:
      loginRateLimiter:
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0s
        register-health-indicator: true
  circuitbreaker:
    instances:
      keycloakService:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      keycloakService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
# Account Lockout Configuration
payu:
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    password-policy:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true
  biometric:
    challenge-expiry-seconds: 300
    max-registrations-per-user: 5
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:payu}
    client-id: ${KEYCLOAK_CLIENT_ID:payu-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    admin:
      username: ${KEYCLOAK_ADMIN_USERNAME}
      password: ${KEYCLOAK_ADMIN_PASSWORD}
  logging:
    service-name: ${spring.application.name}
    service-version: "1.0.0"
    environment: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    enabled: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      pool-size: 20
      timeout: 5s
    default-ttl: 5m
    local-cache:
      enabled: true
      max-size: 1000
      ttl: 1m
# Logging
logging:
  level:
    id.payu.auth: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true
  packages-to-scan: id.payu.auth

