apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cms-service
  description: Content Management Service. Banners, dynamic content, promotions management, and public content APIs.
  annotations:
    github.com/project-slug: payu/cms-service
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: app=cms-service
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
  tags:
    - java
    - spring-boot
    - postgresql
    - cms
    - content-management
spec:
  type: service
  lifecycle: production
  owner: team-backend
  system: payu-core-banking
  dependsOn:
    - component:postgresql
    - component:redis
  providesApis:
    - cms-api
