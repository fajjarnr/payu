# ==================================================
# PayU CMS Service Configuration
# ==================================================

server:
  port: 8082
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: cms-service
    version: 1.0.0

  # ==================================================
  # Database Configuration (PostgreSQL)
  # ==================================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payu_cms
    username: ${DB_USERNAME:payu}
    password: ${DB_PASSWORD:payu_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ==================================================
  # JPA Configuration
  # ==================================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        default_schema: public
    show-sql: false

  # ==================================================
  # Flyway Configuration
  # ==================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_cms
    validate-on-migrate: true

  # ==================================================
  # Redis Configuration (Data Grid RESP mode)
  # ==================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 60000ms

  # ==================================================
  # Cache Configuration
  # ==================================================
  cache:
    type: redis
    cache-names: contents,activeContents
    redis:
      time-to-live: 600000
      cache-null-values: false
    ttl: 10m

  # ==================================================
  # Kafka Configuration (AMQ Streams)
  # ==================================================
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  # ==================================================
  # Keycloak/OAuth2 Configuration
  # ==================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/payu}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/payu/protocol/openid-connect/certs}

# ==================================================
# Application-specific Configuration
# ==================================================
app:
  kafka:
    topics:
      content-published: cms-content-published
      content-updated: cms-content-updated
      content-archived: cms-content-archived
  features:
    scheduler:
      enabled: true
    cache:
      enabled: true
    kafka:
      enabled: true

# ==================================================
# Actuator Configuration
# ==================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ==================================================
# Logging Configuration
# ==================================================
logging:
  level:
    id.payu.cms: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

# ==================================================
# OpenAPI/Swagger Configuration
# ==================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: true
