# PayU CMS Service Configuration

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: cms-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
          time_zone: UTC
        generate_statistics: false
        use_sql_comments: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history_cms
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      retries: 3
      acks: all
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaProducerInterceptor
        enable.idempotence: true
    consumer:
      group-id: cms-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaConsumerInterceptor
        spring.json.trusted.packages: "*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWK_SET_URI}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      default:
        timeout-duration: 10s

# Cache Configuration (shared Infinispan Hot Rod contract)
payu:
  cache:
    enabled: true
    provider: ${PAYU_CACHE_PROVIDER:hotrod}
    hotrod:
      server-list: ${PAYU_CACHE_HOTROD_SERVER_LIST:localhost:11222}
      cache-name: ${PAYU_CACHE_HOTROD_CACHE_NAME:payu}
      auth-username: ${PAYU_CACHE_HOTROD_AUTH_USERNAME:}
      auth-password: ${PAYU_CACHE_HOTROD_AUTH_PASSWORD:}
      auth-realm: ${PAYU_CACHE_HOTROD_AUTH_REALM:default}
      sasl-mechanism: ${PAYU_CACHE_HOTROD_SASL_MECHANISM:DIGEST-SHA-256}
      use-ssl: ${PAYU_CACHE_HOTROD_USE_SSL:false}
      trust-store-file-name: ${PAYU_CACHE_HOTROD_TRUST_STORE_FILE_NAME:}
      trust-store-password: ${PAYU_CACHE_HOTROD_TRUST_STORE_PASSWORD:}
      key-store-file-name: ${PAYU_CACHE_HOTROD_KEY_STORE_FILE_NAME:}
      key-store-password: ${PAYU_CACHE_HOTROD_KEY_STORE_PASSWORD:}
      sni-host-name: ${PAYU_CACHE_HOTROD_SNI_HOST_NAME:}
    default-ttl: 5m
    local-cache:
      enabled: true
      max-size: 2000
      ttl: 2m

# Application Configuration
app:
  kafka:
    topics:
      content-published: cms-content-published
      content-updated: cms-content-updated
      content-archived: cms-content-archived
  features:
    scheduler:
      enabled: true
    cache:
      enabled: true
    kafka:
      enabled: true

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

# Logging
logging:
  level:
    id.payu.cms: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# OpenAPI Documentation
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
  show-actuator: true
  packages-to-scan: id.payu.cms
