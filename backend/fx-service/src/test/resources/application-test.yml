# Test configuration for fx-service integration tests
# Uses H2 in-memory database for fast test execution

spring:
  datasource:
    primary:
      hikari:
        jdbc-url: jdbc:h2:mem:fx_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        username: sa
        password:
        driver-class-name: org.h2.Driver
    read-replica:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://fake-issuer.example.com
          jwk-set-uri: https://fake-issuer.example.com/.well-known/jwks.json
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=1m

payu:
  cache:
    enabled: false

fx:
  providers:
    default-provider: MOCK
    cache-ttl-minutes: 10
    supported-currencies: IDR,USD,EUR,SGD,JPY,GBP,AUD,CNY
    base-currency: IDR
  scheduler:
    update-rates-cron: "0 0 0 31 12 ?"

management:
  health:
    redis:
      enabled: false

logging:
  level:
    id.payu.fx: DEBUG
