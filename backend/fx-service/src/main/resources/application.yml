server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: fx-service
  profiles:
    active: ${ENVIRONMENT:dev}
    include: grpc
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME:payu_fx}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: fx-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaConsumerInterceptor
        spring.json.trusted.packages: id.payu.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaProducerInterceptor

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
    instances:
      fxRateProvider:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      fxRateProvider:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

fx:
  provider:
    url: ${FX_PROVIDER_URL:}
    api-key: ${FX_PROVIDER_API_KEY:}
    source: ${FX_PROVIDER_SOURCE:}
    timeout: ${FX_PROVIDER_TIMEOUT:3s}
    max-age: ${FX_PROVIDER_MAX_AGE:15m}
  providers:
    default-provider: ${FX_DEFAULT_PROVIDER:UNCONFIGURED}
    cache-ttl-minutes: 10
    supported-currencies: IDR,USD,EUR,SGD,JPY,GBP,AUD,CNY
    base-currency: IDR
  scheduler:
    update-rates-cron: "0 */15 * * * *"

# PayU Cache Starter Configuration
payu:
  grpc:
    clients:
      wallet-service:
        address: ${WALLET_GRPC_ADDRESS}
  cache:
    enabled: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      pool-size: 20
      timeout: 5s
    default-ttl: 10m
    local-cache:
      enabled: true
      max-size: 1000
      ttl: 2m

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/fx-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
