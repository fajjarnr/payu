quarkus:
  application:
    name: notification-service
  http:
    port: 8080
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:9080}/realms/${KEYCLOAK_REALM:payu}
    client-id: ${OIDC_CLIENT_ID:notification-service}
    tls:
      verification: none
    token:
      issuer: any
  security:
    jaxrs:
      deny-unauthenticated-by-default: true
  otel:
    service:
      name: notification-service
    exporter:
      otlp:
        endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    resource:
      attributes:
        - service.name=notification-service
        - service.version=1.0.0
  banner:
    path: banner.txt
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/notificationdb}
  hibernate-orm:
    packages: id.payu.notification.domain
    database:
      generation: update
    log:
      sql: false
  kafka:
    bootstrap-servers: localhost:9092
  mailer:
    from: noreply@payu.id
    host: smtp.example.com
    port: 587
    start-tls: REQUIRED
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    mock: true # Use mock mailer in dev
  smallrye-openapi:
# SMS provider configuration
payu:
  sms:
    provider: ${SMS_PROVIDER:LOG}   # LOG | TWILIO | VONAGE | ZENZIVA
    # twilio:
    #   account-sid: ${TWILIO_SID:}
    #   auth-token: ${TWILIO_TOKEN:}
    #   from-number: ${TWILIO_FROM:}
    # vonage:
    #   api-key: ${VONAGE_KEY:}
    #   api-secret: ${VONAGE_SECRET:}
    # zenziva:
    #   userkey: ${ZENZIVA_USERKEY:}
    #   passkey: ${ZENZIVA_PASSKEY:}    info-title: PayU Notification Service API
    info-version: 1.0.0
    info-description: Notification API for Push, SMS, Email
  log:
    level: INFO
    category:
      "id.payu.notification":
        level: DEBUG
"%dev":
  quarkus:
    hibernate-orm:
      database:
        generation: drop-and-create
    mailer:
      mock: true
mp:
  messaging:
    incoming:
      wallet-events:
        connector: smallrye-kafka
        topic: wallet.balance.changed
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
      transaction-events:
        connector: smallrye-kafka
        topic: transaction.completed
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
      payment-events:
        connector: smallrye-kafka
        topic: payment-events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
