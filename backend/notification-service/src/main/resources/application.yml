quarkus:
  application:
    name: notification-service
    version: 1.0.0
    environment: dev
  http:
    port: 8080
    auth:
      permission:
        public-health:
          paths: "/**/public/health"
          policy: permit
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:9080}/realms/${KEYCLOAK_REALM:payu}
    client-id: ${OIDC_CLIENT_ID:notification-service}
    tls:
      verification: none
    token:
      issuer: any
  security:
    jaxrs:
      deny-unauthenticated-by-default: true
  otel:
    service:
      name: notification-service
    exporter:
      otlp:
        endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    resource:
      attributes:
        - service.name=notification-service
        - service.version=1.0.0
  banner:
    path: banner.txt
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/notificationdb}
  hibernate-orm:
    packages: id.payu.notification.domain
    database:
      generation: update
    log:
      sql: false
  mailer:
    from: noreply@payu.fajjjar.my.id
    host: smtp.example.com
    port: 587
    start-tls: REQUIRED
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    mock: true
  smallrye-openapi:
    info-title: PayU Notification Service API
    info-version: 1.0.0
    info-description: Notification API for Push, SMS, Email
# SMS provider configuration
payu:
  sms:
    provider: ${SMS_PROVIDER:LOG}
    # twilio:
    #   account-sid: ${TWILIO_SID:}
    #   auth-token: ${TWILIO_TOKEN:}
    #   from-number: ${TWILIO_FROM:}
    # vonage:
    #   api-key: ${VONAGE_KEY:}
    #   api-secret: ${VONAGE_SECRET:}
    # zenziva:
    #   userkey: ${ZENZIVA_USERKEY:}
    #   passkey: ${ZENZIVA_PASSKEY:}
  log:
    level: INFO
    category:
      "id.payu.notification":
        level: DEBUG
    console:
      json:
        enabled: true
        log-format: ecs
        exception-output-type: formatted
        additional-field:
          "service.environment":
            value: dev
            type: STRING
"%dev":
  quarkus:
    hibernate-orm:
      database:
        generation: drop-and-create
    mailer:
      mock: true
mp:
  messaging:
    incoming:
      wallet-events:
        connector: smallrye-kafka
        topic: wallet.balance.changed
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: wallet.balance.changed.dlq
      transaction-events:
        connector: smallrye-kafka
        topic: transaction.completed
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: transaction.completed.dlq
      payment-events:
        connector: smallrye-kafka
        topic: payment-events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payment-events.dlq
      split-bill-events:
        connector: smallrye-kafka
        topic: split-bill.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: split-bill.events.dlq
      kyc-verified-events:
        connector: smallrye-kafka
        topic: payu.kyc.verified
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.kyc.verified.dlq
      kyc-failed-events:
        connector: smallrye-kafka
        topic: payu.kyc.failed
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.kyc.failed.dlq
