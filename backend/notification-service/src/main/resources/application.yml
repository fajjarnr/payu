quarkus:
  application:
    name: notification-service
    version: 1.0.0
  http:
    port: 8080
    auth:
      permission:
        public-health:
          paths: "/public/health,/q/health/*"
          policy: permit
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:9080}/realms/${KEYCLOAK_REALM:payu}
    client-id: ${OIDC_CLIENT_ID:notification-service}
    connection-delay: 30S
    token:
      issuer: any
  otel:
    sdk:
      disabled: ${OTEL_SDK_DISABLED:true}
    service:
      name: notification-service
    exporter:
      otlp:
        endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    resource:
      attributes:
        - service.name=notification-service
        - service.version=1.0.0
  banner:
    path: banner.txt
  artemis:
    url: ${ARTEMIS_URL:tcp://localhost:61616}
    username: ${ARTEMIS_USERNAME:admin}
    password: ${ARTEMIS_PASSWORD:admin}
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/notificationdb}
  hibernate-orm:
    packages: id.payu.notification
    schema-management:
      strategy: update
    log:
      sql: false
  mailer:
    from: noreply@payu.fajjjar.my.id
    host: smtp.example.com
    port: 587
    start-tls: REQUIRED
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    mock: false
  smallrye-openapi:
    info-title: PayU Notification Service API
    info-version: 1.0.0
    info-description: Notification API for Push, SMS, Email
  log:
    level: INFO
    category:
      "id.payu.notification":
        level: DEBUG
    console:
      json:
        enabled: true
        log-format: ecs
        exception-output-type: formatted
        additional-field:
          "service.environment":
            value: dev
            type: STRING
# SMS provider configuration — PROD-044: fail-closed by default (NONE).
# Set SMS_PROVIDER=LOG only for explicit dev-mode logging; real providers
# (TWILIO/VONAGE/ZENZIVA) are not implemented yet and also fail closed.
# ADR-0027 zero-cost lab: TELEGRAM (bot-token) / SIMULATOR (log-only)
payu:
  sms:
    provider: ${SMS_PROVIDER:NONE}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  fcm:
    project-id: ${FCM_PROJECT_ID:}
    # twilio:
    #   account-sid: ${TWILIO_SID:}
    #   auth-token: ${TWILIO_TOKEN:}
    #   from-number: ${TWILIO_FROM:}
    # vonage:
    #   api-key: ${VONAGE_KEY:}
    #   api-secret: ${VONAGE_SECRET:}
    # zenziva:
    #   userkey: ${ZENZIVA_USERKEY:}
    #   passkey: ${ZENZIVA_PASSKEY:}
  push:
    provider: ${PUSH_PROVIDER:NONE}
mp:
  messaging:
    incoming:
      wallet-events:
        connector: smallrye-kafka
        topic: payu.wallet.balance-changed.v1
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.wallet.balance-changed.v1.dlq
      transaction-events:
        connector: smallrye-kafka
        topic: payu.transaction.completed.v1
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.transaction.completed.v1.dlq
      payment-events:
        connector: smallrye-kafka
        topic: payu.transaction.payment-expired.v1
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.transaction.payment-expired.v1.dlq
      billing-payment-events:
        connector: smallrye-kafka
        topic: payu.billing.payment-completed.v1
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.billing.payment-completed.v1.dlq
      split-bill-events:
        connector: smallrye-kafka
        topics:
          - payu.transaction.split-bill-created.v1
          - payu.transaction.split-bill-activated.v1
          - payu.transaction.split-bill-cancelled.v1
          - payu.transaction.participant-added.v1
          - payu.transaction.payment-made.v1
          - payu.transaction.split-bill-completed.v1
          - payu.transaction.payment-reminder.v1
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.transaction.split-bill-events.v1.dlq
      kyc-verified-events:
        connector: smallrye-kafka
        topic: payu.kyc.verified.v1
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.kyc.verified.v1.dlq
      kyc-failed-events:
        connector: smallrye-kafka
        topic: payu.kyc.failed.v1
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue.topic: payu.kyc.failed.v1.dlq
"%dev":
  quarkus:
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
    mailer:
      mock: true
