apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ab-testing-service
  description: A/B Testing Service. UI and feature experimentation, experiment management, and analytics tracking.
  annotations:
    github.com/project-slug: payu/ab-testing-service
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: app=ab-testing-service
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
  tags:
    - java
    - spring-boot
    - postgresql
    - ab-testing
    - experimentation
spec:
  type: service
  lifecycle: experimental
  owner: team-backend
  system: payu-core-banking
  dependsOn:
    - component:postgresql
    - component:redis
  providesApis:
    - ab-testing-api
