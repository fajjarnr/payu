# ArchUnit Configuration for PayU Hexagonal Architecture
# https://www.archunit.org/userguide/html/000_Index.html#_configuration

# ============================================================================
# General Settings
# ============================================================================

# Resolve dependencies from classpath (recommended for Spring projects)
archunit.resolveMissingDependenciesFromClassPath=true

# Fail on empty should (fail if no classes match the rule)
archunit.failOnEmptyShould=true

# ============================================================================
# Import Options
# ============================================================================

# Default import options - can be overridden per test
archunit.import.excludeTests=true
archunit.import.excludeJars=true

# ============================================================================
# Syntax Settings
# ============================================================================

# Use MD5 for class resolution (faster)
archunit.classResolver=com.tngtech.archunit.core.importer.resolvers.ClassResolverFromClasspath

# ============================================================================
# Freeze Store Configuration (for ArchUnit Store)
# ============================================================================

# Enable freeze store for allowed violations
archunit.freeze.store.default.path=src/test/resources/archunit_store
archunit.freeze.store.default.allowStoreUpdate=false

# Freeze mode - store violations that are allowed
archunit.freeze.refreeze=false

# ============================================================================
# Performance Settings
# ============================================================================

# Enable parallel analysis for large codebases
archunit.enableParallelAnalysis=true

# Cache size for imported classes
archunit.import.cache.size=1000

# ============================================================================
# Logging
# ============================================================================

# Log level for ArchUnit (DEBUG, INFO, WARN, ERROR)
archunit.log.level=INFO
