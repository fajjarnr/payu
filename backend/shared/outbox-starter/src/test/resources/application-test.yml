# Test configuration for outbox-starter integration tests
# Uses H2 in-memory database for fast test execution

spring:
  datasource:
    url: jdbc:h2:mem:outbox_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

payu:
  outbox:
    enabled: true
    publisher:
      batch-size: 100
      poll-interval-ms: 1000
      max-retries: 3
      default-topic: outbox.events
      enabled: false  # Disable scheduled publisher during tests
    cleanup:
      enabled: false  # Disable cleanup scheduler during tests
      retention-days: 30
      failed-retention-days: 7
      cron: "0 0 2 * * *"

logging:
  level:
    id.payu.outbox: DEBUG
    org.hibernate.SQL: DEBUG
