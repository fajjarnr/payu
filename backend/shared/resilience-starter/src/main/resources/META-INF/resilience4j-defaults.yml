# Resilience4j Default Configuration for PayU Financial Services Platform
# This file provides standard resilience patterns optimized for financial operations

# =============================================================================
# CIRCUIT BREAKER CONFIGURATION
# =============================================================================
resilience4j.circuitbreaker:
  configs:
    # Default configuration for financial services
    default:
      slidingWindowSize: 100
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 5
      minimumNumberOfCalls: 10
      slidingWindowType: COUNT_BASED
      automaticTransitionFromOpenToHalfOpenEnabled: true
      slowCallRateThreshold: 80
      slowCallDurationThreshold: 2s
      # Ignore business exceptions - these are expected and should not trigger circuit breaker
      ignoreExceptions:
        - id.payu.api.common.exception.BusinessException
        - id.payu.api.common.exception.ValidationException
        - id.payu.api.common.exception.ResourceNotFoundException
      # Record all exceptions except ignored ones
      recordExceptions:
        - java.io.IOException
        - java.net.SocketTimeoutException
        - java.net.ConnectException
        - org.springframework.web.client.ResourceAccessException
        - org.springframework.web.client.HttpServerErrorException
        - io.github.resilience4j.circuitbreaker.CallNotPermittedException

    # Configuration for critical financial operations (stricter thresholds)
    critical:
      slidingWindowSize: 50
      failureRateThreshold: 30
      waitDurationInOpenState: 15s
      permittedNumberOfCallsInHalfOpenState: 3
      minimumNumberOfCalls: 5
      slidingWindowType: COUNT_BASED
      automaticTransitionFromOpenToHalfOpenEnabled: true
      slowCallRateThreshold: 60
      slowCallDurationThreshold: 1s
      ignoreExceptions:
        - id.payu.api.common.exception.BusinessException
        - id.payu.api.common.exception.ValidationException

    # Configuration for external payment gateways (more lenient)
    external-gateway:
      slidingWindowSize: 200
      failureRateThreshold: 60
      waitDurationInOpenState: 20s
      permittedNumberOfCallsInHalfOpenState: 10
      minimumNumberOfCalls: 20
      slidingWindowType: COUNT_BASED
      automaticTransitionFromOpenToHalfOpenEnabled: true
      slowCallRateThreshold: 90
      slowCallDurationThreshold: 5s
      ignoreExceptions:
        - id.payu.api.common.exception.BusinessException

  instances:
    # Default instance uses the default config
    default:
      baseConfig: default

# =============================================================================
# BULKHEAD CONFIGURATION (Thread Pool & Semaphore)
# =============================================================================
resilience4j.bulkhead:
  configs:
    # Default semaphore-based bulkhead configuration
    default:
      maxConcurrentCalls: 20
      maxWaitDuration: 500ms

    # Configuration for high-throughput operations
    high-throughput:
      maxConcurrentCalls: 50
      maxWaitDuration: 1s

    # Configuration for resource-intensive operations
    resource-intensive:
      maxConcurrentCalls: 10
      maxWaitDuration: 2s

  instances:
    default:
      baseConfig: default

  # Thread pool bulkhead for async operations
  thread-pool-bulkhead:
    configs:
      default:
        maxThreadPoolSize: 20
        coreThreadPoolSize: 10
        queueCapacity: 50
        keepAliveDuration: 20s

      high-throughput:
        maxThreadPoolSize: 50
        coreThreadPoolSize: 20
        queueCapacity: 100
        keepAliveDuration: 30s

    instances:
      default:
        baseConfig: default

# =============================================================================
# RETRY CONFIGURATION
# =============================================================================
resilience4j.retry:
  configs:
    # Default retry configuration for financial services
    default:
      maxAttempts: 3
      waitDuration: 1s
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
      retryExceptions:
        - java.io.IOException
        - java.net.SocketTimeoutException
        - java.net.ConnectException
        - org.springframework.web.client.ResourceAccessException
        - org.springframework.web.client.HttpServerErrorException
        - java.util.concurrent.TimeoutException
      ignoreExceptions:
        - id.payu.api.common.exception.BusinessException
        - id.payu.api.common.exception.ValidationException
        - id.payu.api.common.exception.ResourceNotFoundException
        - id.payu.api.common.exception.ConflictException

    # Configuration for idempotent operations (can retry more aggressively)
    idempotent:
      maxAttempts: 5
      waitDuration: 500ms
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
      retryExceptions:
        - java.io.IOException
        - java.net.SocketTimeoutException
        - java.net.ConnectException
        - org.springframework.web.client.ResourceAccessException
        - org.springframework.web.client.HttpServerErrorException
        - java.util.concurrent.TimeoutException

    # Configuration for non-idempotent operations (minimal retry)
    non-idempotent:
      maxAttempts: 1
      waitDuration: 100ms
      enableExponentialBackoff: false
      retryExceptions:
        - java.net.SocketTimeoutException
        - java.util.concurrent.TimeoutException

  instances:
    default:
      baseConfig: default

# =============================================================================
# RATE LIMITER CONFIGURATION
# =============================================================================
resilience4j.ratelimiter:
  configs:
    # Default rate limiter configuration
    default:
      limitForPeriod: 100
      limitRefreshPeriod: 1s
      timeoutDuration: 500ms
      subscribeForEvents: true

    # Configuration for public APIs (stricter limits)
    public-api:
      limitForPeriod: 50
      limitRefreshPeriod: 1s
      timeoutDuration: 100ms
      subscribeForEvents: true

    # Configuration for internal services (higher limits)
    internal:
      limitForPeriod: 1000
      limitRefreshPeriod: 1s
      timeoutDuration: 1s
      subscribeForEvents: true

    # Configuration for webhook endpoints
    webhook:
      limitForPeriod: 200
      limitRefreshPeriod: 1s
      timeoutDuration: 500ms
      subscribeForEvents: true

  instances:
    default:
      baseConfig: default

# =============================================================================
# TIME LIMITER CONFIGURATION
# =============================================================================
resilience4j.timelimiter:
  configs:
    # Default time limiter configuration
    default:
      timeoutDuration: 5s
      cancelRunningFuture: true

    # Configuration for fast operations
    fast:
      timeoutDuration: 1s
      cancelRunningFuture: true

    # Configuration for slow external calls
    external:
      timeoutDuration: 10s
      cancelRunningFuture: true

    # Configuration for long-running operations
    long-running:
      timeoutDuration: 30s
      cancelRunningFuture: false

  instances:
    default:
      baseConfig: default
