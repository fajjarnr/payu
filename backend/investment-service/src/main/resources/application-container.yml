# Container Integration Test Profile
spring:
  main:
    allow-bean-definition-overriding: true
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payu_test_investment}
    username: ${DB_USERNAME:payu_test}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      pool-name: container-pool
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      auto-startup: true
      group-id: investment-service-container
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/payu}
  
  cloud:
    vault:
      enabled: false

management:
  health:
    kafka:
      enabled: true

payu:
  security:
    encryption-enabled: false
