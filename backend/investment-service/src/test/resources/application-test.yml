spring:
  datasource:
    url: jdbc:tc:postgresql:16:///investment_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://fake-issuer.example.com
          jwk-set-uri: https://fake-issuer.example.com/.well-known/jwks.json

payu:
  events:
    enabled: false
  cache:
    enabled: false

logging:
  level:
    id.payu.investment: DEBUG
