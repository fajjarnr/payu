quarkus:
  application:
    name: api-portal-service
    version: 1.0.0
    environment: dev
  http:
    port: ${QUARKUS_HTTP_PORT:8080}
    auth:
      permission:
        public-health:
          paths: "/public/health,/q/health/*"
          policy: permit
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:payu}
    client-id: ${OIDC_CLIENT_ID:api-portal-service}
    connection-delay: 30S
    tls:
      verification: none
    token:
      issuer: any
  security:
    jaxrs:
      deny-unauthenticated-by-default: true
  smallrye-openapi:
    info-title: PayU API Portal
    info-version: 1.0.0
    info-description: Centralized API Portal for all PayU services
    info-contact-name: PayU Engineering Team
    info-contact-email: engineering@payu.fajjjar.my.id
    path: /q/openapi
  smallrye-health:
    ui:
      enable: true
  log:
    level: INFO
    category:
      "id.payu.portal":
        level: DEBUG
    console:
      json:
        enabled: true
        log-format: ecs
        exception-output-type: formatted
        additional-field:
          "service.environment":
            value: dev
            type: STRING
  # OpenTelemetry
  otel:
    sdk:
      disabled: ${OTEL_SDK_DISABLED:true}
    service:
      name: api-portal-service
    exporter:
      otlp:
        endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    resource:
      attributes:
        - service.name=api-portal-service
        - service.version=1.0.0
