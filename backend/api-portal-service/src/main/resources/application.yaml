quarkus:
  application:
    name: api-portal-service
    version: 1.0.0
  http:
    port: 8099
  smallrye-openapi:
    info-title: PayU API Portal
    info-version: 1.0.0
    info-description: Centralized API Portal for all PayU services
    info-contact-name: PayU Engineering Team
    info-contact-email: engineering@payu.id
    path: /q/openapi
  smallrye-health:
    ui:
      enable: true
  log:
    level: INFO
    category:
      "id.payu.portal":
        level: DEBUG
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
portal:
  services:
    account-service:
      name: Account Service
      url: http://localhost:8001
      openapi-path: /v3/api-docs
    auth-service:
      name: Auth Service
      url: http://localhost:8002
      openapi-path: /v3/api-docs
    transaction-service:
      name: Transaction Service
      url: http://localhost:8003
      openapi-path: /v3/api-docs
    wallet-service:
      name: Wallet Service
      url: http://localhost:8004
      openapi-path: /v3/api-docs
    billing-service:
      name: Billing Service
      url: http://localhost:8005
      openapi-path: /q/openapi
    notification-service:
      name: Notification Service
      url: http://localhost:8006
      openapi-path: /q/openapi
    kyc-service:
      name: KYC Service
      url: http://localhost:8007
      openapi-path: /openapi.json
    analytics-service:
      name: Analytics Service
      url: http://localhost:8008
      openapi-path: /openapi.json
    investment-service:
      name: Investment Service
      url: http://localhost:8009
      openapi-path: /v3/api-docs
    lending-service:
      name: Lending Service
      url: http://localhost:8010
      openapi-path: /v3/api-docs
    backoffice-service:
      name: Backoffice Service
      url: http://localhost:8011
      openapi-path: /v3/api-docs
    partner-service:
      name: Partner Service
      url: http://localhost:8012
      openapi-path: /v3/api-docs
    promotion-service:
      name: Promotion Service
      url: http://localhost:8013
      openapi-path: /v3/api-docs
    support-service:
      name: Support Service
      url: http://localhost:8014
      openapi-path: /q/openapi
    statement-service:
      name: Statement Service
      url: http://localhost:8015
      openapi-path: /v3/api-docs
    fx-service:
      name: FX Service
      url: http://localhost:8086
      openapi-path: /fx-api/v3/api-docs
    cms-service:
      name: CMS Service
      url: http://localhost:8082
      openapi-path: /v3/api-docs
    ab-testing-service:
      name: AB Testing Service
      url: http://localhost:8080
      openapi-path: /api-docs
    gateway-service:
      name: API Gateway
      url: http://localhost:8080
      openapi-path: /q/openapi
    compliance-service:
      name: Compliance Service
      url: http://localhost:8087
      openapi-path: /v3/api-docs
    api-portal-service:
      name: API Portal Service
      url: http://localhost:8099
      openapi-path: /q/openapi
  cache:
    ttl: 5m
sandbox:
  latency:
    enabled: true
    min: 200
    max: 800
