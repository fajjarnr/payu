server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILE:local}
  application:
    name: wallet-service
  grpc:
    server:
      # GRPC-007: spring-grpc's own server (in-process/servlet) would register
      # WalletGrpcService a second time — grpc-starter owns the Netty 9090 server.
      enabled: false
  datasource:
    # Primary datasource for write operations
    primary:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/payu_wallets
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        # Pool configuration
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: false
        leak-detection-threshold: 60000
        pool-name: primary-pool
    # Read replica datasource for reporting/analytics queries
    read-replica:
      enabled: ${READ_REPLICA_ENABLED:false}
      jdbc-url: jdbc:postgresql://${READ_REPLICA_HOST:localhost}:${READ_REPLICA_PORT:5433}/payu_wallets_replica
      username: ${READ_REPLICA_USERNAME:postgres}
      password: ${READ_REPLICA_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        # Larger pool for reads (typically 2x primary)
        maximum-pool-size: 40
        minimum-idle: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: true
        leak-detection-threshold: 60000
        pool-name: read-replica-pool
        read-only: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        # Query optimization
        generate_statistics: false
        use_sql_comments: true
        # Connection pool optimization
        connection:
          provider_disables_autocommit: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      retries: 3
      acks: all
      properties:
        interceptor.classes: id.payu.logging.kafka.MdcKafkaProducerInterceptor
        retry.backoff.ms: 1000
        enable.idempotence: true
    consumer:
      group-id: wallet-service-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        interceptor.classes: id.payu.logging.kafka.MdcKafkaConsumerInterceptor
        spring.json.trusted.packages: "*"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      db:
        enabled: true
      redis:
        enabled: true
      kafka:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT}
    headers:
      Authorization:
  zipkin:
    tracing:
      endpoint: ${OTEL_ENDPOINT}/v1/spans
  metrics:
    export:
      prometheus:
