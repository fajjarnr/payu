# Test Configuration for Backoffice Service (Spring Boot)
spring:
  application:
    name: backoffice-service-test
  datasource:
    primary:
      hikari:
        jdbc-url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/payu
          jwk-set-uri: http://localhost:8180/realms/payu/protocol/openid-connect/certs

logging:
  level:
    id.payu.backoffice: DEBUG
    org.hibernate.SQL: WARN

payu:
  security:
    blind-index-key: backoffice-test-blind-index-key-value-32
    blind-index-key-version: test-v1
