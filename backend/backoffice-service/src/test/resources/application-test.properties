# Test Configuration for Backoffice Service (Spring Boot)
#
# Run tests:
#   ./mvnw test                         # unit/service tests (requires local PostgreSQL)
#   ./mvnw test -Ddocker.enabled=true   # include integration/resource tests

spring.application.name=backoffice-service-test

# H2 In-Memory Database Configuration (Tests)
# Backoffice uses BackofficeDataSourceConfiguration which binds to spring.datasource.primary.hikari.*
spring.datasource.primary.hikari.jdbc-url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.primary.hikari.driver-class-name=org.h2.Driver
spring.datasource.primary.hikari.username=sa
spring.datasource.primary.hikari.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway (disabled for unit/service tests)
spring.flyway.enabled=false

# Security (test values; JWT verification should be disabled or mocked in tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/payu
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/payu/protocol/openid-connect/certs

# Logging
logging.level.id.payu.backoffice=DEBUG
logging.level.org.hibernate.SQL=WARN
