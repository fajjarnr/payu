# Integration Test Configuration for Backoffice Service (Spring Boot)
#
# Run integration tests:
#   ./mvnw test -Dtest=BackofficeIntegrationTest

spring.config.activate.on-profile=integrationtest
spring.application.name=backoffice-service-integrationtest

# H2 Database Configuration (Integration)
# BackofficeDataSourceConfiguration binds this custom datasource prefix.
spring.datasource.primary.hikari.jdbc-url=jdbc:h2:mem:backoffice_integration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.primary.hikari.username=sa
spring.datasource.primary.hikari.password=
spring.datasource.primary.hikari.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway (enabled for integration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration-h2

# Resolve production placeholders without requiring local infrastructure.
spring.data.redis.host=localhost
spring.data.redis.port=6379
payu.security.blind-index-key=backoffice-integration-blind-index-key-32
payu.security.blind-index-key-version=integration-v1

# Security (test values; JWT verification should be disabled or mocked in tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/payu
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/payu/protocol/openid-connect/certs

# Logging
logging.level.id.payu.backoffice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
