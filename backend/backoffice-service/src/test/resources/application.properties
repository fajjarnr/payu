# Test Configuration for Backoffice Service
#
# This file configures PostgreSQL for unit and integration tests.
#
# To run all tests (unit + integration):
#   ./mvnw test -Ddocker.enabled=true
#
# To run only integration tests (with Docker/PostgreSQL):
#   ./mvnw test -Ddocker.enabled=true -Dtest=*IntegrationTest
#
# To run only unit tests:
#   ./mvnw test -Dtest='!*IntegrationTest' -Ddocker.enabled=true

# PostgreSQL Database Configuration (Tests)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/backoffice_test
quarkus.datasource.username=test
quarkus.datasource.password=test

# Hibernate ORM Configuration
quarkus.hibernate-orm.packages=id.payu.backoffice.domain
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# OIDC Configuration (Disabled for tests)
quarkus.oidc.enabled=false

# Logging Configuration
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."id.payu.backoffice".level=DEBUG

# Test Configuration
quarkus.test.continuous-testing=disabled
