server:
  port: ${PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILE:local}
  application:
    name: backoffice-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:payu_backoffice}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:payu}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWK_SET_URI}

logging:
  level:
    id.payu.backoffice: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html

payu:
  security:
    blind-index-key: ${BLIND_INDEX_KEY}
    blind-index-key-version: ${BLIND_INDEX_KEY_VERSION:v1}
    blind-index-previous-keys: ${BLIND_INDEX_PREVIOUS_KEYS:}
  kogito:
    task-api:
      url: ${KOGITO_TASK_API_URL:http://loan-origination-process:8080}
