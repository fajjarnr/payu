quarkus:
  application:
    name: backoffice-service
  http:
    port: 8099
    test-port: 0
  otel:
    service:
      name: backoffice-service
    exporter:
      otlp:
        endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    resource:
      attributes:
        - service.name=backoffice-service
        - service.version=1.0.0
  datasource:
    db-kind: postgresql
    username: ${DB_USER:payu}
    password: ${DB_PASSWORD:payu123}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payu_backoffice}
  hibernate-orm:
    packages: id.payu.backoffice.domain
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    sql-load-script: no-file
  flyway:
    migrate-at-start: true
    validate-on-migrate: true
    baseline-on-migrate: true
  log:
    category:
      "id.payu.backoffice":
        level: INFO
  test:
    disabled-profiles:
      - docker

"%test":
  quarkus:
    datasource:
      db-kind: postgresql
      jdbc:
        url: jdbc:postgresql://localhost:5432/backoffice_test
      username: test
      password: test
    hibernate-orm:
      packages: id.payu.backoffice.domain
      database:
        generation: none
      sql-load-script: no-file
    flyway:
      migrate-at-start: true
      baseline-on-migrate: true
